  // ---------- inline edit ----------
  function enterEdit(kind, coreId, id) {
    var core = kind === "core"
      ? coreById(id)
      : coreById(coreId);
    if (!core) return;
    var text = kind === "core" ? core.text : (core.details.filter(function (d) { return d.id === id; })[0] || {}).text;
    state.editing = { kind: kind, coreId: coreId, id: id };
    state.draftText = text || "";
    var selector = kind === "core"
      ? '[data-role="core"][data-core-id="' + id + '"]'
      : '[data-role="detail"][data-detail-id="' + id + '"]';
    var bubbleEl = bubblesLayer.querySelector(selector);
    if (!bubbleEl) return;
    bubbleEl.innerHTML = '<input class="ihb-edit-input" value="' + escapeHtml(state.draftText) + '" />';
    var input = bubbleEl.querySelector("input");
    input.focus();
    input.select();
    input.addEventListener("input", function (e) { state.draftText = e.target.value; });
    input.addEventListener("blur", function () { commitEdit(); });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); input.blur(); }
      if (e.key === "Escape") { cancelEdit(); }
    });
  }
  function commitEdit() {
    if (!state.editing) return;
    var kind = state.editing.kind, coreId = state.editing.coreId, id = state.editing.id;
    var value = (state.draftText || "").trim();
    if (kind === "core") {
      if (!value) state.cores = state.cores.filter(function (c) { return c.id !== id; });
      else state.cores = state.cores.map(function (c) { return c.id === id ? Object.assign({}, c, { text: value }) : c; });
    } else {
      state.cores = state.cores.map(function (c) {
        if (c.id !== coreId) return c;
        if (!value) return Object.assign({}, c, { details: c.details.filter(function (d) { return d.id !== id; }) });
        return Object.assign({}, c, { details: c.details.map(function (d) { return d.id === id ? Object.assign({}, d, { text: value }) : d; }) });
      });
    }
    state.editing = null;
    onCoresChanged();
  }
  function cancelEdit() {
    state.editing = null;

  }

  // ---------- editor that unfolds from the hub ----------

  // Which way does the hub part? Sideways on a wide window, top/bottom on a
  // tall one — it opens into whichever direction has room.
  function panelHorizontal() {
    try {
      return window.innerWidth >= window.innerHeight;
    } catch (e) {
      return true;
    }
  }

  var hubOpen = false;

  // Lays out the two halves and the display between them. Closed, the halves
  // touch and the hub is an ordinary circle; open, they slide apart by exactly
  // the width of the display, so the outer silhouette stays intact.
  // How far the open display extends past the hub, across the split axis.
  function clampRange(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function displayOverhang(L) {
    var d = L.hub;
    var across = panelHorizontal()
      ? clampRange(Math.max(d * 1.55, 300), d, L.width * 0.80)
      : clampRange(Math.max(d * 1.8, 300), d, L.width * 0.90);
    return Math.max(0, across - d);
  }



  function layoutHub() {
    if (!hubEl) return;
    var L = layout;
    var d = L.hub;
    var horizontal = panelHorizontal();
    var gap = 0;
    if (hubOpen) {
      // Tying every dimension to the hub diameter made the display collapse on
      // narrow screens: the hub scales down with the map, so the panel shrank
      // to a sixth of its desktop area while the type stayed at fixed pixels.
      // The map's own width now sets a floor, which only binds on small screens.
      gap = horizontal
        ? clampRange(Math.max(240, d * 1.35), L.width * 0.32, L.width * 0.62)
        : clampRange(Math.max(190, d * 1.05), L.width * 0.34, L.width * 0.58);
    }
    // The display extends past the hub perpendicular to the split, so the
    // content gets real room; the two halves themselves never change size.
    var over = 0;
    if (hubOpen) {
      var across = horizontal
        ? clampRange(Math.max(d * 1.55, 300), d, L.width * 0.80)
        : clampRange(Math.max(d * 1.8, 300), d, L.width * 0.90);
      over = Math.max(0, across - d);
    }
    var w = horizontal ? d + gap : d + over;
    var h = horizontal ? d + over : d + gap;

    // The sphere sits centred in the glass; the focused idea's park distance
    // accounts for the overhang instead (see coreOrbit), so nothing overlaps.
    var ox = horizontal ? 0 : over / 2;
    var oy = horizontal ? over / 2 : 0;
    hubEl.style.width = w + "px";
    hubEl.style.height = h + "px";
    hubEl.style.marginLeft = (-(horizontal ? w / 2 : ox + d / 2)) + "px";
    hubEl.style.marginTop = (-(horizontal ? oy + d / 2 : h / 2)) + "px";

    var half = d / 2;
    // each half keeps the full circle as its background, just offset, so the
    // two of them read as one sphere when they meet again
    [capA, capB].forEach(function (cap) {
      if (!cap) return;
      cap.style.backgroundSize = d + "px " + d + "px";
    });
    if (horizontal) {
      capA.style.cssText += ";left:0;top:" + oy + "px;width:" + half + "px;height:" + d + "px;" +
        "border-radius:" + half + "px 0 0 " + half + "px;background-position:left center;";
      capB.style.cssText += ";left:" + (w - half) + "px;top:" + oy + "px;width:" + half + "px;height:" + d + "px;" +
        "border-radius:0 " + half + "px " + half + "px 0;background-position:right center;";
      hubDisplay.style.cssText += ";left:" + half + "px;top:0;width:" + Math.max(0, gap) + "px;height:" + h + "px;";
    } else {
      capA.style.cssText += ";left:" + ox + "px;top:0;width:" + d + "px;height:" + half + "px;" +
        "border-radius:" + half + "px " + half + "px 0 0;background-position:center top;";
      capB.style.cssText += ";left:" + ox + "px;top:" + (h - half) + "px;width:" + d + "px;height:" + half + "px;" +
        "border-radius:0 0 " + half + "px " + half + "px;background-position:center bottom;";
      hubDisplay.style.cssText += ";left:0;top:" + half + "px;width:" + w + "px;height:" + Math.max(0, gap) + "px;";
    }
    hubDisplay.style.borderRadius = Math.round(Math.min(22, d * 0.1)) + "px";

    if (hubFace) {
      hubFace.style.width = d + "px";
      hubFace.style.marginLeft = (-d / 2) + "px";
      hubFace.style.marginTop = (-d / 2) + "px";
      hubFace.style.height = d + "px";
      hubFace.style.left = (horizontal ? w / 2 : ox + d / 2) + "px";
      hubFace.style.top = (horizontal ? oy + d / 2 : h / 2) + "px";
      hubFace.style.position = "absolute";
      hubFace.style.padding = "0 " + (d * 0.085) + "px";
    }
    if (hubDisplayBody) {
      var dispW = horizontal ? Math.max(0, gap) : w;
      // Type is scaled from the map, not left at fixed pixels: on a phone the
      // panel is far smaller, so unscaled text swamped it. The floor keeps
      // labels and inputs readable at the smallest sizes.
      hubDisplay.style.setProperty("--dsc", clampRange(L.s * 0.92, 0.9, 1).toFixed(3));
      hubDisplayBody.style.padding = Math.round(Math.max(10, dispW * 0.045)) + "px " +
        Math.round(Math.max(14, dispW * 0.055)) + "px";

  // Opens the hub around some content. The search moves inside so it stays
  // reachable while the hub is parted.
  // In tree view the right pane is the editor's home; on the map it is the
  // opened hub. Same editor, same commit path — only the container differs.
  function editorHost() {
    return state.view === "tree" && treeDetail ? treeDetail : hubDisplayBody;
  }

  function openHubDisplay(html) {
    if (state.view === "tree" && treeDetail) { treeDetail.innerHTML = html; return; }
    clearTimeout(hubCloseTimer);
    hubDisplayBody.innerHTML = html;
    var host = hubDisplayBody.querySelector(".ihb-search-host");
    if (host && searchWrap) host.appendChild(searchWrap);
    hubOpen = true;
    hubEl.classList.add("open");
    layoutHub();

  // Switching to another idea closes the display first and reopens it with the
  // new content, instead of swapping the text inside the open panel.
  var displaySwapTimer = null;
  var selectDetailSwapping = false;
  function swapDisplay(fn) {
    if (!hubOpen) { fn(); return; }
    clearTimeout(displaySwapTimer);
    closeHubDisplay();
    displaySwapTimer = setTimeout(fn, Math.round(560 * speedFactor()));
  }

  var hubCloseTimer = null;
  function closeHubDisplay() {
    // Repeated calls while already closed must not restart the clearing timer,
    // or the content would linger for another full close cycle each time.
    var wasOpen = hubOpen;
    if (!wasOpen && !hubCloseTimer) return;
    if (!wasOpen) return;
    clearTimeout(hubCloseTimer);
    if (searchWrap && hubFace && searchWrap.parentNode !== hubFace) {
      hubFace.insertBefore(searchWrap, hubFace.querySelector(".ihb-hub-count"));
    }
    hubOpen = false;
    hubEl.classList.remove("open");
    layoutHub();
    // Keep the content in place while the halves close, so it shrinks away with
    // them. Clearing it straight away made it blink out mid-movement.
    var ms = Math.round(900 * speedFactor());
    hubCloseTimer = setTimeout(function () {
      if (!hubOpen) hubDisplayBody.innerHTML = "";
    }, ms);
  }

  function val(id) {
    var host = editorHost();
    var el = (host && host.querySelector("#" + id)) || document.getElementById(id);

  function commitHubEditor() {
    var tags = val("edTags").split(",").map(function (t) { return t.trim(); }).filter(Boolean);
    var notes = val("edNotes");
    if (detailEditing) {
      var coreId = detailEditing.coreId, detailId = detailEditing.detailId;
      var text = val("edTitle").trim();
      state.cores = state.cores.map(function (c) {
        if (c.id !== coreId) return c;
        if (!text) {
          return Object.assign({}, c, { details: c.details.filter(function (d) { return d.id !== detailId; }) });
        }
        return Object.assign({}, c, {
          details: c.details.map(function (d) {
            return d.id === detailId
              ? Object.assign({}, d, { text: text, notes: notes, tags: tags, color: draftColor, status: detailDraftStatus })
              : d;
          })
        });
      });
      closeHubEditor();
      onCoresChanged();
      return;
    }
    if (state.tagEditing) {
      var editingId = state.tagEditing;
      var subtitle = val("edSubtitle").trim();
      state.cores = state.cores.map(function (c) {
        return c.id === editingId
          ? Object.assign({}, c, { tags: tags, notes: notes, subtitle: subtitle, icon: draftIcon, color: draftColor })
          : c;
      });
      closeHubEditor();
      onCoresChanged();
    }
  }

  // ---------- search wiring ----------
  function clearSearch() {
    state.query = "";
    searchInput.value = "";
    clearSearchBtn.style.display = "none";
  }
  searchInput.addEventListener("input", function (e) {
    state.query = e.target.value;
    clearSearchBtn.style.display = state.query ? "flex" : "none";
    // The search box lives outside bubblesLayer, so rebuilding the bubble
    // structure here never steals its focus; this keeps ghost visibility,
    // filtering, the hub count and the quick-create panel all in sync.
    renderCurrentView();
  });
  searchInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      var c = computeCounts();

  });

    renderStructure();

  });

  // ---------- drag & drop ----------
  // Cores are reordered on the ring, details are re-homed to another core.
  // Both changes go back through the normal layout engine, so the overlap-free
  // guarantee still holds; free x/y placement would have thrown that away.
  var drag = null;
  var DRAG_THRESHOLD = 6;
  var justDragged = false;

  function pointerXY(e) {
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }


  // ---------- pan & zoom ----------
  // A view transform layered on top of everything else: it never touches the
  // percentage-based layout, ring math, or collision checks, only how the
  // result is rendered. That keeps it safe to add this late without
  // reworking geometry that took a long time to get right.
  var camera = { zoom: 1, panX: 0, panY: 0 };
  var MIN_ZOOM = 1, MAX_ZOOM = 4;

  function clampCamera() {
    camera.zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, camera.zoom));
    if (camera.zoom <= 1.001) { camera.panX = 0; camera.panY = 0; return; }
    // A fixed pixel budget would not scale with zoom, and undershoots badly:
    // reaching a bubble on the outer ring (roughly 300 base units out) needs
    // about 240px of pan at 2x zoom and 840px at 4x — far past any reasonable
    // constant cap. The reachable range has to grow with zoom, or the very
    // thing zooming in is meant to let you inspect becomes unreachable.
    // "Reachable" for the hub does not depend on this clamp alone, either: the
    // zoom controls sit outside the transformed layers and stay on screen and
    // clickable at all times, so resetting the view is always one tap away.
    var W = layout.width || REF;
    var maxPan = (camera.zoom - 1) * (W / 2);
    var mag = Math.hypot(camera.panX, camera.panY);
    if (mag > maxPan && mag > 0) {
      var k = maxPan / mag;
      camera.panX *= k;
      camera.panY *= k;
    }
  }

  function applyCamera(animate) {
    if (!cameraLayer || !hubAnchor) return;
    var tx = camera.panX, ty = camera.panY;
    if (cameraLayer) cameraLayer.classList.toggle("ihb-cam-anim", !!animate);
    if (hubAnchor) hubAnchor.classList.toggle("ihb-cam-anim", !!animate);
    cameraLayer.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + camera.zoom + ")";
    hubAnchor.style.transform = "translate(" + tx + "px," + ty + "px)";
    if (mapEl) mapEl.classList.toggle("ihb-zoomed", camera.zoom > 1.001);
    updateZoomControls();
  }

  function setCamera(zoom, panX, panY, animate) {
    camera.zoom = zoom; camera.panX = panX; camera.panY = panY;
    clampCamera();
    applyCamera(animate);
  }

  function resetCamera(animate) {
    setCamera(1, 0, 0, animate !== false);
  }

  // Undo the camera transform: turns a point in screen pixels relative to the
  // map container back into the same 0..layout.width space that --x/--y
  // percentages use, so drag & drop keeps working correctly while zoomed in.
  function toMapSpace(sx, sy) {
    var W = layout.width || REF;
    var c = W / 2;
    if (camera.zoom <= 1.001 && !camera.panX && !camera.panY) return { x: sx, y: sy };
    return {
      x: c + (sx - c - camera.panX) / camera.zoom,
      y: c + (sy - c - camera.panY) / camera.zoom
    };
  }

  // Zoom while keeping one screen point (the cursor, or a pinch midpoint)
  // visually still, which is what makes zooming feel anchored rather than
  // the map sliding out from under the gesture.
  function zoomAt(sx, sy, factor, animate) {
    var newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, camera.zoom * factor));
    var W = layout.width || REF;
    var c = W / 2;
    var mapPt = toMapSpace(sx, sy);
    var panX = sx - c - (mapPt.x - c) * newZoom;
    var panY = sy - c - (mapPt.y - c) * newZoom;
    setCamera(newZoom, panX, panY, animate);
  }

  function zoomStep(factor) {
    var W = layout.width || REF;
    zoomAt(W / 2, W / 2, factor, true);
  }

  function updateZoomControls() {
    if (!zoomCtl) return;
    var outBtn = zoomCtl.querySelector('[data-role="zoom-out"]');
    var inBtn = zoomCtl.querySelector('[data-role="zoom-in"]');
    if (outBtn) outBtn.disabled = camera.zoom <= MIN_ZOOM + 0.001;
    if (inBtn) inBtn.disabled = camera.zoom >= MAX_ZOOM - 0.001;
  }

  function isBackgroundTarget(t) {
    return !!t && (!t.closest || (!t.closest(".ihb-bubble") && !t.closest("#hub") && !t.closest("#hubDisplay")));
  }

  var panState = null;
  var pinchState = null;
  var justPanned = false;

  function pinchDist(e) {
    var a = e.touches[0], b = e.touches[1];
    return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  }
  function pinchMid(e) {
    var rect = mapEl.getBoundingClientRect();
    var a = e.touches[0], b = e.touches[1];
    return { x: (a.clientX + b.clientX) / 2 - rect.left, y: (a.clientY + b.clientY) / 2 - rect.top };
  }

  function onMapWheel(e) {
    // Inside the open display the wheel belongs to its own scrollbar; grabbing
    // it there would zoom the map instead of scrolling the content.
    if (e.target && e.target.closest && e.target.closest("#hubDisplay")) return;
    // Elsewhere the map has nothing to scroll, so a plain wheel zooms; this
    // also covers trackpad pinch, which browsers report as a wheel event.
    if (e.cancelable) e.preventDefault();
    var rect = mapEl.getBoundingClientRect();
    var sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    var factor = Math.pow(1.0016, -e.deltaY);
    zoomAt(sx, sy, factor, false);
  }

  function onMapPointerDown(e) {
    if (e.touches && e.touches.length === 2) {
      panState = null;
      pinchState = { startDist: pinchDist(e), startZoom: camera.zoom, mid: pinchMid(e) };
      return;
    }
    if (camera.zoom <= 1.001) return;              // nothing to pan at rest
    if (!isBackgroundTarget(e.target)) return;      // let bubble drag / hub taps through
    var p = pointerXY(e);
    panState = { startX: p.x, startY: p.y, startPanX: camera.panX, startPanY: camera.panY, moved: false };
  }

  function onMapPointerMove(e) {
    if (pinchState) {
      if (!e.touches || e.touches.length < 2) return;
      if (e.cancelable) e.preventDefault();
      var dist = pinchDist(e);
      var factor = dist / (pinchState.startDist || 1);
      var mid = pinchState.mid;
      zoomAt(mid.x, mid.y, (pinchState.startZoom * factor) / camera.zoom, false);
      return;
    }
    if (!panState) return;
    var p = pointerXY(e);
    var dx = p.x - panState.startX, dy = p.y - panState.startY;
    if (!panState.moved && Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
    panState.moved = true;
    if (mapEl) mapEl.classList.add("ihb-panning");
    if (e.cancelable) e.preventDefault();
    setCamera(camera.zoom, panState.startPanX + dx, panState.startPanY + dy, false);
  }

  function onMapPointerUp() {
    if (pinchState) { pinchState = null; return; }
    if (!panState) return;
    if (panState.moved) justPanned = true;
    panState = null;
    if (mapEl) mapEl.classList.remove("ihb-panning");
  }

  function onMapDblClick(e) {
    if (!isBackgroundTarget(e.target)) return;
    var rect = mapEl.getBoundingClientRect();
    var sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    if (camera.zoom > 1.5) resetCamera(true);
    else zoomAt(sx, sy, 1.8, true);
  }

  if (mapEl) {
    mapEl.addEventListener("wheel", onMapWheel, { passive: false });
    mapEl.addEventListener("mousedown", onMapPointerDown);
    mapEl.addEventListener("touchstart", onMapPointerDown, { passive: true });
    mapEl.addEventListener("dblclick", onMapDblClick);
  }
  document.addEventListener("mousemove", onMapPointerMove);
  document.addEventListener("touchmove", onMapPointerMove, { passive: false });
  document.addEventListener("mouseup", onMapPointerUp);
  document.addEventListener("touchend", onMapPointerUp);

  if (zoomCtl) {
    zoomCtl.addEventListener("click", function (e) {
      var t = e.target.closest("[data-role]");
      if (!t) return;
      var role = t.getAttribute("data-role");
      if (role === "zoom-in") zoomStep(1.4);
      else if (role === "zoom-out") zoomStep(1 / 1.4);
      else if (role === "zoom-reset") resetCamera(true);
    });
  }


  // ---------- tree view ----------
  // The map is good at showing how ideas relate; a plain tree is better for
  // scanning a long list and for keyboard use. Both read the same state, so
  // focus and selection carry across when switching.
  var treeView = document.getElementById("treeView");
  var treePane = document.getElementById("treePane");
  var treeCount = document.getElementById("treeCount");
  var treeDetail = document.getElementById("treeDetail");
  var viewSwitch = document.getElementById("viewSwitch");
  var treeExpanded = {};              // coreId -> bool

  function setView(view, skipRender) {
    state.view = view === "tree" ? "tree" : "map";
    if (window.storage) window.storage.set(VIEW_KEY, state.view, false).catch(function () {});
    var isTree = state.view === "tree";
    if (mapEl) mapEl.hidden = isTree;
    if (treeView) treeView.hidden = !isTree;
    var capEl = document.getElementById("captionArea");
    if (capEl) capEl.hidden = isTree;
    if (treeDetail) {
    treeDetail.addEventListener("click", function (e) {
      var b = e.target.closest('[data-role="tree-edit"]');
      if (!b) return;
      var cid = b.getAttribute("data-core-id"), did = b.getAttribute("data-detail-id");
      if (did) openDetailEditor(cid, did); else openTagEditor(cid);
    });
  }


  if (viewSwitch) {
      var mb = viewSwitch.querySelector('[data-role="view-map"]');
      var tb = viewSwitch.querySelector('[data-role="view-tree"]');
      if (mb) mb.setAttribute("aria-selected", String(!isTree));
      if (tb) tb.setAttribute("aria-selected", String(isTree));
    }
    if (isTree) {
      // the hub display belongs to the map; the right pane takes over here
      closeHubDisplay();
      if (state.focusedId !== null) treeExpanded[state.focusedId] = true;
    }
    renderTagFilterBar();
    if (!skipRender) { renderTree(); if (!isTree) renderStructure(); }
  }

  function treeSelection() {
    if (state.selectedDetail) return "d:" + state.selectedDetail.detailId;
    if (state.focusedId !== null) return "c:" + state.focusedId;
    return null;
  }

  function treeRowActions(coreId, detailId) {
    var d = detailId ? ' data-detail-id="' + detailId + '"' : "";
    var what = detailId ? "Detailidee" : "Kernidee";
    return '<span class="ihb-tree-actions">' +
      '<button type="button" data-role="tree-edit" data-core-id="' + coreId + '"' + d +
      ' tabindex="-1" aria-label="' + what + ' bearbeiten" title="Bearbeiten">' +
      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>' +
      (detailId ? "" :
        '<button type="button" data-role="tree-add" data-core-id="' + coreId + '" tabindex="-1" ' +
        'aria-label="Detailidee hinzufügen" title="Detailidee hinzufügen">' +
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>') +
      '<button type="button" data-role="tree-delete" data-core-id="' + coreId + '"' + d +
      ' tabindex="-1" aria-label="' + what + ' löschen" title="Löschen">' +
      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>' +
      "</span>";
  }

  function renderTree() {
    if (!treePane || state.view !== "tree") return;
    var filters = evaluateFilters();
    var html = "";
    var anyVisible = false;
    state.cores.forEach(function (core, ci) {
      var f = filters.perCore.get(core.id) || { coreActive: true, details: {} };
      var pr = coreProgress(core);
      var expanded = !!treeExpanded[core.id];
      var sel = treeSelection() === "c:" + core.id;
      var branchVisible = f.coreActive;
      if (!branchVisible && f.details) {
        core.details.forEach(function (d) { if (f.details.get(d.id)) branchVisible = true; });
      }
      if (branchVisible) anyVisible = true;
      html += '<div class="ihb-tree-row' + (f.coreActive ? "" : " is-dimmed") + '" role="treeitem" ' +
        'aria-selected="' + sel + '" tabindex="0" data-role="tree-core" data-core-id="' + core.id + '">' +
        '<button type="button" class="ihb-tree-twisty' + (core.details.length ? "" : " is-leaf") + '" ' +
        'data-role="tree-toggle" data-core-id="' + core.id + '" aria-expanded="' + expanded + '" ' +
        'aria-label="' + (expanded ? "Zuklappen" : "Aufklappen") + '" tabindex="-1">' +
        '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>' +
        "</button>" +
        '<span class="ihb-tree-dot" style="background:' + paletteFor(core, ci).core + '"></span>' +
        '<span class="ihb-tree-label">' + escapeHtml(core.text || "Ohne Titel") + "</span>" +
        (pr.total ? '<span class="ihb-tree-meta">' + pr.done + "/" + pr.total + "</span>" : "") +
        treeRowActions(core.id, null) +
        "</div>";
      if (expanded) {
        core.details.forEach(function (d) {
          var dActive = !f.details || f.details.get(d.id) !== false;   // it is a Map, not an object
          var dSel = treeSelection() === "d:" + d.id;
          var st = detailStatus(d);
          var mark = st === "erledigt" ? "✓" : st === "in-arbeit" ? "◐" : "○";
          var stLbl = { offen: "Offen", "in-arbeit": "In Arbeit", erledigt: "Erledigt" }[st];
          html += '<div class="ihb-tree-row is-detail' + (dActive ? "" : " is-dimmed") + '" role="treeitem" ' +
            'aria-selected="' + dSel + '" tabindex="0" data-role="tree-detail" ' +
            'data-core-id="' + core.id + '" data-detail-id="' + d.id + '">' +
            '<button type="button" class="ihb-tree-status" data-role="tree-status" ' +
            'data-core-id="' + core.id + '" data-detail-id="' + d.id + '" tabindex="-1" ' +
            'title="' + stLbl + ' — klicken zum Weiterschalten" aria-label="Status: ' + stLbl + '">' + mark + "</button>" +
            '<span class="ihb-tree-label">' + escapeHtml(d.text || "Ohne Titel") + "</span>" +
            treeRowActions(core.id, d.id) +
            "</div>";
        });
      }
    });
    if (state.cores.length && state.cores.length < MAX_CORES) {
      html += '<button type="button" class="ihb-tree-newrow" data-role="tree-newcore">' +
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
        " Neue Kernidee</button>";
    }
    if (!state.cores.length) {
      html = '<button type="button" class="ihb-tree-newrow" data-role="tree-newcore">' +
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
        " Erste Kernidee anlegen</button>";
    } else if (!anyVisible) {
      html = '<div class="ihb-tree-empty">Kein Treffer für die aktuelle Suche.</div>';
    }
    treePane.innerHTML = html;
    if (treeCount) {
      var shown = 0, hidden = 0;
      state.cores.forEach(function (c2) {
        var ff = filters.perCore.get(c2.id);
        if (!ff || ff.coreActive) shown += 1; else hidden += 1;
      });
      treeCount.textContent = hidden
        ? shown + " von " + state.cores.length + " Kernideen"
        : state.cores.length + " Kernideen · " + state.cores.reduce(function (n, c3) { return n + c3.details.length; }, 0) + " Details";
    }
    renderTreeDetail();
  }

  function renderTreeDetail() {
    if (!treeDetail) return;
    var sel = selectedDetailObj();
    var core = state.focusedId !== null ? coreById(state.focusedId) : null;
    var title, kind, notes, tags, subtitle = "";
    if (sel) {
      var stLabels = { offen: "Offen", "in-arbeit": "In Arbeit", erledigt: "Erledigt" };
      kind = "Detailidee · " + stLabels[detailStatus(sel.detail)];
      title = sel.detail.text; notes = (sel.detail.notes || "").trim(); tags = sel.detail.tags || [];
    } else if (core) {
      kind = "Kernidee"; title = core.text; notes = (core.notes || "").trim();
      tags = core.tags || []; subtitle = core.subtitle || "";
    } else {
      treeDetail.innerHTML = '<div class="ihb-tree-empty">Wähle links eine Idee, um sie hier zu lesen.</div>';
      return;
    }
    var editTarget = sel
      ? 'data-role="tree-edit" data-core-id="' + sel.core.id + '" data-detail-id="' + sel.detail.id + '"'
      : 'data-role="tree-edit" data-core-id="' + core.id + '"';
    treeDetail.innerHTML =
      '<div class="ihb-display-head"><span>' + escapeHtml(kind) + "</span>" +
      '<button type="button" class="ihb-btn" ' + editTarget + '>Bearbeiten</button></div>' +
      '<div class="ihb-info-title">' + escapeHtml(title || "Ohne Titel") + "</div>" +
      (subtitle ? '<div class="ihb-info-sub">' + escapeHtml(subtitle) + "</div>" : "") +
      (notes ? '<div class="ihb-info-notes">' + escapeHtml(notes) + "</div>"
             : '<div class="ihb-info-notes ihb-info-empty">Noch keine Beschreibung</div>') +
      (tags.length ? '<div class="ihb-tree-tags">' + tags.map(function (t) {
        return '<span class="ihb-tree-tag">' + escapeHtml(t) + "</span>";
      }).join("") + "</div>" : "");
  }

  function treeSelectCore(id) {
    state.selectedDetail = null;
    state.focusedId = state.focusedId === id ? null : id;
    if (state.focusedId !== null) treeExpanded[state.focusedId] = true;
    renderTree();
  }

  function treeSelectDetail(coreId, detailId) {
    var cur = state.selectedDetail;
    var same = cur && cur.coreId === coreId && cur.detailId === detailId;
    state.focusedId = coreId;
    state.selectedDetail = same ? null : { coreId: coreId, detailId: detailId };
    renderTree();
  }

  if (treePane) {
    treePane.addEventListener("click", function (e) {
      var tw = e.target.closest('[data-role="tree-toggle"]');
      if (tw) {
        var cid = tw.getAttribute("data-core-id");
        treeExpanded[cid] = !treeExpanded[cid];
        renderTree();
        return;
      }
      var act = e.target.closest('[data-role="tree-edit"], [data-role="tree-delete"], ' +
        '[data-role="tree-add"], [data-role="tree-status"], [data-role="tree-newcore"]');
      if (act) {
        e.stopPropagation();
        var role = act.getAttribute("data-role");
        var aCore = act.getAttribute("data-core-id");
        var aDet = act.getAttribute("data-detail-id");
        if (role === "tree-status") { cycleDetailStatus(aCore, aDet); renderTree(); }
        else if (role === "tree-edit") {
          if (aDet) { state.focusedId = aCore; state.selectedDetail = { coreId: aCore, detailId: aDet }; openDetailEditor(aCore, aDet); }
          else { state.focusedId = aCore; state.selectedDetail = null; openTagEditor(aCore); }
        } else if (role === "tree-add") {
          treeExpanded[aCore] = true;
          var before = (coreById(aCore) || { details: [] }).details.length;
          addDetail(aCore);
          state.editing = null;   // the tree edits in its pane, not inline on the map
          var core2 = coreById(aCore);
          if (core2 && core2.details.length > before) {
            var fresh = core2.details[core2.details.length - 1];
            state.focusedId = aCore;
            state.selectedDetail = { coreId: aCore, detailId: fresh.id };
            openDetailEditor(aCore, fresh.id);
          }
        } else if (role === "tree-delete") {
          var label = aDet
            ? ((coreById(aCore) || { details: [] }).details.filter(function (x) { return x.id === aDet; })[0] || {}).text
            : (coreById(aCore) || {}).text;
          if (!window.confirm("„" + (label || "Ohne Titel") + "“ wirklich löschen?")) return;
          if (aDet) deleteDetail(aCore, aDet); else deleteCore(aCore);
          if (!aDet && state.focusedId === aCore) { state.focusedId = null; state.selectedDetail = null; }
          renderTree();
        } else if (role === "tree-newcore") {
          var beforeN = state.cores.length;
          addCore();
          state.editing = null;
          if (state.cores.length > beforeN) {
            var fresh2 = state.cores[state.cores.length - 1];
            state.focusedId = fresh2.id;
            state.selectedDetail = null;
            openTagEditor(fresh2.id);
          }
        }
        return;
      }
      var row = e.target.closest("[data-role]");
      if (!row) return;
      if (row.getAttribute("data-role") === "tree-core") treeSelectCore(row.getAttribute("data-core-id"));
      else if (row.getAttribute("data-role") === "tree-detail")
        treeSelectDetail(row.getAttribute("data-core-id"), row.getAttribute("data-detail-id"));
    });
    // Arrow keys walk the tree the way a tree widget is expected to behave.
    treePane.addEventListener("keydown", function (e) {
      var row = e.target.closest("[data-role]");
      if (!row) return;
      var rows = Array.prototype.slice.call(treePane.querySelectorAll("[data-role]"))
        .filter(function (r) { return r.getAttribute("data-role") !== "tree-toggle"; });
      var idx = rows.indexOf(row);
      if (e.key === "ArrowDown" && idx < rows.length - 1) { e.preventDefault(); rows[idx + 1].focus(); }
      else if (e.key === "ArrowUp" && idx > 0) { e.preventDefault(); rows[idx - 1].focus(); }
      else if (e.key === "ArrowRight" && row.getAttribute("data-role") === "tree-core") {
        e.preventDefault(); treeExpanded[row.getAttribute("data-core-id")] = true; renderTree();
      } else if (e.key === "ArrowLeft" && row.getAttribute("data-role") === "tree-core") {
        e.preventDefault(); treeExpanded[row.getAttribute("data-core-id")] = false; renderTree();
      } else if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        if (row.getAttribute("data-role") === "tree-core") treeSelectCore(row.getAttribute("data-core-id"));
        else treeSelectDetail(row.getAttribute("data-core-id"), row.getAttribute("data-detail-id"));
      }
    });
  }

  if (viewSwitch) {
    viewSwitch.addEventListener("click", function (e) {
      var b = e.target.closest("[data-role]");
      if (!b) return;
      setView(b.getAttribute("data-role") === "view-tree" ? "tree" : "map");
    });
  }

  function mapPoint(e) {
    var rect = mapEl.getBoundingClientRect();
    var p = pointerXY(e);
    // Undo pan/zoom so drag-and-drop hit-testing keeps matching --x/--y
    // percentages even while the user is zoomed in.
    return toMapSpace(p.x - rect.left, p.y - rect.top);
  }

  function clearDropHighlight() {
    eachEl(bubblesLayer.querySelectorAll(".ihb-droptarget"), function (el) {
      el.classList.remove("ihb-droptarget");
    });
  }

  function coreElementAt(x, y) {
    var found = null;
    eachEl(bubblesLayer.querySelectorAll('[data-role="core"]'), function (el) {
      var w = parseFloat(el.style.width) || 0;
      var cx = (parseFloat(el.style.getPropertyValue("--x")) / 100) * layout.width;
      var cy = (parseFloat(el.style.getPropertyValue("--y")) / 100) * layout.width;
      if (distance(x, y, cx, cy) <= w / 2) found = el;
    });
    return found;
  }

  // Which slot on the ring does this point fall into?
  function slotAt(x, y, slots) {
    var ang = Math.atan2(y - layout.width / 2, x - layout.width / 2) + Math.PI / 2;
    while (ang < 0) ang += Math.PI * 2;
    while (ang >= Math.PI * 2) ang -= Math.PI * 2;
    return Math.round((ang / (Math.PI * 2)) * slots) % slots;
  }

  function reorderCore(coreId, toIndex) {
    var from = -1;
    for (var i = 0; i < state.cores.length; i++) if (state.cores[i].id === coreId) from = i;
    if (from === -1) return false;
    var to = Math.max(0, Math.min(state.cores.length - 1, toIndex));
    if (to === from) return false;
    var moved = state.cores.slice();
    var item = moved.splice(from, 1)[0];
    moved.splice(to, 0, item);
    state.cores = moved;
    onCoresChanged();
    return true;
  }

  function moveDetail(fromCoreId, detailId, toCoreId) {
    if (fromCoreId === toCoreId) return false;
    var target = null, moving = null;
    state.cores.forEach(function (c) {
      if (c.id === toCoreId) target = c;
      if (c.id === fromCoreId) {
        c.details.forEach(function (dd) { if (dd.id === detailId) moving = dd; });
      }
    });
    if (!target || !moving || target.details.length >= MAX_DETAILS) return false;
    state.cores = state.cores.map(function (c) {
      if (c.id === fromCoreId) return Object.assign({}, c, { details: c.details.filter(function (dd) { return dd.id !== detailId; }) });
      if (c.id === toCoreId) return Object.assign({}, c, { details: c.details.concat([moving]) });
      return c;
    });
    onCoresChanged();
    return true;
  }

  function onDragStart(e) {
    if (drag || state.editing) return;
    var t = e.target;
    if (!t || !t.closest) return;
    if (t.tagName === "INPUT" || t.closest("button")) return;
    var el = t.closest('[data-role="core"]') || t.closest('[data-role="detail"]');
    if (!el) return;
    if (el.getAttribute("data-mode") === "mini") return; // silent dots are not drag handles
    var p = pointerXY(e);
    drag = {
      el: el,
      kind: el.getAttribute("data-role"),
      coreId: el.getAttribute("data-core-id"),
      detailId: el.getAttribute("data-detail-id"),
      startX: p.x,
      startY: p.y,
      moved: false
    };
  }

  function onDragMove(e) {
    if (!drag) return;
    var p = pointerXY(e);
    if (!drag.moved && distance(p.x, p.y, drag.startX, drag.startY) < DRAG_THRESHOLD) return;
    if (!drag.moved) {
      drag.moved = true;
      drag.el.classList.add("ihb-dragging");
    }
    if (e.cancelable) e.preventDefault();
    drag.el.style.transform = "translate(" + (p.x - drag.startX) + "px," + (p.y - drag.startY) + "px)";

    clearDropHighlight();
    if (drag.kind === "detail") {
      var m = mapPoint(e);
      var target = coreElementAt(m.x, m.y);
      if (target && target.getAttribute("data-core-id") !== drag.coreId) {
        var tc = coreById(target.getAttribute("data-core-id"));
        if (tc && tc.details.length < MAX_DETAILS) target.classList.add("ihb-droptarget");
      }
    }
  }

  function onDragEnd(e) {
    if (!drag) return;
    var d = drag;
    drag = null;
    clearDropHighlight();
    if (!d.moved) return;
    justDragged = true;
    d.el.classList.remove("ihb-dragging");
    d.el.style.transform = "";
    var m = mapPoint(e);

    if (d.kind === "core") {
      var slots = state.cores.length + (state.cores.length < MAX_CORES ? 1 : 0);
      reorderCore(d.coreId, slotAt(m.x, m.y, slots));
      return;
    }
    var targetEl = coreElementAt(m.x, m.y);
    if (!targetEl) return;
    moveDetail(d.coreId, d.detailId, targetEl.getAttribute("data-core-id"));
  }

  bubblesLayer.addEventListener("mousedown", onDragStart);
  bubblesLayer.addEventListener("touchstart", onDragStart, { passive: true });
  document.addEventListener("mousemove", onDragMove);
  document.addEventListener("touchmove", onDragMove, { passive: false });
  document.addEventListener("mouseup", onDragEnd);
  document.addEventListener("touchend", onDragEnd);

  // ---------- delegated bubble interaction ----------
  function handleBubbleActivate(target) {
    var delBtn = target.closest('[data-role="del-core"], [data-role="del-detail"]');
    if (delBtn) {
      if (delBtn.getAttribute("data-role") === "del-core") deleteCore(delBtn.getAttribute("data-core-id"));
      else deleteDetail(delBtn.getAttribute("data-core-id"), delBtn.getAttribute("data-detail-id"));
      return;
    }
    var noteBtn = target.closest('[data-role="detail-note"]');
    if (noteBtn) { openDetailEditor(noteBtn.getAttribute("data-core-id"), noteBtn.getAttribute("data-detail-id")); return; }
    var statusBtn = target.closest('[data-role="status-btn"]');
    if (statusBtn) { cycleDetailStatus(statusBtn.getAttribute("data-core-id"), statusBtn.getAttribute("data-detail-id")); return; }
    var tagBtn = target.closest('[data-role="tag-btn"]');
    if (tagBtn) { openTagEditor(tagBtn.getAttribute("data-core-id")); return; }
    var ghostCore = target.closest('[data-role="ghost-core"]');
    if (ghostCore) { addCore(); return; }
    var ghostDetail = target.closest('[data-role="ghost-detail"]');
    if (ghostDetail) { addDetail(ghostDetail.getAttribute("data-core-id")); return; }
    var editBtn = target.closest('[data-role="edit-core"]');
    if (editBtn) { enterEdit("core", null, editBtn.getAttribute("data-core-id")); return; }
    var coreBubble = target.closest('[data-role="core"]');
    if (coreBubble) { toggleFocus(coreBubble.getAttribute("data-core-id")); return; }
    var detailBubble = target.closest('[data-role="detail"]');
    if (detailBubble) {
      // A silent dot is tiny and may be moving; editing it would be a poor target.
      // Tapping it focuses its core, which is what you wanted to see anyway.
      if (detailBubble.getAttribute("data-mode") === "mini") {
        toggleFocus(detailBubble.getAttribute("data-core-id"));
        return;
      }
      // Tapping selects, so the hub can show the full text; the pencil edits.
      selectDetail(detailBubble.getAttribute("data-core-id"), detailBubble.getAttribute("data-detail-id"));
      return;
    }
  }
  bubblesLayer.addEventListener("click", function (e) {
    if (e.target.tagName === "INPUT") return;
    if (justDragged) { justDragged = false; return; }
    handleBubbleActivate(e.target);
  });
  bubblesLayer.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.target.tagName === "INPUT") return;
    handleBubbleActivate(e.target);
  });
  document.addEventListener("keydown", function (e) {
    // Escape steps back out of focus before touching any modal.
    if (e.key === "Escape" && state.focusedId !== null && !state.tagEditing &&
        !settingsModal.classList.contains("open") && !state.editing) {
      clearFocus();
    }
  });

  // ---------- tag filter bar interaction ----------
  tagFilterBar.addEventListener("click", function (e) {
    var clearBtn = e.target.closest('[data-role="tagfilter-clear"]');
    if (clearBtn) { clearTagFilter(); return; }
    var chip = e.target.closest('[data-role="tagfilter-chip"]');
    if (chip) { toggleTagFilter(chip.getAttribute("data-tag")); return; }
  });

  // ---------- quick-create panel interaction ----------
  captionArea.addEventListener("click", function (e) {
    var coreBtn = e.target.closest('[data-role="quickcreate-core"]');
    if (coreBtn) { quickCreateCore(coreBtn.getAttribute("data-text")); return; }
    var detailBtn = e.target.closest('[data-role="quickcreate-detail"]');
    if (detailBtn) { quickCreateDetail(detailBtn.getAttribute("data-core-id"), detailBtn.getAttribute("data-text")); return; }
  });

  // ---------- settings / details modal interaction ----------
  // one delegated handler for the whole hub editor, whichever form it shows
  // One handler, two hosts: the editor renders into the hub on the map and into
  // the right pane in tree view, so the same roles must work in both places.
  function handleEditorClick(e) {
    var t = e.target.closest("[data-role]");
    if (!t) return false;
    var role = t.getAttribute("data-role");
    if (role === "editor-close" || role === "display-close") {
      closeHubEditor();
      if (state.view !== "tree") clearFocus();
    }
    else if (role === "editor-save") commitHubEditor();
    else if (role === "icon-opt") { draftIcon = t.getAttribute("data-icon"); renderIconPicker(); }
    else if (role === "color-opt") { draftColor = t.getAttribute("data-color"); renderColorPicker(); }
    else if (role === "detail-status") { detailDraftStatus = t.getAttribute("data-status"); renderDetailStatusRow(); }
    else if (role === "tag-suggest") { addTagFromSuggestion(t.getAttribute("data-tag")); }
    else return false;
    return true;
  }
  function handleEditorKeydown(e) {
    if (e.key === "Escape") { closeHubEditor(); return; }
    // Enter saves from the single-line fields; the description needs its newlines
    if (e.key === "Enter" && e.target.tagName === "INPUT") commitHubEditor();
  }
  hubDisplay.addEventListener("click", handleEditorClick);
  hubDisplay.addEventListener("keydown", handleEditorKeydown);
  if (treeDetail) {
    treeDetail.addEventListener("click", handleEditorClick);
    treeDetail.addEventListener("keydown", handleEditorKeydown);
  }

  focusPill.addEventListener("click", clearFocus);

  settingsBtn.addEventListener("click", openSettings);
  settingsModal.addEventListener("click", function (e) {
    if (e.target === settingsModal) { closeSettings(); return; }
    var t = e.target.closest("[data-role]");
    if (!t) return;
    var role = t.getAttribute("data-role");
    if (role === "close") closeSettings();
    else if (role === "theme") setTheme(t.getAttribute("data-theme"));
    else if (role === "links") setShowLinks(t.getAttribute("data-on") === "1");
    else if (role === "orbit") setRotate(t.getAttribute("data-on") === "1");
    else if (role === "cluster") setCluster(t.getAttribute("data-on") === "1");
    else if (role === "motion") setMotion(t.getAttribute("data-on") === "1");
    else if (role === "speed") setSpeed(t.getAttribute("data-speed"));
    else if (role === "folder-connect") connectFolder();
    else if (role === "folder-disconnect") disconnectFolder();
    else if (role === "export") exportAll();
    else if (role === "import") importInput.click();
    else if (role === "export-json") exportJson();
    else if (role === "import-json") importJsonInput.click();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (detailEditing || state.tagEditing) closeHubEditor();
    else if (settingsModal.classList.contains("open")) closeSettings();
  });

  // ---------- init ----------
  function showStartupError(err) {
    var box = document.createElement("div");
    box.id = "ihbStartupError";
    box.setAttribute("style",
      "max-width:560px;margin:40px auto;padding:18px 20px;border-radius:14px;" +
      "background:#2a1a24;border:1px solid rgba(244,114,182,0.4);color:#fbd1e7;" +
      "font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;" +
      "font-size:13px;line-height:1.6;");
    box.innerHTML = "<b>IdeaHub konnte nicht starten.</b><br>" +
      "Bitte diese Meldung melden:<br><code style='font-size:12px;word-break:break-word'>" +
      String(err && err.message ? err.message : err).replace(/[<>&]/g, "") + "</code>";
    document.body.insertBefore(box, document.body.firstChild);
  }

  function init() {
    try {
      applyMotion();
      applySpeed();
      applyTheme();
    } catch (e) { /* theme is cosmetic; never let it stop the app */ }
    try {
      renderStars();
    } catch (e) { /* decorative only */ }
    try {
      renderStructure();
      setView(state.view, true);   // apply the restored view without re-rendering the map
      renderTree();
    } catch (e) {
      showStartupError(e);
      return;
    }
    // Persistence is optional: if the host blocks storage, the app still works.
    try {
      loadPersisted().then(function () {
        try { renderStructure(); } catch (e) { /* keep the already-rendered map */ }
      }, function () {});
    } catch (e) { /* ignore */ }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  window.__ihb = {
    state: state, coreToMd: coreToMd, parseMdToCore: parseMdToCore, slugify: slugify, coreFilename: coreFilename,
    coreStatus: coreStatus, coreProgress: coreProgress, cycleDetailStatus: cycleDetailStatus,
    allTags: allTags, toggleTagFilter: toggleTagFilter, clearTagFilter: clearTagFilter, computeCounts: computeCounts,
    highlightMatch: highlightMatch, setTheme: setTheme, glassFill: glassFill,
    toggleFocus: toggleFocus, clearFocus: clearFocus, coreIconSvg: coreIconSvg,
    measureLayout: measureLayout, detailRadiusPx: detailRadiusPx, detailSpreadDeg: detailSpreadDeg,
    coreOrbit: coreOrbit, coreDiameter: coreDiameter, detailModeFor: detailModeFor, detailSizeFor: detailSizeFor,
    orbiting: orbiting, setRotate: setRotate, setMotion: setMotion, motionEnabled: motionEnabled,
    setSpeed: setSpeed, speedFactor: speedFactor,
    camera: camera, clampCamera: clampCamera, applyCamera: applyCamera, setCamera: setCamera,
    resetCamera: resetCamera, toMapSpace: toMapSpace, zoomAt: zoomAt, zoomStep: zoomStep, ringRotation: ringRotation, coreAngleRaw: coreAngleRaw,
    ringTarget: ringTarget, startRingTween: startRingTween, updatePositionsOnly: updatePositionsOnly,
    clusterAngles: clusterAngles, clusterGroups: clusterGroups, setCluster: setCluster,
    setView: setView, renderTree: renderTree, treeExpanded: treeExpanded,
    filteredCores: filteredCores, exportAll: exportAll,
    deleteCore: deleteCore, deleteDetail: deleteDetail, addCore: addCore, addDetail: addDetail,
    ringRadiusFor: ringRadiusFor, ringIndexFor: ringIndexFor,
    frequentTags: frequentTags, tagCounts: tagCounts, renderTagSuggestions: renderTagSuggestions,
    focusProgressFor: focusProgressFor, panelHorizontal: panelHorizontal,
    layoutHub: layoutHub, openHubDisplay: openHubDisplay, closeHubDisplay: closeHubDisplay, emitEnergy: emitEnergy, energyFromCore: energyFromCore,
    openDetailEditor: openDetailEditor, openTagEditor: openTagEditor,
    commitHubEditor: commitHubEditor, closeHubEditor: closeHubEditor,
    selectDetail: selectDetail, selectedDetailObj: selectedDetailObj,
    computePositions: computePositions, worstClearance: worstClearance,
    edgeMargin: edgeMargin, layoutMargin: layoutMargin,
    MAX_CORES: MAX_CORES, MAX_DETAILS: MAX_DETAILS,
    exportJson: exportJson, applyJsonBackup: applyJsonBackup, moveDetail: moveDetail, reorderCore: reorderCore, slotAt: slotAt,
    crossLinks: crossLinks, linkPath: linkPath, setShowLinks: setShowLinks, paletteFor: paletteFor, hexToRgbTriple: hexToRgbTriple, getLayout: function () { return layout; }
  };
})();
</script>
