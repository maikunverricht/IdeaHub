<style>
  * { box-sizing: border-box; }
  /* One factor drives every duration in the app. */
  body { --sp: 1.5; }
  body[data-speed="ruhig"]  { --sp: 2.2; }
  body[data-speed="mittel"] { --sp: 1.5; }
  body[data-speed="zuegig"] { --sp: 1; }
  html, body {
    margin: 0;
    padding: 0;
    background: #05060f;
  }
  .ihb-root {
    position: relative;
    min-height: 520px;
    background: radial-gradient(120% 90% at 50% 8%, #171d3d 0%, #0b0e21 46%, #05060f 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 16px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .ihb-settingsbtn {
    position: absolute;
    top: 14px;
    right: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    color: rgba(226,229,255,0.85);
    border-radius: 999px;
    padding: 7px 12px 7px 10px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    z-index: 5;
  }
  .ihb-settingsbtn:hover { background: rgba(255,255,255,0.1); }
  .ihb-map {
    position: relative;
    width: 100%;
    max-width: 980px;
  }
  .ihb-map:after { content: ""; display: block; padding-bottom: 100%; }
  .ihb-star {
    position: absolute;
    border-radius: 999px;
    background: #eef1ff;
    opacity: 0.4;
  }
  body[data-motion="on"] .ihb-star { animation: ihbTwinkle linear infinite; }
  body[data-motion="on"] .ihb-bob { animation: ihbBob ease-in-out infinite; }
  @keyframes ihbTwinkle { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.65; } }
  @keyframes ihbBob {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-3px); }
  }
  .ihb-bubble {
    position: absolute;
    left: var(--x);
    top: var(--y);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: left calc(0.7s * var(--sp)) ease, top calc(0.7s * var(--sp)) ease,
                width calc(0.7s * var(--sp)) ease, height calc(0.7s * var(--sp)) ease,
                margin-left calc(0.7s * var(--sp)) ease, margin-top calc(0.7s * var(--sp)) ease,
                opacity calc(0.55s * var(--sp)) ease, box-shadow calc(0.6s * var(--sp)) ease,
                filter calc(0.6s * var(--sp)) ease;
    border: 1px solid rgba(255,255,255,0.28);
  }
  /* the ring tween sets positions itself; a second easing would desynchronise
     the bubbles from their connecting lines */
  .ihb-tweening .ihb-bubble,
  .ihb-tweening .ihb-orbit { transition: none !important; }
  .ihb-bubble:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  /* The cloud view is the one place that trades the flat map's guaranteed
     non-overlap for real depth. perspective lives here and nowhere else: any
     ancestor carrying a filter, a backdrop blur or a partial opacity would
     flatten preserve-3d back into a plane. #bubblesLayer has none of those, which is
     why the layer is the container rather than the map or the camera. */
  #bubblesLayer.ihb-3d {
    transform-style: preserve-3d;
    /* perspective turns this element into the containing block for its
       absolutely positioned children — same as transform does. #bubblesLayer is
       an unpositioned div of zero height, so without these two lines every
       bubble's top: var(--y) suddenly resolved against 0 and the whole ring
       collapsed onto one horizontal line. It has to carry the same box the
       camera layer does. */
    position: absolute;
    inset: 0;
  }
  #bubblesLayer.ihb-3d .ihb-bubble {
    transform-style: preserve-3d;
  }
  /* Depth fog. Deliberately not opacity or filter: applyFilter() writes both of
     those inline for search and focus dimming, and the two would overwrite
     each other. An overlay pseudo-element keeps the two concerns apart. */
  #bubblesLayer.ihb-3d .ihb-core:after {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 50%;
    pointer-events: none;
    background: rgba(6,8,22,var(--fog,0));
    transition: background calc(0.5s * var(--sp)) ease;
  }
  body[data-theme="minimal"] #bubblesLayer.ihb-3d .ihb-core:after {
    background: rgba(255,255,255,var(--fog,0));
  }
  /* The pixel sizes below are only the starting point: measureLayout() computes
     the real sizes from the map width and writes them inline. They still matter
     as a sane fallback if that script ever fails to run. */
  .ihb-core {
    width: 96px; height: 96px; margin-left: -48px; margin-top: -48px;
    padding: 8px;
    flex-direction: column;
    gap: 1px;
  }
  /* Group bubble: sits in the band between hub and ring, so it reads as a
     gathering point rather than another idea on the ring. */
  .ihb-group {
    flex-direction: column;
    gap: 2px;
    padding: 6px;
    text-align: center;
    cursor: pointer;
    border-radius: 999px;
  }
  .ihb-group .ihb-grouplabel {
    font-size: 11.5px;   /* overwritten inline: the real size follows the bubble */
    line-height: 1.15;
    font-weight: 600;
    letter-spacing: 0.01em;
    overflow: hidden;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    word-break: break-word;
  }
  .ihb-group .ihb-groupcount {
    font-size: 9.5px;
    opacity: 0.72;
  }
  .ihb-progressring {
    position: absolute;
    top: -1px; left: -1px;
    pointer-events: none;
    z-index: 0;
  }
  body[data-theme="minimal"] .ihb-progressring circle:first-child { stroke: rgba(20,22,45,0.12); }
  body[data-theme="minimal"] .ihb-crosslink { stroke: #6C4CFF; }
  .ihb-coreicon {
    color: rgba(255,255,255,0.82);
    margin-bottom: 1px;
    flex-shrink: 0;
    pointer-events: none;
    position: relative;
    z-index: 1;
  }
  body[data-theme="minimal"] .ihb-coreicon { color: rgba(23,26,46,0.66); }
  .ihb-sublabel {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-size: 8.5px;
    line-height: 1.15;
    font-weight: 400;
    color: rgba(242,243,255,0.72);
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    word-break: break-word;
    pointer-events: none;
    position: relative;
    z-index: 1;
  }
  body[data-theme="minimal"] .ihb-sublabel { color: rgba(23,26,46,0.62); text-shadow: none; }
  .ihb-detail {
    width: 66px; height: 50px; margin-left: -33px; margin-top: -25px;
    padding: 5px;
  }
  .ihb-bubble.ihb-dragging {
    z-index: 30;
    transition: none;
    cursor: grabbing;
    box-shadow: 0 10px 26px rgba(0,0,0,0.45) !important;
  }
  .ihb-bubble.ihb-droptarget {
    border-color: #ffffff;
    border-width: 2px;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.18) !important;
  }
  body[data-theme="minimal"] .ihb-bubble.ihb-droptarget { border-color: #6C4CFF; box-shadow: 0 0 0 4px rgba(108,76,255,0.2) !important; }
  /* ---- the hub opens: two halves stay, a display appears between them ----
     Nothing is placed next to the hub any more; the hub itself parts, so the
     connection is shown rather than implied. No frame on the display: the
     halves already carry the shape. */
  .ihb-hub {
    position: absolute;
    left: 50%; top: 50%;
    z-index: 12;
    cursor: default;
  }
  .ihb-cap {
    position: absolute;
    background: radial-gradient(circle at 38% 30%, #fff0c4 0%, #ffd98a 26%, #ffb156 58%, #e07f28 100%);
    box-shadow: 0 0 44px 10px rgba(255,168,74,0.26), 0 0 96px 26px rgba(255,140,40,0.10);
    z-index: 2;
  }
  .ihb-display {
    position: absolute;
    background: #10132a;                    /* solid fallback */
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 14px 40px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(255,255,255,0.22),
                inset 0 -1px 0 rgba(255,255,255,0.05);
    overflow: hidden;
    z-index: 1;
    opacity: 0;
  }
  /* Liquid glass where the browser supports it; the solid colour above is the
     fallback, so nothing depends on the effect being available. */
  @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .ihb-display {
      background: rgba(18,22,48,0.44);
      -webkit-backdrop-filter: blur(16px) saturate(1.35);
      backdrop-filter: blur(16px) saturate(1.35);
    }
    body[data-theme="minimal"] .ihb-display {
      background: rgba(255,255,255,0.55);
      -webkit-backdrop-filter: blur(16px) saturate(1.2);
      backdrop-filter: blur(16px) saturate(1.2);
    }
  }
  body[data-theme="minimal"] .ihb-display {
    background: #f6f7fc;
    border-color: rgba(20,22,45,0.12);
    box-shadow: 0 14px 40px rgba(20,22,45,0.18), inset 0 1px 0 rgba(255,255,255,0.8);
  }
  .ihb-hub.open .ihb-display { opacity: 1; }
  body[data-theme="minimal"] .ihb-display { background: #ffffff; }
  .ihb-display-body {
    opacity: 0; text-align: left;
    height: 100%;
    position: absolute; top: 0; left: 50%;   /* Endbreite, mittig: die Flaeche gibt den Inhalt frei wie ein Vorhang */
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;      /* reaching the end must not scroll the page */
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.25) transparent;
  }
  .ihb-display-body::-webkit-scrollbar { width: 5px; }

  body[data-theme="minimal"] .ihb-hub {
    background: radial-gradient(circle at 38% 30%, #ffe7b0 0%, #ffd28a 45%, #f0aa55 100%);
    box-shadow: 0 2px 18px rgba(180,120,40,0.18);
  }
  body[data-theme="minimal"] .ihb-hub-title { color: #4a2c0d; }
  body[data-theme="minimal"] .ihb-searchwrap { background: rgba(255,255,255,0.9); border-color: rgba(80,60,120,0.3); box-shadow: none; }
  body[data-theme="minimal"] .ihb-search { color: #241405; }
  body[data-theme="minimal"] .ihb-search::placeholder { color: rgba(60,40,20,0.5); }
  body[data-theme="minimal"] .ihb-hl { background: #ffe27a; color: #241405; }
  body[data-theme="minimal"] .ihb-caption { color: #5b6079; }
  body[data-theme="minimal"] .ihb-caption b { color: #262a44; }
  body[data-theme="minimal"] .ihb-version { color: rgba(20,22,45,0.28); }
  body[data-theme="minimal"] .ihb-settingsbtn {
    background: rgba(20,22,45,0.05); border-color: rgba(20,22,45,0.18); color: #333752;
  }
  body[data-theme="minimal"] .ihb-tagchip { background: rgba(20,22,45,0.05); border-color: rgba(20,22,45,0.16); color: #414665; }
  body[data-theme="minimal"] .ihb-tagchip.active { background: #6C4CFF; border-color: transparent; color: #fff; }
  body[data-theme="minimal"] .ihb-tagchip.clear { color: rgba(20,22,45,0.5); }
  body[data-theme="minimal"] .ihb-chip { background: rgba(20,22,45,0.05); border-color: rgba(20,22,45,0.16); color: #333752; }
  body[data-theme="minimal"] .ihb-del,
  body[data-theme="minimal"] .ihb-tagbtn,
  body[data-theme="minimal"] .ihb-statusbtn { background: #ffffff; border-color: rgba(20,22,45,0.25); color: #333752; }
  body[data-theme="minimal"] .ihb-overlay { background: rgba(30,32,55,0.42); }
  body[data-theme="minimal"] .ihb-card { background: #ffffff; border-color: rgba(20,22,45,0.12); color: #23263d; }
  body[data-theme="minimal"] .ihb-card h2 button { color: rgba(35,38,61,0.55); }
  body[data-theme="minimal"] .ihb-note { color: #5b6079; }
  body[data-theme="minimal"] .ihb-status { color: #6a6f88; }
  body[data-theme="minimal"] .ihb-section h3,
  body[data-theme="minimal"] .ihb-fieldlabel { color: #6a6f88; }
  body[data-theme="minimal"] .ihb-btn { background: rgba(20,22,45,0.05); border-color: rgba(20,22,45,0.16); color: #23263d; }
  body[data-theme="minimal"] .ihb-btn.primary { background: linear-gradient(135deg, #8B6CFF, #6C4CFF); color: #fff; }
  body[data-theme="minimal"] .ihb-taginput,
  body[data-theme="minimal"] .ihb-notesarea { background: #f7f8fc; border-color: rgba(20,22,45,0.18); color: #23263d; }

  /* ---- Theme-Auswahl in den Einstellungen ---- */
  .ihb-themerow { display: flex; gap: 8px; margin-top: 8px; }
  .ihb-themeopt {
    flex: 1; border-radius: 10px; padding: 10px 8px; font-size: 12.5px; font-weight: 600;
    font-family: inherit; cursor: pointer; border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.05); color: #e7e9fb;
  }
  .ihb-themeopt.active { border-color: #8B6CFF; background: rgba(139,108,255,0.18); }
  body[data-theme="minimal"] .ihb-themeopt { background: rgba(20,22,45,0.04); border-color: rgba(20,22,45,0.16); color: #23263d; }
  body[data-theme="minimal"] .ihb-themeopt.active { border-color: #6C4CFF; background: rgba(108,76,255,0.12); }

  .ihb-viewswitch {
    position: absolute; top: 12px; left: 12px; z-index: 30;
    display: flex; gap: 2px; padding: 2px;
    background: rgba(20,22,45,0.5); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
  }
  .ihb-viewswitch button {
    border: none; background: none; color: rgba(231,233,251,0.65);
    font-family: inherit; font-size: 12px; font-weight: 600;
    padding: 5px 13px; border-radius: 999px; cursor: pointer;
  }
  .ihb-viewswitch button[aria-selected="true"] { background: rgba(255,255,255,0.14); color: #eef0ff; }
  body[data-theme="minimal"] .ihb-viewswitch { background: rgba(255,255,255,0.92); border-color: rgba(20,22,45,0.14); }
  body[data-theme="minimal"] .ihb-viewswitch button { color: #6a6f88; }
  body[data-theme="minimal"] .ihb-viewswitch button[aria-selected="true"] { background: rgba(20,22,45,0.08); color: #23263d; }

  /* ---- tree view: structure on the left, the selected item's content right ---- */
  .ihb-treeview {
    display: flex; gap: 16px;
    width: 100%; max-width: 980px; margin: 0 auto;
    min-height: 420px;
  }
  .ihb-treeview[hidden] { display: none; }
  .ihb-tree-pane, .ihb-tree-detail {
    background: rgba(18,22,48,0.44);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 12px;
    overflow-y: auto;
    max-height: 68vh;
    overscroll-behavior: contain;
  }
  .ihb-tree-left { flex: 0 0 40%; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .ihb-tree-pane { flex: 1; min-width: 0; }
  .ihb-tree-count { font-size: 11.5px; color: rgba(231,233,251,0.5); padding: 0 4px; }
  .ihb-tree-warn { margin: 6px 0 0; line-height: 1.45; }
  body[data-theme="minimal"] .ihb-tree-count { color: #6a6f88; }
  .ihb-tree-detail { flex: 1; min-width: 0; padding: 18px 20px; }
  @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .ihb-tree-pane, .ihb-tree-detail {
      -webkit-backdrop-filter: blur(16px) saturate(1.35);
      backdrop-filter: blur(16px) saturate(1.35);
    }
  }
  body[data-theme="minimal"] .ihb-tree-pane,
  body[data-theme="minimal"] .ihb-tree-detail {
    background: rgba(255,255,255,0.75); border-color: rgba(20,22,45,0.12);
  }
  .ihb-tree-row {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 8px; border-radius: 9px; cursor: pointer;
    color: #e7e9fb; font-size: 13.5px; line-height: 1.3;
  }
  .ihb-tree-row:hover { background: rgba(255,255,255,0.07); }
  .ihb-tree-row[aria-selected="true"] { background: rgba(139,108,255,0.26); }
  .ihb-tree-row.is-detail { font-size: 12.5px; padding-left: 26px; color: rgba(231,233,251,0.86); }
  .ihb-tree-row.is-dimmed { opacity: 0.35; }
  .ihb-tree-twisty {
    width: 16px; height: 16px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border: none; background: none; color: inherit; cursor: pointer; padding: 0;
    transition: transform calc(0.18s * var(--sp));
  }
  .ihb-tree-twisty[aria-expanded="true"] { transform: rotate(90deg); }
  .ihb-tree-twisty.is-leaf { visibility: hidden; }
  .ihb-tree-dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
  .ihb-tree-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ihb-tree-meta { font-size: 11px; color: rgba(231,233,251,0.45); flex-shrink: 0; }
  body[data-theme="minimal"] .ihb-tree-row { color: #23263d; }
  body[data-theme="minimal"] .ihb-tree-row.is-detail { color: #4a4f68; }
  body[data-theme="minimal"] .ihb-tree-meta { color: #6a6f88; }
  .ihb-tree-actions { display: flex; gap: 2px; flex-shrink: 0; opacity: 0; }
  .ihb-tree-row:hover .ihb-tree-actions,
  .ihb-tree-row:focus-within .ihb-tree-actions,
  .ihb-tree-row[aria-selected="true"] .ihb-tree-actions { opacity: 1; }
  .ihb-tree-actions button {
    border: none; background: none; padding: 3px; border-radius: 6px;
    color: rgba(231,233,251,0.55); cursor: pointer; display: flex;
  }
  .ihb-tree-actions button:hover { background: rgba(255,255,255,0.14); color: #eef0ff; }
  .ihb-tree-status {
    border: none; background: none; padding: 0; cursor: pointer;
    color: rgba(231,233,251,0.7); font-size: 12px; width: 15px; flex-shrink: 0;
  }
  .ihb-tree-status:hover { color: #eef0ff; }
  .ihb-tree-newrow {
    display: flex; align-items: center; gap: 7px; width: 100%;
    margin-top: 4px; padding: 8px; border-radius: 9px; cursor: pointer;
    border: 1px dashed rgba(255,255,255,0.24); background: none;
    color: rgba(231,233,251,0.6); font-family: inherit; font-size: 12.5px;
  }
  .ihb-tree-newrow:hover { background: rgba(255,255,255,0.06); color: #eef0ff; }
  body[data-theme="minimal"] .ihb-tree-actions button,
  body[data-theme="minimal"] .ihb-tree-status { color: #6a6f88; }
  body[data-theme="minimal"] .ihb-tree-newrow { border-color: rgba(20,22,45,0.24); color: #6a6f88; }
  .ihb-tree-empty { color: rgba(231,233,251,0.5); font-size: 13px; padding: 10px; }
  .ihb-tree-detail .ihb-info-title { margin-top: 0; }
  .ihb-tree-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .ihb-tree-tag {
    font-size: 11.5px; padding: 3px 10px; border-radius: 999px;
    background: rgba(255,255,255,0.09); color: rgba(231,233,251,0.85);
  }
  body[data-theme="minimal"] .ihb-tree-tag { background: rgba(20,22,45,0.07); color: #4a4f68; }
  @media (max-width: 720px) {
    .ihb-treeview { flex-direction: column; }
    .ihb-tree-left { flex: none; }
    .ihb-tree-pane { flex: none; max-height: 40vh; }
    .ihb-tree-detail { max-height: none; }
  }
  /* ---- Einstellungen klarer gegliedert (Review-Punkt) ---- */
  .ihb-section + .ihb-section { border-top: 1px solid rgba(255,255,255,0.09); padding-top: 15px; }
  body[data-theme="minimal"] .ihb-section + .ihb-section { border-top-color: rgba(20,22,45,0.1); }

  /* ═══════════════════════════════════════════════════════════════
     WERKBANK-Auftritt — dieselben Tokens wie Kontor (Stand 10.10.2026).
     Liegt als letzte Schicht ueber allem, damit die gewachsenen Regeln
     darueber unberuehrt bleiben. Jede Regel beginnt mit body[data-theme],
     so gewinnt sie gegen die alten Minimal-Regeln gleicher Staerke.
     Farbe heisst hier: Bernstein = Hub, Fokus, Hauptaktion.
     Tuerkis = erledigt. Die Akzentfarben der Ideen sagen nur „welche Idee“.
     ═══════════════════════════════════════════════════════════════ */
  html { background: #06090E; }
  html[data-theme="light"] { background: #EEF1F6; }
  body[data-theme] {
    --void: #06090E;
    --text: #EDF0F3; --text-2: #9BA6B2; --text-3: #6B7683;
    --line: rgba(255,255,255,.09); --line-strong: rgba(255,255,255,.17);
    --line-hi: rgba(242,179,61,.38);
    --glass: rgba(16,22,31,.55); --film: rgba(255,255,255,.045);
    --surface: rgba(12,17,24,.86); --surface-solid: #0C1118;
    --shadow: 0 18px 46px -22px rgba(0,0,0,.75);
    --shadow-lg: 0 30px 80px -30px rgba(0,0,0,.85);
    --amber: #F2B33D; --amber-soft: rgba(242,179,61,.14);
    --free: #63D9C4; --free-soft: rgba(99,217,196,.16);
    --over: #EE8E6A; --red-ink: #E8646E; --ink: #12171F;
    --em-1: #F2B33D; --em-2: #F7CF83; --em-3: #63D9C4;
    --glow-a: rgba(242,179,61,.10); --glow-t: rgba(99,217,196,.08);
    --bg-grad: linear-gradient(175deg,#070B11 0%,#0A121B 38%,#0C1620 68%,#080C12 100%);
    --display: "Archivo","Helvetica Neue",Arial,sans-serif;
    --mono: "JetBrains Mono",ui-monospace,Menlo,monospace;
    --kurve: cubic-bezier(.2,.8,.2,1);
    --bub-edge: .38; --ctl: rgba(12,17,24,.94);
    background: var(--void); color: var(--text);
    font-family: var(--display);
    -webkit-font-smoothing: antialiased;
  }
  body[data-theme="minimal"] {
    --void: #EEF1F6;
    --text: #111923; --text-2: #4A5563; --text-3: #7A8493;
    --line: rgba(17,28,44,.10); --line-strong: rgba(17,28,44,.20);
    --line-hi: rgba(224,162,31,.55);
    --glass: rgba(255,255,255,.62); --film: rgba(17,28,44,.04);
    --surface: rgba(250,251,253,.92); --surface-solid: #FAFBFD;
    --shadow: 0 20px 44px -24px rgba(20,36,60,.38);
    --shadow-lg: 0 30px 70px -34px rgba(30,40,60,.42);
    --amber: #E0A21F; --amber-soft: rgba(224,162,31,.16);
    --free: #2FA894; --free-soft: rgba(47,168,148,.16);
    --over: #D2704A; --red-ink: #C6404E;
    --em-1: #B8791A; --em-2: #8E7A26; --em-3: #14796A;
    --glow-a: rgba(224,162,31,.13); --glow-t: rgba(47,168,148,.10);
    --bg-grad: linear-gradient(175deg,#F5F7FA 0%,#EAEEF4 38%,#E6EBF2 68%,#F2F4F8 100%);
    --bub-edge: .5; --ctl: #FFFFFF;
  }
  body[data-theme] :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  /* ---- Grund: Verlauf, zwei Lichtfelder, Raster das nach unten ausblendet ---- */
  body[data-theme] { background: var(--bg-grad) fixed, var(--void); }
  body[data-theme] .ihb-root {
    background: transparent;
    font-family: var(--display);
    justify-content: flex-start;
    padding: 12px 16px 28px;
    isolation: isolate;
    min-height: 640px;
  }
  body[data-theme] .ihb-root::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(620px 620px at 8% -6%, var(--glow-a), transparent 70%),
      radial-gradient(720px 720px at 104% 58%, var(--glow-t), transparent 70%);
  }
  body[data-theme] .ihb-root::after {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .5;
    background-image: linear-gradient(var(--line) 1px, transparent 1px),
                      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 62%);
    mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 62%);
  }
  /* Die Sternenebene braucht eine Flaeche: sobald sie fuer die Parallaxe ein
     transform traegt, wird sie Bezugsrahmen ihrer Sterne. */
  body[data-theme] #starsLayer { position: absolute; inset: 0; pointer-events: none; }
  body[data-theme] .ihb-star { opacity: .22; }
  body[data-theme="minimal"] .ihb-star { display: none; }

  /* ---- Leiste oben: eine Glasschiene statt vier verstreuter Knoepfe ---- */
  body[data-theme] .ihb-nav {
    position: -webkit-sticky; position: sticky; top: 12px; z-index: 45;
    width: 100%; max-width: 1120px; margin: 0 auto 14px;
  }
  body[data-theme] .ihb-nav-in {
    display: flex; align-items: center; gap: 12px;
    height: 52px; padding: 0 8px 0 18px;
    border-radius: 100px; border: 1px solid var(--line-strong);
    background: var(--surface); box-shadow: var(--shadow);
  }
  @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    body[data-theme] .ihb-nav-in {
      background: var(--glass);
      -webkit-backdrop-filter: blur(15px) saturate(1.3);
      backdrop-filter: blur(15px) saturate(1.3);
    }
  }
  body[data-theme] .ihb-brand {
    display: flex; align-items: center; gap: 10px; white-space: nowrap;
    font-weight: 500; letter-spacing: -.01em; color: var(--text); font-size: 16px;
  }
  body[data-theme] .ihb-brand b { font-weight: 800; font-variation-settings: 'wdth' 112; }
  body[data-theme] .ihb-mark { display: inline-flex; width: 22px; height: 22px; color: var(--text); }
  body[data-theme] .ihb-mark svg { width: 100%; height: 100%; display: block; overflow: visible; }
  body[data-theme] .ihb-mark-dot { fill: var(--amber); }
  body[data-theme] .ihb-nav-r { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  body[data-theme] .ihb-viewswitch {
    position: static; display: flex; gap: 2px; padding: 3px;
    background: var(--film); border: 1px solid var(--line); border-radius: 100px;
  }
  body[data-theme] .ihb-viewswitch button {
    height: 30px; padding: 0 14px; border-radius: 100px; border: 0; background: none;
    font-family: var(--display); font-size: 13.5px; font-weight: 500; color: var(--text-2); cursor: pointer;
    transition: background .25s var(--kurve), color .25s var(--kurve);
  }
  body[data-theme] .ihb-viewswitch button[aria-selected="true"] {
    background: var(--amber-soft); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-hi);
  }

  body[data-theme] .ihb-focuspill {
    margin: 0 auto; min-width: 0; max-width: 42%;
    height: 34px; padding: 0 6px 0 14px; gap: 9px;
    border-radius: 100px; border: 1px solid var(--line-hi); background: var(--amber-soft);
    color: var(--text); font-family: var(--display); font-size: 13.5px; font-weight: 600;
  }
  body[data-theme] #focusPillText { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body[data-theme] .ihb-focuspill-x { width: 22px; height: 22px; flex: none; background: var(--film); color: var(--text-2); }

  body[data-theme] .ihb-settingsbtn,
  body[data-theme] .ihb-themebtn {
    position: static; display: inline-flex; align-items: center; gap: 7px;
    height: 36px; padding: 0 14px; border-radius: 100px;
    border: 1px solid var(--line-strong); background: transparent; color: var(--text);
    font-family: var(--display); font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap;
    transition: background .25s var(--kurve), border-color .25s var(--kurve);
  }
  body[data-theme] .ihb-themebtn { width: 36px; padding: 0; justify-content: center; }
  body[data-theme] .ihb-settingsbtn:hover,
  body[data-theme] .ihb-themebtn:hover { background: var(--film); border-color: var(--line-hi); }
  body[data-theme] .ihb-themebtn svg { width: 16px; height: 16px; }
  body[data-theme] .ihb-themebtn .ihb-sun { display: none; }
  body[data-theme="minimal"] .ihb-themebtn .ihb-sun { display: block; }
  body[data-theme="minimal"] .ihb-themebtn .ihb-moon { display: none; }

  /* ---- Tag-Leiste: Schildchen wie die Kategorie-Marken im Kontor ---- */
  body[data-theme] .ihb-tagfilterbar { gap: 6px; margin-bottom: 6px; max-width: 760px; }
  body[data-theme] .ihb-tagchip {
    font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    padding: 5px 11px; border-radius: 100px;
    border: 1px solid var(--line); background: transparent; color: var(--text-3);
  }
  body[data-theme] .ihb-tagchip:hover { border-color: var(--line-hi); color: var(--text); background: var(--film); }
  body[data-theme] .ihb-tagchip.active { background: var(--amber-soft); border-color: var(--amber); color: var(--text); }
  body[data-theme] .ihb-tagchip.clear { border-style: dashed; color: var(--text-3); display: inline-flex; align-items: center; gap: 6px; }

  /* ---- Bubbles ---- */
  body[data-theme] .ihb-bubble.ihb-core,
  body[data-theme] .ihb-bubble.ihb-detail {
    border-color: rgba(var(--tint, 155,166,178), var(--bub-edge));
  }
  body[data-theme] .ihb-bubble.is-focused { border-color: var(--amber); border-width: 2px; }
  body[data-theme] .ihb-label {
    color: var(--text); font-weight: 700; letter-spacing: -.02em;
    font-variation-settings: 'wdth' 106; text-shadow: 0 1px 2px rgba(0,0,0,.35);
  }
  body[data-theme="minimal"] .ihb-label { text-shadow: none; }
  body[data-theme] .ihb-detail .ihb-label { font-weight: 600; letter-spacing: -.01em; }
  /* lange deutsche Woerter trennen statt mitten im Wort umzubrechen */
  body[data-theme] .ihb-label, body[data-theme] .ihb-sublabel {
    word-break: normal; overflow-wrap: anywhere; -webkit-hyphens: auto; hyphens: auto;
  }
  body[data-theme] .ihb-sublabel { color: var(--text-2); text-shadow: none; font-weight: 500; }
  body[data-theme] .ihb-coreicon { color: var(--text-2); }
  /* Lichtkante, die beim Ueberfahren einmal ueber die Kugel streicht */
  body[data-theme] #bubblesLayer:not(.ihb-3d) .ihb-core:not(.ihb-ghost)::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 0;
    background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.16) 50%, transparent 62%);
    background-size: 260% 100%; background-position: 130% 0; opacity: 0;
  }
  body[data-theme][data-motion="on"] #bubblesLayer:not(.ihb-3d) .ihb-core:not(.ihb-ghost):hover::after {
    opacity: 1; background-position: -30% 0;
    transition: background-position calc(.9s * var(--sp)) var(--kurve), opacity .2s ease;
  }

  /* Wolke (3D): der Nebel nimmt den Grundton der Werkbank an, nicht Violett */
  body[data-theme] #bubblesLayer.ihb-3d .ihb-core::after { background: rgba(6,9,14,var(--fog,0)); }
  body[data-theme="minimal"] #bubblesLayer.ihb-3d .ihb-core::after { background: rgba(238,241,246,var(--fog,0)); }
  /* Gruppen-Bubble: Sammelpunkt, kein weiteres Ideenzeichen. Duenner Bernsteinrand

  /* Status ueber die Form, nicht ueber die Ideenfarbe:

  body[data-theme] .ihb-statusbtn { opacity: 1; }

  /* Fortschritt: die Speiche zeigt ihn immer, der Ring an der Kugel nur,

  /* ---- Display: dieselbe Tafel wie der Inspektor im Kontor ---- */

  body[data-theme] .ihb-inboxbtn.is-full .ihb-inboxcount { background: var(--amber); color: var(--ink); }
  /* Eingang aus dem Hub: leichter Schleier statt Abdunkeln, das Fenster steht

  body[data-theme] .ihb-overlay.ihb-inboxsheet { padding: 0; background: rgba(4,7,11,.20); -webkit-backdrop-filter: none; backdrop-filter: none; }
  body[data-theme="minimal"] .ihb-overlay.ihb-inboxsheet { background: rgba(30,40,60,.07); }

    box-shadow: 0 28px 70px rgba(0,0,0,.34), 0 2px 10px rgba(0,0,0,.16); }

  body[data-theme] .ihb-inbox-notice { margin: 8px 0 0; color: var(--amber); }
  body[data-theme] .ihb-inbox-notice:empty { display: none; }
  body[data-theme] .ihb-inbox-pick { flex: none; width: 20px; height: 20px; padding: 0; border-radius: 50%; border: 1px solid var(--line-strong); background: transparent; color: var(--ink); font-family: var(--mono); font-size: 10px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  body[data-theme] .ihb-inbox-pick[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); }
  .ihb-inbox-pick { position: relative; }
  .ihb-inbox-pick::after { content: ""; position: absolute; inset: -9px -8px; }   /* Fingerflaeche um den kleinen Kreis */
  @media (max-width: 599px) { body[data-theme] .ihb-inbox-time { display: none; } }   /* der Tag steht darueber */
  body[data-theme] .ihb-inbox-badge { margin-left: 6px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--amber); white-space: nowrap; }
  body[data-theme] .ihb-inbox-pickbar { margin-top: 10px; }
  body[data-theme] .ihb-inbox-pickbar .ihb-note { margin: 0 0 8px; text-align: center; }
  body[data-theme] .ihb-inbox-pickbar .ihb-btnrow { flex-wrap: wrap; }
  body[data-theme] .ihb-inbox-pickbar .ihb-btn:disabled { opacity: .45; cursor: default; }
  body[data-theme] .ihb-inbox-day { margin: 14px 0 4px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
  body[data-theme] .ihb-inbox-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  body[data-theme] .ihb-inbox-time { flex: none; font-family: var(--mono); font-size: 11px; color: var(--text-3); }
  body[data-theme] .ihb-inbox-text { flex: 1; min-width: 0; color: var(--text); font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
  body[data-theme] .ihb-inbox-row .ihb-chip { flex: none; font-size: 12px; padding: 4px 10px; }
  body[data-theme] .ihb-inbox-drop { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line-strong); background: transparent; color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  body[data-theme] .ihb-inbox-empty { margin-top: 12px; }
  @media (max-width: 599px) {
    body[data-theme] .ihb-inboxcard { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-height: 85%; border-radius: 20px 20px 0 0; }
  }
  /* ---- Einsortier-Dialog ---- */
  body[data-theme] .ihb-sort { outline: none; display: flex; flex-direction: column; gap: 8px; }
  body[data-theme] .ihb-sort .ihb-chiprow { justify-content: flex-start; }
  body[data-theme] .ihb-sort kbd { font-family: var(--mono); font-size: 10px; padding: 0 4px; margin-right: 6px; border: 1px solid var(--line-strong); border-radius: 4px; color: var(--amber); }
  body[data-theme] .ihb-sort .ihb-chip:disabled { opacity: .45; cursor: default; }
  body[data-theme] .ihb-sort-full { margin-left: 6px; font-family: var(--mono); font-size: 10px; color: var(--over); }
  /* ---- Eingang auf der Karte ---- */
  .ihb-inboxdots { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
  body[data-theme] .ihb-inboxdot { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; padding: 0; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--film); opacity: .75; cursor: grab; pointer-events: auto; touch-action: none; transition: opacity .3s, background .3s, box-shadow .3s; }
  body[data-theme] .ihb-inboxdot:hover { opacity: 1; border-color: var(--line-hi); }
  body[data-theme] .ihb-inboxdot.is-match { opacity: 1; background: var(--amber); border-color: var(--amber); box-shadow: 0 0 10px var(--amber-soft); }
  body[data-theme] .ihb-inboxdot.is-dim { opacity: .2; }
  body[data-theme] .ihb-inboxmore { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; padding: 2px; border: 0; background: transparent; cursor: pointer; font-family: var(--mono); font-size: 10px; color: var(--text-2); }
  body[data-theme] .ihb-inbox-handle { flex: none; cursor: grab; color: var(--text-3); touch-action: none; user-select: none; font-size: 14px; line-height: 1; padding: 2px; }
  body[data-theme] .ihb-inbox-row.is-match .ihb-inbox-text { color: var(--amber); }
  body[data-theme] .ihb-inboxsheet.is-dragging { opacity: .12; pointer-events: none; transition: opacity .2s; }
  /* ---- Dialoge am Handy als Blatt (v4.2) ---- */
  .ihb-dialogcard .ihb-sheet-body { min-height: 0; }
  .ihb-dialogcard .ihb-display-head { margin-top: 2px; }
  @media (max-width: 599px) {
    body[data-theme] .ihb-inboxcard { bottom: var(--kb, 0px); max-height: calc(85% - var(--kb, 0px)); }
  }
  /* ---- Eingang im Hub (v4.1) ---- */
  .ihb-overlay.ihb-inboxsheet.in-hub { display: none !important; }
  #hubDisplayBody .ihb-inboxcard { position: static; left: auto; top: auto; width: auto; max-width: none; max-height: none;
    overflow: visible; margin: 0; padding: 0; background: transparent; border: 0; border-radius: 0; box-shadow: none; }
  #hubDisplayBody .ihb-inboxcard > h2 { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin: 0 0 12px; padding: 0; border: 0; font-family: var(--mono); font-size: calc(10.5px * var(--dsc, 1)); font-weight: 500;
    letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); font-variation-settings: normal; }
  #hubDisplayBody .ihb-inboxcard > h2 > span { display: flex; align-items: center; gap: 10px; min-width: 0; }
  #hubDisplayBody .ihb-inboxcard > h2 > span::before { content: ""; width: 22px; height: 1px; background: var(--amber); flex: none; }
  #hubDisplayBody .ihb-inboxcard > h2 > button { width: 30px; height: 30px; flex: none; }
  /* ---- Uebergaenge (v4.0) ---- */
  body[data-motion="on"] .ihb-hub .ihb-cap {
    transition: width calc(0.85s * var(--sp)) cubic-bezier(.33,.02,.15,1),
                height calc(0.85s * var(--sp)) cubic-bezier(.33,.02,.15,1),
                margin-left calc(0.85s * var(--sp)) cubic-bezier(.33,.02,.15,1),
                margin-top calc(0.85s * var(--sp)) cubic-bezier(.33,.02,.15,1),
                left calc(0.85s * var(--sp)) cubic-bezier(.33,.02,.15,1),
                top calc(0.85s * var(--sp)) cubic-bezier(.33,.02,.15,1),
                opacity calc(0.3s * var(--sp)) ease,
                transform calc(0.5s * var(--sp)) cubic-bezier(.33,.02,.15,1);
  }
  .ihb-hub.ihb-peek:not(.open) .ihb-cap-a { transform: translateX(calc(-1 * var(--peek, 30px))); }
  .ihb-hub.ihb-peek:not(.open) .ihb-cap-b { transform: translateX(var(--peek, 30px)); }
  .ihb-hub.ihb-peek.ihb-peek-v:not(.open) .ihb-cap-a { transform: translateY(calc(-1 * var(--peek, 30px))); }
  .ihb-hub.ihb-peek.ihb-peek-v:not(.open) .ihb-cap-b { transform: translateY(var(--peek, 30px)); }
  .ihb-hub.ihb-peek .ihb-hub-face { opacity: 0; }
  body[data-motion="on"] .ihb-hub.ihb-peek-out:not(.ihb-peek):not(.open) .ihb-hub-face { transition: opacity calc(0.25s * var(--sp)) ease calc(0.28s * var(--sp)); }
  body[data-theme] #settingsModal { background: rgba(4,7,11,.30); }
  body[data-theme="minimal"] #settingsModal { background: rgba(30,40,60,.10); }
  @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    body[data-theme] #settingsModal { -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
  }
  #settingsModal.closing { display: flex; pointer-events: none; }
  .ihb-nowrap { white-space: nowrap; }
  .ihb-core .ihb-label-off { opacity: 0; }
  body[data-motion="on"] .ihb-core .ihb-label-out { animation: ihbLabelOut calc(0.18s * var(--sp)) ease both; }
  body[data-motion="on"] .ihb-core .ihb-label-in { animation: ihbLabelIn calc(0.3s * var(--sp)) ease both; }
  @keyframes ihbLabelOut { from { opacity: 1; } to { opacity: 0; } }
  @keyframes ihbLabelIn { from { opacity: 0; } to { opacity: 1; } }
  body.ihb-thought-drag .ihb-core .ihb-editbtn, body.ihb-thought-drag .ihb-core .ihb-del, body.ihb-thought-drag .ihb-core .ihb-tagbtn { opacity: 0 !important; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .38s; }
  /* ---- Ordner im Blick ---- */
  body[data-theme] .ihb-file-toggle { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 4px 0; border: 0; background: transparent; color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
  body[data-theme] .ihb-file-caret { display: inline-block; width: 12px; color: var(--text-3); }
  body[data-theme] .ihb-file-list { margin-top: 4px; }
  body[data-theme] .ihb-file-group { margin: 12px 0 4px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
  body[data-theme] .ihb-file-row { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  body[data-theme] .ihb-file-name { flex: 1 1 100%; min-width: 0; padding: 0; border: 0; background: transparent; text-align: left; font-family: var(--mono); font-size: 12px; color: var(--text); cursor: pointer; overflow-wrap: anywhere; }
  body[data-theme] .ihb-file-name:hover, body[data-theme] .ihb-file-name[aria-expanded="true"] { color: var(--amber); }
  body[data-theme] .ihb-file-title { flex: 1 1 auto; min-width: 0; font-size: 12.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body[data-theme] .ihb-file-time { flex: none; font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
  body[data-theme] .ihb-file-row .ihb-chip { flex: none; font-size: 11.5px; padding: 3px 9px; }
  body[data-theme] .ihb-file-preview { margin: 6px 0 4px; max-height: 260px; overflow: auto; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--film); color: var(--text); font-family: var(--mono); font-size: 11px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  body[data-theme] .ihb-tree-file { margin: 14px 0 0; font-size: 11.5px; color: var(--text-3); }
  body[data-theme] .ihb-tree-file code { font-family: var(--mono); font-size: 11px; color: var(--text-2); }
  /* ---- Kompost ---- */
  body[data-theme] .ihb-compost-title { margin: 0; font-size: 17px; font-weight: 600; color: var(--text); }
  body[data-theme] .ihb-compost-hint { margin-top: 4px; font-size: 11.5px; color: var(--text-3); }
  body[data-theme] .ihb-compost-note { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; color: var(--text-2); }
  body[data-theme] .ihb-compost-list { margin-top: 10px; }
  body[data-theme] .ihb-compost-row { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  body[data-theme] .ihb-compost-name { flex: 1 1 140px; min-width: 0; color: var(--text); font-size: 14px; overflow-wrap: anywhere; }
  body[data-theme] .ihb-compost-meta { flex: 1 1 100%; order: 3; font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
  body[data-theme] .ihb-compost-row.is-match .ihb-compost-name { color: var(--amber); }
  body[data-theme] .ihb-compost-row .ihb-chip { font-size: 12px; padding: 4px 10px; }
  body[data-theme] .ihb-compost-row .ihb-chip:disabled { opacity: .45; cursor: default; }
  body[data-theme] .ihb-sink { position: fixed; left: 0; top: 0; z-index: 79; pointer-events: none; max-width: 240px; padding: 5px 10px; border-radius: 10px; background: var(--surface-solid); border: 1px solid var(--amber); color: var(--text); font-size: 12.5px; box-shadow: var(--shadow); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; will-change: transform, opacity; }
  body[data-theme] .ihb-bubble.ihb-absorb { animation: ihbAbsorb calc(.6s * var(--sp)) ease-out; }
  @keyframes ihbAbsorb { 0% { box-shadow: 0 0 0 0 var(--amber-soft); } 35% { box-shadow: 0 0 0 12px var(--amber-soft); } 100% { box-shadow: 0 0 0 0 transparent; } }
  body[data-theme] .ihb-inbox-ghost { position: fixed; z-index: 80; pointer-events: none; transform: translate(12px, 12px); max-width: 260px; padding: 6px 10px; border-radius: 10px; background: var(--surface-solid); border: 1px solid var(--amber); color: var(--text); font-size: 13px; box-shadow: var(--shadow); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body[data-theme] .ihb-version { font-family: var(--mono); color: var(--text-3); opacity: .7; letter-spacing: .08em; }

  /* ---- Baum: Kacheln wie im Kontor ---- */
  body[data-theme] .ihb-tree-pane, body[data-theme] .ihb-tree-detail {
    background: var(--surface); border: 1px solid var(--line); border-radius: 15px; box-shadow: var(--shadow-lg);
  }
  @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    body[data-theme] .ihb-tree-pane, body[data-theme] .ihb-tree-detail { background: var(--glass); }
  }
  body[data-theme] .ihb-tree-count { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
  body[data-theme] .ihb-tree-row { color: var(--text); border-radius: 10px; font-family: var(--display); }
  body[data-theme] .ihb-tree-row.is-detail { color: var(--text-2); }
  body[data-theme] .ihb-tree-row:hover { background: var(--film); }
  body[data-theme] .ihb-tree-row[aria-selected="true"] { background: var(--amber-soft); box-shadow: inset 2px 0 0 var(--amber); }
  body[data-theme] .ihb-tree-meta { font-family: var(--mono); color: var(--text-3); }
  body[data-theme] .ihb-tree-actions button, body[data-theme] .ihb-tree-status { color: var(--text-3); }
  body[data-theme] .ihb-tree-actions button:hover { background: var(--film); color: var(--text); }
  body[data-theme] .ihb-tree-newrow { border: 1px dashed var(--line-strong); border-radius: 100px; color: var(--text-3); font-family: var(--display); }
  body[data-theme] .ihb-tree-newrow:hover { border-color: var(--amber); color: var(--text); background: var(--amber-soft); }
  body[data-theme] .ihb-tree-tag {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    background: transparent; border: 1px solid var(--line); color: var(--text-3);
  }
  body[data-theme] .ihb-tree-empty { color: var(--text-3); }

  @media (max-width: 720px) {
    body[data-theme] .ihb-nav-in { padding-left: 14px; gap: 8px; }
    body[data-theme] .ihb-brand b, body[data-theme] .ihb-hide-sm { display: none; }
    body[data-theme] .ihb-settingsbtn { width: 36px; padding: 0; justify-content: center; }
    body[data-theme] .ihb-viewswitch button { padding: 0 10px; font-size: 12.5px; }
    /* am Telefon bekommt der Fokus eine eigene Zeile in der Leiste */
    body[data-theme] .ihb-nav-in { flex-wrap: wrap; height: auto; min-height: 52px; padding: 7px 8px 7px 14px; border-radius: 26px; row-gap: 6px; }
    body[data-theme] .ihb-focuspill { order: 10; flex: 1 1 100%; max-width: none; margin: 0; justify-content: space-between; }
  }
</style>
</head>
<body>
<div class="ihb-root">
  <header class="ihb-nav">
    <div class="ihb-nav-in">
      <span class="ihb-brand"><span class="ihb-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.4 2.6" stroke-linecap="round"/><circle class="ihb-mark-dot" cx="12" cy="12" r="5.6"/></svg></span><b>IdeaHub</b></span>

      <div class="ihb-viewswitch" id="viewSwitch" role="tablist" aria-label="Ansicht">
        <button type="button" role="tab" data-role="view-map" id="viewMapBtn">Karte</button>
        <button type="button" role="tab" data-role="view-tree" id="viewTreeBtn">Baum</button>
      </div>

      <button type="button" class="ihb-focuspill" id="focusPill">
        <span id="focusPillText"></span>
        <span class="ihb-focuspill-x">&#10005;</span>
      </button>

      <div class="ihb-nav-r">
        <button type="button" class="ihb-settingsbtn ihb-inboxbtn is-empty" id="inboxBtn" aria-label="Eingang öffnen">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l2.5-7h11L20 13"/><path d="M4 13v5h16v-5h-5l-1.5 2h-3L9 13z"/></svg>
          <span class="ihb-hide-sm">Eingang</span>
          <span class="ihb-inboxcount" id="inboxCount">0</span>
        </button>
        <button type="button" class="ihb-settingsbtn" id="settingsBtn" aria-label="Einstellungen">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="14" cy="7" r="2"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="17" r="2"/></svg>
          <span class="ihb-hide-sm">Einstellungen</span>
        </button>
        <button type="button" class="ihb-themebtn" id="themeBtn" aria-label="Hell/Dunkel umschalten">
          <svg class="ihb-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="ihb-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="ihb-tagfilterbar" id="tagFilterBar"></div>

  <div class="ihb-map" id="map">
    <div id="starsLayer"></div>

    <div id="cameraLayer">
      <div id="sparkLayer"></div>
      <svg id="linesLayer" viewBox="0 0 100 100" style="position:absolute;inset:0;width:100%;height:100%;"></svg>
      <div id="bubblesLayer"></div>
    </div>

    <div id="hubAnchor">
    <div class="ihb-hub ihb-bob" id="hub">
      <div class="ihb-cap ihb-cap-a" id="capA"></div>
      <div class="ihb-cap ihb-cap-b" id="capB"></div>
      <div class="ihb-display" id="hubDisplay"><div class="ihb-display-body" id="hubDisplayBody"></div></div>
      <div class="ihb-hub-face" id="hubFace">
        <div class="ihb-hub-title" id="hubTitle">IdeaHub</div>
        <div class="ihb-searchwrap" id="searchWrap">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex-shrink:0;"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16" y2="16"/></svg>
          <input id="searchInput" class="ihb-search" placeholder="Ideen durchsuchen…" aria-label="Ideen durchsuchen" autocomplete="off" />
          <button type="button" id="clearSearchBtn" class="ihb-clearx" aria-label="Suche zurücksetzen">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="ihb-hub-count" id="hubCount"></div>
      </div>
    </div>

    </div>

    <div class="ihb-inboxdots" id="inboxDots" aria-label="Gedanken im Eingang"></div>
    <div class="ihb-zoomctl" id="zoomCtl">
      <button type="button" data-role="zoom-in" aria-label="Vergrößern">+</button>
      <button type="button" data-role="zoom-reset" aria-label="Ansicht zurücksetzen">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      </button>
      <button type="button" data-role="zoom-out" aria-label="Verkleinern">&minus;</button>
    </div>
  </div>

  <div class="ihb-treeview" id="treeView" hidden>
    <div class="ihb-tree-left">
      <div class="ihb-tree-count" id="treeCount"></div>
      <div class="ihb-tree-pane" id="treePane" role="tree" aria-label="Ideenbaum"></div>
    </div>
    <div class="ihb-tree-detail" id="treeDetail" aria-live="polite"></div>
  </div>

  <div id="captionArea"></div>

  <div class="ihb-version">IdeaHub v4.2</div>

  <input id="importInput" type="file" accept=".md,text/markdown" multiple style="display:none" />
  <input id="importJsonInput" type="file" accept=".json,application/json" style="display:none" />
</div>

<div class="ihb-overlay ihb-inboxsheet" id="inboxSheet" role="dialog" aria-label="Eingang">
  <div class="ihb-card ihb-inboxcard">
    <h2><span id="inboxTitle">Eingang</span> <button type="button" data-role="inbox-close" aria-label="Schließen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></h2>
    <div class="ihb-inbox-inputrow">
      <input id="inboxInput" class="ihb-taginput" placeholder="Gedanke festhalten – Enter" autocomplete="off" aria-label="Neuer Gedanke" />
      <button type="button" class="ihb-inbox-mic" id="inboxMic" data-role="inbox-mic" hidden aria-pressed="false" aria-label="Diktieren" title="Diktieren – jede Pause beendet einen Gedanken. In Chrome läuft die Erkennung über Googles Server."><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/></svg></button>
    </div>
    <p class="ihb-inbox-live" id="inboxLive" aria-live="polite" hidden></p>
    <p class="ihb-note ihb-inbox-notice" id="inboxNotice" role="status"></p>
    <div id="inboxList"></div>
  </div>
</div>
<div class="ihb-overlay ihb-inboxsheet ihb-dialogsheet" id="dialogSheet" role="dialog" aria-label="Dialog">
  <div class="ihb-card ihb-inboxcard ihb-dialogcard" id="dialogCard"></div>
</div>
<div class="ihb-overlay" id="settingsModal">
  <div class="ihb-card">
    <h2>Einstellungen <button type="button" data-role="close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></h2>
    <div id="settingsBody"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // Werkbank-Toene. Bernstein (Hub, Fokus) und Tuerkis (erledigt) fehlen hier
  // mit Absicht: die automatische Farbe sagt nur „welche Idee“, nie „welcher Stand“.
  var PALETTE = [
    { core: "#7FA9F5", detail: "#C4D6FA", glow: "rgba(127,169,245,0.30)", rgb: "127,169,245" },  // Info-Blau
    { core: "#D9A86C", detail: "#EED5B4", glow: "rgba(217,168,108,0.30)", rgb: "217,168,108" },  // Kupfer
    { core: "#B49CF2", detail: "#DCD0F9", glow: "rgba(180,156,242,0.30)", rgb: "180,156,242" },  // Flieder
    { core: "#EE8E6A", detail: "#F7C9B6", glow: "rgba(238,142,106,0.30)", rgb: "238,142,106" },  // Koralle
    { core: "#8FB8C9", detail: "#CADFE7", glow: "rgba(143,184,201,0.30)", rgb: "143,184,201" },  // Stahl
    { core: "#E596B4", detail: "#F4CEDC", glow: "rgba(229,150,180,0.30)", rgb: "229,150,180" },  // Rose
  ];

  // Builds the translucent "soap bubble" fill: a bright specular highlight in the
  // upper left, fading to a tinted, semi-transparent shell so the starfield shows through.
  // Mischt eine Ideenfarbe in einen Grundton. So bekommt die Kugel einen fast
  // deckenden, getoenten Koerper wie die Zeichen im Kontor: Linien dahinter
  // schneiden nicht mehr durch die Schrift.
  function mixRgb(rgb, share, base) {
    var p = String(rgb).split(",").map(function (v) { return parseFloat(v) || 0; });
    return [0, 1, 2].map(function (i) { return Math.round(base[i] + (p[i] - base[i]) * share); }).join(",");
  }
  var WB_VOID = [12, 17, 24], WB_PAPER = [250, 251, 253];

  function glassFill(rgb, strength) {
    if (state.theme === "minimal") {
      // Hell: ruhige, fast deckende Pastelltoene, wie die Zeichen im hellen Kontor.
      return "linear-gradient(160deg, rgba(" + mixRgb(rgb, 0.14, WB_PAPER) + "," + (0.94 * strength) + "), " +
        "rgba(" + mixRgb(rgb, 0.26, WB_PAPER) + "," + (0.96 * strength) + "))";
    }
    // Dunkel: getoentes Glas mit kleinem Glanzlicht oben links.
    return "radial-gradient(circle at 30% 24%, rgba(255,255,255," + (0.15 * strength) + ") 0%, " +
      "rgba(" + mixRgb(rgb, 0.20, WB_VOID) + "," + (0.82 * strength) + ") 44%, " +
      "rgba(" + mixRgb(rgb, 0.32, WB_VOID) + "," + (0.88 * strength) + ") 100%)";
  }
  function glassShadow(rgb, glow, active) {
    if (state.theme === "minimal") {
      return active ? "inset 0 1px 0 rgba(255,255,255,0.9), 0 12px 26px -16px rgba(20,36,60,0.42)" : "none";
    }
    var inner = "inset 0 1px 0 rgba(255,255,255,0.10), inset 0 -12px 24px rgba(" + rgb + ",0.16)";
    return active ? inner + ", 0 18px 40px -20px rgba(0,0,0,0.8), 0 0 22px -6px " + glow : inner;
  }
  function setCluster(on) {
    state.cluster = !!on;
    storeSet(CLUSTER_KEY, state.cluster ? "1" : "0");
    renderStructure();
    renderSettingsModal();
  }

  function setRotate(on) {
    state.rotate = !!on;
    storeSet(ROTATE_KEY, state.rotate ? "1" : "0");
    renderStructure();
    renderSettingsModal();
  }

  function setShowLinks(on) {
    state.showLinks = !!on;
    storeSet(LINKS_KEY, state.showLinks ? "1" : "0");
    renderStructure();
    renderSettingsModal();
  }

  function systemPrefersReducedMotion() {
    try {
      return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    } catch (e) {
      return false;
    }
  }
  function motionEnabled() {
    if (state.motion === null) return !systemPrefersReducedMotion();
    return !!state.motion;
  }
  function speedFactor() {
    return SPEEDS[state.speed] || 1.5;
  }
  function applySpeed() {
    document.body.setAttribute("data-speed", SPEEDS[state.speed] ? state.speed : "mittel");
  }
  function setSpeed(key) {
    if (!SPEEDS[key]) return;
    state.speed = key;
    applySpeed();
    storeSet(SPEED_KEY, key);
    renderStructure();
    renderSettingsModal();
  }

  function applyMotion() {
    document.body.setAttribute("data-motion", motionEnabled() ? "on" : "off");
  }
  function setMotion(on) {
    state.motion = !!on;
    applyMotion();
    storeSet(MOTION_KEY, state.motion ? "1" : "0");
    renderStructure();
    renderSettingsModal();
  }

  function applyTheme() {
    document.body.setAttribute("data-theme", state.theme);
    // Die Werkbank kennt nur hell/dunkel am <html>; IdeaHub haelt intern seine
    // alten Namen (Backups und Chat-Speicher tragen sie), bildet sie aber ab.
    var wb = state.theme === "minimal" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", wb);
    var tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute("content", wb === "light" ? "#EEF1F6" : "#06090E");
  }
  function setTheme(t, vomBus) {
    if (t !== "space" && t !== "minimal") return;
    state.theme = t;
    applyTheme();
    storeSet(THEME_KEY, t);
    if (!vomBus) wbThemeSchreiben(t);
    renderCurrentView();
    renderSettingsModal();
  }

  // ---------- Werkbank: ein Aussehen fuer alle Werkzeuge ----------
  // Gleiches Protokoll wie Kontor: zwei Speicher-Schluessel, dazu eine Meldung
  // auf dem Kanal "werkbank" (Rueckfall: storage-Ereignis ueber "wb-signal").
  // So stellt ein Wechsel hier auch offene Kontor-Tabs um und umgekehrt.
  var WB_THEME_KEYS = ["wb-theme", "wb-cockpit-theme"];
  var wbEigen = Math.random().toString(36).slice(2) + Date.now().toString(36);
  var wbKanal = null;
  try { wbKanal = new BroadcastChannel("werkbank"); } catch (e) { /* aeltere Browser */ }
  function wbThemeLesen() {
    try {
      var v = localStorage.getItem("wb-theme") || localStorage.getItem("wb-cockpit-theme");
      return v === "light" ? "minimal" : v === "dark" ? "space" : null;
    } catch (e) { return null; }
  }
  function systemThemeLesen() {
    try {
      if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) return "minimal";
    } catch (e) {}
    return null;
  }
  function wbThemeSchreiben(t) {
    var v = t === "minimal" ? "light" : "dark";
    WB_THEME_KEYS.forEach(function (k) { try { localStorage.setItem(k, v); } catch (e) {} });
    var n = { thema: "theme", theme: v, von: wbEigen, zeit: Date.now() };
    if (wbKanal) { try { wbKanal.postMessage(n); } catch (e) {} }
    try { localStorage.setItem("wb-signal", JSON.stringify(n)); } catch (e) {}
  }
  function wbEmpfangen(n) {
    if (!n || typeof n !== "object" || n.von === wbEigen || n.thema !== "theme") return;
    var t = n.theme === "light" ? "minimal" : n.theme === "dark" ? "space" : null;
    if (t && t !== state.theme) setTheme(t, true);
  }
  if (wbKanal) wbKanal.onmessage = function (e) { wbEmpfangen(e.data); };
  window.addEventListener("storage", function (e) {
    if (e.key !== "wb-signal" || !e.newValue) return;
    try { wbEmpfangen(JSON.parse(e.newValue)); } catch (err) {}
  });
  // Optional per-idea accent colour. "auto" keeps the rotating palette.
  var COLOR_CHOICES = [
    { key: "auto",   hex: "",        label: "Automatisch" },
    { key: "violet", hex: "#8B6CFF", label: "Violett" },
    { key: "teal",   hex: "#2DD4BF", label: "Türkis" },
    { key: "pink",   hex: "#F472B6", label: "Pink" },
    { key: "blue",   hex: "#60A5FA", label: "Blau" },
    { key: "green",  hex: "#34D399", label: "Grün" },
    { key: "indigo", hex: "#818CF8", label: "Indigo" },
    { key: "amber",  hex: "#F59E0B", label: "Bernstein" },
    { key: "red",    hex: "#F87171", label: "Rot" },
    { key: "slate",  hex: "#94A3B8", label: "Grau" }
  ];
  function colorChoiceByKey(key) {
    for (var i = 0; i < COLOR_CHOICES.length; i++) {
      if (COLOR_CHOICES[i].key === key) return COLOR_CHOICES[i];
    }
    return null;
  }
  function hexToRgbTriple(hex) {
    var h = String(hex || "").replace("#", "");
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    if (h.length !== 6) return null;
    var n = parseInt(h, 16);
    if (isNaN(n)) return null;
    return ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255);
  }
  // Resolves the colours a core actually renders with: its own accent if set,
  // otherwise its slot in the rotating palette.
  function coreById(id) {
    for (var i = 0; i < state.cores.length; i++) {
      if (state.cores[i].id === id) return state.cores[i];
    }
    return null;
  }

  // ---------- scope: the whole map, or the inside of one cloud ----------
  // Every geometry, render and filter function reads the ring through here.
  // state.cores stays the single source of truth for data: editing, export,
  // persistence and the tree deliberately keep reading it directly, so a scope
  // can never hide an idea from a backup. With no scope set this returns the
  // same array, which is why the overview behaves exactly as before.
  function visibleCores() {
    if (!state.scope) return state.cores;
    var ids = state.scope.memberIds || [];
    return state.cores.filter(function (c) { return ids.indexOf(c.id) !== -1; });
  }

  function paletteFor(core, index) {
    var choice = core && core.color ? colorChoiceByKey(core.color) : null;
    if (choice && choice.hex) {
      var rgb = hexToRgbTriple(choice.hex);
      if (rgb) return { core: choice.hex, rgb: rgb, glow: "rgba(" + rgb + ",0.32)" };
    }
    return PALETTE[index % PALETTE.length];
  }

  var HUB = { x: 50, y: 50 };
  // Design sizes are authored against a 720px reference map and scaled to the
  // real width, so gaps stay proportional at every window size.
  var REF = 720;
  var BASE = {
    hub: 226,      // hub diameter: search and counter only, the text lives in the panel
    core: 96,      // core bubble diameter (starting point)
    coreMax: 232,  // grow up to this when the ring has room
    coreMin: 76,      // comfortable size when the ring has room
    focusGrow: 1,        // the hub now carries the information, so the focused
                         // idea no longer needs to grow — it only needs to stand out
    focusShrink: 0.62,    // how much the others recede
    focusHub: 1,      // the hub steps back too, freeing room for the zoom
    focusDetail: 1.35,   // the focused idea's details grow with it
    coreGap: 14,   // desired clear space between neighbouring cores
    detailW: 66,   // detail bubble width (ellipse)
    miniScale: 0.26, // size of a silent, unfocused detail dot
    detailH: 50,   // detail bubble height
    r1: 280,       // core orbit radius on a single ring
    r1Outer: 300,  // when a second ring is needed, the outer one moves further out
    r1Inner: 190,  // and the inner one sits between it and the hub
    twoRingsFrom: 17, // measured crossover: below this a single ring gives bigger bubbles
    detailGap: 16, // desired clear space between neighbouring details
    edge: 6        // margin to the map edge
  };
  var layout = { s: 1, hub: 200, core: 96, detailW: 66, detailH: 50, r1: 190, width: REF };

  function measureLayout() {
    useTargetFocus = true;
    try {
      return measureLayoutInner();
    } finally {
      useTargetFocus = false;
    }
  }

  function measureLayoutInner() {
    var w = mapEl && mapEl.clientWidth ? mapEl.clientWidth : REF;
    var s = w / REF;
    var core = BASE.core * s;
    var detailW = BASE.detailW * s;
    var detailH = BASE.detailH * s;
    var r1 = BASE.r1 * s;
    var gap = BASE.detailGap * s;

    // Core bubbles size themselves to the room actually available on the ring,
    // so headlines stay readable instead of being clipped on a sparse map.
    var vcores = visibleCores();
    var corePositions = Math.max(2, vcores.length + (vcores.length < MAX_CORES ? 1 : 0));
    var coreGap = BASE.coreGap * s;

    // Ring placement. With one ring the classic radius is used. With two, they
    // are spread across the whole space between hub and map edge so the gap
    // between them does not become the limiting factor.
    var tblEarly = clusterAngles();
    var ringCount = 1;
    for (var rk in tblEarly.radii) { if (tblEarly.radii[rk] === 1) { ringCount = 2; break; } }
    var innerLimit = BASE.hub * s / 2 + 10 * s;
    var outerLimit = w / 2 - BASE.edge * s;
    var ringRadii;
    if (ringCount === 1) {
      ringRadii = [BASE.r1 * s];
    } else {
      var avail = outerLimit - innerLimit;
      var byRings = Math.max(20 * s, (avail - coreGap) / 2);
      ringRadii = [outerLimit - byRings / 2, innerLimit + byRings / 2];
    }
    layout = layout || {};
    layout.ringRadii = ringRadii;
    layout.s = s;
    // widest circle that still leaves coreGap between neighbours on the ring
    // With clouds the ring is no longer evenly spaced, so the size has to follow
    // the tightest actual gap rather than the average one.
    // With clouds the ring is uneven, and with two rings each has its own
    // spacing. The tightest chord across all rings decides the size.
    var tbl = clusterAngles();
    var perRing = {};
    vcores.forEach(function (c) {
      if (!tbl.angles.hasOwnProperty(c.id)) return;
      var rr = tbl.radii[c.id];
      (perRing[rr] = perRing[rr] || []).push(tbl.angles[c.id]);
    });
    if (vcores.length < MAX_CORES) {
      // ring index 0 is the outer ring, not "unset" — a truthiness check here
      // put the ghost on a ring of its own and collapsed the spacing to zero
      var gr = (tbl.ghostRadius === undefined ? 0 : tbl.ghostRadius);
      (perRing[gr] = perRing[gr] || []).push(tbl.ghost);
    }
    var chord = 2 * ringRadii[0] * Math.sin(Math.PI / corePositions);
    Object.keys(perRing).forEach(function (rr) {
      var list = perRing[rr].slice().sort(function (a, b) { return a - b; });
      var radius = ringRadii[parseInt(rr, 10)] !== undefined ? ringRadii[parseInt(rr, 10)] : ringRadii[0];
      var step = Math.PI * 2;
      if (list.length > 1) {
        for (var q = 0; q < list.length; q++) {
          var nxt = (q + 1 < list.length) ? list[q + 1] : list[0] + Math.PI * 2;
          if (nxt - list[q] < step) step = nxt - list[q];
        }
      }
      var c2 = 2 * radius * Math.sin(step / 2);
      if (c2 < chord) chord = c2;
    });
    // two rings must also clear each other
    if (ringCount > 1) {
      var ringGapLimit = (ringRadii[0] - ringRadii[1]) - coreGap;
      if (ringGapLimit < chord) chord = ringGapLimit;
    }
    var byNeighbour = chord - coreGap;
    // must not crowd the hub, and must not fall off the map edge
    var byHub = 2 * (ringRadii[ringRadii.length - 1] - innerLimit);
    var byEdge = 2 * (outerLimit - ringRadii[0]);
    core = Math.min(BASE.coreMax * s, byNeighbour, byHub, byEdge);
    // coreMin is the comfortable size, not a promise: an over-full map (e.g. an
    // imported file with more ideas than the UI allows) must still fit rather
    // than overlap, so the geometry wins and only a hard tap-target floor stays.
    // coreHardMin is a comfort target, not a promise: forcing it onto a ring that
    // cannot hold it is what produced overlaps on very large imports. Below that
    // point the geometry wins; only a bare visibility floor remains.
    core = Math.max(10 * s, core);

    var totalDetails = 0;
    vcores.forEach(function (c) {
      // unfocused details are drawn as small dots and cost proportionally less room
      var weight = (state.focusedId === c.id || state.focusedId === null) ? 1 : BASE.miniScale;
      totalDetails += detailSlotsFor(c) * weight;
    });
    if (totalDetails < 1) totalDetails = 1;
    var outerR = w / 2 - detailW / 2 - BASE.edge * s;
    var detailAvailable = 2 * Math.PI * outerR;
    var detailNeeded = totalDetails * (detailW + gap);
    // Wanted size before the crowding clamp. The focused idea's details fan out
    // in their own sector near the hub, so they start from this value and are
    // only cut down by the fitter if they themselves run tight.
    var idealDetailW = detailW, idealDetailH = detailH;
    if (detailNeeded > detailAvailable) {
      var kd = detailAvailable / detailNeeded;
      detailW *= kd;
      detailH *= kd;
    }

    // Focusing zooms in place: the chosen idea grows, the others step back.
    // The hub and the search stay exactly where they are, so the overview and
    // the global search are never pushed off screen.
    // a focus pointing at an idea that no longer exists counts as no focus
    var focusing = focusCoreId() !== null && vcores.some(function (c) { return c.id === focusCoreId(); });
    var hub = BASE.hub * s;
    var coreFocus = core;
    if (focusing) {
      // The hub steps back as well. It keeps the search reachable but stops
      // eating the middle of the map, which is what makes room for the zoom.
      hub = BASE.hub * BASE.focusHub * s;
      detailW *= BASE.focusDetail;
      detailH *= BASE.focusDetail;
      coreFocus = Math.min(BASE.coreMax * BASE.focusGrow * s, core * BASE.focusGrow,
        2 * (r1 - hub / 2 - 10 * s), 2 * (w / 2 - r1 - BASE.edge * s));
      core = Math.max(BASE.coreMin * 0.8 * s, core * BASE.focusShrink);
      if (coreFocus < core) coreFocus = core;
    }
    if (state.scope) {
      var dsc = depthScaleMax();
      core = Math.max(10 * s, core / dsc);
      coreFocus = Math.max(core, coreFocus / dsc);
    }

    layout = {
      s: s,
      width: w,
      hub: hub,
      core: core,
      coreFocus: coreFocus,
      detailW: detailW,
      detailH: detailH,
      // The details of the focused idea sit inside, where there is room, while
      // the silent dots are crowded together out on the ring. One shared size
      // meant the crowded case dictated the roomy one: the fitter shrank
      // detailW because two foreign dot clusters touched, and the focused idea
      // paid for it. They get their own size and shrink independently.
      focusW: idealDetailW * (focusing ? BASE.focusDetail : 1),
      focusH: idealDetailH * (focusing ? BASE.focusDetail : 1),
      miniW: detailW * BASE.miniScale,
      miniH: detailW * BASE.miniScale, // circular, so rotation looks right
      r1: r1,
      ringRadii: ringRadii
    };
    // The crown around the hub has far more room than the old sector fan, so the
    // focused idea's details start from what fits there. The fitter below still
    // has the last word and shrinks this if anything runs tight.
    if (focusing) {
      var fc = coreById(focusCoreId());
      if (fc) {
        var cs = crownDetailSize(fc, detailSlotsFor(fc));
        if (cs !== null && cs > layout.focusW) { layout.focusW = cs; layout.focusH = cs; }
      }
    }
    fitDetailsToSectors();
    return layout;
  }

  // Orbit radius of one core. The focused idea hugs the hub so that everything
  // outward of it belongs to its details; otherwise its own size would squeeze
  // them against the map edge.
  // Sizes must be worked out for the state we are heading to, not the one we are
  // passing through: otherwise the fitter converges on slightly different values
  // depending on where the animation happened to be.
  var useTargetFocus = false;
  // Which idea the layout has to make room for. state.focusedId flips to null
  // the moment the focus is released, but the idea keeps gliding back out for
  // another few hundred milliseconds. Sizing the map for "nothing focused"
  // during that window is what let the details overlap the ring on the way out:
  // the layout said no focus while the screen still showed one.
  function focusCoreId() {
    if (state.focusedId !== null) return state.focusedId;
    if (ringAnim.focusId && ringAnim.focusP > 0) return ringAnim.focusId;
    return null;
  }

  function focusProgressFor(core) {
    if (!core) return 0;
    if (useTargetFocus) return focusCoreId() === core.id ? 1 : 0;
    if (ringAnim.focusId === core.id) return ringAnim.focusP;
    return state.focusedId === core.id ? 1 : 0;
  }

  function coreOrbit(core) {
    var L = layout;
    var own = ringRadiusFor(core) * L.s;
    var t = focusProgressFor(core);
    if (t <= 0) return own;
    // The idea parks on the free axis — exactly where the glass now overhangs
    // symmetrically — so it clears the display edge, not just the sphere.
    var pulled = Math.min(own, L.hub / 2 + displayOverhang(L) / 2 + 10 * L.s + L.coreFocus / 2);
    return own + (pulled - own) * t;
  }

  // Diameter of one particular core bubble, honouring the focus zoom.
  function coreDiameter(core) {
    var t = focusProgressFor(core);
    var base = layout.core * roomFactor(core.id);
    return base + (layout.coreFocus - base) * t;
  }
  // Endmass nach der laufenden Drehung (Fokus schon gesetzt oder schon aufgehoben)
  function finalCoreDiameter(core) {
    return state.focusedId === core.id ? layout.coreFocus : layout.core * roomFactor(core.id);
  }
  // Wie weit eine Idee fuer das offene Hub zuruecktritt (1 = gar nicht)
  function roomFactor(id) {
    return (layout.roomScale && layout.roomScale[id]) || 1;
  }

  // Exact fit: lay out every bubble the way the renderer will, measure the
  // tightest clearance, and shrink until nothing collides. Approximating this
  // with angle maths proved unreliable, so the layout is verified directly.
  // Details stay hidden until their core is focused, which keeps the default
  // map calm. A text search is the exception: hiding matches would defeat the
  // point of the global hub search, so relevant details surface while searching.
  // Details are always on the map, but only readable where they matter:
  // "full" carries text and controls, "mini" is a silent dot that just shows
  // an idea has substance without crowding the view.
  function detailModeFor(core) {
