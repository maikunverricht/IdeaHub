<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IdeaHub</title>
<style>
  * { box-sizing: border-box; }
  /* One factor drives every duration in the app. */
  body { --sp: 1.5; }
  body[data-speed="ruhig"]  { --sp: 2.2; }
  body[data-speed="mittel"] { --sp: 1.5; }
  body[data-speed="zuegig"] { --sp: 1; }
  html, body {
    margin: 0;
    padding: 0;
    background: #05060f;
  }
  .ihb-root {
    position: relative;
    min-height: 520px;
    background: radial-gradient(120% 90% at 50% 8%, #171d3d 0%, #0b0e21 46%, #05060f 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 16px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .ihb-settingsbtn {
    position: absolute;
    top: 14px;
    right: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    color: rgba(226,229,255,0.85);
    border-radius: 999px;
    padding: 7px 12px 7px 10px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    z-index: 5;
  }
  .ihb-settingsbtn:hover { background: rgba(255,255,255,0.1); }
  .ihb-map {
    position: relative;
    width: 100%;
    max-width: 980px;
  }
  .ihb-map:after { content: ""; display: block; padding-bottom: 100%; }
  .ihb-star {
    position: absolute;
    border-radius: 999px;
    background: #eef1ff;
    opacity: 0.4;
  }
  body[data-motion="on"] .ihb-star { animation: ihbTwinkle linear infinite; }
  body[data-motion="on"] .ihb-bob { animation: ihbBob ease-in-out infinite; }
  @keyframes ihbTwinkle { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.65; } }
  @keyframes ihbBob {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-3px); }
  }
  .ihb-bubble {
    position: absolute;
    left: var(--x);
    top: var(--y);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: left calc(0.7s * var(--sp)) ease, top calc(0.7s * var(--sp)) ease,
                width calc(0.7s * var(--sp)) ease, height calc(0.7s * var(--sp)) ease,
                margin-left calc(0.7s * var(--sp)) ease, margin-top calc(0.7s * var(--sp)) ease,
                opacity calc(0.55s * var(--sp)) ease, box-shadow calc(0.6s * var(--sp)) ease,
                filter calc(0.6s * var(--sp)) ease;
    border: 1px solid rgba(255,255,255,0.28);
  }
  /* the ring tween sets positions itself; a second easing would desynchronise
     the bubbles from their connecting lines */
  .ihb-tweening .ihb-bubble,
  .ihb-tweening .ihb-orbit { transition: none !important; }
  .ihb-bubble:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  /* The pixel sizes below are only the starting point: measureLayout() computes
     the real sizes from the map width and writes them inline. They still matter
     as a sane fallback if that script ever fails to run. */
  .ihb-core {
    width: 96px; height: 96px; margin-left: -48px; margin-top: -48px;
    padding: 8px;
    flex-direction: column;
    gap: 1px;
  }
  .ihb-progressring {
    position: absolute;
    top: -1px; left: -1px;
    pointer-events: none;
    z-index: 0;
  }
  body[data-theme="minimal"] .ihb-progressring circle:first-child { stroke: rgba(20,22,45,0.12); }
  body[data-theme="minimal"] .ihb-crosslink { stroke: #6C4CFF; }
  .ihb-coreicon {
    color: rgba(255,255,255,0.82);
    margin-bottom: 1px;
    flex-shrink: 0;
    pointer-events: none;
    position: relative;
    z-index: 1;
  }
  body[data-theme="minimal"] .ihb-coreicon { color: rgba(23,26,46,0.66); }
  .ihb-sublabel {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-size: 8.5px;
    line-height: 1.15;
    font-weight: 400;
    color: rgba(242,243,255,0.72);
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    word-break: break-word;
    pointer-events: none;
    position: relative;
    z-index: 1;
  }
  body[data-theme="minimal"] .ihb-sublabel { color: rgba(23,26,46,0.62); text-shadow: none; }
  .ihb-detail {
    width: 66px; height: 50px; margin-left: -33px; margin-top: -25px;
    padding: 5px;
  }
  .ihb-bubble.ihb-dragging {
    z-index: 30;
    transition: none;
    cursor: grabbing;
    box-shadow: 0 10px 26px rgba(0,0,0,0.45) !important;
  }
  .ihb-bubble.ihb-droptarget {
    border-color: #ffffff;
    border-width: 2px;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.18) !important;
  }
  body[data-theme="minimal"] .ihb-bubble.ihb-droptarget { border-color: #6C4CFF; box-shadow: 0 0 0 4px rgba(108,76,255,0.2) !important; }
  /* ---- the hub opens: two halves stay, a display appears between them ----
     Nothing is placed next to the hub any more; the hub itself parts, so the
     connection is shown rather than implied. No frame on the display: the
     halves already carry the shape. */
  .ihb-hub {
    position: absolute;
    left: 50%; top: 50%;
    z-index: 12;
    cursor: default;
  }
  .ihb-cap {
    position: absolute;
    background: radial-gradient(circle at 38% 30%, #fff0c4 0%, #ffd98a 26%, #ffb156 58%, #e07f28 100%);
    box-shadow: 0 0 44px 10px rgba(255,168,74,0.26), 0 0 96px 26px rgba(255,140,40,0.10);
    z-index: 2;
  }
  .ihb-display {
    position: absolute;
    background: #10132a;                    /* solid fallback */
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 14px 40px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(255,255,255,0.22),
                inset 0 -1px 0 rgba(255,255,255,0.05);
    overflow: hidden;
    z-index: 1;
    opacity: 0;
  }
  /* Liquid glass where the browser supports it; the solid colour above is the
     fallback, so nothing depends on the effect being available. */
  @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .ihb-display {
      background: rgba(18,22,48,0.44);
      -webkit-backdrop-filter: blur(16px) saturate(1.35);
      backdrop-filter: blur(16px) saturate(1.35);
    }
    body[data-theme="minimal"] .ihb-display {
      background: rgba(255,255,255,0.55);
      -webkit-backdrop-filter: blur(16px) saturate(1.2);
      backdrop-filter: blur(16px) saturate(1.2);
    }
  }
  body[data-theme="minimal"] .ihb-display {
    background: #f6f7fc;
    border-color: rgba(20,22,45,0.12);
    box-shadow: 0 14px 40px rgba(20,22,45,0.18), inset 0 1px 0 rgba(255,255,255,0.8);
  }
  .ihb-hub.open .ihb-display { opacity: 1; }
  body[data-theme="minimal"] .ihb-display { background: #ffffff; }
  .ihb-display-body {
    opacity: 0; text-align: left;
    height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;      /* reaching the end must not scroll the page */
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.25) transparent;
  }
  .ihb-display-body::-webkit-scrollbar { width: 5px; }
  .ihb-display-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.22); border-radius: 999px; }
  body[data-theme="minimal"] .ihb-display-body { scrollbar-color: rgba(20,22,45,0.3) transparent; }
  body[data-theme="minimal"] .ihb-display-body::-webkit-scrollbar-thumb { background: rgba(20,22,45,0.25); }
  .ihb-hub.open .ihb-display-body { opacity: 1; }
  body[data-motion="on"] .ihb-display-body {
    transition: opacity calc(0.42s * var(--sp)) ease calc(0.4s * var(--sp));
  }
  .ihb-hub-face {
    position: absolute;
    left: 50%; top: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    z-index: 4;
  }
  .ihb-hub.open .ihb-hub-face { opacity: 0; pointer-events: none; }
  body[data-motion="on"] .ihb-hub-face { transition: opacity calc(0.22s * var(--sp)) ease; }
  body[data-motion="on"] .ihb-hub,
  body[data-motion="on"] .ihb-cap,
  body[data-motion="on"] .ihb-display {
    transition: width calc(0.85s * var(--sp)) cubic-bezier(.33,.02,.15,1),
                height calc(0.85s * var(--sp)) cubic-bezier(.33,.02,.15,1),
                margin-left calc(0.85s * var(--sp)) cubic-bezier(.33,.02,.15,1),
                margin-top calc(0.85s * var(--sp)) cubic-bezier(.33,.02,.15,1),
                left calc(0.85s * var(--sp)) cubic-bezier(.33,.02,.15,1),
                top calc(0.85s * var(--sp)) cubic-bezier(.33,.02,.15,1),
                opacity calc(0.3s * var(--sp)) ease;
  }
  .ihb-display-head {
    display: flex; align-items: center; justify-content: space-between;
    font-size: calc(13.5px * var(--dsc, 1)); font-weight: 700; margin-bottom: 6px; color: #e7e9fb;
  }
  .ihb-display-head button {
    background: none; border: none; color: rgba(231,233,251,0.6);
    cursor: pointer; font-size: calc(14px * var(--dsc, 1)); padding: 2px 4px;
  }
  body[data-theme="minimal"] .ihb-display-head { color: #23263d; }
  body[data-theme="minimal"] .ihb-display-head button { color: rgba(35,38,61,0.55); }

  #cameraLayer, #hubAnchor {
    position: absolute; inset: 0;
    transform-origin: 50% 50%;
    will-change: transform;
  }
  #hubAnchor { pointer-events: none; }
  #hubAnchor > * { pointer-events: auto; }
  body[data-motion="on"] #cameraLayer.ihb-cam-anim,
  body[data-motion="on"] #hubAnchor.ihb-cam-anim {
    transition: transform calc(0.35s * var(--sp)) cubic-bezier(.2,.85,.25,1);
  }
  .ihb-zoomctl {
    position: absolute; right: 10px; bottom: 10px; z-index: 40;
    display: flex; flex-direction: column; gap: 6px;
  }
  .ihb-zoomctl button {
    width: 30px; height: 30px; border-radius: 999px;
    background: rgba(20,22,45,0.55); border: 1px solid rgba(255,255,255,0.18);
    color: #e7e9fb; font-size: 15px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .ihb-zoomctl button[disabled] { opacity: 0.35; cursor: default; }
  .ihb-zoomctl button[data-role="zoom-reset"] { display: none; }
  .ihb-map.ihb-zoomed .ihb-zoomctl button[data-role="zoom-reset"] { display: flex; }
  .ihb-map.ihb-zoomed #cameraLayer, .ihb-map.ihb-zoomed #hubAnchor { cursor: grab; }
  .ihb-map.ihb-zoomed.ihb-panning #cameraLayer, .ihb-map.ihb-zoomed.ihb-panning #hubAnchor { cursor: grabbing; }
  body[data-theme="minimal"] .ihb-zoomctl button { background: rgba(255,255,255,0.9); border-color: rgba(20,22,45,0.14); color: #33374f; }
  /* ---- motion ---- */
  #sparkLayer { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
  .ihb-spark {
    position: absolute;
    width: 7px; height: 7px;
    margin-left: -3.5px; margin-top: -3.5px;
    border-radius: 999px;
    opacity: 0;
  }
  body[data-motion="on"] .ihb-spark { animation: ihbSpark calc(1.15s * var(--sp)) cubic-bezier(.4,.05,.25,1) forwards; }
  body[data-motion="on"] .ihb-hub-pulse { animation: ihbHubPulse calc(1.3s * var(--sp)) ease-out; }
  body[data-motion="on"] .ihb-display-body { animation: ihbInfoIn calc(0.7s * var(--sp)) calc(0.5s * var(--sp)) both cubic-bezier(.2,.8,.2,1); }
  @keyframes ihbSpark {
    0%   { transform: translate(0,0) scale(0.5); opacity: 0; }
    18%  { opacity: 1; }
    75%  { opacity: 0.9; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.25); opacity: 0; }
  }
  @keyframes ihbPop {
    0%   { transform: scale(0.55); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes ihbHubPulse {
    0%   { filter: brightness(1); }
    45%  { filter: brightness(1.28); }
    100% { filter: brightness(1); }
  }
  @keyframes ihbInfoIn {
    0%   { opacity: 0; transform: translateY(7px) scale(0.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .ihb-orbit {
    position: absolute;
    pointer-events: none;
  }
  .ihb-orbit > * { pointer-events: auto; }
  body[data-motion="on"] .ihb-orbit { animation-name: ihbOrbit; animation-timing-function: linear; animation-iteration-count: infinite; }
  @keyframes ihbOrbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .ihb-detail-mini {
    border-color: rgba(255,255,255,0.22);
    cursor: pointer;
  }
  .ihb-detail-mini[data-status="erledigt"] { border-color: rgba(52,211,153,0.75); }
  .ihb-detail-mini[data-status="in-arbeit"] { border-color: rgba(251,191,36,0.75); }
  body[data-theme="minimal"] .ihb-detail-mini { border-color: rgba(20,22,45,0.25); }
  .ihb-ghost {
    background: transparent;
    border: 1.5px dashed rgba(255,255,255,0.28);
    color: rgba(255,255,255,0.55);
  }
  .ihb-label {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-weight: 600;
    color: #f2f3ff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.55);
    line-height: 1.16;
    word-break: break-word;
    pointer-events: none;
    position: relative;
    z-index: 1;
  }
  .ihb-core .ihb-label { font-size: 12px; }
  .ihb-detail .ihb-label { font-size: 9.5px; font-weight: 500; -webkit-line-clamp: 2; }
  .ihb-hl {
    background: rgba(255,255,255,0.92);
    color: #05060f;
    text-shadow: none;
    border-radius: 3px;
    padding: 0 2px;
    font-weight: 700;
  }
  .ihb-del, .ihb-tagbtn, .ihb-statusbtn {
    position: absolute;
    width: 18px; height: 18px;
    border-radius: 999px;
    background: #1a1d33;
    border: 1px solid rgba(255,255,255,0.25);
    color: #d8dcf5;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    cursor: pointer;
  }
  .ihb-del { top: -4px; right: -4px; }
  .ihb-notebtn {
    position: absolute; bottom: -4px; right: -4px;
    width: 18px; height: 18px; border-radius: 999px;
    background: #1a1d33; border: 1px solid rgba(255,255,255,0.25); color: #d8dcf5;
    display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;
  }
  .ihb-notebtn.has-extra { background: #2a2350; border-color: rgba(139,108,255,0.6); color: #cabfff; }
  body[data-theme="minimal"] .ihb-notebtn { background: #ffffff; border-color: rgba(20,22,45,0.25); color: #333752; }
  .ihb-editbtn {
    position: absolute; top: -4px; left: -4px;
    width: 18px; height: 18px; border-radius: 999px;
    background: #1a1d33; border: 1px solid rgba(255,255,255,0.25); color: #d8dcf5;
    display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;
  }
  body[data-theme="minimal"] .ihb-editbtn { background: #ffffff; border-color: rgba(20,22,45,0.25); color: #333752; }
  .ihb-tagbtn, .ihb-statusbtn { bottom: -4px; left: -4px; }
  .ihb-tagbtn.has-extra { background: #2a2350; border-color: rgba(139,108,255,0.6); color: #cabfff; }
  .ihb-statusbtn.status-in-arbeit { background: #3a2a12; border-color: rgba(251,191,36,0.65); color: #fbd38d; }
  .ihb-statusbtn.status-erledigt { background: #123a28; border-color: rgba(52,211,153,0.7); color: #8cf5c4; }
  /* The hub's material now lives on the two halves, not on the container:
     otherwise a stretched gradient would show through behind the display. */
  .ihb-hub-title {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: #241405;
    font-size: 18px;
    white-space: nowrap;
  }
  .ihb-display .ihb-searchwrap { margin: 0 0 10px; width: 100%; }
  .ihb-searchwrap {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(14,10,22,0.82);
    border: 1px solid rgba(180,150,255,0.45);
    box-shadow: 0 2px 14px rgba(0,0,0,0.4);
    border-radius: 999px;
    padding: 5px 9px;
    width: 226px;
    margin: 0 -24px;
  }
  .ihb-search {
    border: none;
    background: transparent;
    outline: none;
    color: #f0eaff;
    font-size: 12px;
    width: 100%;
    font-family: inherit;
    min-width: 0;
  }
  .ihb-search::placeholder { color: rgba(230,220,255,0.5); }
  .ihb-clearx {
    background: none; border: none; padding: 0; margin: 0;
    display: none; align-items: center; flex-shrink: 0;
    color: #241405; opacity: 0.7; cursor: pointer;
  }
  .ihb-hub-count {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 9.5px;
    color: rgba(36,20,5,0.72);
    letter-spacing: 0.02em;
  }
  /* Reading panel: same shape and motion as the editor, so both feel like one
     surface that unfolds from the hub. */
    .ihb-info-title {
    font-weight: 700;
    color: #eef0ff;
    font-size: calc(17px * var(--dsc, 1));
    line-height: 1.25;
    margin: 2px 0 5px;
    word-break: break-word;
  }
  .ihb-info-notes {
    color: rgba(232,235,255,0.9);
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .ihb-info-empty { color: rgba(231,233,251,0.5); font-style: italic; }
  body[data-theme="minimal"] .ihb-info-title { color: #23263d; }
  body[data-theme="minimal"] .ihb-info-notes { color: #33374f; }
  body[data-theme="minimal"] .ihb-info-empty { color: #7a7f96; }
  .ihb-edit-input {
    width: 88%;
    background: rgba(255,255,255,0.94);
    border: none;
    border-radius: 8px;
    font-size: 12px;
    text-align: center;
    padding: 3px 4px;
    font-family: inherit;
    outline: 2px solid #fff;
  }
  .ihb-caption {
    margin-top: 18px;
    color: rgba(220,224,255,0.5);
    font-size: 12px;
    text-align: center;
    max-width: 500px;
    line-height: 1.5;
  }
  .ihb-caption b { color: rgba(230,233,255,0.78); font-weight: 600; }

  .ihb-quickcreate {
    margin-top: 18px;
    max-width: 480px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .ihb-chiprow { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 4px; }
  .ihb-chip {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    color: #e7e9fb;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  .ihb-chip:hover { background: rgba(255,255,255,0.14); }

  .ihb-focuspill {
    display: none;
    align-items: center;
    gap: 9px;
    background: rgba(139,108,255,0.18);
    border: 1px solid rgba(139,108,255,0.55);
    color: #e7e9fb;
    font-size: 12.5px;
    font-weight: 600;
    font-family: inherit;
    padding: 7px 9px 7px 15px;
    border-radius: 999px;
    margin-bottom: 12px;
    cursor: pointer;
  }
  .ihb-focuspill.show { display: inline-flex; }
  .ihb-focuspill-x {
    display: flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 999px;
    background: rgba(255,255,255,0.14); font-size: 10px;
  }
  body[data-theme="minimal"] .ihb-focuspill { background: rgba(108,76,255,0.12); border-color: rgba(108,76,255,0.5); color: #23263d; }
  body[data-theme="minimal"] .ihb-focuspill-x { background: rgba(20,22,45,0.1); }
  .ihb-bubble.is-focused {
    border-color: rgba(255,255,255,0.85);
    border-width: 2px;
  }
  body[data-theme="minimal"] .ihb-bubble.is-focused { border-color: #6C4CFF; }

  .ihb-tagfilterbar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    max-width: 620px;
    margin-bottom: 16px;
  }
  .ihb-tagchip {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.18);
    color: rgba(226,229,255,0.72);
    border-radius: 999px;
    padding: 5px 13px;
    font-size: 11.5px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .ihb-tagchip:hover { background: rgba(255,255,255,0.12); }
  .ihb-tagchip.active {
    background: linear-gradient(135deg, #8B6CFF, #6C4CFF);
    border-color: transparent;
    color: #fff;
  }
  .ihb-tagchip.clear {

<div class="ihb-root">

    var i = STATUS_ORDER.indexOf(s);
    return STATUS_ORDER[(i + 1) % STATUS_ORDER.length];

  function coreProgress(core) {
    var total = core.details.length;
    var done = core.details.filter(function (d) { return detailStatus(d) === "erledigt"; }).length;
    return { done: done, total: total };
  }
  function coreStatus(core) {
    var p = coreProgress(core);
    if (p.total === 0) return "offen";
    if (p.done === p.total) return "erledigt";
    var anyProgress = p.done > 0 || core.details.some(function (d) { return detailStatus(d) === "in-arbeit"; });
    return anyProgress ? "in-arbeit" : "offen";
  }

  // ---------- text / markdown helpers ----------
  function escapeHtml(str) {
    return (str == null ? "" : String(str)).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function highlightMatch(text, query) {
    var t = text == null ? "" : String(text);
    var q = (query || "").trim();
    if (!q) return escapeHtml(t);
    var idx = t.toLowerCase().indexOf(q.toLowerCase());
    if (idx === -1) return escapeHtml(t);
    var before = t.slice(0, idx);
    var match = t.slice(idx, idx + q.length);
    var after = t.slice(idx + q.length);
    return escapeHtml(before) + '<mark class="ihb-hl">' + escapeHtml(match) + "</mark>" + escapeHtml(after);
  }
  function slugify(str) {
    var s = (str || "")
      .toLowerCase()
      .replace(/ß/g, "ss")
      .normalize("NFKD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/(^-+|-+$)/g, "");
    return s || "idee";
  }
  function coreFilename(core) {
    var shortId = core.id.replace(/[^a-zA-Z0-9]/g, "").slice(-6) || "x";
    return slugify(core.text) + "-" + shortId + ".md";
  }
  function escapeYamlScalar(str) {
    var v = str || "";
    if (/^[\s]|[\s]$|[:#\[\]{}",\n]/.test(v) || v === "") {
      return '"' + v.replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
    }
    return v;
  }
  function statusMark(status) {
    if (status === "erledigt") return "x";
    if (status === "in-arbeit") return "~";
    return " ";
  }
  function markToStatus(mark) {
    if (mark === "x" || mark === "X") return "erledigt";
    if (mark === "~") return "in-arbeit";
    return "offen";
  }
  function coreToMd(core) {
    var now = new Date().toISOString();
    var tagsStr = "[" + (core.tags || []).join(", ") + "]";
    var lines = [
      "---",
      "id: " + core.id,
      "title: " + escapeYamlScalar(core.text),
      "subtitle: " + escapeYamlScalar(core.subtitle || ""),
      "icon: " + (core.icon || "none"),
      "color: " + (core.color || "auto"),
      "tags: " + tagsStr,
      "status: " + coreStatus(core) + "  # automatisch aus den Detail-Status berechnet",
      "created: " + (core.created || now),
      "updated: " + now,
      "---",
      "",
      "# " + (core.text || "Unbenannte Idee"),
      "",
    ];
    if ((core.notes || "").trim()) {
      lines.push("## Beschreibung", "", core.notes.trim(), "");
    }
    lines.push("## Details", "");
    core.details.forEach(function (d) {
      lines.push("- [" + statusMark(detailStatus(d)) + "] " + d.text);
      // Colour and tags were added to details later than this format; without
      // this meta line they silently vanished on every export/import round-trip.
      var meta = [];
      if (d.color && d.color !== "auto") meta.push("farbe: " + d.color);
      if (d.tags && d.tags.length) meta.push("tags: " + d.tags.join(", "));
      if (meta.length) lines.push("  {" + meta.join(" | ") + "}");
      // A detail's description follows indented underneath it, which keeps the
      // file readable in any editor and unambiguous to parse.
      if ((d.notes || "").trim()) {
        d.notes.trim().split(/\r?\n/).forEach(function (line) { lines.push("  " + line); });
      }
    });
    lines.push("");
    return lines.join("\n");
  }
  function parseMdToCore(text, filename) {
    var fmMatch = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
    var meta = {};
    var body = text;
    if (fmMatch) {
      body = text.slice(fmMatch[0].length);
      fmMatch[1].split(/\r?\n/).forEach(function (line) {
        var m = line.match(/^([a-zA-Z_]+):\s*(.*)$/);
        if (!m) return;
        var key = m[1];
        var val = m[2].replace(/\s*#.*$/, "").trim();
        if (key === "tags") {
          val = val.replace(/^\[|\]$/g, "");
          meta.tags = val ? val.split(",").map(function (t) { return t.trim(); }).filter(Boolean) : [];
        } else {
          if (/^".*"$/.test(val)) val = val.slice(1, -1).replace(/\\"/g, '"');
          meta[key] = val;
        }
      });
    }
    var beschreibungMatch = body.match(/##\s*Beschreibung\s*\r?\n([\s\S]*?)(?:\r?\n##\s|$)/i);
    var notes = beschreibungMatch ? beschreibungMatch[1].trim() : "";
    var details = [];
    var inDetails = false;
    body.split(/\r?\n/).forEach(function (line) {
      var m = line.match(/^\s*[-*]\s+\[([ xX~])\]\s+(.*)$/);
      if (m && m[2].trim()) {
        details.push({ id: nextId(), text: m[2].trim(), status: markToStatus(m[1]), notes: "", tags: [], color: "auto" });
        inDetails = true;
        return;
      }
      var plain = line.match(/^\s*[-*]\s+(.*)$/);
      if (plain && plain[1].trim() && !/^\[.*\]$/.test(plain[1].trim())) {
        details.push({ id: nextId(), text: plain[1].trim(), status: "offen", notes: "", tags: [], color: "auto" });
        inDetails = true;
        return;
      }
      // indented continuation belongs to the detail above it
      if (inDetails && details.length && /^\s{2,}\S/.test(line)) {
        var last = details[details.length - 1];
        var metaM = line.trim().match(/^\{(.+)\}$/);
        if (metaM) {
          metaM[1].split("|").forEach(function (part) {
            var kv = part.split(":");
            if (kv.length < 2) return;
            var key = kv[0].trim(), val = kv.slice(1).join(":").trim();
            if (key === "farbe") last.color = val;
            else if (key === "tags") last.tags = val.split(",").map(function (t) { return t.trim(); }).filter(Boolean);
          });
          return;   // inside forEach; continue would be a syntax error
        }
        last.notes = last.notes ? last.notes + "\n" + line.trim() : line.trim();
        return;
      }
      if (line.trim() === "") return;
      if (/^#/.test(line.trim())) inDetails = false;
    });
    return {
      id: meta.id || nextId(),
      text: meta.title || filename.replace(/\.md$/i, ""),
      subtitle: meta.subtitle || "",
      icon: CORE_ICONS.hasOwnProperty(meta.icon) ? meta.icon : "none",
      color: colorChoiceByKey(meta.color) ? meta.color : "auto",
      tags: meta.tags || [],
      notes: notes,
      created: meta.created,
      details: details,
    };
  }

  function icon(name, size) {
    size = size || 14;
    var paths = {
      x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
      plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
      tag: '<rect x="3" y="6" width="14" height="12" rx="2"/><circle cx="8" cy="11" r="1.3"/>',
      check: '<polyline points="20,6 9,17 4,12"/>',
      pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/>',
      folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>',
      download: '<line x1="12" y1="3" x2="12" y2="15"/><polyline points="7,10 12,15 17,10"/><line x1="4" y1="19" x2="20" y2="19"/>',
      upload: '<line x1="12" y1="15" x2="12" y2="3"/><polyline points="7,8 12,3 17,8"/><line x1="4" y1="19" x2="20" y2="19"/>'
    };
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (paths[name] || "") + '</svg>';

  // ---------- state ----------
  var state = {
    cores: defaultCores(),
    loaded: false,
    query: "",
    activeTags: [],
    focusedId: null,
    selectedDetail: null,   // { coreId, detailId }
    editing: null,       // { kind: 'core'|'detail', coreId, id }
    draftText: "",
    tagEditing: null,    // core id
    dirHandle: null,
    folderName: "",
    folderStatus: "",
    theme: "space",
    showLinks: true,
    rotate: true,
    cluster: true,
    view: "map",

  var writtenFiles = new Map();

  var mapEl = document.getElementById("map");
  var starsLayer = document.getElementById("starsLayer");
  var sparkLayer = document.getElementById("sparkLayer");
  var linesLayer = document.getElementById("linesLayer");
  var bubblesLayer = document.getElementById("bubblesLayer");
  var cameraLayer = document.getElementById("cameraLayer");
  var hubAnchor = document.getElementById("hubAnchor");
  var zoomCtl = document.getElementById("zoomCtl");
  var hubCountEl = document.getElementById("hubCount");
  var hubEl = document.getElementById("hub");
  var capA = document.getElementById("capA");
  var capB = document.getElementById("capB");
  var hubDisplay = document.getElementById("hubDisplay");
  var hubDisplayBody = document.getElementById("hubDisplayBody");
  var hubFace = document.getElementById("hubFace");
  var searchWrap = document.getElementById("searchWrap");
  var searchInput = document.getElementById("searchInput");
  var clearSearchBtn = document.getElementById("clearSearchBtn");

  var focusPillText = document.getElementById("focusPillText");
  var settingsBtn = document.getElementById("settingsBtn");
  var settingsModal = document.getElementById("settingsModal");
  var settingsBody = document.getElementById("settingsBody");
  var draftIcon = "none";
  var draftColor = "auto";
  var importInput = document.getElementById("importInput");
  var importJsonInput = document.getElementById("importJsonInput");
  var detailEditing = null;   // { coreId, detailId }
  var detailDraftStatus = "offen";

  var folderSupported = typeof window !== "undefined" && "showDirectoryPicker" in window;

  // ---------- counting / filtering ----------
  function evaluateFilters() {
    var q = state.query.trim().toLowerCase();
    var textSearching = q.length > 0;
    var tagSearching = state.activeTags.length > 0;
    // a focus pointing at an idea that no longer exists counts as no focus
    var focusing = state.focusedId !== null && state.cores.some(function (c) { return c.id === state.focusedId; });
    var perCore = new Map();
    state.cores.forEach(function (core) {
      var isFocused = focusing && core.id === state.focusedId;
      var coreTagHit = (core.tags || []).some(function (t) { return state.activeTags.indexOf(t) !== -1; });
      var detailTagHit = core.details.some(function (d) {
        return (d.tags || []).some(function (t) { return state.activeTags.indexOf(t) !== -1; });
      });
      // A tag sitting only on a detail still belongs to that branch: without
      // this the core dimmed away and took the matching detail with it.
      var tagOk = !tagSearching || coreTagHit || detailTagHit;
      var coreTextMatch = !textSearching || core.text.toLowerCase().indexOf(q) !== -1 ||
        (core.subtitle || "").toLowerCase().indexOf(q) !== -1 ||
        (core.tags || []).some(function (t) { return t.toLowerCase().indexOf(q) !== -1; });
      var anyDetailTextMatch = core.details.some(function (d) { return d.text.toLowerCase().indexOf(q) !== -1; });
      var passesFilters = tagOk && (!textSearching || coreTextMatch || anyDetailTextMatch);
      // Focus never narrows the search: a focused idea always stays visible, and
      // matches elsewhere still light up so the hub search remains global.
      var coreActive = isFocused || (focusing ? (textSearching || tagSearching) && passesFilters : passesFilters);
      var details = new Map();
      core.details.forEach(function (d) {
        var dOwn = d.text.toLowerCase().indexOf(q) !== -1;
        var dTagOk = !tagSearching || coreTagHit ||
          (d.tags || []).some(function (t) { return state.activeTags.indexOf(t) !== -1; });
        var dActive = isFocused ? true : (coreActive && dTagOk && (!textSearching || coreTextMatch || dOwn));
        details.set(d.id, dActive);
      });
      perCore.set(core.id, { coreActive: coreActive, isFocused: isFocused, details: details });
    });
    return { anyFilter: textSearching || tagSearching || focusing, perCore: perCore };
  }

  function selectDetail(coreId, detailId) {
    var sel = state.selectedDetail;
    var opening = !(sel && sel.coreId === coreId && sel.detailId === detailId);
    // Any change of what the display shows closes and reopens it, so moving
    // between details (or back to the core idea) reads as one clear gesture.
    if (hubOpen && !selectDetailSwapping) {
      selectDetailSwapping = true;
      swapDisplay(function () { selectDetail(coreId, detailId); });
      return;
    }
    selectDetailSwapping = false;
    state.selectedDetail = opening ? { coreId: coreId, detailId: detailId } : null;
    renderStructure();
    if (opening) {
      // the spark starts at the detail itself, not at its core
      var el = bubblesLayer.querySelector('[data-role="detail"][data-detail-id="' + detailId + '"]');
      if (el) {
        var xp = parseFloat(el.style.getPropertyValue("--x"));
        var yp = parseFloat(el.style.getPropertyValue("--y"));
        if (isFinite(xp) && isFinite(yp)) emitEnergy(xp, yp, "200,190,255");
      }
    }
  }

  function selectedDetailObj() {
    var sel = state.selectedDetail;
    if (!sel) return null;
    var core = coreById(sel.coreId);
    if (!core) return null;
    var found = null;
    core.details.forEach(function (d) { if (d.id === sel.detailId) found = d; });
    return found ? { core: core, detail: found } : null;
  }

  // When an idea is focused its description travels to the hub as a stream of
  // sparks, so the text does not simply appear in the middle out of nowhere.
  function emitEnergy(fromXpct, fromYpct, colorRgb) {
    if (!mapEl || !motionEnabled()) return;
    var W = layout.width;
    if (!W) return;
    var fx = (fromXpct / 100) * W, fy = (fromYpct / 100) * W;
    var tx = W / 2, ty = W / 2;
    var count = 7;
    for (var i = 0; i < count; i++) {
      var el = document.createElement("span");
      el.className = "ihb-spark";
      // scatter the start points a little so it reads as a stream, not a line
      var jitter = (i - count / 2) * 7;
      var nx = -(ty - fy), ny = (tx - fx);
      var nlen = Math.sqrt(nx * nx + ny * ny) || 1;
      var sx = fx + (nx / nlen) * jitter;
      var sy = fy + (ny / nlen) * jitter;
      el.style.left = sx + "px";
      el.style.top = sy + "px";
      el.style.setProperty("--dx", (tx - sx) + "px");
      el.style.setProperty("--dy", (ty - sy) + "px");
      el.style.background = "rgba(" + (colorRgb || "255,214,140") + ",0.95)";
      el.style.animationDelay = Math.round(i * 90 * speedFactor()) + "ms";
      sparkLayer.appendChild(el);
    }
    var hub = document.getElementById("hub");
    if (hub) {
      hub.classList.remove("ihb-hub-pulse");
      void hub.offsetWidth;
      hub.classList.add("ihb-hub-pulse");
    }
    setTimeout(function () {
      if (sparkLayer) sparkLayer.innerHTML = "";
      if (hub) hub.classList.remove("ihb-hub-pulse");
    }, Math.round(1400 * speedFactor()) + 300);
  }

  function energyFromCore(coreId) {
    var idx = -1;
    for (var i = 0; i < state.cores.length; i++) if (state.cores[i].id === coreId) idx = i;
    if (idx === -1) return;
    var core = state.cores[idx];
    var slots = state.cores.length + (state.cores.length < MAX_CORES ? 1 : 0);
    var angle = coreAngle(idx, slots);
    var pos = polar(HUB.x, HUB.y, pctOfMap(coreOrbit(core)), angle);
    emitEnergy(pos.x, pos.y, paletteFor(core, idx).rgb);
  }

  function toggleFocus(id) {
    // Switching from one focused idea straight to another: close the display
    // around the old one first, then reopen it around the new one.
    if (state.focusedId !== null && id !== state.focusedId && hubOpen) {
      swapDisplay(function () { toggleFocus(id); });
      return;
    }
    clearTimeout(displaySwapTimer);
    // Focusing always plays out at the resting view: if the hub split open
    // while the user was zoomed in on a bubble on the far side of the ring,
    // the split itself could land off screen, with no visible feedback for
    // the tap that triggered it.
    resetCamera(true);
    var opening = state.focusedId !== id;
    state.focusedId = opening ? id : null;
    state.selectedDetail = null;
    ringMoving = true;                 // suppress FLIP while the ring turns
    ringAnim.fromSizes = captureCoreSizes();
    renderStructure();
    ringMoving = false;
    startRingTween(ringTarget());
    if (opening) energyFromCore(id);
  }
  function clearFocus() {
    resetCamera(true);
    state.focusedId = null;
    state.selectedDetail = null;
    ringMoving = true;
    ringAnim.fromSizes = captureCoreSizes();
    renderStructure();
    ringMoving = false;
    startRingTween(ringTarget());
  }

  function computeCounts() {
    var total = state.cores.length + state.cores.reduce(function (s, c) { return s + c.details.length; }, 0);
    var ev = evaluateFilters();
    if (!ev.anyFilter) return { total: total, matched: total, searching: false };
    var matched = 0;
    state.cores.forEach(function (core) {
      var info = ev.perCore.get(core.id);
      if (info.coreActive) matched += 1;
      core.details.forEach(function (d) { if (info.details.get(d.id)) matched += 1; });
    });
    return { total: total, matched: matched, searching: true };

  function setActive(el, active) {

    el.style.filter = active ? "none" : "saturate(0.35)";

  function applyFilter() {
    var ev = evaluateFilters();
    state.cores.forEach(function (core) {
      var info = ev.perCore.get(core.id);
      var coreEl = bubblesLayer.querySelector('[data-role="core"][data-core-id="' + core.id + '"]');
      setActive(coreEl, info.coreActive);
      if (coreEl) {

        if (!dEl2) return;

        else dEl2.classList.remove("is-focused");

      var progLine = linesLayer.querySelector('line[data-line-progress="' + core.id + '"]');

      core.details.forEach(function (d) {
        var dActive = info.details.get(d.id);
        var dEl = bubblesLayer.querySelector('[data-role="detail"][data-detail-id="' + d.id + '"]');
        setActive(dEl, dActive);
        var dLine = linesLayer.querySelector('line[data-line-detail="' + d.id + '"]');
        if (dLine) dLine.setAttribute("opacity", dActive ? "0.4" : "0.06");
      });
    });
  }

  function updateHubCount() {
    var editorActive = !!(state.tagEditing || detailEditing);
    var c = computeCounts();
    var coresCount = state.cores.length;
    // While an idea is focused the hub carries its description: the space is
    // there, the eye is already in the middle, and the text no longer has to be
    // squeezed into a bubble.
    // Note: computeCounts() treats focus itself as a filter, so ask the query
    // directly rather than going through c.searching.
    var reallySearching = state.query.trim().length > 0 || state.activeTags.length > 0;
    var focusNotes = "";
    if (state.focusedId !== null && !reallySearching) {
      var f = coreById(state.focusedId);
      if (f && (f.notes || "").trim()) focusNotes = f.notes.trim();
    }
    // The hub is the reading surface: it shows the selected detail if there is
    // one, otherwise the focused core idea, otherwise just the counter.
    var info = null;
    if (!reallySearching) {
      var sel = selectedDetailObj();
      if (sel) {
        var stLabels = { offen: "Offen", "in-arbeit": "In Arbeit", erledigt: "Erledigt" };
        info = {
          kind: "Detailidee · " + stLabels[detailStatus(sel.detail)],
          title: sel.detail.text,
          notes: (sel.detail.notes || "").trim()
        };
      } else if (state.focusedId !== null) {
        var f2 = coreById(state.focusedId);
        if (f2) info = { kind: "Kernidee", title: f2.text, notes: (f2.notes || "").trim() };
      }
    }

    // The information unfolds from the hub rather than sitting inside it: the
    // circle is the wrong shape for running text, and the panel gives it room.
    // Reading and editing both live inside the opened hub. The editor wins if
    // it is open, so a selection change does not throw away what you are typing.
    if (info && !editorActive) {
      openHubDisplay(
        '<div class="ihb-display-head"><span>' + escapeHtml(info.kind) + "</span>" +
        '<button type="button" data-role="display-close" aria-label="Schließen">&#10005;</button></div>' +
        '<div class="ihb-search-host"></div>' +
        '<div class="ihb-info-title">' + escapeHtml(info.title || "Ohne Titel") + "</div>" +

    } else if (!editorActive) {

    }

      ? c.matched + " Treffer"
      : coresCount + " Kernideen · " + (c.total - coresCount) + " Details";
  }

  // ---------- tag filter bar ----------
  // Tags only do their job — filtering and forming clouds — when they are reused
  // rather than reinvented, so the editor offers the ones already in play.
  function tagCounts() {
    var counts = {};
    state.cores.forEach(function (c) {
      (c.tags || []).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; });
      c.details.forEach(function (d) {
        (d.tags || []).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; });
      });
    });
    return counts;
  }

  function frequentTags(limit) {
    var counts = tagCounts();
    return Object.keys(counts)
      .sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b, "de"); })
      .slice(0, limit || 8);
  }

  function currentTagsInEditor() {
    var el = document.getElementById("edTags");
    if (!el) return [];
    return el.value.split(",").map(function (t) { return t.trim(); }).filter(Boolean);
  }

  function renderTagSuggestions() {
    var host = document.getElementById("edTagSuggest");
    if (!host) return;
    var counts = tagCounts();
    var have = currentTagsInEditor();
    var free = frequentTags(10).filter(function (t) { return have.indexOf(t) === -1; }).slice(0, 6);
    if (!free.length) {
      host.innerHTML = have.length
        ? '<span class="ihb-tagsuggest-none">Alle bekannten Tags sind vergeben.</span>'
        : '<span class="ihb-tagsuggest-none">Noch keine Tags vorhanden — der erste entsteht hier.</span>';
      return;
    }
    var html = '<span class="ihb-tagsuggest-label">Häufig verwendet:</span>';
    free.forEach(function (t) {
      html += '<button type="button" class="ihb-tagsuggest-chip" data-role="tag-suggest" data-tag="' +
        escapeHtml(t) + '" title="' + counts[t] + 'x verwendet">' + escapeHtml(t) + "</button>";
    });
    host.innerHTML = html;
  }

  function addTagFromSuggestion(tag) {
    var el = document.getElementById("edTags");
    if (!el) return;
    var have = currentTagsInEditor();
    if (have.indexOf(tag) === -1) have.push(tag);
    el.value = have.join(", ");
    renderTagSuggestions();
  }

  function allTags() {
    var set = new Set();
    state.cores.forEach(function (c) {
      (c.tags || []).forEach(function (t) { set.add(t); });
      // Details carry tags too, and the filter already understands them — but
      // a tag living only on details never reached the filter bar, so it could
      // not be picked. That made those tags unusable for filtering entirely.
      c.details.forEach(function (d) { (d.tags || []).forEach(function (t) { set.add(t); }); });
    });
    return Array.from(set).sort(function (a, b) { return a.localeCompare(b, "de"); });
  }
  // Filters are shared between the views, so every change has to redraw
  // whichever one is on screen. Calling renderStructure() in tree view would
  // also drive the hub's reading panel, which now shares its container with
  // the tree editor and would overwrite it mid-edit.
  function renderCurrentView() {
    if (state.view === "tree") { renderTagFilterBar(); renderTree(); return; }
    renderStructure();
  }

  function toggleTagFilter(tag) {
    var idx = state.activeTags.indexOf(tag);
    state.activeTags = idx === -1 ? state.activeTags.concat([tag]) : state.activeTags.filter(function (t) { return t !== tag; });
    renderCurrentView();
  }
  function clearTagFilter() {
    state.activeTags = [];
    renderCurrentView();
  }
  function renderTagFilterBar() {
    var tags = allTags();
    if (!tags.length) { tagFilterBar.innerHTML = ""; return; }
    var html = "";
    tags.forEach(function (t) {
      var active = state.activeTags.indexOf(t) !== -1;
      html += '<button type="button" class="ihb-tagchip' + (active ? " active" : "") + '" data-role="tagfilter-chip" data-tag="' + escapeHtml(t) + '">' + escapeHtml(t) + "</button>";
    });
    if (state.activeTags.length) {
      html += '<button type="button" class="ihb-tagchip clear" data-role="tagfilter-clear">Filter zurücksetzen' + icon("x", 10) + "</button>";
    }
    tagFilterBar.innerHTML = html;
  }

  function quickCreatePanelHtml(q) {
    var eligibleCores = state.cores.filter(function (c) { return c.details.length < MAX_DETAILS; });
    var canAddCore = state.cores.length < MAX_CORES;
    var html = '<div class="ihb-quickcreate"><p class="ihb-note">Keine Treffer für „' + escapeHtml(q) + '"</p>';
    if (canAddCore) {
      html += '<button type="button" class="ihb-btn primary" data-role="quickcreate-core" data-text="' + escapeHtml(q) + '">' + icon("plus", 14) + ' Als neue Kernidee anlegen</button>';
    } else {
      // Without this the button would simply vanish and leave the user guessing.
      html += '<p class="ihb-note" style="margin-top:6px;">Die Karte ist mit ' + MAX_CORES +
        ' Kernideen voll. Häng den Text als Detail an, oder lösche zuerst eine Kernidee.</p>';
    }
    if (eligibleCores.length) {
      html += '<p class="ihb-note" style="margin-top:6px;">…oder als Detail anlegen bei:</p><div class="ihb-chiprow">';
      eligibleCores.forEach(function (c) {
        html += '<button type="button" class="ihb-chip" data-role="quickcreate-detail" data-core-id="' + c.id + '" data-text="' + escapeHtml(q) + '">' + escapeHtml(c.text || "Unbenannt") + '</button>';
      });
      html += "</div>";
    }
    html += "</div>";
    return html;
  }

  function renderCaptionOrQuickCreate() {
    var q = state.query.trim();
    var c = computeCounts();
    if (c.searching && c.matched === 0) {
      captionArea.innerHTML = quickCreatePanelHtml(q);
    } else {
      var overflowNote = state.cores.length > COMFORT_CORES
        ? '<p class="ihb-caption" style="color:#fbd1e7;">' + state.cores.length + ' Kernideen auf der Karte' +
          (state.cores.length > MAX_CORES ? ' — mehr als die ' + MAX_CORES + ', die sich hier anlegen lassen' : '') +
          '. Alles wird angezeigt, die Bubbles werden dabei aber kleiner.</p>'
        : "";
      captionArea.innerHTML = overflowNote + '<p class="ihb-caption"><b>Antippen</b> zeigt eine Idee im Hub · <b>Stift bzw. Tag-Symbol</b> klappt das Bearbeitungsfeld am Hub auf · <b>ziehen</b> sortiert um · <b>Mausrad, Kneifgeste oder Doppelklick</b> zoomen die Karte · leere Fläche ziehen verschiebt die Ansicht.</p>';
    }
  }

  // ---------- structural render ----------
  // Bubbles are recreated on every render, so ordinary CSS transitions have
  // nothing to transition. Instead the old positions are captured first and the
  // new elements are animated back from them — the bubbles appear to move.
  function captureRects() {
    var map = {};
    eachEl(bubblesLayer.querySelectorAll('[data-role="core"],[data-role="detail"]'), function (el) {
      var key = el.getAttribute("data-detail-id") || el.getAttribute("data-core-id");
      if (!key) return;
      var r = el.getBoundingClientRect();
      if (!r.width) return;
      map[key] = { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height };
    });
    return map;
  }

  var ringMoving = false;
  function playFlip(prev) {
    if (!prev || !motionEnabled() || ringMoving) return;
    eachEl(bubblesLayer.querySelectorAll('[data-role="core"],[data-role="detail"]'), function (el) {
      var key = el.getAttribute("data-detail-id") || el.getAttribute("data-core-id");
      var was = prev[key];
      var r = el.getBoundingClientRect();
      if (!r.width) return;                    // no layout information available
      if (!was) {                              // genuinely new: let it pop in
        el.style.animation = "ihbPop " + (0.6 * speedFactor()) + "s cubic-bezier(.2,.9,.3,1.25)";
        return;
      }
      var dx = was.x - (r.left + r.width / 2);
      var dy = was.y - (r.top + r.height / 2);
      var sx = was.w / (r.width || 1);
      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5 && Math.abs(sx - 1) < 0.01) return;
      el.style.transition = "none";
      el.style.transform = "translate(" + dx + "px," + dy + "px) scale(" + sx + ")";
      void el.offsetWidth;                     // force the browser to accept the start state
      el.style.transition = "transform " + (0.8 * speedFactor()) + "s cubic-bezier(.22,.85,.25,1)";
      el.style.transform = "";
    });
  }

  function renderStructure() {
    var prevRects = captureRects();
    measureLayout();
    var L = layout;
    var R1 = pctOfMap(L.r1);
    function coreStyleFor(d) {
      return "width:" + d + "px;height:" + d + "px;margin-left:" + (-d / 2) + "px;margin-top:" + (-d / 2) + "px;";
    }
    var coreStyle = coreStyleFor(L.core);
    var corePos = {};
    var cores = state.cores;
    var showGhostCore = state.query.trim().length === 0 && state.activeTags.length === 0 && cores.length < MAX_CORES;
    var coreSlots = cores.length + (showGhostCore ? 1 : 0);
    var linesHtml = "";
    var bubblesHtml = "";

    cores.forEach(function (core, i) {
      var angle = coreAngle(i, coreSlots);
      var pos = polar(HUB.x, HUB.y, pctOfMap(coreOrbit(core)), angle);
      corePos[core.id] = pos;
      var palette = paletteFor(core, i);
      var coreSearch = (core.text + " " + (core.subtitle || "") + " " + (core.tags || []).join(" ")).toLowerCase();
      var thisCoreD = coreDiameter(core);
      var detailSlots = detailSlotsFor(core);
      var showGhostDetail = detailSlots > core.details.length;
      var dMode = detailModeFor(core);
      var dSize = detailSizeFor(core);
      var detailStyleHere = "width:" + dSize.w + "px;height:" + dSize.h + "px;margin-left:" +
        (-dSize.w / 2) + "px;margin-top:" + (-dSize.h / 2) + "px;";
      var isFocusedCore = state.focusedId === core.id;
      var r2 = detailSlots ? pctOfMap(detailRadiusPx(detailSlots, thisCoreD, dSize, coreOrbit(core), isFocusedCore)) : 0;
      var progress = coreProgress(core);
      var titleAttr = escapeHtml(core.text) + (progress.total ? " (" + progress.done + "/" + progress.total + " erledigt)" : "");

      linesHtml += '<line data-line-core="' + core.id + '" data-line-kind="core" x1="' + HUB.x + '" y1="' + HUB.y + '" x2="' + pos.x + '" y2="' + pos.y + '" stroke="' + palette.core + '" stroke-width="0.35" opacity="0.45" />';
      // The spoke doubles as the progress bar: it fills from the hub outwards as
      // the idea's details get done, so progress is legible across the whole map
      // and not only on the ring inside each bubble.
      if (progress.total) {
        var done = progress.done / progress.total;
        if (done > 0) {
          // The thicker fill begins at the hub's rim: starting it in the centre
          // showed a fat stub through the translucent glass.
          var hubR = (layout.hub / 2) / layout.width * 100;
          var ddx = pos.x - HUB.x, ddy = pos.y - HUB.y;
          var dlen = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
          var sx0 = HUB.x + ddx / dlen * hubR, sy0 = HUB.y + ddy / dlen * hubR;
          var fx = sx0 + (pos.x - sx0) * done;
          var fy = sy0 + (pos.y - sy0) * done;
          var full = done >= 1;
          linesHtml += '<line data-line-core="' + core.id + '" data-line-progress="' + core.id + '" ' +
            'x1="' + sx0 + '" y1="' + sy0 + '" x2="' + fx + '" y2="' + fy + '" ' +
            'stroke="' + (full ? "#34D399" : palette.core) + '" stroke-width="' + (full ? 1.15 : 0.95) + '" ' +
            'stroke-linecap="round" opacity="' + (full ? 0.95 : 0.8) + '">' +
            "<title>" + progress.done + " von " + progress.total + " erledigt</title></line>";
        }
      }

      bubblesHtml += '' +
        '<div class="ihb-bubble ihb-core" role="button" tabindex="0" data-role="core" data-core-id="' + core.id + '" ' +
        'data-search="' + escapeHtml(coreSearch) + '" data-shadow="' + glassShadow(palette.rgb, palette.glow, true) + '" title="' + titleAttr + '" ' +
        'style="' + coreStyleFor(thisCoreD) + '--x:' + pos.x + '%;--y:' + pos.y + '%;background:' + glassFill(palette.rgb, 1) + ';animation-delay:' + (i * 0.4) + 's;">' +
        progressRingSvg(progress, thisCoreD) +
        coreIconSvg(core.icon, 17) +
        '<span class="ihb-label">' + highlightMatch(core.text, state.query) + '</span>' +
        ((core.subtitle || "").trim() ? '<span class="ihb-sublabel">' + highlightMatch(core.subtitle, state.query) + '</span>' : "") +
        '<button type="button" class="ihb-editbtn" data-role="edit-core" data-core-id="' + core.id + '" aria-label="Titel bearbeiten">' + icon("pencil", 10) + '</button>' +
        '<button type="button" class="ihb-del" data-role="del-core" data-core-id="' + core.id + '" aria-label="Kernidee löschen">' + icon("x", 11) + '</button>' +
        '<button type="button" class="ihb-tagbtn' + (((core.tags && core.tags.length) || (core.notes && core.notes.trim()) || (core.subtitle && core.subtitle.trim()) || (core.icon && core.icon !== "none") || (core.color && core.color !== "auto")) ? " has-extra" : "") + '" data-role="tag-btn" data-core-id="' + core.id + '" aria-label="Tags und Beschreibung bearbeiten">' + icon("tag", 10) + '</button>' +
        '</div>';

      var spins = orbiting(core);
      var orbitOpen = "", orbitClose = "";
      if (spins) {
        var boxPx = 2 * (detailRadiusPx(detailSlots, thisCoreD, dSize, coreOrbit(core), isFocusedCore) + Math.max(dSize.w, dSize.h) / 2);
        var period = (70 + (i % 5) * 14) * speedFactor();                 // slightly different speeds feel organic
        var dir = (i % 2 === 0) ? "normal" : "reverse"; // and alternating directions
        orbitOpen = '<div class="ihb-orbit" data-orbit-core="' + core.id + '" style="left:' + pos.x + '%;top:' + pos.y +
          '%;width:' + boxPx + 'px;height:' + boxPx + 'px;margin-left:' + (-boxPx / 2) + 'px;margin-top:' + (-boxPx / 2) +
          'px;animation-duration:' + period + 's;animation-direction:' + dir + ';">';
        orbitClose = "</div>";
      }
      bubblesHtml += orbitOpen;
      if (detailSlots) core.details.forEach(function (d, j) {
        var da = detailAngle(angle, j, detailSlots, isFocusedCore);
        var dp = polar(pos.x, pos.y, r2, da);
        var st = detailStatus(d);
        linesHtml += '<line data-line-core="' + core.id + '" data-line-detail="' + d.id + '" x1="' + pos.x + '" y1="' + pos.y + '" x2="' + dp.x + '" y2="' + dp.y + '" stroke="' + palette.core + '" stroke-width="0.25" opacity="0.4" />';
        bubblesHtml += '' +
          '<div class="ihb-bubble ihb-detail' + (dMode === "mini" ? " ihb-detail-mini" : "") + '" role="button" tabindex="0" data-role="detail" data-core-id="' + core.id + '" data-detail-id="' + d.id + '" ' +
          'data-mode="' + dMode + '" data-status="' + st + '" ' +
          'data-shadow="' + glassShadow(palette.rgb, palette.glow, true) + '" title="' + escapeHtml(d.text + ((d.notes || "").trim() ? "\n\n" + d.notes.trim() : "")) + '" ' +
          'style="' + detailStyleHere + (spins ? orbitDotPos(j, detailSlots, boxPx, dSize) : '--x:' + dp.x + '%;--y:' + dp.y + '%;') + 'background:' + glassFill(palette.rgb, 0.72) + ';animation-delay:' + (i * 0.4 + j * 0.2 + 0.3) + 's;">' +
          (dMode === "full"
            ? '<span class="ihb-label">' + highlightMatch(d.text, state.query) + '</span>' +
              '<button type="button" class="ihb-del" data-role="del-detail" data-core-id="' + core.id + '" data-detail-id="' + d.id + '" aria-label="Detailidee löschen">' + icon("x", 10) + '</button>' +
              '<button type="button" class="ihb-statusbtn status-' + st + '" data-role="status-btn" data-core-id="' + core.id + '" data-detail-id="' + d.id + '" aria-label="Status: ' + st + ', antippen zum Ändern">' + (st === "erledigt" ? icon("check", 9) : "") + '</button>' +
              '<button type="button" class="ihb-notebtn' + ((d.notes || "").trim() ? " has-extra" : "") + '" data-role="detail-note" data-core-id="' + core.id + '" data-detail-id="' + d.id + '" aria-label="Beschreibung bearbeiten">' + icon("pencil", 9) + '</button>'
            : "") +
          '</div>';
      });

      bubblesHtml += orbitClose;
      if (showGhostDetail) {
        var gda = detailAngle(angle, core.details.length, detailSlots, isFocusedCore);
        var gdp = polar(pos.x, pos.y, r2, gda);
        bubblesHtml += '<div class="ihb-bubble ihb-detail ihb-ghost" role="button" tabindex="0" data-role="ghost-detail" data-core-id="' + core.id + '" ' +
          'style="' + detailStyleHere + '--x:' + gdp.x + '%;--y:' + gdp.y + '%;" aria-label="Detail hinzufügen">' + icon("plus", 14) + '</div>';
      }
    });

    if (showGhostCore) {
      var gAngle = clusterAngles().ghost + ringRotation();
      var gPos = polar(HUB.x, HUB.y, R1, gAngle);
      bubblesHtml += '<div class="ihb-bubble ihb-core ihb-ghost" role="button" tabindex="0" data-role="ghost-core" ' +
        'style="' + coreStyle + '--x:' + gPos.x + '%;--y:' + gPos.y + '%;" aria-label="Neue Kernidee hinzufügen">' + icon("plus", 18) + '</div>';
    }

    linesLayer.innerHTML = crossLinkSvg(corePos) + linesHtml;
    bubblesLayer.innerHTML = bubblesHtml;
    if (ringAnim.raf && bubblesLayer) bubblesLayer.classList.add("ihb-tweening");
    playFlip(prevRects);
    applyFilter();
    updateHubCount();
    renderCaptionOrQuickCreate();
    renderTagFilterBar();
    renderFocusPill();
    applyHubSize();
  }

  function applyHubSize() {
    var L = layout;
    var hub = hubEl;
    if (!hub) return;
    layoutHub();   // the two halves and the display carry the sizing now

    // Everything inside the hub is measured against the hub itself, so the
    // content actually grows with it instead of staying pinned to a fixed size.
    var pad = L.hub * 0.085;
    if (hubFace) hubFace.style.gap = Math.max(3, L.hub * 0.028) + "px";
    var contentW = L.hub - 2 * pad;

    var wrap = searchWrap;
    if (wrap) {
      // A circle is widest at its middle, which is exactly where the search sits,
      // so the pill may reach past the text column without clipping.
      var pillW = L.hub * 0.95;
      var bleed = -(pillW - contentW) / 2;
      wrap.style.width = pillW + "px";
      wrap.style.marginLeft = bleed + "px";
      wrap.style.marginRight = bleed + "px";
      wrap.style.padding = Math.max(4, L.hub * 0.026) + "px " + Math.max(8, L.hub * 0.042) + "px";
    }
    var titleEl = document.getElementById("hubTitle");
    if (titleEl) titleEl.style.fontSize = Math.max(11, Math.min(21, L.hub * 0.085)) + "px";
    var searchEl2 = document.getElementById("searchInput");
    if (searchEl2) searchEl2.style.fontSize = Math.max(10, Math.min(16, L.hub * 0.063)) + "px";
    if (hubCountEl) hubCountEl.style.fontSize = Math.max(8, Math.min(12, L.hub * 0.048)) + "px";
    // The reading panel is a rectangle, so the text can simply use a comfortable
    // fixed size instead of being squeezed to fit a circle.
    // Headline type follows each bubble's own diameter, so the focused idea
    // really does read as zoomed in rather than just being a bigger circle.
    eachEl(bubblesLayer.querySelectorAll('[data-role="core"]'), function (bubble) {
      var d = parseFloat(bubble.style.width) || L.core;
      var label = bubble.querySelector(".ihb-label");
      if (label) label.style.fontSize = Math.max(9, Math.min(22, d * 0.135)) + "px";
      var sub = bubble.querySelector(".ihb-sublabel");
      if (sub) sub.style.fontSize = Math.max(7.5, Math.min(14, d * 0.093)) + "px";
      var ic = bubble.querySelector(".ihb-coreicon");
      if (ic) {
        var isz = Math.max(12, Math.min(26, d * 0.15));
        ic.setAttribute("width", isz);
        ic.setAttribute("height", isz);
      }
    });
    eachEl(bubblesLayer.querySelectorAll(".ihb-detail .ihb-label"), function (el) {
      el.style.fontSize = Math.max(7.5, Math.min(12, L.detailW * 0.155)) + "px";
    });
    fitHeadlines();
  }

  // Last-resort fit: if a headline still does not fit its bubble, step the type
  // down until it does. Uses the real rendered height, so it is exact rather
  // than an estimate. Silently skipped where measurement is unavailable.
  function fitHeadlines() {
    eachEl(bubblesLayer.querySelectorAll('[data-role="core"]'), function (bubble) {
      var label = bubble.querySelector(".ihb-label");
      if (!label) return;
      var startFont = parseFloat(label.style.fontSize) || 12;
      var box = bubble.clientHeight;
      if (!box) return; // no layout information available
      var sub = bubble.querySelector(".ihb-sublabel");
      var icon = bubble.querySelector(".ihb-coreicon");
      var reserved = (sub ? sub.offsetHeight : 0) + (icon ? icon.offsetHeight + 2 : 0);
      var budget = box * 0.82 - reserved;
      if (budget <= 0) return;
      var font = startFont;
      var guard = 0;
      while (label.scrollHeight > budget && font > 8 && guard < 14) {
        font -= 0.7;
        label.style.fontSize = font + "px";
        guard++;
      }
      // If it still does not fit at the minimum size, the tooltip carries the
      // full text (already set via the title attribute).
    });
  }

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      resetCamera(false);
      if (!state.editing) renderStructure();
      positionHubEditor();
    }, 150);
  });

  function renderFocusPill() {
    if (state.focusedId === null) { focusPill.className = "ihb-focuspill"; return; }
    var f = coreById(state.focusedId);
    if (!f) { state.focusedId = null; focusPill.className = "ihb-focuspill"; return; }
    focusPillText.textContent = "Fokus: " + (f.text || "Unbenannt");
    focusPill.className = "ihb-focuspill show";
  }

  // Position of one dot inside its rotating wrapper, evenly spaced all the way
  // around: a partial fan would look like a wobble rather than an orbit.
  function orbitDotPos(index, total, boxPx, size) {
    var r = boxPx / 2 - Math.max(size.w, size.h) / 2;
    var a = (index / Math.max(1, total)) * Math.PI * 2 - Math.PI / 2;
    var x = boxPx / 2 + r * Math.cos(a);
    var y = boxPx / 2 + r * Math.sin(a);
    return "--x:" + ((x / boxPx) * 100) + "%;--y:" + ((y / boxPx) * 100) + "%;";
  }

  function crossLinkSvg(corePos) {
    if (!state.showLinks) return "";
    var links = crossLinks();
    if (!links.length) return "";
    var clearPct = (layout.hub / 2 / layout.width) * 100 + 7;
    // a focus pointing at an idea that no longer exists counts as no focus
    var focusing = state.focusedId !== null && state.cores.some(function (c) { return c.id === state.focusedId; });
    var filtering = state.activeTags.length > 0;
    var html = "";
    for (var i = 0; i < links.length; i++) {
      var l = links[i];
      var pa = corePos[l.aId], pb = corePos[l.bId];
      if (!pa || !pb) continue;
      var opacity, width;
      if (focusing) {
        // while focused, only that idea's connections matter
        if (l.aId !== state.focusedId && l.bId !== state.focusedId) continue;
        opacity = 0.6; width = 0.32;
      } else if (filtering) {
        var hit = false;
        for (var t = 0; t < l.tags.length; t++) {
          if (state.activeTags.indexOf(l.tags[t]) !== -1) { hit = true; break; }
        }
        if (!hit) continue;
        opacity = 0.5; width = 0.3;
      } else {
        opacity = 0.2; width = 0.25;
      }
      html += '<path class="ihb-crosslink" data-link-a="' + l.aId + '" data-link-b="' + l.bId + '" ' +
        'd="' + linkPath(pa.x, pa.y, pb.x, pb.y, clearPct) + '" fill="none" ' +
        'stroke="#c9beff" stroke-width="' + width + '" stroke-dasharray="1.4 1.4" ' +
        'stroke-linecap="round" opacity="' + opacity + '">' +
        "<title>Gemeinsame Tags: " + escapeHtml(l.tags.join(", ")) + "</title></path>";
    }
    return html;
  }

  function renderStars() {
    var html = "";
    for (var i = 0; i < 46; i++) {
      var x = Math.random() * 100, y = Math.random() * 100;
      var size = Math.random() * 1.6 + 0.6, delay = Math.random() * 6, dur = 4 + Math.random() * 5;
      html += '<span class="ihb-star" style="left:' + x + '%;top:' + y + '%;width:' + size + 'px;height:' + size + 'px;animation-duration:' + dur + 's;animation-delay:' + delay + 's;"></span>';
    }
    starsLayer.innerHTML = html;
  }

  // ---------- persistence (chat-scoped) ----------
  var persistTimer = null;
  function schedulePersist() {
    if (!state.loaded || !window.storage) return;
    clearTimeout(persistTimer);
    persistTimer = setTimeout(function () {
      window.storage.set(STORAGE_KEY, JSON.stringify(state.cores), false).catch(function () {});
    }, 500);
  }
  function loadPersisted() {
    if (!window.storage) { state.loaded = true; applyTheme(); return Promise.resolve(); }
    return window.storage.get(THEME_KEY, false).catch(function () { return null; }).then(function (tRes) {
      if (tRes && (tRes.value === "minimal" || tRes.value === "space")) state.theme = tRes.value;
      applyTheme();
      return window.storage.get(LINKS_KEY, false).catch(function () { return null; });
    }).then(function (lRes) {
      if (lRes && (lRes.value === "0" || lRes.value === "1")) state.showLinks = lRes.value === "1";
      return window.storage.get(ROTATE_KEY, false).catch(function () { return null; });
    }).then(function (rRes) {
      if (rRes && (rRes.value === "0" || rRes.value === "1")) state.rotate = rRes.value === "1";
      return window.storage.get(CLUSTER_KEY, false).catch(function () { return null; });
    }).then(function (cRes) {
      if (cRes && (cRes.value === "0" || cRes.value === "1")) state.cluster = cRes.value === "1";
      return window.storage.get(VIEW_KEY, false).catch(function () { return null; });
    }).then(function (vRes) {
      if (vRes && (vRes.value === "map" || vRes.value === "tree")) state.view = vRes.value;
      return window.storage.get(MOTION_KEY, false).catch(function () { return null; });
    }).then(function (mRes) {
      if (mRes && (mRes.value === "0" || mRes.value === "1")) state.motion = mRes.value === "1";
      applyMotion();
      return window.storage.get(SPEED_KEY, false).catch(function () { return null; });
    }).then(function (spRes) {
      if (spRes && SPEEDS[spRes.value]) state.speed = spRes.value;
      applySpeed();
      return window.storage.get(STORAGE_KEY, false).catch(function () { return null; });
    }).then(function (res) {
      if (res && res.value) {
        try {
          var parsed = JSON.parse(res.value);
          if (Array.isArray(parsed) && parsed.length) state.cores = parsed;
        } catch (e) {}
      }
      state.loaded = true;
    });
  }

  // ---------- folder sync ----------
  var folderSyncTimer = null;
  function scheduleFolderSync() {
    if (!state.dirHandle) return;
    clearTimeout(folderSyncTimer);
    folderSyncTimer = setTimeout(syncToFolder, 300);
  }
  function syncToFolder() {
    var handle = state.dirHandle;
    if (!handle) return Promise.resolve();
    var currentIds = {};
    state.cores.forEach(function (c) { currentIds[c.id] = true; });
    var deletions = [];
    writtenFiles.forEach(function (fname, id) {
      if (!currentIds[id]) deletions.push([id, fname]);
    });
    var chain = Promise.resolve();
    deletions.forEach(function (pair) {
      chain = chain.then(function () {
        return handle.removeEntry(pair[1]).catch(function () {}).then(function () {
          writtenFiles.delete(pair[0]);
        });
      });
    });
    state.cores.forEach(function (core) {
      chain = chain.then(function () {
        var fname = coreFilename(core);
        var prevName = writtenFiles.get(core.id);
        var pre = Promise.resolve();
        if (prevName && prevName !== fname) {
          pre = handle.removeEntry(prevName).catch(function () {});
        }
        return pre.then(function () {
          return handle.getFileHandle(fname, { create: true }).then(function (fh) {
            return fh.createWritable().then(function (w) {
              return w.write(coreToMd(core)).then(function () { return w.close(); }).then(function () {
                writtenFiles.set(core.id, fname);
              });
            });
          });
        });
      });
    });
    return chain.then(function () {
      state.folderStatus = "Synchronisiert · " + state.cores.length + " Dateien";
      renderSettingsModal();
    }).catch(function () {
      state.folderStatus = "Synchronisierung fehlgeschlagen";
      renderSettingsModal();
    });
  }
  function connectFolder() {
    if (!folderSupported) return;
    window.showDirectoryPicker({ mode: "readwrite" }).then(function (handle) {
      state.folderStatus = "Verbinde…";
      renderSettingsModal();
      var loadedCores = [];
      var map = new Map();
      var iter = handle.entries();
      function step() {
        return iter.next().then(function (res) {
          if (res.done) return;
          var name = res.value[0], entry = res.value[1];
          if (entry.kind === "file" && name.toLowerCase().indexOf(".md") === name.length - 3) {
            return entry.getFile().then(function (file) {
              return file.text().then(function (text) {
                var core = parseMdToCore(text, name);
                loadedCores.push(core);
                map.set(core.id, name);
              });
            }).then(step);
          }
          return step();
        });
      }
      return step().then(function () {
        writtenFiles = map;
        state.dirHandle = handle;
        state.folderName = handle.name;
        if (loadedCores.length) {
          state.cores = loadedCores;
          renderStructure();
          schedulePersist();
        }
        renderSettingsModal();
        return syncToFolder();
      });
    }).catch(function () {
      state.folderStatus = "";
      renderSettingsModal();
    });
  }
  function disconnectFolder() {
    state.dirHandle = null;
    state.folderName = "";
    state.folderStatus = "";
    writtenFiles = new Map();
    renderSettingsModal();
  }

  // ---------- export / import ----------
  // Which ideas an export covers should match what the filters currently show —
  // otherwise "export" quietly means something different from what is on screen.
  function filteredCores() {
    var f = evaluateFilters();
    if (!f.anyFilter) return state.cores;
    return state.cores.filter(function (c) {
      var e = f.perCore.get(c.id);
      if (!e) return true;
      if (e.coreActive) return true;
      var any = false;
      c.details.forEach(function (d) { if (e.details.get(d.id)) any = true; });
      return any;
    });
  }

  function exportLabel() {
    var n = filteredCores().length, all = state.cores.length;
    return n === all
      ? "Als .md-Dateien exportieren (" + all + ")"
      : "Gefilterte als .md exportieren (" + n + " von " + all + ")";
  }

  function exportAll() {
    filteredCores().forEach(function (core, i) {
      setTimeout(function () {
        var blob = new Blob([coreToMd(core)], { type: "text/markdown" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = coreFilename(core);
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, i * 150);
    });
  }
  function exportJson() {
    var payload = {
      format: "ideahub",
      version: 1,
      exported: new Date().toISOString(),
      theme: state.theme,
      // A backup is deliberately always complete: restoring it replaces the
      // whole map, so a filtered backup would silently destroy what it omits.
      cores: state.cores
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "ideahub-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // Restores a full backup. Replaces the current map, so it asks first.
  function applyJsonBackup(text) {
    var data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      state.folderStatus = "Backup konnte nicht gelesen werden (kein gültiges JSON).";
      renderSettingsModal();
      return false;
    }
    var cores = data && Array.isArray(data.cores) ? data.cores : (Array.isArray(data) ? data : null);
    if (!cores) {
      state.folderStatus = "Backup enthält keine Ideen.";
      renderSettingsModal();
      return false;
    }
    // normalise so older or hand-edited backups still load cleanly
    var clean = cores.filter(function (c) { return c && typeof c === "object"; }).map(function (c) {
      return {
        id: c.id || nextId(),
        text: typeof c.text === "string" ? c.text : "",
        subtitle: typeof c.subtitle === "string" ? c.subtitle : "",
        icon: CORE_ICONS.hasOwnProperty(c.icon) ? c.icon : "none",
        color: colorChoiceByKey(c.color) ? c.color : "auto",
        tags: Array.isArray(c.tags) ? c.tags.filter(function (t) { return typeof t === "string"; }) : [],
        notes: typeof c.notes === "string" ? c.notes : "",
        created: c.created,
        details: Array.isArray(c.details) ? c.details.filter(function (d) { return d && typeof d === "object"; }).map(function (d) {
          return {
            id: d.id || nextId(),
            text: typeof d.text === "string" ? d.text : "",
            notes: typeof d.notes === "string" ? d.notes : "",
            status: STATUS_ORDER.indexOf(d.status) !== -1 ? d.status : "offen",
            // colour and tags were added to details later; the restore cleaning
            // silently dropped them from every backup until this line existed
            color: colorChoiceByKey(d.color) ? d.color : "auto",
            tags: Array.isArray(d.tags) ? d.tags.filter(function (t) { return typeof t === "string"; }) : []
          };
        }) : []
      };
    });
    if (!clean.length) {
      state.folderStatus = "Backup enthält keine Ideen.";
      renderSettingsModal();
      return false;
    }
    state.cores = clean;
    if (data.theme === "minimal" || data.theme === "space") {
      state.theme = data.theme;
      applyTheme();
      if (window.storage) window.storage.set(THEME_KEY, state.theme, false).catch(function () {});
    }
    state.focusedId = null;
    state.activeTags = [];
    clearSearch();
    state.folderStatus = "Backup geladen · " + clean.length + " Kernideen";
    onCoresChanged();
    renderSettingsModal();
    return true;
  }

  importJsonInput.addEventListener("change", function (e) {
    var file = (e.target.files || [])[0];
    if (!file) return;
    var proceed = window.confirm("Backup laden? Die aktuell angezeigten Ideen werden dabei ersetzt.");
    if (!proceed) { importJsonInput.value = ""; return; }
    file.text().then(function (text) {
      applyJsonBackup(text);
      importJsonInput.value = "";
    });
  });

  importInput.addEventListener("change", function (e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    if (!files.length) return;
    Promise.all(files.map(function (file) { return file.text().then(function (text) { return parseMdToCore(text, file.name); }); })).then(function (imported) {
      var map = new Map(state.cores.map(function (c) { return [c.id, c]; }));
      imported.forEach(function (c) { map.set(c.id, c); });
      state.cores = Array.from(map.values());
      importInput.value = "";
      onCoresChanged();
    });
  });

  // ---------- mutators ----------
  function onCoresChanged() {
    if (state.view === "tree") { renderTree(); schedulePersist(); scheduleFolderSync(); return; }
    renderStructure();
    schedulePersist();
    scheduleFolderSync();
  }
  function addCore() {
    if (state.cores.length >= MAX_CORES) return;
    var id = nextId();
    state.cores = state.cores.concat([{ id: id, text: "", subtitle: "", icon: "none", color: "auto", tags: [], notes: "", details: [] }]);
    onCoresChanged();
    enterEdit("core", null, id);
  }
  function addDetail(coreId) {
    var core = coreById(coreId);
    if (!core || core.details.length >= MAX_DETAILS) return;
    var id = nextId();
    state.cores = state.cores.map(function (c) {
      return c.id === coreId ? Object.assign({}, c, { details: c.details.concat([{ id: id, text: "", status: "offen", notes: "" }]) }) : c;
    });
    onCoresChanged();
    enterEdit("detail", coreId, id);
  }
  function quickCreateCore(text) {
    var value = (text || "").trim();
    if (!value || state.cores.length >= MAX_CORES) return;
    state.cores = state.cores.concat([{ id: nextId(), text: value, subtitle: "", icon: "none", color: "auto", tags: state.activeTags.slice(), notes: "", details: [] }]);
    clearSearch();
    onCoresChanged();
  }
  function quickCreateDetail(coreId, text) {
    var value = (text || "").trim();
    var core = coreById(coreId);
    if (!value || !core || core.details.length >= MAX_DETAILS) return;
    state.cores = state.cores.map(function (c) {
      return c.id === coreId ? Object.assign({}, c, { details: c.details.concat([{ id: nextId(), text: value, status: "offen", notes: "" }]) }) : c;
    });
    clearSearch();
    onCoresChanged();
  }
  function deleteCore(id) {
    state.cores = state.cores.filter(function (c) { return c.id !== id; });
    if (state.editing && state.editing.id === id) state.editing = null;
    // A focus left pointing at a deleted idea makes the filter treat every
    // remaining idea as "not the focused one" and dims the whole map.
    if (state.focusedId === id) state.focusedId = null;
    if (state.selectedDetail && state.selectedDetail.coreId === id) state.selectedDetail = null;
    if (state.tagEditing === id) state.tagEditing = null;
    onCoresChanged();
  }
  function deleteDetail(coreId, id) {
    state.cores = state.cores.map(function (c) {
      return c.id === coreId ? Object.assign({}, c, { details: c.details.filter(function (d) { return d.id !== id; }) }) : c;
    });
    if (state.editing && state.editing.id === id) state.editing = null;
    if (state.selectedDetail && state.selectedDetail.detailId === id) state.selectedDetail = null;
    onCoresChanged();
  }
  function cycleDetailStatus(coreId, detailId) {
    state.cores = state.cores.map(function (c) {
      if (c.id !== coreId) return c;
      return Object.assign({}, c, { details: c.details.map(function (d) {
        return d.id === detailId ? Object.assign({}, d, { status: nextStatus(detailStatus(d)) }) : d;
      })});
