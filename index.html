  // ---------- quick capture in the hub field ----------
  // Enter im Hub-Feld legt immer etwas an (Assist: "im Zweifel erfassen"). Die
  // Zeile unter der Karte sagt vorher, was genau. Alles rein lexikalisch.
  var CAPTURE_STOPWORDS = {};
  ("und oder der die das den dem des ein eine einen einem einer eines fuer mit auf aus bei von vom zum zur "
    + "ist sind war nicht noch auch nur als wie was wer wird werden the and for").split(" ")
    .forEach(function (w) { CAPTURE_STOPWORDS[w] = true; });
  function normTitle(s) {
    return (s || "").toLowerCase().replace(/ß/g, "ss").normalize("NFKD")
      .replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
  }
  function captureWords(s) {
    return normTitle(s).split(" ").filter(function (w) { return w.length >= 3 && !CAPTURE_STOPWORDS[w]; });
  }
  function wordsMatch(a, b) {
    if (a === b) return true;
    var n = Math.min(a.length, b.length);
    return n >= 4 && (a.indexOf(b) === 0 || b.indexOf(a) === 0);
  }
  function parseCapture(raw) {
    var tags = [];
    var text = (raw || "").replace(/(^|\s)#([^\s#,]+)/g, function (m, pre, tag) {
      if (tags.indexOf(tag) === -1) tags.push(tag);
      return pre;
    }).replace(/\s+/g, " ").trim();
    var res = { raw: raw || "", text: text, tags: tags, prefix: null, rest: null, target: null };
    // Nach dem Doppelpunkt muss ein Leerzeichen stehen: "14:30" ist kein Praefix.
    var m = text.match(/^([^:]{1,60}?):\s+(\S.*)$/);
    if (m) {
      res.prefix = m[1].trim();
      res.rest = m[2].trim();
      res.target = coreForPrefix(res.prefix);
    }
    return res;
  }
  function coreForPrefix(prefix) {
    var p = normTitle(prefix);
    if (!p) return null;
    var exact = state.cores.filter(function (c) { return normTitle(c.text) === p; });
    if (exact.length) return exact[0];
    var starts = state.cores.filter(function (c) { return normTitle(c.text).indexOf(p) === 0; });
    return starts.length === 1 ? starts[0] : null;
  }
  function exactCore(text) {
    var n = normTitle(text);
    if (!n) return null;
    return state.cores.filter(function (c) { return normTitle(c.text) === n; })[0] || null;
  }
  function similarCores(text) {
    var n = normTitle(text);
    if (n.length < 4) return [];
    var wa = captureWords(text);
    return state.cores.filter(function (c) {
      var t = normTitle(c.text);
      if (!t || t === n) return false;
      // ohne Leer- und Trennzeichen: "Marketingplan" ~ "Marketing-Plan", "Web Site" ~ "Website"
      var nc = n.replace(/ /g, ""), tc = t.replace(/ /g, "");
      if (Math.min(tc.length, nc.length) >= 4 && (tc.indexOf(nc) !== -1 || nc.indexOf(tc) !== -1)) return true;
      var wb = captureWords(c.text);
      if (!wa.length || !wb.length) return false;
      var shared = wa.filter(function (w) { return wb.some(function (v) { return wordsMatch(w, v); }); }).length;
      return shared / (wa.length + wb.length - shared) >= 0.6;
    }).slice(0, 2);
  }
  function suggestCores(text) {
    var words = captureWords(text);
    if (!words.length) return [];
    return state.cores.filter(function (c) { return c.details.length < MAX_DETAILS; }).map(function (c) {
      var score = 0;
      function add(src, weight) {
        var ws = captureWords(src);
        words.forEach(function (w) { if (ws.some(function (v) { return wordsMatch(w, v); })) score += weight; });
      }
      add(c.text, 3);
      add(c.subtitle, 2);
      add((c.tags || []).join(" "), 2);
      add(c.details.map(function (d) { return d.text; }).join(" "), 1);
      return { core: c, score: score };
    }).filter(function (s) { return s.score > 0; })
      .sort(function (a, b) { return b.score - a.score; })
      .slice(0, 3).map(function (s) { return s.core; });
  }
  // Was Enter mit diesem Text tun wuerde: { kind, label, run? }
  function captureAction(raw) {
    var p = parseCapture(raw);
    var tagNote = p.tags.length ? " · #" + p.tags.join(" #") : "";
    if (p.prefix && p.rest) {
      if (p.target) {
        if (p.target.details.length >= MAX_DETAILS) {
          return { kind: "inbox", parsed: p, label: "„" + p.target.text + "“ ist voll – Enter legt den Gedanken in den Eingang",
            run: function () { addToInbox(p.raw.trim()); clearSearch(); renderCurrentView(); } };
        }
        return { kind: "detail", parsed: p, label: "Detail „" + p.rest + "“ bei „" + p.target.text + "“" + tagNote,
          run: function () { quickCreateDetail(p.target.id, p.rest, p.tags); } };
      }
      if (state.cores.length >= MAX_CORES) {
        return { kind: "inbox", parsed: p, label: "Die Karte ist mit " + MAX_CORES + " Kernideen voll – Enter legt den Gedanken in den Eingang",
        run: function () { addToInbox(p.raw.trim()); clearSearch(); renderCurrentView(); } };
      }
      // Unbekanntes Praefix: im Zweifel erfassen statt eine Kernidee zu raten
      return { kind: "inbox", parsed: p, label: "„" + p.prefix + "“ gibt es noch nicht – Enter legt den Gedanken in den Eingang",
        run: function () { addToInbox(p.raw.trim()); clearSearch(); renderCurrentView(); } };
    }
    if (!p.text) return null;
    var same = exactCore(p.text);
    if (same) {
      return { kind: "open", parsed: p, label: "öffnet „" + same.text + "“ – die gibt es schon",
        run: function () {
          clearSearch();
          if (state.focusedId !== same.id) toggleFocus(same.id); else renderCurrentView();
        } };
    }
    if (state.cores.length >= MAX_CORES) {
      return { kind: "inbox", parsed: p, label: "Die Karte ist mit " + MAX_CORES + " Kernideen voll – Enter legt den Gedanken in den Eingang",
        run: function () { addToInbox(p.raw.trim()); clearSearch(); renderCurrentView(); } };
    }
    return { kind: "core", parsed: p, label: "neue Kernidee „" + p.text + "“" + tagNote,
      run: function () { quickCreateCore(p.text, p.tags); } };
  }

  // ---------- paste a whole list ----------
  // Gelesen wird wie eine Gliederung:
  //   "# Titel" oder "Titel:"        -> Kernidee, die folgenden Zeilen sind Details
  //   eingerueckte Zeilen            -> Details der Zeile darueber
  //   "Website: Impressum"           -> wie im Hub-Feld
  //   flache Zeilen ohne Struktur    -> je eine Kernidee
  // Aufzaehlungszeichen fallen weg, [x]/[~] setzen den Status, #tag setzt Tags.
  // Gibt es eine Kernidee schon, landen die Details dort statt in einem Doppel.
  function planOutline(raw) {
    var items = [];
    (raw || "").replace(/\r\n?/g, "\n").split("\n").forEach(function (line) {
      if (!line.trim()) { items.push({ blank: true }); return; }
      var exp = line.replace(/\t/g, "  ");
      var indent = exp.match(/^ */)[0].length;
      var t = exp.trim();
      var heading = false, status = null;
      var hm = t.match(/^#{1,6}\s+(.+)$/);
      if (hm) { heading = true; t = hm[1].trim(); }
      else {
        t = t.replace(/^(?:[-*•–+]|\d+[.)])\s+/, "");
        var cb = t.match(/^\[([ xX~])\]\s*(.*)$/);
        if (cb) { status = markToStatus(cb[1]); t = cb[2].trim(); }
      }
      if (t) items.push({ indent: indent, text: t, heading: heading, status: status });
    });
    var plain = items.filter(function (it) { return !it.blank && !it.heading; });
    var top = plain.length ? Math.min.apply(null, plain.map(function (it) { return it.indent; })) : 0;
    var groups = [], cur = null;
    function groupFor(title, tags, target, explicit) {
      var key = target ? "id:" + target.id : "t:" + normTitle(title);
      var g = groups.filter(function (x) { return x.key === key; })[0];
      if (!g) { g = { key: key, title: title, tags: [], target: target, details: [], explicit: explicit }; groups.push(g); }
      g.tags = mergeTags(g.tags, tags);
      return g;
    }
    items.forEach(function (it) {
      if (it.blank) {
        // eine Leerzeile beendet eine "Titel:"-Gruppe, die schon Details hat
        if (cur && cur.explicit === "colon" && cur.details.length) cur = null;
        return;
      }
      var p = parseCapture(it.text);
      if (!p.text) return;
      var colonHead = !it.heading && !p.prefix && /:$/.test(p.text);
      if (it.heading || colonHead) {
        var title = p.text.replace(/:$/, "").trim();
        if (!title) return;
        cur = groupFor(title, p.tags, it.heading ? exactCore(title) : coreForPrefix(title), it.heading ? "heading" : "colon");
        return;
      }
      var isTop = it.indent <= top;
      if (cur && (!isTop || cur.explicit)) {
        cur.details.push({ text: p.text, tags: p.tags, status: it.status || "offen" });
        return;
      }
      if (p.prefix && p.rest) {
        cur = groupFor(p.prefix, [], p.target, false);
        cur.details.push({ text: p.rest, tags: p.tags, status: it.status || "offen" });
        return;
      }
      cur = groupFor(p.text, p.tags, exactCore(p.text), false);
    });
    var real = groups.filter(function (g) { return !g.target || g.details.length; });
    var newCores = real.filter(function (g) { return !g.target; }).length;
    var nDetails = real.reduce(function (n, g) { return n + g.details.length; }, 0);
    var toExisting = real.filter(function (g) { return g.target; }).reduce(function (n, g) { return n + g.details.length; }, 0);
    var overfull = real.filter(function (g) {
      return (g.target ? g.target.details.length : 0) + g.details.length > MAX_DETAILS;
    }).map(function (g) { return g.target ? g.target.text : g.title; });
    return { raw: raw, groups: real, newCores: newCores, nDetails: nDetails, toExisting: toExisting,
      coresAfter: state.cores.length + newCores, overfull: overfull };
  }
  function applyPasteDraft() {
    if (!state.pasteDraft) return;
    var plan = planOutline(state.pasteDraft.raw);
    state.pasteDraft = null;
    if (!plan.newCores && !plan.nDetails) { renderCaptionOrQuickCreate(); return; }
    var list = state.cores.slice();
    plan.groups.forEach(function (g) {
      var ds = g.details.map(function (d) {
        return { id: nextId(), text: d.text, status: d.status, notes: "", tags: d.tags.slice(), color: "auto" };
      });
      if (g.target) {
        list = list.map(function (c) {
          return c.id === g.target.id ? Object.assign({}, c, { details: c.details.concat(ds), tags: mergeTags(c.tags, g.tags) }) : c;
        });
      } else {
        list.push({ id: nextId(), text: g.title, subtitle: "", icon: "none", color: "auto",
          tags: mergeTags(state.activeTags, g.tags), notes: "", details: ds });
      }
    });
    // Wie beim Import: alles wird uebernommen, auch ueber die Grenzen hinaus.
    state.cores = list;
    clearSearch();
    onCoresChanged();
  }
  function discardPasteDraft() {
    state.pasteDraft = null;
    renderCaptionOrQuickCreate();
  }
  function pastePanelHtml() {
    var plan = planOutline(state.pasteDraft.raw);
    var any = plan.newCores || plan.nDetails;
    var html = '<div class="ihb-quickcreate" data-role="paste-panel">';
    if (!any) {
      html += '<p class="ihb-capture-preview" data-role="capture-preview" data-kind="paste-empty">Nichts Neues – das gibt es alles schon.</p>';
    } else {
      var parts = [];
      if (plan.newCores) parts.push(plan.newCores + (plan.newCores === 1 ? " neue Kernidee" : " neue Kernideen"));
      if (plan.nDetails) parts.push(plan.nDetails + (plan.nDetails === 1 ? " Detail" : " Details"));
      html += '<p class="ihb-capture-preview" data-role="capture-preview" data-kind="paste"><kbd>Enter</kbd>' +
        escapeHtml(parts.join(" und ") + " anlegen?") + "</p>";
      if (plan.toExisting) {
        html += '<p class="ihb-note">' + plan.toExisting + (plan.toExisting === 1 ? " davon kommt" : " davon kommen") + " zu vorhandenen Kernideen.</p>";
      }
    }
    var warn = [];
    if (plan.coresAfter > MAX_CORES) warn.push("Danach " + plan.coresAfter + " Kernideen – mehr als die " + MAX_CORES + ", die sich hier anlegen lassen.");
    if (plan.overfull.length) warn.push("Mehr als " + MAX_DETAILS + " Details bei: " + plan.overfull.join(", ") + ".");
    if (warn.length && any) {
      html += '<p class="ihb-note ihb-capture-dup" data-role="paste-warn">' +
        escapeHtml(warn.join(" ") + " Alles wird übernommen, die Bubbles werden dafür kleiner.") + "</p>";
    }
    html += '<ul class="ihb-paste-tree">';
    plan.groups.slice(0, 12).forEach(function (g) {
      html += "<li><b>" + escapeHtml(g.target ? g.target.text : g.title) + "</b>" +
        '<span class="ihb-paste-badge">' + (g.target ? "vorhanden" : "neu") + "</span>";
      if (g.details.length) {
        html += "<ul>";
        g.details.slice(0, 6).forEach(function (d) {
          html += "<li>" + escapeHtml(d.text) +
            (d.status !== "offen" ? '<span class="ihb-paste-badge">' + (d.status === "erledigt" ? "erledigt" : "in Arbeit") + "</span>" : "") +
            "</li>";
        });
        if (g.details.length > 6) html += '<li class="ihb-paste-more">… und ' + (g.details.length - 6) + " weitere</li>";
        html += "</ul>";
      }
      html += "</li>";
    });
    if (plan.groups.length > 12) html += '<li class="ihb-paste-more">… und ' + (plan.groups.length - 12) + " weitere Kernideen</li>";
    html += "</ul>";
    html += '<div class="ihb-btnrow ihb-paste-actions">' +
      (any ? '<button type="button" class="ihb-btn primary" data-role="paste-apply">' + icon("plus", 14) + " Anlegen</button>" : "") +
      '<button type="button" class="ihb-btn" data-role="paste-cancel">Verwerfen</button></div>';
    html += "</div>";
    return html;
  }
  function deleteCore(id) {
    state.cores = state.cores.filter(function (c) { return c.id !== id; });
    if (state.editing && state.editing.id === id) state.editing = null;
    // A focus left pointing at a deleted idea makes the filter treat every
    // remaining idea as "not the focused one" and dims the whole map.
    if (state.focusedId === id) state.focusedId = null;
    if (state.selectedDetail && state.selectedDetail.coreId === id) state.selectedDetail = null;
    if (state.tagEditing === id) state.tagEditing = null;
    onCoresChanged();
  }
  function deleteDetail(coreId, id) {
    state.cores = state.cores.map(function (c) {
      return c.id === coreId ? Object.assign({}, c, { details: c.details.filter(function (d) { return d.id !== id; }) }) : c;
    });
    if (state.editing && state.editing.id === id) state.editing = null;
    if (state.selectedDetail && state.selectedDetail.detailId === id) state.selectedDetail = null;
    onCoresChanged();
  }
  function cycleDetailStatus(coreId, detailId) {
    state.cores = state.cores.map(function (c) {
      if (c.id !== coreId) return c;
      return Object.assign({}, c, { details: c.details.map(function (d) {
        return d.id === detailId ? Object.assign({}, d, { status: nextStatus(detailStatus(d)) }) : d;
      })});
    });
    onCoresChanged();
  }

  // ---------- inline edit ----------
  function enterEdit(kind, coreId, id, isNew) {
    var core = kind === "core"
      ? coreById(id)
      : coreById(coreId);
    if (!core) return;
    var text = kind === "core" ? core.text : (core.details.filter(function (d) { return d.id === id; })[0] || {}).text;
    // isNew: gerade angelegt (Geister-Bubble, Enter-Kette); chain: mit Enter beendet
    state.editing = { kind: kind, coreId: coreId, id: id, isNew: !!isNew, chain: false };
    state.draftText = text || "";
    var selector = kind === "core"
      ? '[data-role="core"][data-core-id="' + id + '"]'
      : '[data-role="detail"][data-detail-id="' + id + '"]';
    var bubbleEl = bubblesLayer.querySelector(selector);
    if (!bubbleEl) return;
    bubbleEl.innerHTML = '<input class="ihb-edit-input" value="' + escapeHtml(state.draftText) + '" />';
    var input = bubbleEl.querySelector("input");
    input.focus();
    input.select();
    input.addEventListener("input", function (e) { state.draftText = e.target.value; });
    input.addEventListener("blur", function () { commitEdit(); });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        if (state.editing) state.editing.chain = true;
        input.blur();
      }
      if (e.key === "Escape") {
        // nur die Eingabe abbrechen, nicht zusaetzlich den Fokus der Karte loesen
        e.stopPropagation();
        cancelEdit();
      }
    });
  }
  function commitEdit() {
    if (!state.editing) return;
    var kind = state.editing.kind, coreId = state.editing.coreId, id = state.editing.id;
    var chain = !!(state.editing.chain && state.editing.isNew);
    var value = (state.draftText || "").trim();
    if (kind === "core") {
      if (!value) state.cores = state.cores.filter(function (c) { return c.id !== id; });
      else state.cores = state.cores.map(function (c) { return c.id === id ? Object.assign({}, c, { text: value }) : c; });
    } else {
      state.cores = state.cores.map(function (c) {
        if (c.id !== coreId) return c;
        if (!value) return Object.assign({}, c, { details: c.details.filter(function (d) { return d.id !== id; }) });
        return Object.assign({}, c, { details: c.details.map(function (d) { return d.id === id ? Object.assign({}, d, { text: value }) : d; }) });
      });
    }
    state.editing = null;
    onCoresChanged();
    // Enter-Kette: Wer eine neue Idee mit Enter abschliesst, schreibt gleich die naechste.
    if (chain && value) continueChain(kind, coreId, id);
  }
  function continueChain(kind, coreId, id) {
    if (kind === "detail") {
      var core = coreById(coreId);
      if (core && core.details.length < MAX_DETAILS) addDetail(coreId);
      return;
    }
    // Neue Kernidee: fokussieren und das erste Detail erst nach der Drehung
    // oeffnen; die Drehung zeichnet am Ende neu.
    if (!coreById(id) || state.view !== "map") return;
    if (state.focusedId !== id) toggleFocus(id);
    afterRingSettles(function () {
      if (state.focusedId === id && !state.editing && state.view === "map") addDetail(id);
    });
  }
  function cancelEdit() {
    // Eine gerade angelegte Idee verschwindet wieder, statt als leere Blase
    // stehen zu bleiben.
    if (state.editing && state.editing.isNew) {
      state.editing.chain = false;
      state.draftText = "";
      commitEdit();
      return;
    }
    state.editing = null;
    renderStructure();
  }

  // ---------- editor that unfolds from the hub ----------
  // One panel for both kinds of idea, anchored to the hub so editing happens
  // where you are already looking, instead of in a dialogue that covers the map.
  function editorFieldsForCore(core) {
    var p = coreProgress(core);
    var html = '<p class="ihb-note">' +
      (p.total ? p.done + " von " + p.total + " Details erledigt" : "Noch keine Details angelegt.") + "</p>" +

      '<label class="ihb-fieldlabel" for="edTags">Tags</label>' +

  // Which way does the hub part? Sideways on a wide window, top/bottom on a
  // tall one — it opens into whichever direction has room.
  function panelHorizontal() {
    try {
      return window.innerWidth >= window.innerHeight;
    } catch (e) {
      return true;
    }
  }

  var hubOpen = false;

  // Lays out the two halves and the display between them. Closed, the halves
  // touch and the hub is an ordinary circle; open, they slide apart by exactly
  // the width of the display, so the outer silhouette stays intact.
  // How far the open display extends past the hub, across the split axis.
  function clampRange(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function displayOverhang(L) {
    var d = L.hub;
    var across = panelHorizontal()
      ? clampRange(Math.max(d * 1.55, 300), d, L.width * 0.80)
      : clampRange(Math.max(d * 1.8, 300), d, L.width * 0.90);
    return Math.max(0, across - d);
  }



  // How far the display may open. It used to take whatever the map would give,
  // which pushed it right over the inner bubbles: 4 of 48 details vanished under
  // it on a desktop, 2 of 6 on a phone. The panel now has to stay inside the
  // ring of ideas, which is a measurement, not a chosen number, so it adapts to
  // narrow screens on its own. Costs nothing either way — a narrower panel is a
  // taller one, and the description gains lines rather than losing them.
  // Deriving this from the ring radius was tried and measured worse: the room
  // that calculation hands back is larger than the panel should ever take, and
  // the bubbles went back under it. A flat pull-back is what the numbers
  // actually support — 0.6 clears every detail on a desktop and is the point
  // beyond which shrinking further stops helping.
  var DISPLAY_REACH = 0.6;

  function displayLimit(L, d, gap, over) {
    // Only where it earns its keep. On a wide map pulling the panel back clears
    // every bubble that used to sit under it. On a phone it clears none — the
    // capsule is wider than the ring at any size we could still read text in —
    // so the panel there keeps the width it needs, and the density limit stays
    // what it is.
    if (L.width < 600) return { gap: gap, over: over };
    return { gap: d + (gap - d) * DISPLAY_REACH, over: over * DISPLAY_REACH };
  }

  function layoutHub() {
    if (!hubEl) return;
    var L = layout;
    var d = L.hub;
    var horizontal = panelHorizontal();
    var gap = 0;
    if (hubOpen) {
      // Tying every dimension to the hub diameter made the display collapse on
      // narrow screens: the hub scales down with the map, so the panel shrank
      // to a sixth of its desktop area while the type stayed at fixed pixels.
      // The map's own width now sets a floor, which only binds on small screens.
      gap = horizontal
        ? clampRange(Math.max(240, d * 1.35), L.width * 0.32, L.width * 0.62)
        : clampRange(Math.max(190, d * 1.05), L.width * 0.34, L.width * 0.58);
    }
    // The display extends past the hub perpendicular to the split, so the
    // content gets real room; the two halves themselves never change size.
    var over = 0;
    if (hubOpen) {
      var across = horizontal
        ? clampRange(Math.max(d * 1.55, 300), d, L.width * 0.80)
        : clampRange(Math.max(d * 1.8, 300), d, L.width * 0.90);
      over = Math.max(0, across - d);
    }
    // The panel used to open as far as it could, which pushed it over the inner
    // details: 4 of 48 on a desktop, 2 of 6 on a phone disappeared underneath it.
    // Pulling it back turned out to cost nothing at all — measured, it gains
    // reading room, because a narrower panel is a taller one and the description
    // wraps into more lines. Desktop 4 lines -> 5, phone 5 lines -> 7, and no
    // detail hidden on either. The number is the largest that clears them.
    if (hubOpen) {
      var lim = displayLimit(L, d, gap, over);
      gap = Math.max(0, lim.gap);
      over = lim.over;
    }
    if (hubOpen && hubDisplayBody) {
      // Inhalt gleich in Endbreite setzen: so bricht waehrend der Bewegung nichts
      // um, die wachsende Flaeche gibt ihn nur frei. Dann die Glasflaeche nach
      // dem Inhalt bemessen - mindestens so hoch wie der Hub.
      var finalW = horizontal ? Math.max(0, gap) : d + over;
      var bodyW = Math.min(finalW, 480);
      // Type is scaled from the map, not left at fixed pixels: on a phone the
      // panel is far smaller, so unscaled text swamped it. The floor keeps
      // labels and inputs readable at the smallest sizes.
      hubDisplay.style.setProperty("--dsc", clampRange(L.s * 0.92, 0.9, 1).toFixed(3));
      hubDisplayBody.style.padding = Math.round(Math.max(10, finalW * 0.045)) + "px " +
        Math.round(Math.max(14, finalW * 0.055)) + "px";
      hubDisplayBody.style.maxWidth = "480px";
      hubDisplayBody.style.width = bodyW + "px";
      hubDisplayBody.style.marginLeft = (-bodyW / 2) + "px";
      hubDisplayBody.style.height = "auto";
      var need = hubDisplayBody.offsetHeight;   // 0, wo nichts gemessen werden kann
      hubDisplayBody.style.height = "";
      if (need > 0) {
        if (horizontal) over = Math.max(0, Math.min(over, need - d));
        else gap = Math.max(Math.min(gap, d), Math.min(gap, need));
      }
    }
    var w = horizontal ? d + gap : d + over;
    var h = horizontal ? d + over : d + gap;

    // The sphere sits centred in the glass; the focused idea's park distance
    // accounts for the overhang instead (see coreOrbit), so nothing overlaps.
    var ox = horizontal ? 0 : over / 2;
    var oy = horizontal ? over / 2 : 0;
    hubEl.style.width = w + "px";
    hubEl.style.height = h + "px";
    hubEl.style.marginLeft = (-(horizontal ? w / 2 : ox + d / 2)) + "px";
    hubEl.style.marginTop = (-(horizontal ? oy + d / 2 : h / 2)) + "px";

    var half = d / 2;
    // each half keeps the full circle as its background, just offset, so the
    // two of them read as one sphere when they meet again
    [capA, capB].forEach(function (cap) {
      if (!cap) return;
      cap.style.backgroundSize = d + "px " + d + "px";
    });
    if (horizontal) {
      capA.style.cssText += ";left:0;top:" + oy + "px;width:" + half + "px;height:" + d + "px;" +
        "border-radius:" + half + "px 0 0 " + half + "px;background-position:left center;";
      capB.style.cssText += ";left:" + (w - half) + "px;top:" + oy + "px;width:" + half + "px;height:" + d + "px;" +
        "border-radius:0 " + half + "px " + half + "px 0;background-position:right center;";
      hubDisplay.style.cssText += ";left:" + half + "px;top:0;width:" + Math.max(0, gap) + "px;height:" + h + "px;";
    } else {
      capA.style.cssText += ";left:" + ox + "px;top:0;width:" + d + "px;height:" + half + "px;" +
        "border-radius:" + half + "px " + half + "px 0 0;background-position:center top;";
      capB.style.cssText += ";left:" + ox + "px;top:" + (h - half) + "px;width:" + d + "px;height:" + half + "px;" +
        "border-radius:0 0 " + half + "px " + half + "px;background-position:center bottom;";
      hubDisplay.style.cssText += ";left:0;top:" + half + "px;width:" + w + "px;height:" + Math.max(0, gap) + "px;";
    }
    hubDisplay.style.borderRadius = Math.round(Math.min(22, d * 0.1)) + "px";

    if (hubFace) {
      hubFace.style.width = d + "px";
      hubFace.style.marginLeft = (-d / 2) + "px";
      hubFace.style.marginTop = (-d / 2) + "px";
      hubFace.style.height = d + "px";
      // Mitte der Kapsel, in Prozent: folgt ihr auch waehrend sie waechst oder
      // schrumpft (mit Pixeln sprang der Titel sofort auf das Endmass)
      hubFace.style.left = "50%";
      hubFace.style.top = "50%";
      hubFace.style.position = "absolute";
      hubFace.style.padding = "0 " + (d * 0.085) + "px";
    }
    // Schliessend bleibt der Inhalt in seiner Breite stehen und wird von der
    // schrumpfenden Flaeche verdeckt, statt sich zusammenzuquetschen.
  }

  function positionHubEditor() { layoutHub(); }

  // Opens the hub around some content. The search moves inside so it stays
  // reachable while the hub is parted.
  // In tree view the right pane is the editor's home; on the map it is the
  // opened hub. Same editor, same commit path — only the container differs.
  function editorHost() {
    if (state.view === "tree" && treeDetail) return treeDetail;
    return dialogSheetOpen() ? dialogCard : hubDisplayBody;   // am Handy: das Blatt
  }

  function openHubDisplay(html) {
    var node = typeof html === "string" ? null : html;   // der Eingang kommt als Knoten
    if (state.view === "tree" && treeDetail) { if (!node) treeDetail.innerHTML = html; return; }
    // ein Dialog (Einsortieren, Kompost, Editor) geht am Handy ins Blatt; die
    // Beschreibung im Fokus bleibt im Hub, die passt hinein
    var dialogNow = !!(state.tagEditing || detailEditing || sortSession || compostSession);
    if (!node && dialogNow && dialogSheetWanted()) { openDialogSheet(html); return; }
    closeDialogSheet();
    clearTimeout(hubCloseTimer);
    var swap = hubOpen || hubClosing;   // das Hub ist (noch) offen: nur der Inhalt wechselt
    hubClosing = false;
    if (node !== inboxCardEl) handOverInbox();   // was sonst ins Hub kommt, loest den Eingang ab
    if (node) {
      if (node.parentNode !== hubDisplayBody || hubDisplayBody.childNodes.length !== 1) {
        hubDisplayBody.innerHTML = "";
        hubDisplayBody.appendChild(node);
      } else swap = false;
    } else {
      homeInboxCard();
      hubDisplayBody.innerHTML = html;
    }
    if (swap) fadeIn(hubDisplayBody);
    refreshRoom();
    var host = hubDisplayBody.querySelector(".ihb-search-host");
    if (host && searchWrap) host.appendChild(searchWrap);
    hubOpen = true;
    hubEl.classList.add("open");
    layoutHub();
    // was danach noch in die Flaeche gezeichnet wird (Symbole, Vorschlaege),
    // zaehlt fuer die Hoehe mit
    requestAnimationFrame(function () { if (hubOpen) layoutHub(); });
  }

  // Switching to another idea closes the display first and reopens it with the
  // new content, instead of swapping the text inside the open panel.
  var displaySwapTimer = null;
  var selectDetailSwapping = false;
  function swapDisplay(fn) {
    if (!hubOpen) { fn(); return; }
    clearTimeout(displaySwapTimer);
    closeHubDisplay();
    displaySwapTimer = setTimeout(fn, Math.round(560 * speedFactor()));
  }

  var hubCloseTimer = null;
  function closeHubDisplay() {
    closeDialogSheet();
    // Repeated calls while already closed must not restart the clearing timer,
    // or the content would linger for another full close cycle each time.
    var wasOpen = hubOpen;
    if (!wasOpen && !hubCloseTimer) return;
    if (!wasOpen) return;
    clearTimeout(hubCloseTimer);
    if (searchWrap && hubFace && searchWrap.parentNode !== hubFace) {
      hubFace.insertBefore(searchWrap, hubFace.querySelector(".ihb-hub-count"));
    }
    hubOpen = false;
    hubClosing = true;
    hubEl.classList.remove("open");
    layoutHub();
    refreshRoom();
    // Keep the content in place while the halves close, so it shrinks away with
    // them. Clearing it straight away made it blink out mid-movement.
    var ms = Math.round(900 * speedFactor());
    hubCloseTimer = setTimeout(function () {
      hubClosing = false;
      if (!hubOpen) { homeInboxCard(); hubDisplayBody.innerHTML = ""; }   // die Karte des Eingangs geht nach Hause
    }, ms);
  }
  var hubClosing = false;

  function openTagEditor(coreId) {
    var core = coreById(coreId);
    if (!core) return;
    sortSession = null;   // ein Editor beendet das Einsortieren
    compostSession = null;
    state.tagEditing = coreId;
    detailEditing = null;
    draftIcon = core.icon || "none";
    draftColor = colorChoiceByKey(core.color) ? core.color : "auto";
    openHubDisplay(
      '<div class="ihb-display-head"><span>Kernidee: ' + escapeHtml(core.text || "Ohne Titel") + "</span>" +
      '<button type="button" data-role="display-close" aria-label="Schließen">&#10005;</button></div>' +
      editorFieldsForCore(core) +
      '<div class="ihb-btnrow"><button type="button" class="ihb-btn primary" data-role="editor-save">Speichern</button></div>');
    renderIconPicker();
    renderColorPicker();
    renderTagSuggestions();
    var f = document.getElementById("edSubtitle");
    if (f) { f.focus(); f.select(); }
  }

  function openDetailEditor(coreId, detailId) {
    var core = coreById(coreId);
    if (!core) return;
    sortSession = null;
    compostSession = null;
    var d = null;
    core.details.forEach(function (x) { if (x.id === detailId) d = x; });
    if (!d) return;
    state.tagEditing = null;
    detailEditing = { coreId: coreId, detailId: detailId };
    detailDraftStatus = detailStatus(d);
    draftColor = colorChoiceByKey(d.color) ? d.color : "auto";
    openHubDisplay(
      '<div class="ihb-display-head"><span>Detailidee</span>' +
      '<button type="button" data-role="display-close" aria-label="Schließen">&#10005;</button></div>' +
      editorFieldsForDetail(d) +
      '<div class="ihb-btnrow"><button type="button" class="ihb-btn primary" data-role="editor-save">Speichern</button></div>');
    renderDetailStatusRow();
    renderColorPicker();
    renderTagSuggestions();
    var t = document.getElementById("edTitle");
    if (t) { t.focus(); t.select(); }
  }

  function closeHubEditor() {
    state.tagEditing = null;
    detailEditing = null;
    if (state.view === "tree") { renderTree(); return; }
    updateHubCount();   // the reading view takes over again, or the hub closes
  }

  function val(id) {
    var host = editorHost();
    var el = (host && host.querySelector("#" + id)) || document.getElementById(id);
    return el ? el.value : "";
  }


  function commitHubEditor() {
    var tags = val("edTags").split(",").map(function (t) { return t.trim(); }).filter(Boolean);
    var notes = val("edNotes");
    if (detailEditing) {
      var coreId = detailEditing.coreId, detailId = detailEditing.detailId;
      var text = val("edTitle").trim();
      state.cores = state.cores.map(function (c) {
        if (c.id !== coreId) return c;
        if (!text) {
          return Object.assign({}, c, { details: c.details.filter(function (d) { return d.id !== detailId; }) });
        }
        return Object.assign({}, c, {
          details: c.details.map(function (d) {
            return d.id === detailId
              ? Object.assign({}, d, { text: text, notes: notes, tags: tags, color: draftColor, status: detailDraftStatus })
              : d;
          })
        });
      });
      closeHubEditor();
      onCoresChanged();
      return;
    }
    if (state.tagEditing) {
      var editingId = state.tagEditing;
      var subtitle = val("edSubtitle").trim();
      state.cores = state.cores.map(function (c) {
        return c.id === editingId
          ? Object.assign({}, c, { tags: tags, notes: notes, subtitle: subtitle, icon: draftIcon, color: draftColor })
          : c;
      });
      closeHubEditor();
      onCoresChanged();
    }
  }

  // ---------- settings modal ----------
  function openSettings() {
    var was = settingsModal.classList.contains("open");
    settingsModal.classList.remove("closing");
    settingsModal.classList.add("open");
    renderSettingsModal();
    if (!was) softCard(settingsModal, true);
  }
  function closeSettings() {
    if (!settingsModal.classList.contains("open")) return;
    settingsModal.classList.remove("open");
    settingsModal.classList.add("closing");
    softCard(settingsModal, false, function () {
      if (!settingsModal.classList.contains("open")) settingsModal.classList.remove("closing");
    });
  }
  function renderSettingsModal() {
    var folderSectionHtml;
    if (folderSupported) {
      if (state.dirHandle) {
        folderSectionHtml =
          '<p class="ihb-note">Verbunden mit <b>' + escapeHtml(state.folderName) + '</b> · ' +
          state.cores.length + ' Kernidee' + (state.cores.length === 1 ? "" : "n") +
          '. Jede Änderung wird sofort als .md-Datei dorthin geschrieben, und der Ordner wird beim nächsten Start wieder verwendet.</p>' +

  // ---------- drag & drop ----------
  // Cores are reordered on the ring, details are re-homed to another core.
  // Both changes go back through the normal layout engine, so the overlap-free
  // guarantee still holds; free x/y placement would have thrown that away.
  var drag = null;
  var DRAG_THRESHOLD = 6;
  var justDragged = false;

  function pointerXY(e) {
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }


  // ---------- pan & zoom ----------
  // A view transform layered on top of everything else: it never touches the
  // percentage-based layout, ring math, or collision checks, only how the
  // result is rendered. That keeps it safe to add this late without
  // reworking geometry that took a long time to get right.
  var camera = { zoom: 1, panX: 0, panY: 0 };
  var MIN_ZOOM = 1, MAX_ZOOM = 4;

  function clampCamera() {
    camera.zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, camera.zoom));
    if (camera.zoom <= 1.001) { camera.panX = 0; camera.panY = 0; return; }
    // A fixed pixel budget would not scale with zoom, and undershoots badly:
    // reaching a bubble on the outer ring (roughly 300 base units out) needs
    // about 240px of pan at 2x zoom and 840px at 4x — far past any reasonable
    // constant cap. The reachable range has to grow with zoom, or the very
    // thing zooming in is meant to let you inspect becomes unreachable.
    // "Reachable" for the hub does not depend on this clamp alone, either: the
    // zoom controls sit outside the transformed layers and stay on screen and
    // clickable at all times, so resetting the view is always one tap away.
    var W = layout.width || REF;
    var maxPan = (camera.zoom - 1) * (W / 2);
    var mag = Math.hypot(camera.panX, camera.panY);
    if (mag > maxPan && mag > 0) {
      var k = maxPan / mag;
      camera.panX *= k;
      camera.panY *= k;
    }
  }

  function applyCamera(animate) {
    if (!cameraLayer || !hubAnchor) return;
    var tx = camera.panX, ty = camera.panY;
    if (cameraLayer) cameraLayer.classList.toggle("ihb-cam-anim", !!animate);
    if (hubAnchor) hubAnchor.classList.toggle("ihb-cam-anim", !!animate);
    cameraLayer.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + camera.zoom + ")";
    hubAnchor.style.transform = "translate(" + tx + "px," + ty + "px)";
    if (starsLayer) starsLayer.style.transform = "translate(" + (tx * 0.25) + "px," + (ty * 0.25) + "px)";
    if (mapEl) mapEl.classList.toggle("ihb-zoomed", camera.zoom > 1.001);
    updateZoomControls();
  }

  function setCamera(zoom, panX, panY, animate) {
    camera.zoom = zoom; camera.panX = panX; camera.panY = panY;
    clampCamera();
    applyCamera(animate);
  }

  function resetCamera(animate) {
    setCamera(1, 0, 0, animate !== false);
  }

  // Undo the camera transform: turns a point in screen pixels relative to the
  // map container back into the same 0..layout.width space that --x/--y
  // percentages use, so drag & drop keeps working correctly while zoomed in.
  function toMapSpace(sx, sy) {
    var W = layout.width || REF;
    var c = W / 2;
    if (camera.zoom <= 1.001 && !camera.panX && !camera.panY) return { x: sx, y: sy };
    return {
      x: c + (sx - c - camera.panX) / camera.zoom,
      y: c + (sy - c - camera.panY) / camera.zoom
    };
  }

  // Zoom while keeping one screen point (the cursor, or a pinch midpoint)
  // visually still, which is what makes zooming feel anchored rather than
  // the map sliding out from under the gesture.
  function zoomAt(sx, sy, factor, animate) {
    var newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, camera.zoom * factor));
    var W = layout.width || REF;
    var c = W / 2;
    var mapPt = toMapSpace(sx, sy);
    var panX = sx - c - (mapPt.x - c) * newZoom;
    var panY = sy - c - (mapPt.y - c) * newZoom;
    setCamera(newZoom, panX, panY, animate);
  }

  function zoomStep(factor) {
    var W = layout.width || REF;
    zoomAt(W / 2, W / 2, factor, true);
  }

  function updateZoomControls() {
    if (!zoomCtl) return;
    var outBtn = zoomCtl.querySelector('[data-role="zoom-out"]');
    var inBtn = zoomCtl.querySelector('[data-role="zoom-in"]');
    if (outBtn) outBtn.disabled = camera.zoom <= MIN_ZOOM + 0.001;
    if (inBtn) inBtn.disabled = camera.zoom >= MAX_ZOOM - 0.001;
  }

  function isBackgroundTarget(t) {
    return !!t && (!t.closest || (!t.closest(".ihb-bubble") && !t.closest("#hub") && !t.closest("#hubDisplay") &&
      !t.closest(".ihb-inboxdots")));   // Punkte des Eingangs verschieben und zoomen die Karte nicht
  }

  var panState = null;
  var pinchState = null;
  var justPanned = false;

  function pinchDist(e) {
    var a = e.touches[0], b = e.touches[1];
    return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  }
  function pinchMid(e) {
    var rect = mapEl.getBoundingClientRect();
    var a = e.touches[0], b = e.touches[1];
    return { x: (a.clientX + b.clientX) / 2 - rect.left, y: (a.clientY + b.clientY) / 2 - rect.top };
  }

  function onMapWheel(e) {
    // Inside the open display the wheel belongs to its own scrollbar; grabbing
    // it there would zoom the map instead of scrolling the content.
    if (e.target && e.target.closest && e.target.closest("#hubDisplay")) return;
    // Elsewhere the map has nothing to scroll, so a plain wheel zooms; this
    // also covers trackpad pinch, which browsers report as a wheel event.
    if (e.cancelable) e.preventDefault();
    var rect = mapEl.getBoundingClientRect();
    var sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    var factor = Math.pow(1.0016, -e.deltaY);
    zoomAt(sx, sy, factor, false);

  function onMapPointerDown(e) {

      pinchState = { startDist: pinchDist(e), startZoom: camera.zoom, mid: pinchMid(e) };
      return;
    }
    if (camera.zoom <= 1.001) return;              // nothing to pan at rest
    if (!isBackgroundTarget(e.target)) return;      // let bubble drag / hub taps through
    var p = pointerXY(e);
    panState = { startX: p.x, startY: p.y, startPanX: camera.panX, startPanY: camera.panY, moved: false };
  }

  function onMapPointerMove(e) {
    if (pinchState) {
      if (!e.touches || e.touches.length < 2) return;
      if (e.cancelable) e.preventDefault();
      var dist = pinchDist(e);
      var factor = dist / (pinchState.startDist || 1);
      var mid = pinchState.mid;
      zoomAt(mid.x, mid.y, (pinchState.startZoom * factor) / camera.zoom, false);
      return;
    }
    if (!panState) return;
    var p = pointerXY(e);
    var dx = p.x - panState.startX, dy = p.y - panState.startY;
    if (!panState.moved && Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
    panState.moved = true;
    if (mapEl) mapEl.classList.add("ihb-panning");
    if (e.cancelable) e.preventDefault();
    setCamera(camera.zoom, panState.startPanX + dx, panState.startPanY + dy, false);
  }

  function onMapPointerUp() {
    if (pinchState) { pinchState = null; return; }
    if (!panState) return;
    if (panState.moved) justPanned = true;
    panState = null;
    if (mapEl) mapEl.classList.remove("ihb-panning");
  }

  function onMapDblClick(e) {
    if (!isBackgroundTarget(e.target)) return;
    var rect = mapEl.getBoundingClientRect();
    var sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    if (camera.zoom > 1.5) resetCamera(true);
    else zoomAt(sx, sy, 1.8, true);
  }

    mapEl.addEventListener("wheel", onMapWheel, { passive: false });
    mapEl.addEventListener("mousedown", onMapPointerDown);
    mapEl.addEventListener("touchstart", onMapPointerDown, { passive: true });
    mapEl.addEventListener("dblclick", onMapDblClick);
  }
  document.addEventListener("mousemove", onMapPointerMove);
  document.addEventListener("touchmove", onMapPointerMove, { passive: false });
  document.addEventListener("mouseup", onMapPointerUp);
  document.addEventListener("touchend", onMapPointerUp);

  if (zoomCtl) {
    zoomCtl.addEventListener("click", function (e) {

        'aria-label="' + (expanded ? "Zuklappen" : "Aufklappen") + '" tabindex="-1">' +

        '<span class="ihb-tree-dot" style="background:' + paletteFor(core, ci).core + '"></span>' +
        '<span class="ihb-tree-label">' + escapeHtml(core.text || "Ohne Titel") + "</span>" +
        (pr.total ? '<span class="ihb-tree-meta">' + pr.done + "/" + pr.total + "</span>" : "") +
        treeRowActions(core.id, null) +
        "</div>";
      if (expanded) {
        core.details.forEach(function (d) {
          var dActive = !f.details || f.details.get(d.id) !== false;   // it is a Map, not an object
          var dSel = treeSelection() === "d:" + d.id;
          var st = detailStatus(d);
          var mark = st === "erledigt" ? "✓" : st === "in-arbeit" ? "◐" : "○";
          var stLbl = { offen: "Offen", "in-arbeit": "In Arbeit", erledigt: "Erledigt" }[st];
          html += '<div class="ihb-tree-row is-detail' + (dActive ? "" : " is-dimmed") + '" role="treeitem" ' +
            'aria-selected="' + dSel + '" tabindex="0" data-role="tree-detail" ' +
            'data-core-id="' + core.id + '" data-detail-id="' + d.id + '">' +
            '<button type="button" class="ihb-tree-status" data-role="tree-status" ' +
            'data-core-id="' + core.id + '" data-detail-id="' + d.id + '" tabindex="-1" ' +
            'title="' + stLbl + ' — klicken zum Weiterschalten" aria-label="Status: ' + stLbl + '">' + mark + "</button>" +
            '<span class="ihb-tree-label">' + escapeHtml(d.text || "Ohne Titel") + "</span>" +
            treeRowActions(core.id, d.id) +
            "</div>";
        });
      }
    });
    if (state.cores.length && state.cores.length < MAX_CORES) {
      html += '<button type="button" class="ihb-tree-newrow" data-role="tree-newcore">' +
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
        " Neue Kernidee</button>";
    }
    if (!state.cores.length) {
      html = '<button type="button" class="ihb-tree-newrow" data-role="tree-newcore">' +
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
        " Erste Kernidee anlegen</button>";
    } else if (!anyVisible) {
      html = '<div class="ihb-tree-empty">Kein Treffer für die aktuelle Suche.</div>';
    }
    treePane.innerHTML = html;
    if (treeCount) {
      var shown = 0, hidden = 0;
      state.cores.forEach(function (c2) {
        var ff = filters.perCore.get(c2.id);
        if (!ff || ff.coreActive) shown += 1; else hidden += 1;
      });
      treeCount.textContent = hidden
        ? shown + " von " + state.cores.length + " Kernideen"
        : state.cores.length + " Kernideen · " + state.cores.reduce(function (n, c3) { return n + c3.details.length; }, 0) + " Details";
      if (storageWarning()) treeCount.insertAdjacentHTML("beforeend", storageWarnHtml("ihb-tree-warn"));
      treeCount.insertAdjacentHTML("beforeend", compostNoteHtml("ihb-tree-hint"));
      if (treeHint) treeCount.insertAdjacentHTML("beforeend", '<p class="ihb-tree-hint ihb-caption-warn" data-role="tree-hint">' + escapeHtml(treeHint) + "</p>");
    }
    renderTreeDetail();
    if (treeEdit) mountTreeEditor();
  }

  function renderTreeDetail() {
    if (!treeDetail) return;
    if (sortSession) { renderSortDialog(); return; }
    if (compostSession) { renderCompostDialog(); return; }
    var sel = selectedDetailObj();
    var core = state.focusedId !== null ? coreById(state.focusedId) : null;
    var title, kind, notes, tags, subtitle = "";
    if (sel) {
      var stLabels = { offen: "Offen", "in-arbeit": "In Arbeit", erledigt: "Erledigt" };
      kind = "Detailidee · " + stLabels[detailStatus(sel.detail)];
      title = sel.detail.text; notes = (sel.detail.notes || "").trim(); tags = sel.detail.tags || [];
    } else if (core) {
      kind = "Kernidee"; title = core.text; notes = (core.notes || "").trim();
      tags = core.tags || []; subtitle = core.subtitle || "";
    } else {
      treeDetail.innerHTML = '<div class="ihb-tree-empty">Wähle links eine Idee, um sie hier zu lesen.</div>';
      return;
    }
    var editTarget = sel
      ? 'data-role="tree-edit" data-core-id="' + sel.core.id + '" data-detail-id="' + sel.detail.id + '"'
      : 'data-role="tree-edit" data-core-id="' + core.id + '"';
    treeDetail.innerHTML =
      '<div class="ihb-display-head"><span>' + escapeHtml(kind) + "</span>" +
      '<button type="button" class="ihb-btn" ' + editTarget + '>Bearbeiten</button></div>' +
      '<div class="ihb-info-title">' + escapeHtml(title || "Ohne Titel") + "</div>" +
      (subtitle ? '<div class="ihb-info-sub">' + escapeHtml(subtitle) + "</div>" : "") +
      (notes ? '<div class="ihb-info-notes">' + escapeHtml(notes) + "</div>"
             : '<div class="ihb-info-notes ihb-info-empty">Noch keine Beschreibung</div>') +
      (tags.length ? '<div class="ihb-tree-tags">' + tags.map(function (t) {
        return '<span class="ihb-tree-tag">' + escapeHtml(t) + "</span>";
      }).join("") + "</div>" : "") +
      treeFileHtml(sel ? sel.core : core);
  }

  // ---------- outliner: editing straight in the tree ----------
  // Enter legt darunter eine neue Zeile gleicher Ebene an, Tab rueckt ein
  // (Kernidee -> letztes Detail der Kernidee darueber), Shift+Tab rueckt aus
  // (Detail -> eigene Kernidee direkt nach der bisherigen).
  var treeEdit = null;       // { kind, coreId, id, isNew, draft }
  var treeEditMount = 0;     // zaehlt Neuaufbauten des Feldes
  var treeHint = "";
  var lastRowClick = { key: null, t: 0 };
  function detailOf(coreId, detailId) {
    var c = coreById(coreId);
    return c ? (c.details.filter(function (d) { return d.id === detailId; })[0] || null) : null;
  }
  function startTreeEdit(kind, coreId, id, isNew) {
    var item = kind === "core" ? coreById(id) : detailOf(coreId, id);
    if (!item) return;
    treeEdit = { kind: kind, coreId: kind === "core" ? id : coreId, id: id, isNew: !!isNew, draft: item.text || "" };
    treeHint = "";
    if (kind === "detail") treeExpanded[coreId] = true;
    renderTree();
  }
  // Der Baum wird oft komplett neu gezeichnet; danach baut das hier das Feld
  // samt Entwurf wieder auf, statt die Eingabe zu verlieren.
  function mountTreeEditor() {
    if (!treeEdit || !treePane || state.view !== "tree") return;
    var sel = treeEdit.kind === "core"
      ? '[data-role="tree-core"][data-core-id="' + treeEdit.id + '"]'
      : '[data-role="tree-detail"][data-detail-id="' + treeEdit.id + '"]';
    var row = treePane.querySelector(sel);
    var label = row && row.querySelector(".ihb-tree-label");
    if (!label) return;
    var token = ++treeEditMount;
    label.innerHTML = '<input class="ihb-tree-input" aria-label="Titel" value="' + escapeHtml(treeEdit.draft) + '" />';
    var input = label.querySelector("input");
    input.focus();
    var end = input.value.length;
    try { input.setSelectionRange(end, end); } catch (err) { /* aeltere Browser */ }
    input.addEventListener("input", function () { if (treeEdit) treeEdit.draft = input.value; });
    input.addEventListener("keydown", onTreeEditKey);
    input.addEventListener("blur", function () {
      // nur ein echtes Verlassen uebernimmt, kein Neuaufbau
      setTimeout(function () {
        if (treeEdit && token === treeEditMount && document.activeElement !== input) commitTreeEdit(false);
      }, 0);
    });
  }
  function onTreeEditKey(e) {
    e.stopPropagation();   // Baum-Navigation, Tastenkuerzel und Escape der Karte bleiben aussen vor
    if (!treeEdit) return;
    if (e.key === "Enter") { e.preventDefault(); commitTreeEdit(true); }
    else if (e.key === "Escape") { e.preventDefault(); cancelTreeEdit(); }
    else if (e.key === "Tab") { e.preventDefault(); if (e.shiftKey) outdentTreeEdit(); else indentTreeEdit(); }
    else if (e.key === "Backspace" && e.target.value === "") { e.preventDefault(); removeEmptyTreeRow(); }
  }
  function setItemText(kind, coreId, id, value) {
    state.cores = state.cores.map(function (c) {
      if (kind === "core") return c.id === id ? Object.assign({}, c, { text: value }) : c;
      if (c.id !== coreId) return c;
      return Object.assign({}, c, { details: c.details.map(function (d) { return d.id === id ? Object.assign({}, d, { text: value }) : d; }) });
    });
  }
  function removeItem(kind, coreId, id) {
    if (kind === "core") {
      state.cores = state.cores.filter(function (c) { return c.id !== id; });
      if (state.focusedId === id) { state.focusedId = null; state.selectedDetail = null; }
      return;
    }
    state.cores = state.cores.map(function (c) {
      return c.id === coreId ? Object.assign({}, c, { details: c.details.filter(function (d) { return d.id !== id; }) }) : c;
    });
    if (state.selectedDetail && state.selectedDetail.detailId === id) state.selectedDetail = null;
  }
  function insertCoreAfter(afterId, core) {
    if (state.cores.length >= MAX_CORES) return null;
    var fresh = core || { id: nextId(), text: "", subtitle: "", icon: "none", color: "auto", tags: state.activeTags.slice(), notes: "", details: [] };
    var idx = -1;
    state.cores.forEach(function (c, i) { if (c.id === afterId) idx = i; });
    var list = state.cores.slice();
    list.splice(idx === -1 ? list.length : idx + 1, 0, fresh);
    state.cores = list;
    return fresh.id;
  }
  function insertDetailAfter(coreId, afterId, detail) {
    var core = coreById(coreId);
    if (!core) return null;
    var d = detail || { id: nextId(), text: "", status: "offen", notes: "", tags: [], color: "auto" };
    var idx = -1;
    core.details.forEach(function (x, i) { if (x.id === afterId) idx = i; });
    var ds = core.details.slice();
    ds.splice(idx === -1 ? ds.length : idx + 1, 0, d);
    state.cores = state.cores.map(function (c) { return c.id === coreId ? Object.assign({}, c, { details: ds }) : c; });
    return d.id;
  }
  function commitTreeEdit(next) {
    var t = treeEdit;
    if (!t) return;
    treeEdit = null;
    treeHint = "";
    var value = (t.draft || "").trim();
    if (!value) {
      var keep = t.kind === "core" && !t.isNew && (coreById(t.id) || { details: [] }).details.length;
      // leer = loeschen wie auf der Karte; eine Kernidee mit Details bleibt aber stehen
      if (!keep) removeItem(t.kind, t.coreId, t.id);
      onCoresChanged();
      return;
    }
    setItemText(t.kind, t.coreId, t.id, value);
    if (next) {
      var newId = null;
      if (t.kind === "core") newId = insertCoreAfter(t.id);
      else if ((coreById(t.coreId) || { details: [] }).details.length < MAX_DETAILS) newId = insertDetailAfter(t.coreId, t.id);
      if (newId) treeEdit = { kind: t.kind, coreId: t.kind === "core" ? newId : t.coreId, id: newId, isNew: true, draft: "" };
      else treeHint = t.kind === "core"
        ? "Die Karte ist mit " + MAX_CORES + " Kernideen voll."
        : "„" + coreById(t.coreId).text + "“ hat schon " + MAX_DETAILS + " Details.";
    }
    onCoresChanged();   // zeichnet den Baum und baut das naechste Feld auf
  }
  function cancelTreeEdit() {
    var t = treeEdit;
    treeEdit = null;
    treeHint = "";
    if (t && t.isNew) { removeItem(t.kind, t.coreId, t.id); onCoresChanged(); return; }
    renderTree();
  }
  function flashTreeHint(msg) {
    treeHint = msg;
    renderTree();
  }
  function indentTreeEdit() {
    var t = treeEdit;
    if (!t || t.kind !== "core") return;   // Details haben keine tiefere Ebene
    var idx = -1;
    state.cores.forEach(function (c, i) { if (c.id === t.id) idx = i; });
    var core = state.cores[idx], prev = state.cores[idx - 1];
    if (!core) return;
    if (!prev) { flashTreeHint("Die oberste Kernidee kann nicht eingerückt werden."); return; }
    if (core.details.length) { flashTreeHint("„" + (t.draft || core.text) + "“ hat eigene Details und bleibt deshalb Kernidee."); return; }
    if (prev.details.length >= MAX_DETAILS) { flashTreeHint("„" + prev.text + "“ hat schon " + MAX_DETAILS + " Details."); return; }
    var d = { id: core.id, text: core.text, status: "offen", notes: core.notes || "", tags: (core.tags || []).slice(), color: core.color || "auto" };
    removeItem("core", null, core.id);
    insertDetailAfter(prev.id, null, d);
    treeEdit = { kind: "detail", coreId: prev.id, id: d.id, isNew: t.isNew, draft: t.draft };
    treeExpanded[prev.id] = true;
    treeHint = "";
    onCoresChanged();
  }
  function outdentTreeEdit() {
    var t = treeEdit;
    if (!t || t.kind !== "detail") return;
    if (state.cores.length >= MAX_CORES) { flashTreeHint("Die Karte ist mit " + MAX_CORES + " Kernideen voll."); return; }
    var d = detailOf(t.coreId, t.id);
    if (!d) return;
    removeItem("detail", t.coreId, t.id);
    insertCoreAfter(t.coreId, { id: d.id, text: d.text, subtitle: "", icon: "none", color: d.color || "auto",
      tags: (d.tags || []).slice(), notes: d.notes || "", details: [] });
    treeEdit = { kind: "core", coreId: d.id, id: d.id, isNew: t.isNew, draft: t.draft };
    treeHint = "";
    onCoresChanged();
  }
  function removeEmptyTreeRow() {
    var t = treeEdit;
    if (!t) return;
    if (t.kind === "core" && (coreById(t.id) || { details: [] }).details.length) return;   // nicht mitsamt Details
    var rows = Array.prototype.slice.call(treePane.querySelectorAll('[data-role="tree-core"], [data-role="tree-detail"]'));
    var cur = treePane.querySelector(t.kind === "core"
      ? '[data-role="tree-core"][data-core-id="' + t.id + '"]'
      : '[data-role="tree-detail"][data-detail-id="' + t.id + '"]');
    var prevRow = rows[rows.indexOf(cur) - 1];
    treeEdit = null;
    treeHint = "";
    removeItem(t.kind, t.coreId, t.id);
    if (prevRow) {
      var pk = prevRow.getAttribute("data-role") === "tree-core" ? "core" : "detail";
      var pc = prevRow.getAttribute("data-core-id"), pd = prevRow.getAttribute("data-detail-id");
      var item = pk === "core" ? coreById(pc) : detailOf(pc, pd);
      if (item) treeEdit = { kind: pk, coreId: pc, id: pk === "core" ? pc : pd, isNew: false, draft: item.text || "" };
    }
    onCoresChanged();
  }
  function treeNewCore() {
    var last = state.cores.length ? state.cores[state.cores.length - 1].id : null;
    var id = insertCoreAfter(last);
    if (!id) return;
    treeEdit = { kind: "core", coreId: id, id: id, isNew: true, draft: "" };
    treeHint = "";
    onCoresChanged();
  }
  function treeNewDetail(coreId) {
    var core = coreById(coreId);
    if (!core || core.details.length >= MAX_DETAILS) return;
    var last = core.details.length ? core.details[core.details.length - 1].id : null;
    var id = insertDetailAfter(coreId, last);
    treeExpanded[coreId] = true;
    treeEdit = { kind: "detail", coreId: coreId, id: id, isNew: true, draft: "" };
    treeHint = "";
    onCoresChanged();
  }

  function treeSelectCore(id) {
    state.selectedDetail = null;
    state.focusedId = state.focusedId === id ? null : id;
    if (state.focusedId !== null) treeExpanded[state.focusedId] = true;
    renderTree();
  }

  function treeSelectDetail(coreId, detailId) {
    var cur = state.selectedDetail;
    var same = cur && cur.coreId === coreId && cur.detailId === detailId;
    state.focusedId = coreId;
    state.selectedDetail = same ? null : { coreId: coreId, detailId: detailId };
    renderTree();
  }

  if (treePane) {
    treePane.addEventListener("click", function (e) {
      if (e.target.tagName === "INPUT") return;   // Klick ins Zeilenfeld
      var tw = e.target.closest('[data-role="tree-toggle"]');
      if (tw) {
        var cid = tw.getAttribute("data-core-id");
        treeExpanded[cid] = !treeExpanded[cid];
        renderTree();
        return;
      }
      var act = e.target.closest('[data-role="tree-edit"], [data-role="tree-delete"], ' +
        '[data-role="tree-add"], [data-role="tree-status"], [data-role="tree-newcore"]');
      if (act) {
        e.stopPropagation();
        var role = act.getAttribute("data-role");
        var aCore = act.getAttribute("data-core-id");
        var aDet = act.getAttribute("data-detail-id");
        if (role === "tree-status") { cycleDetailStatus(aCore, aDet); renderTree(); }
        else if (role === "tree-edit") {
          if (aDet) { state.focusedId = aCore; state.selectedDetail = { coreId: aCore, detailId: aDet }; openDetailEditor(aCore, aDet); }
          else { state.focusedId = aCore; state.selectedDetail = null; openTagEditor(aCore); }
        } else if (role === "tree-add") {
          treeNewDetail(aCore);   // neue Zeile direkt im Baum (Gliederungsmodus)
        } else if (role === "tree-delete") {
          var label = aDet
            ? ((coreById(aCore) || { details: [] }).details.filter(function (x) { return x.id === aDet; })[0] || {}).text
            : (coreById(aCore) || {}).text;
          if (!window.confirm("„" + (label || "Ohne Titel") + "“ wirklich löschen?")) return;
          if (aDet) deleteDetail(aCore, aDet); else deleteCore(aCore);
          if (!aDet && state.focusedId === aCore) { state.focusedId = null; state.selectedDetail = null; }
          renderTree();
        } else if (role === "tree-newcore") {
          treeNewCore();
        }
        return;
      }
      var row = e.target.closest("[data-role]");
      if (!row) return;
      var rKind = row.getAttribute("data-role");
      if (rKind !== "tree-core" && rKind !== "tree-detail") return;
      var rKey = rKind + ":" + (row.getAttribute("data-detail-id") || row.getAttribute("data-core-id"));
      var now = Date.now();
      // Zweiter Klick auf denselben Titel: bearbeiten. Ein eigener Doppelklick,
      // weil der erste Klick den Baum neu zeichnet und dblclick dabei verloren geht.
      if (lastRowClick.key === rKey && now - lastRowClick.t < 450 && e.target.closest(".ihb-tree-label")) {
        lastRowClick = { key: null, t: 0 };
        if (rKind === "tree-core") startTreeEdit("core", null, row.getAttribute("data-core-id"), false);
        else startTreeEdit("detail", row.getAttribute("data-core-id"), row.getAttribute("data-detail-id"), false);
        return;
      }
      lastRowClick = { key: rKey, t: now };
      if (rKind === "tree-core") treeSelectCore(row.getAttribute("data-core-id"));
      else treeSelectDetail(row.getAttribute("data-core-id"), row.getAttribute("data-detail-id"));
    });
    // Arrow keys walk the tree the way a tree widget is expected to behave.
    treePane.addEventListener("keydown", function (e) {
      if (e.target.tagName === "INPUT") return;   // das Zeilenfeld hat eigene Tasten
      var row = e.target.closest("[data-role]");
      if (!row) return;
      // Nur die Zeilen selbst und die Neu-Zeile. Seit v3.0 liefen die Pfeiltasten
      // sonst ueber Stift, Plus und Papierkorb jeder Zeile.
      var rows = Array.prototype.slice.call(treePane.querySelectorAll(
        '[data-role="tree-core"], [data-role="tree-detail"], [data-role="tree-newcore"]'));
      var idx = rows.indexOf(e.target.closest('[data-role="tree-core"], [data-role="tree-detail"], [data-role="tree-newcore"]'));
      if (idx === -1) return;
      if (e.key === "ArrowDown" && idx < rows.length - 1) { e.preventDefault(); rows[idx + 1].focus(); }
      else if (e.key === "ArrowUp" && idx > 0) { e.preventDefault(); rows[idx - 1].focus(); }
      else if (e.key === "ArrowRight" && row.getAttribute("data-role") === "tree-core") {
        e.preventDefault(); treeExpanded[row.getAttribute("data-core-id")] = true; renderTree();
      } else if (e.key === "ArrowLeft" && row.getAttribute("data-role") === "tree-core") {
        e.preventDefault(); treeExpanded[row.getAttribute("data-core-id")] = false; renderTree();
      } else if (e.key === "F2") {
        e.preventDefault();
        if (row.getAttribute("data-role") === "tree-core") startTreeEdit("core", null, row.getAttribute("data-core-id"), false);
        else if (row.getAttribute("data-role") === "tree-detail") startTreeEdit("detail", row.getAttribute("data-core-id"), row.getAttribute("data-detail-id"), false);
      } else if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        if (row.getAttribute("data-role") === "tree-core") treeSelectCore(row.getAttribute("data-core-id"));
        else treeSelectDetail(row.getAttribute("data-core-id"), row.getAttribute("data-detail-id"));
      }
    });
  }

  if (viewSwitch) {
    viewSwitch.addEventListener("click", function (e) {
      var b = e.target.closest("[data-role]");
      if (!b) return;
      setView(b.getAttribute("data-role") === "view-tree" ? "tree" : "map");
    });
  }

  function mapPoint(e) {
    var rect = mapEl.getBoundingClientRect();
    var p = pointerXY(e);
    // Undo pan/zoom so drag-and-drop hit-testing keeps matching --x/--y
    // percentages even while the user is zoomed in.
    return toMapSpace(p.x - rect.left, p.y - rect.top);
  }

  function clearDropHighlight() {
    eachEl(bubblesLayer.querySelectorAll(".ihb-droptarget"), function (el) {
      el.classList.remove("ihb-droptarget");
    });
  }

  function coreElementAt(x, y) {
    var found = null;
    eachEl(bubblesLayer.querySelectorAll('[data-role="core"]'), function (el) {
      var w = parseFloat(el.style.width) || 0;
      var cx = (parseFloat(el.style.getPropertyValue("--x")) / 100) * layout.width;
      var cy = (parseFloat(el.style.getPropertyValue("--y")) / 100) * layout.width;
      if (distance(x, y, cx, cy) <= w / 2) found = el;
    });
    return found;
  }

  // Which slot on the ring does this point fall into?
  function slotAt(x, y, slots) {
    var ang = Math.atan2(y - layout.width / 2, x - layout.width / 2) + Math.PI / 2;
    while (ang < 0) ang += Math.PI * 2;
    while (ang >= Math.PI * 2) ang -= Math.PI * 2;
    return Math.round((ang / (Math.PI * 2)) * slots) % slots;
  }

  // The drag reports a slot on the ring, and the ring shows visibleCores(). In a
  // cloud those are only some of state.cores, so the slot index cannot be used
  // against the full array — dragging inside a cloud would have written to a
  // position belonging to an idea that is not even on screen.
  // The reorder happens among the positions the visible ideas occupy, and those
  // positions are written back in the new order. Everything outside the cloud
  // keeps its exact place. Without a scope this is the plain global reorder.
  function reorderCore(coreId, toIndex) {
    var vis = visibleCores();
    var globalIdx = [];
    var byId = {};
    vis.forEach(function (c) { byId[c.id] = true; });
    state.cores.forEach(function (c, i) { if (byId[c.id]) globalIdx.push(i); });
    var from = -1;
    for (var i = 0; i < vis.length; i++) if (vis[i].id === coreId) from = i;
    if (from === -1) return false;
    var to = Math.max(0, Math.min(vis.length - 1, toIndex));
    if (to === from) return false;
    var order = vis.slice();
    var item = order.splice(from, 1)[0];
    order.splice(to, 0, item);
    var next = state.cores.slice();
    globalIdx.forEach(function (gi, k) { next[gi] = order[k]; });
    state.cores = next;
    onCoresChanged();
    return true;
  }

  function moveDetail(fromCoreId, detailId, toCoreId) {
    if (fromCoreId === toCoreId) return false;
    var target = null, moving = null;
    state.cores.forEach(function (c) {
      if (c.id === toCoreId) target = c;
      if (c.id === fromCoreId) {
        c.details.forEach(function (dd) { if (dd.id === detailId) moving = dd; });
      }
    });
    if (!target || !moving || target.details.length >= MAX_DETAILS) return false;
    state.cores = state.cores.map(function (c) {
      if (c.id === fromCoreId) return Object.assign({}, c, { details: c.details.filter(function (dd) { return dd.id !== detailId; }) });
      if (c.id === toCoreId) return Object.assign({}, c, { details: c.details.concat([moving]) });
      return c;
    });
    onCoresChanged();
    return true;
  }

  function onDragStart(e) {

    var el = t.closest('[data-role="core"]') || t.closest('[data-role="detail"]');

      kind: el.getAttribute("data-role"),
      coreId: el.getAttribute("data-core-id"),

      startX: p.x,
      startY: p.y,
      moved: false

    if (!drag.moved) {
      drag.moved = true;
      drag.el.classList.add("ihb-dragging");
    }
    if (e.cancelable) e.preventDefault();
    drag.el.style.transform = "translate(" + (p.x - drag.startX) + "px," + (p.y - drag.startY) + "px)";

    clearDropHighlight();
    if (drag.kind === "detail") {
      var m = mapPoint(e);
      var target = coreElementAt(m.x, m.y);
      if (target && target.getAttribute("data-core-id") !== drag.coreId) {

      return;
    }
    var targetEl = coreElementAt(m.x, m.y);
    if (!targetEl) return;
    moveDetail(d.coreId, d.detailId, targetEl.getAttribute("data-core-id"));
  }

  // ---------- delegated bubble interaction ----------

  // ---------- Ebene 1: Eingang (Gedankenliste) ----------
  // Roh festhalten, spaeter einsortieren (Assist: Erfassen ist nicht Ordnen).
  // Der Eingang kennt keine Grenzen; die gelten erst fuer die Karte.
  var inboxSheet = document.getElementById("inboxSheet");
  var inboxInput = document.getElementById("inboxInput");
  var inboxList = document.getElementById("inboxList");
  var inboxBtn = document.getElementById("inboxBtn");
  var inboxCountEl = document.getElementById("inboxCount");
  var sortSession = null;   // { queue: [ids], done, total, candidates }
  // Auf der Karte am Rechner steht der Eingang im Hub, zwischen den Haelften;
  // am Handy und im Baum bleibt er ein Fenster. Die Karte wandert dafuer.
  var inboxCardEl = inboxSheet ? inboxSheet.querySelector(".ihb-inboxcard") : null;
  var inboxInHub = false;
  function inboxHubPossible() {
    return state.view !== "tree" && !isPhone() && panelHorizontal() && !!mapEl && !mapEl.hidden && (layout.width || 0) >= 600;
  }
  function homeInboxCard() {
    if (inboxCardEl && inboxSheet && inboxCardEl.parentNode !== inboxSheet) inboxSheet.appendChild(inboxCardEl);
  }
  // anderes uebernimmt das offene Hub: der Eingang ist dann einfach zu
  function handOverInbox() {
    if (!inboxInHub) return;
    inboxInHub = false;
    if (inboxSheet) inboxSheet.classList.remove("open", "in-hub");
    inboxPicks = [];
    stopDictation();
  }

  function cleanInbox(list) {
    if (!Array.isArray(list)) return [];
    return list.filter(function (x) { return x && typeof x === "object" && typeof x.text === "string" && x.text.trim(); })
      .map(function (x) {
        return {
          id: typeof x.id === "string" && x.id ? x.id : nextId(),
          text: x.text.trim(),
          created: typeof x.created === "string" && !isNaN(Date.parse(x.created)) ? x.created : new Date().toISOString()
        };
      });
  }
  function persistInbox() {
    // vor dem Laden nicht: sonst ueberschriebe der leere Startzustand den Speicher
    scheduleFolderSync();
    if (!state.loaded || storageKind() === "none") return;
    storeSet(INBOX_KEY, JSON.stringify(state.inbox));
  }
  function inboxItem(id) {
    return state.inbox.filter(function (x) { return x.id === id; })[0] || null;
  }
  function addToInbox(text) {
    var t = (text || "").trim();
    if (!t) return null;
    var item = { id: nextId(), text: t, created: new Date().toISOString() };
    state.inbox = state.inbox.concat([item]);
    persistInbox();
    updateInboxBadge();
    if (inboxOpen()) renderInbox();
    return item.id;
  }
  function removeFromInbox(id) {
    state.inbox = state.inbox.filter(function (x) { return x.id !== id; });
    persistInbox();
    updateInboxBadge();
  }
  function updateInboxBadge() {
    if (!inboxBtn) return;
    var n = state.inbox.length;
    inboxCountEl.textContent = String(n);
    inboxBtn.classList.toggle("is-empty", n === 0);
    inboxBtn.classList.toggle("is-full", n >= INBOX_SIGNAL);
    inboxBtn.setAttribute("title", n >= INBOX_SIGNAL
      ? n + " Gedanken warten – Zeit zum Einsortieren"
      : (n === 1 ? "1 Gedanke im Eingang" : n + " Gedanken im Eingang"));
    inboxBtn.setAttribute("aria-label", "Eingang öffnen, " + n + (n === 1 ? " Gedanke" : " Gedanken"));
    renderInboxDots();
  }
  function inboxOpen() { return !!(inboxSheet && inboxSheet.classList.contains("open")); }
  // opts.noFocus: zum Start am Handy nicht gleich die Tastatur aufklappen
  function openInbox(opts) {
    if (!inboxSheet) return;
    if (sortSession) endSort();
    if (compostSession) endCompost();
    var was = inboxOpen();
    var inHub = inboxHubPossible();
    if (was && inboxInHub && !inHub) {   // aus dem Hub ins Fenster (Baum, schmales Fenster)
      inboxInHub = false;
      inboxSheet.classList.remove("in-hub");
      closeHubDisplay();
      homeInboxCard();
      was = false;
    }
    if (inHub) {
      if (was && !inboxInHub) { stopInboxAnims(); endPeek(); homeInboxCard(); }   // aus dem Fenster ins Hub
      if (state.focusedId !== null) clearFocus();   // das Hub gehoert jetzt dem Eingang
      inboxInHub = true;
      inboxSheet.classList.remove("closing");
      inboxSheet.classList.add("open", "in-hub");
      if (!was) dictationNote = "";
      renderInbox();
      renderDictation();
      if (!was || !hubOpen) { resetCamera(true); openHubDisplay(inboxCardEl); }
      if (!opts || !opts.noFocus) { try { inboxInput.focus({ preventScroll: true }); } catch (e) { inboxInput.focus(); } }
      return;
    }
    homeInboxCard();
    inboxSheet.classList.remove("in-hub");
    inboxSheet.classList.remove("closing");
    inboxSheet.classList.add("open");
    dictationNote = "";
    renderInbox();
    renderDictation();
    if (!was) {
      placeInboxCard(false);
      startPeek();
      zoomInbox(true);
    }
    if (!opts || !opts.noFocus) { try { inboxInput.focus({ preventScroll: true }); } catch (e) { inboxInput.focus(); } }
  }
  function closeInbox() {
    var was = inboxOpen();
    if (inboxSheet) inboxSheet.classList.remove("open");
    inboxPicks = [];       // eine Auswahl gilt nur, solange die Flaeche offen ist
    stopDictation();       // nie unbemerkt weiterhoeren
    if (!was || !inboxSheet) return;
    if (inboxInHub) {
      // die Haelften schliessen sich um die Karte; danach geht sie nach Hause
      inboxInHub = false;
      inboxSheet.classList.remove("in-hub");

  }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function fmtTime(iso) { var d = new Date(iso); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
  function fmtDay(iso) {
    var d = new Date(iso), today = new Date(), y = new Date();
    y.setDate(today.getDate() - 1);
    function same(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
    if (same(d, today)) return "Heute";
    if (same(d, y)) return "Gestern";
    return pad2(d.getDate()) + "." + pad2(d.getMonth() + 1) + "." + d.getFullYear();
  }
  function oldestFirst(a, b) { return Date.parse(a.created) - Date.parse(b.created); }
  function renderInbox() {
    if (!inboxList) return;
    inboxPicks = inboxPicks.filter(function (id) { return !!inboxItem(id); });
    var n = state.inbox.length;
    document.getElementById("inboxTitle").textContent = n ? "Eingang · " + n + (n === 1 ? " Gedanke" : " Gedanken") : "Eingang";
    if (!n) {
      inboxList.innerHTML = '<p class="ihb-note ihb-inbox-empty">Noch nichts im Eingang. Was dir einfällt: tippen, Enter, weiter – einsortiert wird später.</p>';
      return;
    }
    var html = "", lastDay = null, q = state.query.trim().toLowerCase();
    state.inbox.slice().sort(oldestFirst).reverse().forEach(function (it) {
      var day = fmtDay(it.created);
      if (day !== lastDay) { html += '<div class="ihb-inbox-day">' + escapeHtml(day) + "</div>"; lastDay = day; }
      var hit = q && it.text.toLowerCase().indexOf(q) !== -1;
      var pick = inboxPicks.indexOf(it.id);
      html += '<div class="ihb-inbox-row' + (hit ? " is-match" : "") + (pick !== -1 ? " is-picked" : "") + '" data-role="inbox-item" data-id="' + it.id + '">' +
        '<button type="button" class="ihb-inbox-pick" data-role="inbox-pick" data-id="' + it.id + '" aria-pressed="' + (pick !== -1) +
        '" aria-label="' + (pick !== -1 ? "Markierung aufheben" : "Markieren") + '">' + (pick !== -1 ? pick + 1 : "") + "</button>" +
        '<span class="ihb-inbox-handle" data-role="inbox-handle" data-id="' + it.id + '" title="Auf eine Kernidee ziehen">⠿</span>' +
        '<span class="ihb-inbox-time">' + fmtTime(it.created) + "</span>" +
        '<span class="ihb-inbox-text">' + escapeHtml(it.text) +
        (pick === 0 && inboxPicks.length > 1 ? ' <span class="ihb-inbox-badge">Titel</span>' : "") + "</span>" +
        '<button type="button" class="ihb-chip" data-role="inbox-sort" data-id="' + it.id + '">Einsortieren</button>' +
        '<button type="button" class="ihb-inbox-drop" data-role="inbox-drop" data-id="' + it.id + '" aria-label="Verwerfen" title="Verwerfen">' + icon("x", 12) + "</button>" +
        "</div>";
    });
    if (inboxPicks.length) html += pickBarHtml();
    else html += '<div class="ihb-btnrow ihb-paste-actions"><button type="button" class="ihb-btn primary" data-role="inbox-sort-all">' +
      (n >= INBOX_SIGNAL ? "Zeit zum Einsortieren – alle (" + n + ")" : "Alle einsortieren (" + n + ")") + "</button></div>";

    if (inboxOpen()) placeInboxCard(true);   // waechst die Liste, rueckt das Fenster nur so weit hoch wie noetig
  }

  // ---------- Einsortieren: von Ebene 1 auf die Karte ----------
  function coreScores(text) {
    var words = captureWords(text);
    if (!words.length) return [];
    return state.cores.map(function (c) {
      var score = 0;
      function add(src, weight) {
        var ws = captureWords(src);
        words.forEach(function (w) { if (ws.some(function (v) { return wordsMatch(w, v); })) score += weight; });
      }
      add(c.text, 3);
      add(c.subtitle, 2);
      add((c.tags || []).join(" "), 2);
      add(c.details.map(function (d) { return d.text; }).join(" "), 1);
      return { core: c, score: score };
    }).filter(function (s) { return s.score > 0; })
      .sort(function (a, b) { return b.score - a.score; });
  }
  function sortCandidates(p) {
    // ein bekanntes Praefix ("Recht: ...") steht immer vorn, auch wenn die Kernidee voll ist
    var list = p.target ? [p.target] : [];
    coreScores(p.prefix && p.rest ? p.prefix + " " + p.rest : p.text).forEach(function (s) {
      if (list.indexOf(s.core) === -1) list.push(s.core);
    });
    return list.slice(0, 3);
  }
  function startSort(ids) {
    var queue = ids.filter(function (id) { return !!inboxItem(id); });
    if (!queue.length) return;
    handOffInbox();
    state.tagEditing = null;
    detailEditing = null;
    compostSession = null;
    sortSession = { queue: queue, done: 0, total: queue.length, candidates: [] };
    renderSortDialog();
  }
  function currentSortItem() {
    if (!sortSession) return null;
    while (sortSession.queue.length && !inboxItem(sortSession.queue[0])) sortSession.queue.shift();
    return sortSession.queue.length ? inboxItem(sortSession.queue[0]) : null;
  }

  function sortTextValue() {

  // from: Bildschirmpunkt { x, y }, von dem aus der Gedanke zur Kernidee sinkt
  function assignInboxToCore(itemId, coreId, editedText, from) {
    var item = inboxItem(itemId);

    state.cores = state.cores.map(function (c) { return c.id === core.id ? Object.assign({}, c, { details: c.details.concat([d]) }) : c; });

    var id = nextId();
    var fresh;
    if (p.prefix && p.rest && !p.target) {
      // "Garten: Hochbeet bauen" -> Kernidee "Garten" mit diesem Detail
      fresh = { id: id, text: p.prefix, subtitle: "", icon: "none", color: "auto", tags: [], notes: "", created: item.created,
        details: [{ id: nextId(), text: p.rest, status: "offen", notes: "", tags: p.tags.slice(), color: "auto", created: item.created }] };
    } else {
      if (!p.text) return null;
      fresh = { id: id, text: p.text, subtitle: "", icon: "none", color: "auto", tags: p.tags.slice(), notes: "", created: item.created, details: [] };

  // Mitte des Textfelds im Dialog; vor dem Weiterschalten messen

  if (inboxBtn) inboxBtn.addEventListener("click", openInbox);

  if (inboxCardEl) {
