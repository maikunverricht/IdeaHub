  var mapEl = document.getElementById("map");
  var starsLayer = document.getElementById("starsLayer");
  var sparkLayer = document.getElementById("sparkLayer");
  var linesLayer = document.getElementById("linesLayer");
  var bubblesLayer = document.getElementById("bubblesLayer");
  var cameraLayer = document.getElementById("cameraLayer");
  var hubAnchor = document.getElementById("hubAnchor");
  var zoomCtl = document.getElementById("zoomCtl");
  var hubCountEl = document.getElementById("hubCount");
  var hubEl = document.getElementById("hub");
  var capA = document.getElementById("capA");
  var capB = document.getElementById("capB");
  var hubDisplay = document.getElementById("hubDisplay");
  var hubDisplayBody = document.getElementById("hubDisplayBody");
  var hubFace = document.getElementById("hubFace");
  var searchWrap = document.getElementById("searchWrap");
  var searchInput = document.getElementById("searchInput");
  var clearSearchBtn = document.getElementById("clearSearchBtn");
  var captionArea = document.getElementById("captionArea");
  var tagFilterBar = document.getElementById("tagFilterBar");
  var focusPill = document.getElementById("focusPill");
  var focusPillText = document.getElementById("focusPillText");
  var settingsBtn = document.getElementById("settingsBtn");
  var settingsModal = document.getElementById("settingsModal");
  var settingsBody = document.getElementById("settingsBody");
  var draftIcon = "none";
  var draftColor = "auto";
  var importInput = document.getElementById("importInput");
  var importJsonInput = document.getElementById("importJsonInput");
  var detailEditing = null;   // { coreId, detailId }
  var detailDraftStatus = "offen";

  var folderSupported = typeof window !== "undefined" && "showDirectoryPicker" in window;

  // ---------- counting / filtering ----------
  function evaluateFilters() {
    var q = state.query.trim().toLowerCase();
    var textSearching = q.length > 0;
    var tagSearching = state.activeTags.length > 0;
    // a focus pointing at an idea that no longer exists counts as no focus
    var focusing = state.focusedId !== null && visibleCores().some(function (c) { return c.id === state.focusedId; });
    var perCore = new Map();
    visibleCores().forEach(function (core) {
      var isFocused = focusing && core.id === state.focusedId;
      var coreTagHit = (core.tags || []).some(function (t) { return state.activeTags.indexOf(t) !== -1; });
      var detailTagHit = core.details.some(function (d) {
        return (d.tags || []).some(function (t) { return state.activeTags.indexOf(t) !== -1; });
      });
      // A tag sitting only on a detail still belongs to that branch: without
      // this the core dimmed away and took the matching detail with it.
      var tagOk = !tagSearching || coreTagHit || detailTagHit;
      var coreTextMatch = !textSearching || core.text.toLowerCase().indexOf(q) !== -1 ||
        (core.subtitle || "").toLowerCase().indexOf(q) !== -1 ||
        (core.tags || []).some(function (t) { return t.toLowerCase().indexOf(q) !== -1; });
      var anyDetailTextMatch = core.details.some(function (d) { return d.text.toLowerCase().indexOf(q) !== -1; });
      var passesFilters = tagOk && (!textSearching || coreTextMatch || anyDetailTextMatch);
      // Focus never narrows the search: a focused idea always stays visible, and
      // matches elsewhere still light up so the hub search remains global.
      var coreActive = isFocused || (focusing ? (textSearching || tagSearching) && passesFilters : passesFilters);
      var details = new Map();
      core.details.forEach(function (d) {
        var dOwn = d.text.toLowerCase().indexOf(q) !== -1;
        var dTagOk = !tagSearching || coreTagHit ||
          (d.tags || []).some(function (t) { return state.activeTags.indexOf(t) !== -1; });
        var dActive = isFocused ? true : (coreActive && dTagOk && (!textSearching || coreTextMatch || dOwn));
        details.set(d.id, dActive);
      });
      perCore.set(core.id, { coreActive: coreActive, isFocused: isFocused, details: details });
    });
    return { anyFilter: textSearching || tagSearching || focusing, perCore: perCore };
  }

  function selectDetail(coreId, detailId) {
    var sel = state.selectedDetail;
    var opening = !(sel && sel.coreId === coreId && sel.detailId === detailId);
    // Any change of what the display shows closes and reopens it, so moving
    // between details (or back to the core idea) reads as one clear gesture.
    if (hubOpen && !selectDetailSwapping) {
      selectDetailSwapping = true;
      swapDisplay(function () { selectDetail(coreId, detailId); });
      return;
    }
    selectDetailSwapping = false;
    state.selectedDetail = opening ? { coreId: coreId, detailId: detailId } : null;
    renderStructure();
    if (opening) {
      // the spark starts at the detail itself, not at its core
      var el = bubblesLayer.querySelector('[data-role="detail"][data-detail-id="' + detailId + '"]');
      if (el) {
        var xp = parseFloat(el.style.getPropertyValue("--x"));
        var yp = parseFloat(el.style.getPropertyValue("--y"));
        if (isFinite(xp) && isFinite(yp)) emitEnergy(xp, yp, "247,207,131");
      }
    }
  }

  function selectedDetailObj() {
    var sel = state.selectedDetail;
    if (!sel) return null;
    var core = coreById(sel.coreId);
    if (!core) return null;
    var found = null;
    core.details.forEach(function (d) { if (d.id === sel.detailId) found = d; });
    return found ? { core: core, detail: found } : null;
  }

  // When an idea is focused its description travels to the hub as a stream of
  // sparks, so the text does not simply appear in the middle out of nowhere.
  function emitEnergy(fromXpct, fromYpct, colorRgb) {
    if (!mapEl || !motionEnabled()) return;
    var W = layout.width;
    if (!W) return;
    var fx = (fromXpct / 100) * W, fy = (fromYpct / 100) * W;
    var tx = W / 2, ty = W / 2;
    var count = 7;
    for (var i = 0; i < count; i++) {
      var el = document.createElement("span");
      el.className = "ihb-spark";
      // scatter the start points a little so it reads as a stream, not a line
      var jitter = (i - count / 2) * 7;
      var nx = -(ty - fy), ny = (tx - fx);
      var nlen = Math.sqrt(nx * nx + ny * ny) || 1;
      var sx = fx + (nx / nlen) * jitter;
      var sy = fy + (ny / nlen) * jitter;
      el.style.left = sx + "px";
      el.style.top = sy + "px";
      el.style.setProperty("--dx", (tx - sx) + "px");
      el.style.setProperty("--dy", (ty - sy) + "px");
      el.style.background = "rgba(" + (colorRgb || "255,214,140") + ",0.95)";
      el.style.animationDelay = Math.round(i * 90 * speedFactor()) + "ms";
      sparkLayer.appendChild(el);
    }
    var hub = document.getElementById("hub");
    if (hub) {
      hub.classList.remove("ihb-hub-pulse");
      void hub.offsetWidth;
      hub.classList.add("ihb-hub-pulse");
    }
    setTimeout(function () {
      if (sparkLayer) sparkLayer.innerHTML = "";
      if (hub) hub.classList.remove("ihb-hub-pulse");
    }, Math.round(1400 * speedFactor()) + 300);
  }

  function energyFromCore(coreId) {
    var vc = visibleCores();
    var idx = -1;
    for (var i = 0; i < vc.length; i++) if (vc[i].id === coreId) idx = i;
    if (idx === -1) return;
    var core = vc[idx];
    var slots = vc.length + (vc.length < MAX_CORES ? 1 : 0);
    var angle = coreAngle(idx, slots);
    var pos = polar(HUB.x, HUB.y, pctOfMap(coreOrbit(core)), angle);
    emitEnergy(pos.x, pos.y, paletteFor(core, idx).rgb);
  }

  function toggleFocus(id) {
    // Switching from one focused idea straight to another: close the display
    // around the old one first, then reopen it around the new one.
    if (state.focusedId !== null && id !== state.focusedId && hubOpen) {
      swapDisplay(function () { toggleFocus(id); });
      return;
    }
    if (inboxInHub && inboxOpen() && id !== state.focusedId) {
      closeInbox();
      clearTimeout(displaySwapTimer);
      displaySwapTimer = setTimeout(function () { toggleFocus(id); }, motionEnabled() ? Math.round(560 * speedFactor()) : 0);
      return;
    }
    clearTimeout(displaySwapTimer);
    // Focusing always plays out at the resting view: if the hub split open
    // while the user was zoomed in on a bubble on the far side of the ring,
    // the split itself could land off screen, with no visible feedback for
    // the tap that triggered it.
    resetCamera(true);
    var opening = state.focusedId !== id;
    state.focusedId = opening ? id : null;
    state.selectedDetail = null;
    ringMoving = true;                 // suppress FLIP while the ring turns
    ringAnim.fromSizes = captureCoreSizes();
    renderStructure();
    ringMoving = false;
    startRingTween(ringTarget());
    if (opening) energyFromCore(id);
  }
  function clearFocus() {
    resetCamera(true);
    state.focusedId = null;
    state.selectedDetail = null;
    ringMoving = true;
    ringAnim.fromSizes = captureCoreSizes();
    renderStructure();
    ringMoving = false;
    startRingTween(ringTarget());
  }

  function computeCounts() {
    // counts describe what is on screen, so they follow the scope as well
    var vc = visibleCores();
    var total = vc.length + vc.reduce(function (s, c) { return s + c.details.length; }, 0);
    var ev = evaluateFilters();
    if (!ev.anyFilter) return { total: total, matched: total, searching: false };
    var matched = 0;
    vc.forEach(function (core) {
      var info = ev.perCore.get(core.id);
      if (info.coreActive) matched += 1;
      core.details.forEach(function (d) { if (info.details.get(d.id)) matched += 1; });
    });
    return { total: total, matched: matched, searching: true };
  }

  function setActive(el, active) {
    if (!el) return;
    el.style.opacity = active ? "1" : "0.18";
    el.style.boxShadow = active ? el.getAttribute("data-shadow") : "inset -6px -8px 18px rgba(0,0,0,0.25)";
    el.style.filter = active ? "none" : "saturate(0.35)";
  }

  function applyFilter() {
    var ev = evaluateFilters();
    visibleCores().forEach(function (core) {
      var info = ev.perCore.get(core.id);
      var coreEl = bubblesLayer.querySelector('[data-role="core"][data-core-id="' + core.id + '"]');
      setActive(coreEl, info.coreActive);
      if (coreEl) {
        if (info.isFocused) coreEl.classList.add("is-focused");
        else coreEl.classList.remove("is-focused");
      }
      var sel2 = state.selectedDetail;
      core.details.forEach(function (d) {
        var dEl2 = bubblesLayer.querySelector('[data-role="detail"][data-detail-id="' + d.id + '"]');
        if (!dEl2) return;
        if (sel2 && sel2.detailId === d.id) dEl2.classList.add("is-focused");
        else dEl2.classList.remove("is-focused");
      });
      var coreLine = linesLayer.querySelector('line[data-line-core="' + core.id + '"][data-line-kind="core"]');
      if (coreLine) coreLine.setAttribute("opacity", info.coreActive ? "0.45" : "0.08");
      var progLine = linesLayer.querySelector('line[data-line-progress="' + core.id + '"]');
      if (progLine) {
        var full = coreProgress(core).done === coreProgress(core).total;
        progLine.setAttribute("opacity", info.coreActive ? (full ? "0.95" : "0.8") : "0.1");
      }
      core.details.forEach(function (d) {
        var dActive = info.details.get(d.id);
        var dEl = bubblesLayer.querySelector('[data-role="detail"][data-detail-id="' + d.id + '"]');
        setActive(dEl, dActive);
        var dLine = linesLayer.querySelector('line[data-line-detail="' + d.id + '"]');
        if (dLine) dLine.setAttribute("opacity", dActive ? "0.4" : "0.06");
      });
    });
  }

  function updateHubCount() {
    var editorActive = !!(state.tagEditing || detailEditing || sortSession || compostSession || (inboxInHub && inboxOpen()));
    var c = computeCounts();
    var coresCount = visibleCores().length;
    // While an idea is focused the hub carries its description: the space is
    // there, the eye is already in the middle, and the text no longer has to be
    // squeezed into a bubble.
    // Note: computeCounts() treats focus itself as a filter, so ask the query
    // directly rather than going through c.searching.
    var reallySearching = state.query.trim().length > 0 || state.activeTags.length > 0;
    var focusNotes = "";
    if (state.focusedId !== null && !reallySearching) {
      var f = coreById(state.focusedId);
      if (f && (f.notes || "").trim()) focusNotes = f.notes.trim();
    }
    // The hub is the reading surface: it shows the selected detail if there is
    // one, otherwise the focused core idea, otherwise just the counter.
    var info = null;
    if (!reallySearching) {
      var sel = selectedDetailObj();
      if (sel) {
        var stLabels = { offen: "Offen", "in-arbeit": "In Arbeit", erledigt: "Erledigt" };
        info = {
          kind: "Detailidee · " + stLabels[detailStatus(sel.detail)],
          title: sel.detail.text,
          notes: (sel.detail.notes || "").trim()
        };
      } else if (state.focusedId !== null) {
        var f2 = coreById(state.focusedId);
        if (f2) info = { kind: "Kernidee", title: f2.text, notes: (f2.notes || "").trim() };
      }
    }

    // The information unfolds from the hub rather than sitting inside it: the
    // circle is the wrong shape for running text, and the panel gives it room.
    // Reading and editing both live inside the opened hub. The editor wins if
    // it is open, so a selection change does not throw away what you are typing.
    // ein durch Fokuswechsel geschlossenes Display holt den Dialog zurueck
    if (sortSession && !hubOpen && !dialogSheetOpen() && state.view !== "tree") renderSortDialog();
    if (compostSession && !hubOpen && !dialogSheetOpen() && state.view !== "tree") renderCompostDialog();
    if (info && !editorActive) {
      openHubDisplay(
        '<div class="ihb-display-head"><span>' + escapeHtml(info.kind) + "</span>" +
        '<button type="button" data-role="display-close" aria-label="Schließen">&#10005;</button></div>' +
        '<div class="ihb-search-host"></div>' +
        '<div class="ihb-info-title">' + escapeHtml(info.title || "Ohne Titel") + "</div>" +
        (info.notes
          ? '<div class="ihb-info-notes">' + escapeHtml(info.notes) + "</div>"
          : '<div class="ihb-info-notes ihb-info-empty">Noch keine Beschreibung</div>')
      );
    } else if (!editorActive) {
      closeHubDisplay();
    }
    hubCountEl.textContent = reallySearching
      ? c.matched + " Treffer" + inboxHitNote() + compostHitNote()
      : coresCount + " Kernideen · " + (c.total - coresCount) + " Details";
    // umbrechen nur zwischen den Teilen, nie mitten in "4 Details"
    hubCountEl.innerHTML = hubCountEl.textContent.split(" · ").map(function (s) {
      return '<span class="ihb-nowrap">' + escapeHtml(s) + "</span>";
    }).join(" · ");
    renderInboxDots();
  }

  // ---------- tag filter bar ----------
  // Tags only do their job — filtering and forming clouds — when they are reused
  // rather than reinvented, so the editor offers the ones already in play.
  function tagCounts(cores) {
    var counts = {};
    (cores || state.cores).forEach(function (c) {
      (c.tags || []).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; });
      c.details.forEach(function (d) {
        (d.tags || []).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; });
      });
    });
    return counts;
  }

  function frequentTags(limit) {
    var counts = tagCounts();
    return Object.keys(counts)
      .sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b, "de"); })
      .slice(0, limit || 8);
  }

  function currentTagsInEditor() {
    var el = document.getElementById("edTags");
    if (!el) return [];
    return el.value.split(",").map(function (t) { return t.trim(); }).filter(Boolean);
  }

  function renderTagSuggestions() {
    var host = document.getElementById("edTagSuggest");
    if (!host) return;
    var counts = tagCounts();
    var have = currentTagsInEditor();
    var free = frequentTags(10).filter(function (t) { return have.indexOf(t) === -1; }).slice(0, 6);
    if (!free.length) {
      host.innerHTML = have.length
        ? '<span class="ihb-tagsuggest-none">Alle bekannten Tags sind vergeben.</span>'
        : '<span class="ihb-tagsuggest-none">Noch keine Tags vorhanden — der erste entsteht hier.</span>';
      return;
    }
    var html = '<span class="ihb-tagsuggest-label">Häufig verwendet:</span>';
    free.forEach(function (t) {
      html += '<button type="button" class="ihb-tagsuggest-chip" data-role="tag-suggest" data-tag="' +
        escapeHtml(t) + '" title="' + counts[t] + 'x verwendet">' + escapeHtml(t) + "</button>";
    });
    host.innerHTML = html;
  }

  function addTagFromSuggestion(tag) {
    var el = document.getElementById("edTags");
    if (!el) return;
    var have = currentTagsInEditor();
    if (have.indexOf(tag) === -1) have.push(tag);
    el.value = have.join(", ");
    renderTagSuggestions();
  }

  function allTags() {
    var set = new Set();
    state.cores.forEach(function (c) {
      (c.tags || []).forEach(function (t) { set.add(t); });
      // Details carry tags too, and the filter already understands them — but
      // a tag living only on details never reached the filter bar, so it could
      // not be picked. That made those tags unusable for filtering entirely.
      c.details.forEach(function (d) { (d.tags || []).forEach(function (t) { set.add(t); }); });
    });
    return Array.from(set).sort(function (a, b) { return a.localeCompare(b, "de"); });
  }
  // Filters are shared between the views, so every change has to redraw
  // whichever one is on screen. Calling renderStructure() in tree view would
  // also drive the hub's reading panel, which now shares its container with
  // the tree editor and would overwrite it mid-edit.
  function renderCurrentView() {
    if (state.view === "tree") { renderTagFilterBar(); renderTree(); return; }
    renderStructure();
  }

  function toggleTagFilter(tag) {
    var idx = state.activeTags.indexOf(tag);
    state.activeTags = idx === -1 ? state.activeTags.concat([tag]) : state.activeTags.filter(function (t) { return t !== tag; });
    renderCurrentView();
  }
  function clearTagFilter() {
    state.activeTags = [];
    renderCurrentView();
  }
  function renderTagFilterBar() {
    var tags = allTags();
    if (!tags.length) { tagFilterBar.innerHTML = ""; return; }
    var html = "";
    tags.forEach(function (t) {
      var active = state.activeTags.indexOf(t) !== -1;
      html += '<button type="button" class="ihb-tagchip' + (active ? " active" : "") + '" data-role="tagfilter-chip" data-tag="' + escapeHtml(t) + '">' + escapeHtml(t) + "</button>";
    });
    if (state.activeTags.length) {
      html += '<button type="button" class="ihb-tagchip clear" data-role="tagfilter-clear">Filter zurücksetzen' + icon("x", 10) + "</button>";
    }
    tagFilterBar.innerHTML = html;
  }

  // Bei 0 Treffern: wie bisher Knopf und alle Kernideen als Ziel.
  function quickCreateInnerHtml(p, q) {
    var text = p.text;
    var tagsAttr = escapeHtml(p.tags.join(","));
    var eligibleCores = state.cores.filter(function (c) { return c.details.length < MAX_DETAILS; });
    var canAddCore = state.cores.length < MAX_CORES;
    var html = '<p class="ihb-note">Keine Treffer für „' + escapeHtml(q) + '"</p>';
    if (canAddCore) {
      if (text) html += '<button type="button" class="ihb-btn primary" data-role="quickcreate-core" data-text="' + escapeHtml(text) + '" data-tags="' + tagsAttr + '">' + icon("plus", 14) + ' Als neue Kernidee anlegen</button>';
    } else {
      // Without this the button would simply vanish and leave the user guessing.
      html += '<p class="ihb-note" style="margin-top:6px;">Die Karte ist mit ' + MAX_CORES +
        ' Kernideen voll. Häng den Text als Detail an, oder lösche zuerst eine Kernidee.</p>';
    }
    if (eligibleCores.length && text) {
      html += '<p class="ihb-note" style="margin-top:6px;">…oder als Detail anlegen bei:</p><div class="ihb-chiprow">';
      eligibleCores.forEach(function (c) {
        html += '<button type="button" class="ihb-chip" data-role="quickcreate-detail" data-core-id="' + c.id + '" data-text="' + escapeHtml(text) + '" data-tags="' + tagsAttr + '">' + escapeHtml(c.text || "Unbenannt") + '</button>';
      });
      html += "</div>";
    }
    return html;
  }
  function capturePanelHtml(q, zeroMatches) {
    var act = captureAction(q);
    var p = act ? act.parsed : parseCapture(q);
    var html = '<div class="ihb-quickcreate" data-role="capture-panel">';
    if (act) {
      html += '<p class="ihb-capture-preview" data-role="capture-preview" data-kind="' + act.kind + '">' +
        (act.run ? "<kbd>Enter</kbd>" : "") + escapeHtml(act.label) + "</p>";
    }
    var hits = inboxMatches();
    if (hits.length) {
      html += '<p class="ihb-note" data-role="inbox-hits">' + (hits.length === 1 ? "1 Gedanke im Eingang passt" : hits.length + " Gedanken im Eingang passen") +
        ' <button type="button" class="ihb-chip" data-role="open-inbox">Eingang öffnen</button></p>';
    }
    var kHits = compostMatches();
    if (kHits.length) {
      html += '<p class="ihb-note" data-role="compost-hits">' + (kHits.length === 1 ? "1 Kernidee im Kompost passt" : kHits.length + " Kernideen im Kompost passen") +
        ' <button type="button" class="ihb-chip" data-role="open-compost">Kompost ansehen</button></p>';
    }
    var newTitle = act && act.kind === "core" ? p.text : act && act.kind === "core-detail" ? p.prefix : "";
    var dups = newTitle ? similarCores(newTitle) : [];
    if (dups.length) {
      html += '<p class="ihb-note ihb-capture-dup" data-role="capture-dup">Mögliche Dublette – lieber öffnen?</p><div class="ihb-chiprow">';
      dups.forEach(function (c) {
        html += '<button type="button" class="ihb-chip" data-role="capture-open" data-core-id="' + c.id + '">' + escapeHtml(c.text || "Unbenannt") + "</button>";
      });
      html += "</div>";
    }
    if (p.prefix && p.rest) {
      // Das Ziel steht mit dem Praefix fest; weitere Vorschlaege wuerden nur ablenken.
    } else if (zeroMatches) {
      html += quickCreateInnerHtml(p, q);
    } else if (act && act.kind === "core") {
      // was schon als Dublette angeboten wird, nicht ein zweites Mal vorschlagen
      var sug = suggestCores(p.text).filter(function (c) { return dups.indexOf(c) === -1; });
      if (sug.length) {
        html += '<p class="ihb-note" style="margin-top:6px;">…oder als Detail bei:</p><div class="ihb-chiprow">';
        sug.forEach(function (c) {
          html += '<button type="button" class="ihb-chip" data-role="quickcreate-detail" data-core-id="' + c.id + '" data-text="' + escapeHtml(p.text) + '" data-tags="' + escapeHtml(p.tags.join(",")) + '">' + escapeHtml(c.text || "Unbenannt") + "</button>";
        });
        html += "</div>";
      }
    }
    html += "</div>";
    return html;
  }

  function renderCaptionOrQuickCreate() {
    if (state.pasteDraft) {
      captionArea.innerHTML = storageWarnHtml("ihb-caption") + pastePanelHtml();
      return;
    }
    var q = state.query.trim();
    var c = computeCounts();
    if (q || (c.searching && c.matched === 0)) {
      captionArea.innerHTML = storageWarnHtml("ihb-caption") + capturePanelHtml(q, c.searching && c.matched === 0);
    } else {
      var overflowNote = state.cores.length > COMFORT_CORES
        ? '<p class="ihb-caption ihb-caption-warn">' + state.cores.length + ' Kernideen auf der Karte' +
          (state.cores.length > MAX_CORES ? ' — mehr als die ' + MAX_CORES + ', die sich hier anlegen lassen' : '') +
          '. Alles wird angezeigt, die Bubbles werden dabei aber kleiner.</p>'
        : "";
      captionArea.innerHTML = storageWarnHtml("ihb-caption") + overflowNote + compostNoteHtml("ihb-caption") + '<p class="ihb-caption"><b>Antippen</b> zeigt eine Idee im Hub · <b>Stift bzw. Tag-Symbol</b> klappt das Bearbeitungsfeld am Hub auf · <b>ziehen</b> sortiert um · <b>Mausrad, Kneifgeste oder Doppelklick</b> zoomen die Karte · leere Fläche ziehen verschiebt die Ansicht · <b>/</b> springt ins Hub-Feld, <b>Enter</b> legt dort an, eine eingefügte Liste wird als Gliederung gelesen · <b>N</b> öffnet den Eingang für schnelle Gedanken – tippen oder diktieren, markieren und bündeln; seine Punkte oben links lassen sich antippen oder auf eine Kernidee ziehen.</p>';
    }
  }

  // ---------- structural render ----------
  // Bubbles are recreated on every render, so ordinary CSS transitions have
  // nothing to transition. Instead the old positions are captured first and the
  // new elements are animated back from them — the bubbles appear to move.
  function captureRects() {
    var map = {};
    eachEl(bubblesLayer.querySelectorAll('[data-role="core"],[data-role="detail"]'), function (el) {
      var key = el.getAttribute("data-detail-id") || el.getAttribute("data-core-id");
      if (!key) return;
      var r = el.getBoundingClientRect();
      if (!r.width) return;
      map[key] = { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height };
    });
    return map;
  }

  var ringMoving = false;
  function playFlip(prev) {
    if (!prev || !motionEnabled() || ringMoving) return;
    // FLIP measures with getBoundingClientRect, which reports the flattened 2D
    // projection of a 3D transform, and it finishes by clearing style.transform
    // — which is exactly where translateZ lives. In the cloud it would both
    // interpolate wrong and wipe the depth, so it sits this one out.
    if (state.scope) return;
    eachEl(bubblesLayer.querySelectorAll('[data-role="core"],[data-role="detail"]'), function (el) {
      var key = el.getAttribute("data-detail-id") || el.getAttribute("data-core-id");
      var was = prev[key];
      var r = el.getBoundingClientRect();
      if (!r.width) return;                    // no layout information available
      if (!was) {                              // genuinely new: let it pop in
        el.style.animation = "ihbPop " + (0.6 * speedFactor()) + "s cubic-bezier(.2,.9,.3,1.25)";
        return;
      }
      var dx = was.x - (r.left + r.width / 2);
      var dy = was.y - (r.top + r.height / 2);
      var sx = was.w / (r.width || 1);
      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5 && Math.abs(sx - 1) < 0.01) return;
      el.style.transition = "none";
      el.style.transform = "translate(" + dx + "px," + dy + "px) scale(" + sx + ")";
      void el.offsetWidth;                     // force the browser to accept the start state
      el.style.transition = "transform " + (0.8 * speedFactor()) + "s cubic-bezier(.22,.85,.25,1)";
      el.style.transform = "";
    });
  }

  function renderStructure() {
    var prevRects = captureRects();
    measureLayout();
    var L = layout;
    var R1 = pctOfMap(L.r1);
    function coreStyleFor(d) {
      return "width:" + d + "px;height:" + d + "px;margin-left:" + (-d / 2) + "px;margin-top:" + (-d / 2) + "px;";
    }
    var corePos = {};
    var cores = visibleCores();
    var showGhostCore = !state.scope && state.query.trim().length === 0 &&
      state.activeTags.length === 0 && cores.length < MAX_CORES;
    var coreSlots = cores.length + (showGhostCore ? 1 : 0);
    var linesHtml = "";
    var bubblesHtml = "";

    cores.forEach(function (core, i) {
      var angle = coreAngle(i, coreSlots);
      var pos = polar(HUB.x, HUB.y, pctOfMap(coreOrbit(core)), angle);
      corePos[core.id] = pos;
      var palette = paletteFor(core, i);
      var coreSearch = (core.text + " " + (core.subtitle || "") + " " + (core.tags || []).join(" ")).toLowerCase();
      var thisCoreD = coreDiameter(core);
      var detailSlots = detailSlotsFor(core);
      var showGhostDetail = detailSlots > core.details.length;
      var dMode = detailModeFor(core);
      var dSize = detailSizeFor(core);
      var detailStyleHere = "width:" + dSize.w + "px;height:" + dSize.h + "px;margin-left:" +
        (-dSize.w / 2) + "px;margin-top:" + (-dSize.h / 2) + "px;";
      var isFocusedCore = state.focusedId === core.id;
      var r2 = detailSlots ? pctOfMap(detailRadiusPx(detailSlots, thisCoreD, dSize, coreOrbit(core), isFocusedCore)) : 0;
      // An idea and its details are one object: they share a depth, otherwise
      // the crown stays stuck in the middle plane while its core floats away.
      var depthStyle = "";
      if (state.scope) {
        var z = depthFor(angle);
        depthStyle = "transform:translateZ(" + z.toFixed(1) + "px);--fog:" + fogFor(z) + ";";
      }
      var progress = coreProgress(core);
      var titleAttr = escapeHtml(core.text) + (progress.total ? " (" + progress.done + "/" + progress.total + " erledigt)" : "");

      if (!state.scope) {
        linesHtml += '<line data-line-core="' + core.id + '" data-line-kind="core" x1="' + HUB.x + '" y1="' + HUB.y + '" x2="' + pos.x + '" y2="' + pos.y + '" stroke="' + palette.core + '" stroke-width="0.35" opacity="0.45" />';
      }
      // The spoke doubles as the progress bar: it fills from the hub outwards as
      // the idea's details get done, so progress is legible across the whole map
      // and not only on the ring inside each bubble.
      if (progress.total && !state.scope) {
        var done = progress.done / progress.total;
        if (done > 0) {
          // The thicker fill begins at the hub's rim: starting it in the centre
          // showed a fat stub through the translucent glass.
          var hubR = (layout.hub / 2) / layout.width * 100;
          var ddx = pos.x - HUB.x, ddy = pos.y - HUB.y;
          var dlen = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
          var sx0 = HUB.x + ddx / dlen * hubR, sy0 = HUB.y + ddy / dlen * hubR;
          var fx = sx0 + (pos.x - sx0) * done;
          var fy = sy0 + (pos.y - sy0) * done;
          var full = done >= 1;
          linesHtml += '<line data-line-core="' + core.id + '" data-line-progress="' + core.id + '" ' +
            'x1="' + sx0 + '" y1="' + sy0 + '" x2="' + fx + '" y2="' + fy + '" ' +
            'stroke="' + (full ? (state.theme === "minimal" ? "#2FA894" : "#63D9C4") : palette.core) + '" stroke-width="' + (full ? 1.15 : 0.95) + '" ' +
            'stroke-linecap="round" opacity="' + (full ? 0.95 : 0.8) + '">' +
            "<title>" + progress.done + " von " + progress.total + " erledigt</title></line>";
        }
      }

      bubblesHtml += '' +
        '<div class="ihb-bubble ihb-core" role="button" tabindex="0" data-role="core" data-core-id="' + core.id + '" ' +
        'data-search="' + escapeHtml(coreSearch) + '" data-shadow="' + glassShadow(palette.rgb, palette.glow, true) + '" title="' + titleAttr + '" ' +
        'style="' + coreStyleFor(thisCoreD) + depthStyle + '--tint:' + palette.rgb + ';--x:' + pos.x + '%;--y:' + pos.y + '%;background:' + glassFill(palette.rgb, 1) + ';animation-delay:' + (i * 0.4) + 's;">' +
        progressRingSvg(progress, thisCoreD) +
        coreIconSvg(core.icon, 17) +
        '<span class="ihb-label">' + highlightMatch(core.text, state.query) + '</span>' +
        ((core.subtitle || "").trim() ? '<span class="ihb-sublabel">' + highlightMatch(core.subtitle, state.query) + '</span>' : "") +
        '<button type="button" class="ihb-editbtn" data-role="edit-core" data-core-id="' + core.id + '" aria-label="Titel bearbeiten">' + icon("pencil", 10) + '</button>' +
        '<button type="button" class="ihb-del" data-role="del-core" data-core-id="' + core.id + '" aria-label="Kernidee löschen">' + icon("x", 11) + '</button>' +
        '<button type="button" class="ihb-tagbtn' + (((core.tags && core.tags.length) || (core.notes && core.notes.trim()) || (core.subtitle && core.subtitle.trim()) || (core.icon && core.icon !== "none") || (core.color && core.color !== "auto")) ? " has-extra" : "") + '" data-role="tag-btn" data-core-id="' + core.id + '" aria-label="Tags und Beschreibung bearbeiten">' + icon("tag", 10) + '</button>' +
        '</div>';

      var spins = orbiting(core);
      var orbitOpen = "", orbitClose = "";
      if (spins) {
        var boxPx = 2 * (detailRadiusPx(detailSlots, thisCoreD, dSize, coreOrbit(core), isFocusedCore) + Math.max(dSize.w, dSize.h) / 2);
        var period = (70 + (i % 5) * 14) * speedFactor();                 // slightly different speeds feel organic
        var dir = (i % 2 === 0) ? "normal" : "reverse"; // and alternating directions
        orbitOpen = '<div class="ihb-orbit" data-orbit-core="' + core.id + '" style="left:' + pos.x + '%;top:' + pos.y +
          '%;width:' + boxPx + 'px;height:' + boxPx + 'px;margin-left:' + (-boxPx / 2) + 'px;margin-top:' + (-boxPx / 2) +
          'px;animation-duration:' + period + 's;animation-direction:' + dir + ';">';
        orbitClose = "</div>";
      }
      bubblesHtml += orbitOpen;
      var crownPct = crownGeometry(core, detailSlots);
      if (detailSlots) core.details.forEach(function (d, j) {
        var dp = detailPoint(core, angle, j, detailSlots, pos, r2,
          HUB, crownPct ? pctOfMap(crownPct.radius) : 0,
          pctOfMap(thisCoreD / 2), pctOfMap(Math.max(dSize.w, dSize.h) / 2));
        var st = detailStatus(d);
        // Lines live in a flat SVG sibling that knows nothing about depth, so in
        // the cloud they would run to where a bubble is not. Same reason the hub
        // spokes are left out there.
        if (!state.scope) {
          if (!spins) linesHtml += '<line data-line-core="' + core.id + '" data-line-detail="' + d.id + '" x1="' + pos.x + '" y1="' + pos.y + '" x2="' + dp.x + '" y2="' + dp.y + '" stroke="' + palette.core + '" stroke-width="0.25" opacity="0.4" />';
        }
        bubblesHtml += '' +
          '<div class="ihb-bubble ihb-detail' + (dMode === "mini" ? " ihb-detail-mini" : "") + '" role="button" tabindex="0" data-role="detail" data-core-id="' + core.id + '" data-detail-id="' + d.id + '" ' +
          'data-mode="' + dMode + '" data-status="' + st + '" ' +
          'data-shadow="' + glassShadow(palette.rgb, palette.glow, true) + '" title="' + escapeHtml(d.text + ((d.notes || "").trim() ? "\n\n" + d.notes.trim() : "")) + '" ' +
          'style="' + detailStyleHere + depthStyle + '--tint:' + palette.rgb + ';' + (spins ? orbitDotPos(j, detailSlots, boxPx, dSize) : '--x:' + dp.x + '%;--y:' + dp.y + '%;') + 'background:' + glassFill(palette.rgb, 0.72) + ';animation-delay:' + (i * 0.4 + j * 0.2 + 0.3) + 's;">' +
          (dMode === "full"
            ? '<span class="ihb-label">' + highlightMatch(d.text, state.query) + '</span>' +
              '<button type="button" class="ihb-del" data-role="del-detail" data-core-id="' + core.id + '" data-detail-id="' + d.id + '" aria-label="Detailidee löschen">' + icon("x", 10) + '</button>' +
              '<button type="button" class="ihb-statusbtn status-' + st + '" data-role="status-btn" data-core-id="' + core.id + '" data-detail-id="' + d.id + '" aria-label="Status: ' + st + ', antippen zum Ändern">' + (st === "erledigt" ? icon("check", 9) : "") + '</button>' +
              '<button type="button" class="ihb-notebtn' + ((d.notes || "").trim() ? " has-extra" : "") + '" data-role="detail-note" data-core-id="' + core.id + '" data-detail-id="' + d.id + '" aria-label="Beschreibung bearbeiten">' + icon("pencil", 9) + '</button>'
            : "") +
          '</div>';
      });

      bubblesHtml += orbitClose;
      if (showGhostDetail) {
        var gdp = detailPoint(core, angle, core.details.length, detailSlots, pos, r2,
          HUB, crownPct ? pctOfMap(crownPct.radius) : 0,
          pctOfMap(thisCoreD / 2), pctOfMap(Math.max(dSize.w, dSize.h) / 2));
        bubblesHtml += '<div class="ihb-bubble ihb-detail ihb-ghost" role="button" tabindex="0" data-role="ghost-detail" data-core-id="' + core.id + '" ' +
          'style="' + detailStyleHere + depthStyle + '--x:' + gdp.x + '%;--y:' + gdp.y + '%;" aria-label="Detail hinzufügen">' + icon("plus", 14) + '</div>';
      }
    });

    if (showGhostCore) {
      var gAngle = clusterAngles().ghost + ringRotation();
      var gPos = polar(HUB.x, HUB.y, R1, gAngle);
      bubblesHtml += '<div class="ihb-bubble ihb-core ihb-ghost" role="button" tabindex="0" data-role="ghost-core" ' +
        'style="' + coreStyleFor(L.core * roomFactor(GHOST_ID)) + '--x:' + gPos.x + '%;--y:' + gPos.y + '%;" aria-label="Neue Kernidee hinzufügen">' + icon("plus", 18) + '</div>';
    }

    groupBubbles().forEach(function (g) {
      var gp = polar(HUB.x, HUB.y, pctOfMap(g.radius), g.angle);
      var gd = pctOfMap(g.d);
      // Colour follows the first member so the bubble reads as belonging to
      // that cloud rather than as a separate kind of thing.
      var firstIdx = 0;
      for (var mi = 0; mi < cores.length; mi++) if (cores[mi].id === g.memberIds[0]) firstIdx = mi;
      var gpal = paletteFor(cores[firstIdx], firstIdx);
      var voll = g.tags.length ? g.tags.join(" · ") : g.memberIds.length + " Ideen";
      var label = (g.tagsShown && g.tagsShown.length) ? g.tagsShown.join(" · ") : voll;
      var gekuerzt = label !== voll;
      bubblesHtml += '<div class="ihb-bubble ihb-group" role="button" tabindex="0" data-role="group" ' +
        'data-group-key="' + escapeHtml(g.key) + '" data-group-members="' + escapeHtml(g.memberIds.join(",")) + '" ' +
        'data-shadow="' + glassShadow(gpal.rgb, gpal.glow, true) + '" ' +
        'title="' + escapeHtml(voll) + " · " + g.memberIds.length + ' Kernideen" ' +
        'style="width:' + g.d + "px;height:" + g.d + "px;margin-left:" + (-g.d / 2) + "px;margin-top:" + (-g.d / 2) + "px;" +
        '--x:' + gp.x + '%;--y:' + gp.y + '%;background:' + glassFill(gpal.rgb, 1) + ';">' +
        '<span class="ihb-grouplabel" style="font-size:' + g.fontPx.toFixed(1) + 'px;">' +
        escapeHtml(label) + (gekuerzt ? ' …' : "") + '</span>' +
        (g.showCount ? '<span class="ihb-groupcount">' + g.memberIds.length + ' Ideen</span>' : "") +
        '</div>';
    });

    linesLayer.innerHTML = (state.scope ? "" : ringGuideSvg() + crossLinkSvg(corePos)) + linesHtml;
    bubblesLayer.innerHTML = bubblesHtml;
    bubblesLayer.classList.toggle("ihb-3d", !!state.scope);
    bubblesLayer.style.perspective = state.scope ? perspectivePx().toFixed(0) + "px" : "";
    bubblesLayer.style.perspectiveOrigin = state.scope ? "50% 50%" : "";
    if (ringAnim.raf && bubblesLayer) bubblesLayer.classList.add("ihb-tweening");
    playFlip(prevRects);
    applyFilter();
    updateHubCount();
    renderCaptionOrQuickCreate();
    renderTagFilterBar();
    renderFocusPill();
    applyHubSize();
  }

  function applyHubSize() {
    var L = layout;
    var hub = hubEl;
    if (!hub) return;
    layoutHub();   // the two halves and the display carry the sizing now

    // Everything inside the hub is measured against the hub itself, so the
    // content actually grows with it instead of staying pinned to a fixed size.
    var pad = L.hub * 0.085;
    if (hubFace) hubFace.style.gap = Math.max(3, L.hub * 0.028) + "px";
    var contentW = L.hub - 2 * pad;

    var wrap = searchWrap;
    if (wrap) {
      // A circle is widest at its middle, which is exactly where the search sits,
      // so the pill may reach past the text column without clipping.
      var pillW = L.hub * 0.95;
      var bleed = -(pillW - contentW) / 2;
      wrap.style.width = pillW + "px";
      wrap.style.marginLeft = bleed + "px";
      wrap.style.marginRight = bleed + "px";
      wrap.style.padding = Math.max(4, L.hub * 0.026) + "px " + Math.max(8, L.hub * 0.042) + "px";
    }
    var titleEl = document.getElementById("hubTitle");
    if (titleEl) titleEl.style.fontSize = Math.max(11, Math.min(21, L.hub * 0.085)) + "px";
    var searchEl2 = document.getElementById("searchInput");
    if (searchEl2) searchEl2.style.fontSize = Math.max(10, Math.min(16, L.hub * 0.063)) + "px";
    // auf kleinen Hubs passt der lange Platzhalter nicht hinein
    if (searchEl2) searchEl2.setAttribute("placeholder", L.hub < 170 ? "Suchen …" : "Ideen durchsuchen…");
    if (hubCountEl) hubCountEl.style.fontSize = Math.max(8, Math.min(12, L.hub * 0.048)) + "px";
    // The reading panel is a rectangle, so the text can simply use a comfortable
    // fixed size instead of being squeezed to fit a circle.
    // Headline type follows each bubble's own diameter, so the focused idea
    // really does read as zoomed in rather than just being a bigger circle.
    eachEl(bubblesLayer.querySelectorAll('[data-role="core"]'), function (bubble) {
      var d = parseFloat(bubble.style.width) || L.core;
      var label = bubble.querySelector(".ihb-label");
      if (label) label.style.fontSize = Math.max(9, Math.min(22, d * 0.135)) + "px";
      var sub = bubble.querySelector(".ihb-sublabel");
      if (sub) sub.style.fontSize = Math.max(7.5, Math.min(14, d * 0.093)) + "px";
      var ic = bubble.querySelector(".ihb-coreicon");
      if (ic) {
        var isz = Math.max(12, Math.min(26, d * 0.15));
        ic.setAttribute("width", isz);
        ic.setAttribute("height", isz);
      }
    });
    eachEl(bubblesLayer.querySelectorAll(".ihb-detail .ihb-label"), function (el) {
      el.style.fontSize = Math.max(7.5, Math.min(12, L.detailW * 0.155)) + "px";
    });
    fitHeadlines();
  }

  // Last-resort fit: if a headline still does not fit its bubble, step the type
  // down until it does. Uses the real rendered height, so it is exact rather
  // than an estimate. Silently skipped where measurement is unavailable.
  function fitHeadlines() {
    eachEl(bubblesLayer.querySelectorAll('[data-role="core"]'), function (bubble) {
      var label = bubble.querySelector(".ihb-label");
      if (!label) return;
      var small = parseFloat(bubble.style.width) || 0;
      var padX = small && small < 80 ? Math.max(2, Math.round(small * 0.05)) + "px" : "";
      bubble.style.paddingLeft = padX;
      bubble.style.paddingRight = padX;
      var startFont = parseFloat(label.style.fontSize) || 12;
      var box = bubble.clientHeight;
      if (!box) return; // no layout information available
      var sub = bubble.querySelector(".ihb-sublabel");
      var icon = bubble.querySelector(".ihb-coreicon");
      var reserved = (sub ? sub.offsetHeight : 0) + (icon ? icon.offsetHeight + 2 : 0);
      var budget = box * 0.82 - reserved;
      if (budget <= 0) return;
      var font = startFont;
      var guard = 0;
      while (label.scrollHeight > budget && font > 8 && guard < 14) {
        font -= 0.7;
        label.style.fontSize = font + "px";
        guard++;
      }
      // If it still does not fit at the minimum size, the tooltip carries the
      // full text (already set via the title attribute).
      var fs = parseFloat(bubble.style.width) || 0;
      var fits = fitLongestWord(bubble, label, fs, fs && fs < 80 ? 7 : 8.5);   // zurueckgetretene duerfen kleiner werden
      if (sub) fitLongestWord(bubble, sub, fs, 6.5);
      var off = !fits && fs > 0 && fs < 44;
      setLabelOff(bubble, label, sub, off);
      if (off) label.removeAttribute("data-fit");
      else label.setAttribute("data-fit", label.style.fontSize);      // Zielschrift fuer die Drehung merken
      label.setAttribute("data-fit-d", fs);

      var cs = getComputedStyle(bubble);
      label.setAttribute("data-fit-in", (bubble.offsetWidth - bubble.clientWidth) + (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0));
    });

    eachEl(bubblesLayer.querySelectorAll('[data-role="detail"]'), function (bubble) {
      var label = bubble.querySelector(".ihb-label");
      if (label) fitLongestWord(bubble, label, parseFloat(bubble.style.width) || 0, 7);
    });
  }

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      resetCamera(false);
      if (!state.editing) renderStructure();
      positionHubEditor();
    }, 150);
  });

  // ---------- entering and leaving a cloud ----------
  // The flight is a dolly, not a cut: the camera zooms until the group bubble
  // fills exactly the space the hub occupies, and only then is the ring swapped
  // underneath. At that moment both images agree in size and position, so the
  // swap itself is invisible and the movement reads as one continuous motion.
  var scopeAnim = null;

  function groupFlightMs() {
    // matches the .ihb-cam-anim transition: 0.35s scaled by the speed setting
    return Math.round(350 * speedFactor() / 1.5);
  }

  function enterGroup(memberIds) {
    if (!memberIds || memberIds.length < 2) return;
    if (state.scope) return;
    clearTimeout(scopeAnim);
    // A focused idea and a scope are two different zooms; the focus goes first.
    if (state.focusedId !== null) { state.focusedId = null; state.selectedDetail = null; }
    var target = null;
    groupBubbles().forEach(function (g) {
      if (g.memberIds.join(",") === memberIds.join(",")) target = g;
    });
    var finish = function () {
      state.scope = { memberIds: memberIds.slice() };
      resetCamera(false);          // the scope is the zoom now, the camera is not
      renderStructure();
      startRingTween(ringTarget());
    };
    if (!target || !motionEnabled()) { finish(); return; }
    var W = layout.width || REF;
    var c = W / 2;
    var sx = c + target.radius * Math.cos(target.angle);
    var sy = c + target.radius * Math.sin(target.angle);
    // zoom so the bubble ends up the size the hub has, capped by MAX_ZOOM
    var factor = Math.min(MAX_ZOOM, Math.max(1.2, layout.hub / target.d)) / camera.zoom;
    zoomAt(sx, sy, factor, true);
    scopeAnim = setTimeout(finish, groupFlightMs());
  }

  function leaveGroup() {
    if (!state.scope) return;
    clearTimeout(scopeAnim);
    var members = state.scope.memberIds.slice();
    state.scope = null;
    state.focusedId = null;
    state.selectedDetail = null;
    renderStructure();
    startRingTween(ringTarget());
    if (!motionEnabled()) { resetCamera(false); return; }
    // Mirror image of the way in: start zoomed in on where the bubble now sits
    // in the overview, then pull back out to the resting view.
    var target = null;
    groupBubbles().forEach(function (g) {
      if (g.memberIds.join(",") === members.join(",")) target = g;
    });
    if (!target) { resetCamera(true); return; }
    var W = layout.width || REF;
    var c = W / 2;
    var sx = c + target.radius * Math.cos(target.angle);
    var sy = c + target.radius * Math.sin(target.angle);
    setCamera(1, 0, 0, false);
    zoomAt(sx, sy, Math.min(MAX_ZOOM, Math.max(1.2, layout.hub / target.d)), false);
    // next frame, so the browser has the start state before the transition
    requestAnimationFrame(function () { resetCamera(true); });
  }

  function scopeTitle() {
    if (!state.scope) return "";
    var members = state.scope.memberIds.map(coreById).filter(Boolean);
    var tags = groupTitle(members);
    return tags.length ? tags.join(" · ") : members.length + " Ideen";
  }

  function renderFocusPill() {
    // The scope owns the pill while it is active: leaving the cloud is the more
    // important way out, and two pills stacked would only compete.
    if (state.scope) {
      focusPillText.textContent = "Wolke: " + scopeTitle();
      focusPill.className = "ihb-focuspill show";
      return;
    }
    if (state.focusedId === null) { focusPill.className = "ihb-focuspill"; return; }
    var f = coreById(state.focusedId);
    if (!f) { state.focusedId = null; focusPill.className = "ihb-focuspill"; return; }
    focusPillText.textContent = "Fokus: " + (f.text || "Unbenannt");
    focusPill.className = "ihb-focuspill show";
  }

  // Position of one dot inside its rotating wrapper, evenly spaced all the way
  // around: a partial fan would look like a wobble rather than an orbit.
  function orbitDotPos(index, total, boxPx, size) {
    var r = boxPx / 2 - Math.max(size.w, size.h) / 2;
    var a = (index / Math.max(1, total)) * Math.PI * 2 - Math.PI / 2;
    var x = boxPx / 2 + r * Math.cos(a);
    var y = boxPx / 2 + r * Math.sin(a);
    return "--x:" + ((x / boxPx) * 100) + "%;--y:" + ((y / boxPx) * 100) + "%;";
  }

  function ringGuideSvg() {

    }).join("");
  }

  function crossLinkSvg(corePos) {
    if (!state.showLinks) return "";
    var links = crossLinks();
    if (!links.length) return "";
    var clearPct = (layout.hub / 2 / layout.width) * 100 + 7;
    // a focus pointing at an idea that no longer exists counts as no focus
    var focusing = state.focusedId !== null && visibleCores().some(function (c) { return c.id === state.focusedId; });
    var filtering = state.activeTags.length > 0;
    var html = "";
    for (var i = 0; i < links.length; i++) {
      var l = links[i];
      var pa = corePos[l.aId], pb = corePos[l.bId];
      if (!pa || !pb) continue;
      var opacity, width;
      if (focusing) {
        // while focused, only that idea's connections matter
        if (l.aId !== state.focusedId && l.bId !== state.focusedId) continue;
        opacity = 0.6; width = 0.32;
      } else if (filtering) {
        var hit = false;
        for (var t = 0; t < l.tags.length; t++) {
          if (state.activeTags.indexOf(l.tags[t]) !== -1) { hit = true; break; }
        }
        if (!hit) continue;
        opacity = 0.5; width = 0.3;
      } else {
        opacity = 0.2; width = 0.25;
      }
      html += '<path class="ihb-crosslink" data-link-a="' + l.aId + '" data-link-b="' + l.bId + '" ' +
        'd="' + linkPath(pa.x, pa.y, pb.x, pb.y, clearPct) + '" fill="none" ' +
        'stroke="#c9beff" stroke-width="' + width + '" stroke-dasharray="1.4 1.4" ' +
        'stroke-linecap="round" opacity="' + opacity + '">' +
        "<title>Gemeinsame Tags: " + escapeHtml(l.tags.join(", ")) + "</title></path>";
    }
    return html;
  }

  function renderStars() {
    var html = "";
    for (var i = 0; i < 46; i++) {
      var x = Math.random() * 100, y = Math.random() * 100;
      var size = Math.random() * 1.6 + 0.6, delay = Math.random() * 6, dur = 4 + Math.random() * 5;
      html += '<span class="ihb-star" style="left:' + x + '%;top:' + y + '%;width:' + size + 'px;height:' + size + 'px;animation-duration:' + dur + 's;animation-delay:' + delay + 's;"></span>';
    }
    starsLayer.innerHTML = html;
  }

  // ---------- persistence ----------
  // Im Claude-Chat stellt der Host window.storage bereit; ueberall sonst
  // (GitHub Pages, lokal geoeffnete Datei, Handy) gibt es nur localStorage.
  // Beide sitzen hinter derselben Schnittstelle, damit eine Idee nirgends
  // still verloren geht. Entschieden wird bei jedem Aufruf neu, so bleibt das
  // Verhalten im Chat genau wie bisher. Vorrang beim Start: verbundener Ordner,
  // dann Chat-Speicher, dann localStorage, sonst die Beispielideen.
  // Auf GitHub Pages teilen sich alle Werkbank-Werkzeuge einen localStorage;
  // das Praefix haelt die Schluessel von IdeaHub von denen der anderen fern.
  var LOCAL_PREFIX = "ideahub:";
  var localUsable = null;          // null = noch nicht geprueft
  var storeFailed = false;         // letzter Schreibversuch gescheitert
  var folderSuppliedCores = false; // der Ordner hat die Ideen schon geliefert
  function localStoreUsable() {
    if (localUsable !== null) return localUsable;
    try {
      var probe = LOCAL_PREFIX + "probe";
      window.localStorage.setItem(probe, "1");
      window.localStorage.removeItem(probe);
      localUsable = true;
    } catch (e) {
      localUsable = false;   // Privatmodus, gesperrte Websitedaten, alte Hosts
    }
    return localUsable;
  }
  function storageKind() {
    var s = window.storage;
    if (s && typeof s.get === "function" && typeof s.set === "function") return "chat";
    return localStoreUsable() ? "local" : "none";
  }
  function storeGet(key) {
    try {
      var kind = storageKind();
      if (kind === "chat") return Promise.resolve(window.storage.get(key, false)).catch(function () { return null; });
      if (kind === "local") {
        var v = window.localStorage.getItem(LOCAL_PREFIX + key);
        return Promise.resolve(v === null ? null : { value: v });
      }
    } catch (e) { /* ein gesperrter Speicher zaehlt wie ein leerer */ }
    return Promise.resolve(null);
  }
  function storeSet(key, value) {
    try {
      var kind = storageKind();
      if (kind === "chat") {
        return Promise.resolve(window.storage.set(key, value, false))
          .then(function () { noteStoreResult(true); }, function () { noteStoreResult(false); });
      }
      if (kind === "local") {
        window.localStorage.setItem(LOCAL_PREFIX + key, value);
        noteStoreResult(true);
      }
    } catch (e) {
      // z. B. QuotaExceededError: ein voller Speicher darf die App nicht anhalten
      noteStoreResult(false);
    }
    return Promise.resolve();
  }
  function noteStoreResult(ok) {
    if (storeFailed === !ok) return;
    storeFailed = !ok;
    try {
      renderCaptionOrQuickCreate();
      if (state.view === "tree") renderTree();
      renderSettingsModal();
    } catch (e) { /* der Hinweis ist Beiwerk, nie ein Grund zum Abbruch */ }
  }
  // Was die Oberflaeche ueber den Speicher sagen muss; leer heisst: alles gut.
  function storageWarning() {
    if (storeFailed) {
      return "Speichern fehlgeschlagen – der Speicher ist voll oder gesperrt. " +
        "Sichere deine Ideen über Einstellungen → Export oder Backup.";
    }
    if (storageKind() === "none") {
      return "Dieser Browser lässt kein Speichern zu – neue Ideen sind nach dem Neuladen weg. " +
        "Sichere sie über Einstellungen → Export oder Backup.";
    }
    return "";
  }
  function storageNote() {
    var warn = storageWarning();
    if (warn) return warn;
    return storageKind() === "chat"
      ? "Ideen werden außerdem automatisch in diesem Chat gespeichert."
      : "Ideen werden außerdem automatisch in diesem Browser gespeichert – nur auf diesem Gerät.";
  }
  function storageWarnHtml(cls) {
    var warn = storageWarning();
    return warn ? '<p class="' + cls + ' ihb-caption-warn" data-role="storage-warn">' + escapeHtml(warn) + "</p>" : "";
  }

  var persistTimer = null;
  function schedulePersist() {
    stampCoreChanges();   // jede gespeicherte Aenderung bekommt ihr Datum
    if (!state.loaded || storageKind() === "none") return;
    clearTimeout(persistTimer);
    persistTimer = setTimeout(function () {
      persistTimer = null;
      storeSet(STORAGE_KEY, JSON.stringify(state.cores));
    }, 500);
  }
  // Wer kurz nach dem Eintippen neu laedt oder den Tab schliesst (am Handy oft
  // ohne Vorwarnung), wuerde sonst die letzte halbe Sekunde verlieren.
  function flushPersist() {
    if (!persistTimer) return;
    clearTimeout(persistTimer);
    persistTimer = null;
    if (state.loaded && storageKind() !== "none") storeSet(STORAGE_KEY, JSON.stringify(state.cores));
  }
  window.addEventListener("pagehide", flushPersist);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") flushPersist();
  });
  function loadPersisted() {
    if (storageKind() === "none") { state.loaded = true; applyTheme(); return Promise.resolve(); }
    return storeGet(THEME_KEY).then(function (tRes) {
      // Das Werkbank-Aussehen hat Vorrang vor dem alten Chat-Speicher.
      if (tRes && (tRes.value === "minimal" || tRes.value === "space") && !wbThemeLesen()) state.theme = tRes.value;
      applyTheme();
      return storeGet(LINKS_KEY);
    }).then(function (lRes) {
      if (lRes && (lRes.value === "0" || lRes.value === "1")) state.showLinks = lRes.value === "1";
      return storeGet(ROTATE_KEY);
    }).then(function (rRes) {
      if (rRes && (rRes.value === "0" || rRes.value === "1")) state.rotate = rRes.value === "1";
      return storeGet(CLUSTER_KEY);
    }).then(function (cRes) {
      if (cRes && (cRes.value === "0" || cRes.value === "1")) state.cluster = cRes.value === "1";
      return storeGet(VIEW_KEY);
    }).then(function (vRes) {
      if (vRes && (vRes.value === "map" || vRes.value === "tree")) state.view = vRes.value;
      return storeGet(MOTION_KEY);
    }).then(function (mRes) {
      if (mRes && (mRes.value === "0" || mRes.value === "1")) state.motion = mRes.value === "1";
      applyMotion();
      return storeGet(SPEED_KEY);
    }).then(function (spRes) {
      if (spRes && SPEEDS[spRes.value]) state.speed = spRes.value;
      applySpeed();
      return storeGet(START_KEY);
    }).then(function (stRes) {
      if (stRes && (stRes.value === "eingang" || stRes.value === "karte")) state.phoneStart = stRes.value;
      return storeGet(COMPOST_DAYS_KEY);
    }).then(function (kdRes) {
      if (kdRes && COMPOST_DAY_CHOICES.indexOf(Number(kdRes.value)) !== -1) state.compostDays = Number(kdRes.value);
      return storeGet(COMPOST_KEY);
    }).then(function (kRes) {
      if (kRes && kRes.value) {
        try {
          var stored = JSON.parse(kRes.value);
          // was der Ordner schon geliefert hat, gilt; dazu, was nur hier lag
          if (Array.isArray(stored)) state.compost = unionById(state.compost, stored.filter(function (c) { return c && typeof c === "object"; }).map(cleanBackupCore));
        } catch (e) { /* kaputter Eintrag: Kompost bleibt wie er ist */ }
      }
      return storeGet(INBOX_KEY);
    }).then(function (iRes) {
      if (iRes && iRes.value) {
        try {
          // was vor dem Laden schon festgehalten wurde, bleibt erhalten
          var stored = cleanInbox(JSON.parse(iRes.value));
          if (!folderSuppliedInbox) {
            state.inbox = mergeInbox(stored, state.inbox);
          } else {
            // der Ordner war schneller: er gilt, dazu nur, was er noch nicht kennen konnte
            var had = state.inbox.length;
            state.inbox = mergeInbox(state.inbox, freshSinceFolder(stored));
            if (state.inbox.length > had) scheduleFolderSync();
          }
        } catch (e) { /* kaputter Eintrag: Eingang bleibt wie er ist */ }
      }
      return storeGet(STORAGE_KEY);
    }).then(function (res) {
      // Ordner und Speicher laden beim Start gleichzeitig. Hat der Ordner die
      // Ideen schon geliefert, darf der spaeter eintreffende Speicherstand sie
      // nicht mehr ueberschreiben: der verbundene Ordner hat Vorrang.
      if (res && res.value && !folderSuppliedCores) {
        try {
          var parsed = JSON.parse(res.value);
          if (Array.isArray(parsed) && parsed.length) state.cores = parsed;
        } catch (e) {}
      }
      stampCoreChanges(true);   // geladener Stand ist die Vergleichsbasis, keine Aenderung
      dropCompostOnMap();
      state.loaded = true;
    });
  }

  // ---------- folder sync ----------
  var folderSyncTimer = null;
  // The picked folder is remembered across reloads. A browser will not accept a
  // typed path — it only ever hands out a handle you confirmed in a dialog — but
  // that handle can be kept in IndexedDB and re-permissioned on the next visit,
  // which is the closest thing to "keep using this folder".
  var IDB_NAME = "ideahub-folder", IDB_STORE = "handles";
  function idbOpen() {
    return new Promise(function (resolve, reject) {
      if (typeof indexedDB === "undefined") { reject(new Error("no idb")); return; }
      var req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }
  function idbPut(key, value) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).put(value, key);
        tx.oncomplete = function () { resolve(true); };
        tx.onerror = function () { reject(tx.error); };
      });
    }).catch(function () { return false; });
  }
  function idbGet(key) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve) {
        var tx = db.transaction(IDB_STORE, "readonly");
        var r = tx.objectStore(IDB_STORE).get(key);
        r.onsuccess = function () { resolve(r.result || null); };
        r.onerror = function () { resolve(null); };
      });
    }).catch(function () { return null; });
  }

  // Reads every .md file in the connected folder into the map.
  function loadFromFolder(handle) {
    var loaded = [], map = new Map(), inboxLoaded = null, inboxStand = null, compostLoaded = null;
    var files = new Map(), others = 0;   // Pfad -> { t, how, text }; Eintraege, die IdeaHub nicht anfasst
    var iter = handle.entries();
    function step() {
      return iter.next().then(function (res) {
        if (res.done) return;
        var name = res.value[0], entry = res.value[1];
        if (entry.kind === "directory" && name.toLowerCase() === COMPOST_DIR.toLowerCase()) {
          return readCompostDir(entry, files).then(function (r) { compostLoaded = r; }).then(step);
        }
        if (entry.kind === "file" && name.toLowerCase().slice(-3) === ".md") {
          return entry.getFile()
            .then(function (file) {
              var t = file.lastModified;
              return file.text().then(function (text) { files.set(name, { t: t || Date.now(), how: "geändert", text: text }); return text; });
            })
            .then(function (text) {
              if (isInboxMd(text, name)) {   // nie als Kernidee
                inboxLoaded = parseInboxMd(text);
                inboxStand = inboxMdStand(text);
                files.get(name).sig = inboxToMd(inboxLoaded);   // Inhalt ohne Stand, zum Vergleich beim Schreiben
                return;
              }
              var core = parseMdToCore(text, name);
              loaded.push(core);
              map.set(core.id, name);
            })
            .then(step);
        }
        others++;   // gehoert nicht zu IdeaHub, bleibt unberuehrt
        return step();
      });
    }
    return step().then(function () {
      return { cores: loaded, map: map, inbox: inboxLoaded, inboxStand: inboxStand, compost: compostLoaded, files: files, others: others };
    });
  }

  function adoptFolder(handle, replaceCores) {
    return loadFromFolder(handle).then(function (res) {
      writtenFiles = res.map;
      folderFiles = res.files || new Map();
      folderOthers = res.others || 0;
      folderPreview = null;
      state.dirHandle = handle;
      state.folderName = handle.name;
      inboxFileKnown = !!res.inbox;
      if (replaceCores && res.inbox) {
        // Der Ordner ist massgeblich wie bei den Ideen. Was lokal nach seinem
        // letzten Stand dazukam (z. B. per Link, waehrend die Freigabe fehlte), bleibt.
        folderInboxSince = res.inboxStand ? Date.parse(res.inboxStand) : null;
        state.inbox = mergeInbox(res.inbox, freshSinceFolder(state.inbox));
        folderSuppliedInbox = true;
        if (state.inbox.length > res.inbox.length) persistInbox();   // die neuen auch in die Datei
        else if (state.loaded && storageKind() !== "none") storeSet(INBOX_KEY, JSON.stringify(state.inbox));
        updateInboxBadge();
        if (inboxOpen()) renderInbox();
      }
      if (replaceCores && res.cores.length) {
        state.cores = res.cores;
        stampCoreChanges(true);   // die Dateien bringen ihr eigenes updated mit
        folderSuppliedCores = true;
        renderCurrentView();
        schedulePersist();
      }
      compostDirKnown = !!res.compost;
      if (res.compost) compostFiles = res.compost.map;
      if (replaceCores && res.compost) {
        // der Ordner gilt; was nur hier im Kompost lag, bleibt und wandert hinein
        var before = state.compost.length;
        state.compost = unionById(res.compost.cores, state.compost);
        dropCompostOnMap();
        if (state.compost.length > res.compost.cores.length) persistCompost();
        else if (state.loaded && storageKind() !== "none") storeSet(COMPOST_KEY, JSON.stringify(state.compost));
        if (state.compost.length !== before) renderCurrentView();
      }
      state.folderStatus = res.cores.length
        ? "Verbunden · " + res.cores.length + " Dateien gelesen"
        : "Verbunden · Ordner war leer";
      renderSettingsModal();
      return idbPut("dir", handle);
    });
  }

  // On startup: if the permission is still granted, pick the folder back up
  // silently; otherwise offer a button, since asking again needs a click.
  function restoreFolder() {
    if (!folderSupported) return;
    idbGet("dir").then(function (handle) {
      if (!handle || !handle.queryPermission) return;
      return handle.queryPermission({ mode: "readwrite" }).then(function (perm) {
        if (perm === "granted") return adoptFolder(handle, true);
        pendingFolderHandle = handle;
        state.folderStatus = "Ordner „" + handle.name + "\" wartet auf Freigabe";
        renderSettingsModal();
      });
    }).catch(function () { /* no folder remembered */ });
  }

  var pendingFolderHandle = null;
  function regrantFolder() {
    if (!pendingFolderHandle || !pendingFolderHandle.requestPermission) return;
    pendingFolderHandle.requestPermission({ mode: "readwrite" }).then(function (perm) {
      if (perm !== "granted") { state.folderStatus = "Freigabe abgelehnt"; renderSettingsModal(); return; }
      var h = pendingFolderHandle;
      pendingFolderHandle = null;
      return adoptFolder(h, true);
    }).catch(function () {});
  }

  function reloadFromFolder() {
    if (!state.dirHandle) return;
    state.folderStatus = "Lade neu…";
    renderSettingsModal();
    adoptFolder(state.dirHandle, true).catch(function () {
      state.folderStatus = "Neu laden fehlgeschlagen";
      renderSettingsModal();
    });
  }

  function scheduleFolderSync() {
    if (!state.dirHandle) return;
    clearTimeout(folderSyncTimer);
    folderSyncTimer = setTimeout(syncToFolder, 300);
  }
  function syncToFolder() {
    var handle = state.dirHandle;
    if (!handle) return Promise.resolve();
    var currentIds = {};
    state.cores.forEach(function (c) { currentIds[c.id] = true; });
    var deletions = [];
    writtenFiles.forEach(function (fname, id) {
      if (!currentIds[id]) deletions.push([id, fname]);
    });
    var chain = Promise.resolve();
    deletions.forEach(function (pair) {
      chain = chain.then(function () {
        return handle.removeEntry(pair[1]).catch(function () {}).then(function () {
          writtenFiles.delete(pair[0]);
          folderFiles.delete(pair[1]);
        });
      });
    });
    state.cores.forEach(function (core) {
      chain = chain.then(function () {
        var fname = coreFilename(core);
        var prevName = writtenFiles.get(core.id);
        var pre = Promise.resolve();
        if (prevName && prevName !== fname) {
          pre = handle.removeEntry(prevName).catch(function () {});
        }
        var md = coreToMd(core), known = folderFiles.get(fname);
        // unveraendert: nicht neu schreiben - schont die Platte und laesst die Zeitpunkte ehrlich
        if (prevName === fname && known && known.text === md) return;
        return pre.then(function () {
          if (prevName && prevName !== fname) folderFiles.delete(prevName);
          return handle.getFileHandle(fname, { create: true }).then(function (fh) {
            return fh.createWritable().then(function (w) {
              return w.write(md).then(function () { return w.close(); }).then(function () {
                writtenFiles.set(core.id, fname);
                folderFiles.set(fname, { t: Date.now(), how: "geschrieben", text: md });
              });
            });
          });
        });
      });
    });
    chain = chain.then(function () {
      // auch ein geleerter Eingang wird geschrieben, sonst kaeme Erledigtes zurueck
      if (!state.inbox.length && !inboxFileKnown) return;
      var sig = inboxToMd(state.inbox), known = folderFiles.get(INBOX_FILE);
      if (known && known.sig === sig) return;   // nichts Neues im Eingang
      var text = inboxToMd(state.inbox, new Date().toISOString());
      return handle.getFileHandle(INBOX_FILE, { create: true }).then(function (fh) {
        return fh.createWritable().then(function (w) {
          return w.write(text).then(function () { return w.close(); });
        });
      }).then(function () {
        inboxFileKnown = true;
        folderFiles.set(INBOX_FILE, { t: Date.now(), how: "geschrieben", text: text, sig: sig });
      });
    });
    chain = chain.then(function () { return syncCompostDir(handle); });
    return chain.then(function () {
      state.folderStatus = "Synchronisiert · " + folderRows().length + " Dateien";   // mit Eingang und Kompost
      renderSettingsModal();
    }).catch(function () {
      state.folderStatus = "Synchronisierung fehlgeschlagen";
      renderSettingsModal();
    });
  }
  function connectFolder() {
    if (!folderSupported) return;
    window.showDirectoryPicker({ mode: "readwrite" }).then(function (handle) {
      state.folderStatus = "Verbinde…";
      renderSettingsModal();
      return adoptFolder(handle, true).then(function () { return syncToFolder(); });
    }).catch(function () {
      state.folderStatus = "";
      renderSettingsModal();
    });
  }
  function disconnectFolder() {
    idbPut("dir", null);
    pendingFolderHandle = null;
    state.dirHandle = null;
    state.folderName = "";
    state.folderStatus = "";
    writtenFiles = new Map();
    renderSettingsModal();
  }

  // ---------- export / import ----------
  // Which ideas an export covers should match what the filters currently show —
  // otherwise "export" quietly means something different from what is on screen.
  function filteredCores() {
    var f = evaluateFilters();
    if (!f.anyFilter) return state.cores;
    return state.cores.filter(function (c) {
      var e = f.perCore.get(c.id);
      if (!e) return true;
      if (e.coreActive) return true;
      var any = false;
      c.details.forEach(function (d) { if (e.details.get(d.id)) any = true; });
      return any;
    });
  }

  function exportLabel() {
    var n = filteredCores().length, all = state.cores.length;
    return n === all
      ? "Als .md-Dateien exportieren (" + all + ")"
      : "Gefilterte als .md exportieren (" + n + " von " + all + ")";
  }

  function exportAll() {
    filteredCores().forEach(function (core, i) {
      setTimeout(function () {
        var blob = new Blob([coreToMd(core)], { type: "text/markdown" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = coreFilename(core);
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, i * 150);
    });
    // ohne Filter gehoert der Eingang dazu; ein gefilterter Export bleibt bei den Ideen
    if (state.inbox.length && !state.query.trim() && !state.activeTags.length) {
      setTimeout(function () { downloadText(INBOX_FILE, inboxToMd(state.inbox)); }, filteredCores().length * 150);
    }
  }
  function exportJson() {
    var payload = {
      format: "ideahub",
      version: 1,
      exported: new Date().toISOString(),
      theme: state.theme,

      // whole map, so a filtered backup would silently destroy what it omits.
      cores: state.cores,
      inbox: state.inbox,
      compost: state.compost

    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });

    a.href = url;
    a.download = "ideahub-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

  }

  // Bereinigt eine Kernidee aus einem Backup, damit aeltere oder von Hand
  // bearbeitete Dateien sauber laden (auch fuer den Kompost).
  function cleanBackupCore(c) {
    return {
      id: c.id || nextId(),
      text: typeof c.text === "string" ? c.text : "",
      subtitle: typeof c.subtitle === "string" ? c.subtitle : "",
      icon: CORE_ICONS.hasOwnProperty(c.icon) ? c.icon : "none",
      color: colorChoiceByKey(c.color) ? c.color : "auto",
      tags: Array.isArray(c.tags) ? c.tags.filter(function (t) { return typeof t === "string"; }) : [],
      notes: typeof c.notes === "string" ? c.notes : "",
      created: c.created,
      updated: validIso(c.updated),
      composted: validIso(c.composted),
      details: Array.isArray(c.details) ? c.details.filter(function (d) { return d && typeof d === "object"; }).map(function (d) {
        return {
          id: d.id || nextId(),
          text: typeof d.text === "string" ? d.text : "",
          notes: typeof d.notes === "string" ? d.notes : "",
          status: STATUS_ORDER.indexOf(d.status) !== -1 ? d.status : "offen",
          // colour and tags were added to details later; the restore cleaning
          // silently dropped them from every backup until this line existed
          color: colorChoiceByKey(d.color) ? d.color : "auto",
          tags: Array.isArray(d.tags) ? d.tags.filter(function (t) { return typeof t === "string"; }) : [],
          created: typeof d.created === "string" && !isNaN(Date.parse(d.created)) ? d.created : undefined
        };
      }) : []
    };
  }

  // Restores a full backup. Replaces the current map, so it asks first.
  function applyJsonBackup(text) {
    var data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      state.folderStatus = "Backup konnte nicht gelesen werden (kein gültiges JSON).";
      renderSettingsModal();
      return false;
    }
    var cores = data && Array.isArray(data.cores) ? data.cores : (Array.isArray(data) ? data : null);
    if (!cores) {
      state.folderStatus = "Backup enthält keine Ideen.";
      renderSettingsModal();
      return false;
    }
    // normalise so older or hand-edited backups still load cleanly
    var clean = cores.filter(function (c) { return c && typeof c === "object"; }).map(cleanBackupCore);
    if (!clean.length) {
      state.folderStatus = "Backup enthält keine Ideen.";
      renderSettingsModal();
      return false;
    }
    state.cores = clean;
    stampCoreChanges(true);
    // Ein Backup mit Eingang ersetzt auch ihn; aeltere Backups kennen keinen
    // Eingang und lassen den vorhandenen deshalb stehen.
    // wie beim Eingang: ein Backup mit Kompost ersetzt ihn, ein aelteres laesst ihn stehen
    if (Array.isArray(data.compost)) {
      state.compost = data.compost.filter(function (c) { return c && typeof c === "object"; }).map(cleanBackupCore)
        .map(function (c) { return Object.assign(c, { composted: c.composted || new Date().toISOString() }); });
      persistCompost();
    }
    if (Array.isArray(data.inbox)) {
      state.inbox = cleanInbox(data.inbox);
      persistInbox();
      updateInboxBadge();
    }
    if (data.theme === "minimal" || data.theme === "space") {
      state.theme = data.theme;
      applyTheme();
      storeSet(THEME_KEY, state.theme);
    }
    state.focusedId = null;
    state.activeTags = [];
    clearSearch();
    state.folderStatus = "Backup geladen · " + clean.length + " Kernideen";
    onCoresChanged();
    renderSettingsModal();
    return true;
  }

  importJsonInput.addEventListener("change", function (e) {
    var file = (e.target.files || [])[0];
    if (!file) return;
    var proceed = window.confirm("Backup laden? Die aktuell angezeigten Ideen werden dabei ersetzt.");
    if (!proceed) { importJsonInput.value = ""; return; }
    file.text().then(function (text) {
      applyJsonBackup(text);
      importJsonInput.value = "";
    });
  });

  importInput.addEventListener("change", function (e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    if (!files.length) return;
    Promise.all(files.map(function (file) { return file.text().then(function (text) { return { name: file.name, text: text }; }); })).then(function (list) {
      var map = new Map(state.cores.map(function (c) { return [c.id, c]; }));
      var inboxIn = [];
      list.forEach(function (f) {
        if (isInboxMd(f.text, f.name)) { inboxIn = inboxIn.concat(parseInboxMd(f.text)); return; }   // Eingang, keine Kernidee
        var c = parseMdToCore(f.text, f.name);

      stampCoreChanges(true);
      if (inboxIn.length) {
        state.inbox = mergeInbox(state.inbox, inboxIn);
        persistInbox();
        updateInboxBadge();
      }
      importInput.value = "";
      onCoresChanged();
    });
  });

  // ---------- mutators ----------
