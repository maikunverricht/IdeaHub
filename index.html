  // ---------- Ebene 1 auf der Karte: Punkte, Suche, Ziehen ----------
  var inboxDotsEl = document.getElementById("inboxDots");
  function inboxMatches() {
    var q = state.query.trim().toLowerCase();
    if (!q) return [];
    return state.inbox.filter(function (x) { return x.text.toLowerCase().indexOf(q) !== -1; });
  }
  function inboxHitNote() {
    var n = inboxMatches().length;
    return n ? " · " + n + " im Eingang" : "";
  }
  // Plaetze in der linken oberen Ecke, die sicher ausserhalb des Kreises liegen:
  // dort zeichnet die Karte nie, die Kollisionspruefung bleibt unberuehrt. Oben,
  // weil die Karte am Rechner oft tiefer reicht als das Fenster.
  function inboxDotSlots(W) {
    var r = 6, step = 17, pad = 12, slots = [];
    for (var row = 0; row < 8; row++) {
      for (var col = 0; col < 8; col++) {
        var x = pad + col * step, y = pad + row * step;
        var dx = x - W / 2, dy = y - W / 2;
        if (Math.sqrt(dx * dx + dy * dy) >= W / 2 + r + 8) slots.push({ x: x, y: y, k: row + col, row: row });
      }
    }
    slots.sort(function (a, b) { return a.k - b.k || a.row - b.row; });
    return slots.slice(0, 15);
  }
  function renderInboxDots() {
    if (!inboxDotsEl) return;
    var W = layout.width;
    if (!W || !state.inbox.length || state.view === "tree") { inboxDotsEl.innerHTML = ""; return; }
    var slots = inboxDotSlots(W);
    if (!slots.length) { inboxDotsEl.innerHTML = ""; return; }
    var items = state.inbox.slice().sort(oldestFirst);   // die aeltesten sitzen der Ecke am naechsten
    var show = items.length > slots.length ? slots.length - 1 : items.length;
    var q = state.query.trim().toLowerCase();
    var html = "";
    for (var i = 0; i < show; i++) {
      var it = items[i], s = slots[i];
      var hit = q && it.text.toLowerCase().indexOf(q) !== -1;
      html += '<button type="button" class="ihb-inboxdot' + (q ? (hit ? " is-match" : " is-dim") : "") + '" data-role="inbox-dot" data-id="' + it.id +
        '" style="left:' + s.x + "px;top:" + s.y + 'px" title="' + escapeHtml(it.text) + '" aria-label="Gedanke im Eingang: ' + escapeHtml(it.text) + '"></button>';

  var inboxDrag = null;

  // ---------- Eingang.md: Export, Import, Ordner ----------
  // Lesbar in jedem Editor und in Obsidian: Tagesueberschriften, je Gedanke eine
  // offene Checkbox mit Uhrzeit. Abgehakte Zeilen gelten als erledigt.
  var INBOX_FILE = "Eingang.md";
  var inboxFileKnown = false;      // der verbundene Ordner hat (oder hatte) eine Eingang.md
  var folderSuppliedInbox = false; // der Ordner hat den Eingang beim Start geliefert
  var folderInboxSince = null;     // "stand" der gelesenen Eingang.md (ms) oder null
  // stand = wann IdeaHub die Datei zuletzt geschrieben hat. Damit laesst sich beim
  // Verbinden unterscheiden: ein lokaler Gedanke, der in der Datei fehlt, ist
  // entweder erledigt (aelter als stand) oder neu und noch nicht geschrieben.
  function inboxToMd(list, stand) {
    var lines = ["---", "typ: eingang"].concat(stand ? ["stand: " + stand] : []).concat(["---", "", "# Eingang", ""]);
    var lastDay = null;
    list.slice().sort(oldestFirst).forEach(function (it) {
      var d = new Date(it.created);
      var day = d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
      if (day !== lastDay) { if (lastDay) lines.push(""); lines.push("## " + day); lastDay = day; }
      lines.push("- [ ] " + fmtTime(it.created) + " " + it.text.replace(/\s*\r?\n\s*/g, " "));
    });
    lines.push("");
    return lines.join("\n");
  }
  function isInboxMd(text, filename) {
    if (/^eingang\.md$/i.test(filename || "")) return true;
    var fm = (text || "").match(/^---\r?\n([\s\S]*?)\r?\n---/);
    return !!fm && /(^|\n)typ:\s*eingang\s*($|\r?\n)/i.test(fm[1]);
  }
  function parseInboxMd(text) {
    var out = [], day = null;
    (text || "").replace(/\r\n?/g, "\n").split("\n").forEach(function (line) {
      var h = line.match(/^##\s+(\d{4})-(\d{2})-(\d{2})\s*$/);
      if (h) { day = [Number(h[1]), Number(h[2]) - 1, Number(h[3])]; return; }
      var m = line.match(/^\s*[-*]\s+(?:\[([ xX~])\]\s+)?(?:(\d{1,2}):(\d{2})\s+)?(.+)$/);
      if (!m || !m[4].trim() || (m[1] && /x/i.test(m[1]))) return;   // abgehakt = erledigt
      var dt = day ? new Date(day[0], day[1], day[2], m[2] ? Number(m[2]) : 0, m[3] ? Number(m[3]) : 0) : new Date();
      out.push({ id: nextId(), text: m[4].trim(), created: dt.toISOString() });
    });
    return out;
  }
  function inboxMdStand(text) {
    var fm = (text || "").match(/^---\r?\n([\s\S]*?)\r?\n---/);
    var m = fm && fm[1].match(/(?:^|\n)stand:\s*(\S+)/);
    return m && !isNaN(Date.parse(m[1])) ? m[1] : null;
  }

  // stand (von Hand angelegt) lieber alle behalten als einen verlieren
  function freshSinceFolder(list) {

    return list.filter(function (x) { return Date.parse(x.created) > folderInboxSince; });
  }

  function mergeInbox(a, b) {
    var seen = {}, out = [];
    a.concat(b).forEach(function (x) {

      if (seen[key]) return;
      seen[key] = true;
      out.push(x);
    });
    return out;
  }
  function downloadText(name, text) {
    var blob = new Blob([text], { type: "text/markdown" });

    var a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------- Eingang: markieren und buendeln ----------
  // Die Reihenfolge des Antippens zaehlt: der erste markierte Gedanke wird
  // beim Buendeln der Titel, die uebrigen werden seine Details.
  var inboxPicks = [];
  function bundleCheck(ids) {
    if (ids.length < 2) return "Zum Bündeln mindestens zwei markieren – der erste wird der Titel.";
    if (ids.length - 1 > MAX_DETAILS) return "Höchstens " + (MAX_DETAILS + 1) + " bündeln: ein Titel und " + MAX_DETAILS + " Details.";
    if (state.cores.length >= MAX_CORES) return "Die Karte ist mit " + MAX_CORES + " Kernideen voll – „Markierte einsortieren“ hängt sie an vorhandene.";
    return "";
  }
  function shortText(t, n) { return t.length > n ? t.slice(0, n - 1) + "…" : t; }
  function pickBarHtml() {
    var why = bundleCheck(inboxPicks);
    var note = why;
    if (!why) {
      var head = inboxItem(inboxPicks[0]), k = inboxPicks.length - 1;
      note = "„" + shortText(parseCapture(head.text).text || head.text, 40) + "“ wird Kernidee mit " + k + (k === 1 ? " Detail." : " Details.");
    }
    return '<div class="ihb-inbox-pickbar" data-role="inbox-pickbar"><p class="ihb-note" data-role="bundle-preview">' + escapeHtml(note) + "</p>" +
      '<div class="ihb-btnrow ihb-paste-actions">' +
      '<button type="button" class="ihb-btn primary" data-role="inbox-bundle"' + (why ? " disabled" : "") + ">Zur Kernidee bündeln</button>" +
      '<button type="button" class="ihb-btn" data-role="inbox-sort-picked">Markierte einsortieren (' + inboxPicks.length + ")</button>" +
      '<button type="button" class="ihb-btn" data-role="inbox-unpick">Auswahl aufheben</button></div></div>';
  }
  function bundleInbox(ids) {
    var items = ids.map(inboxItem).filter(Boolean);
    if (bundleCheck(items.map(function (x) { return x.id; }))) return null;
    var head = parseCapture(items[0].text);
    var id = nextId();
    var fresh = { id: id, text: head.text || items[0].text, subtitle: "", icon: "none", color: "auto", tags: head.tags.slice(), notes: "",
      created: items[0].created,
      details: items.slice(1).map(function (it) {
        var p = parseCapture(it.text);
        return { id: nextId(), text: p.text || it.text, status: "offen", notes: "", tags: p.tags.slice(), color: "auto", created: it.created };
      }) };
    state.cores = state.cores.concat([fresh]);
    items.forEach(function (it) { removeFromInbox(it.id); });
    onCoresChanged();
    if (state.view === "map") energyFromCore(id);
    return id;
  }
  var inboxNoticeTimer = null;
  function setInboxNotice(text) {
    var el = document.getElementById("inboxNotice");
    if (!el) return;
    el.textContent = text;
    clearTimeout(inboxNoticeTimer);
    if (text) inboxNoticeTimer = setTimeout(function () { el.textContent = ""; }, 6000);
  }
  if (inboxCardEl) inboxCardEl.addEventListener("click", function (e) {
    var t = e.target.closest && e.target.closest("[data-role]");
    if (!t) return;
    var role = t.getAttribute("data-role"), id = t.getAttribute("data-id");
    if (role === "inbox-pick") {
      var at = inboxPicks.indexOf(id);
      if (at === -1) inboxPicks.push(id); else inboxPicks.splice(at, 1);
      renderInbox();
      // mit der Tastatur (Klick ohne Zeiger) geht es an derselben Stelle weiter
      var again = e.detail === 0 && inboxList.querySelector('[data-role="inbox-pick"][data-id="' + id + '"]');
      if (again) again.focus();
    } else if (role === "inbox-unpick") {
      inboxPicks = [];
      renderInbox();
    } else if (role === "inbox-sort-picked") {
      startSort(inboxPicks.slice());
    } else if (role === "inbox-bundle") {
      var n = inboxPicks.length - 1;
      var newId = bundleInbox(inboxPicks);
      if (!newId) return;
      inboxPicks = [];
      renderInbox();
      var c = coreById(newId);
      setInboxNotice("„" + shortText(c.text, 40) + "“ mit " + n + (n === 1 ? " Detail" : " Details") + " auf der Karte.");
    } else if (role === "inbox-mic") {
      toggleDictation();
    }
  });

  // ---------- Eingang: Spracheingabe ----------
  // Ueber die eingebaute Web Speech API (Chrome, Edge, Safari; Firefox nicht).
  // Ein Diktat ist eine Sitzung: jede Pause und jedes Satzende wird ein eigener
  // Gedanke, bis man wieder aufs Mikrofon tippt oder die Flaeche schliesst.
  var dictation = null;      // { rec, interim, count, stopping, error, startedAt }
  var dictationNote = "";    // was nach dem Diktat stehen bleibt
  var SPEECH_ERRORS = {
    "not-allowed": "Kein Zugriff auf das Mikrofon – bitte im Browser erlauben.",
    "service-not-allowed": "Kein Zugriff auf das Mikrofon – bitte im Browser erlauben.",
    "audio-capture": "Kein Mikrofon gefunden.",
    "network": "Die Spracherkennung braucht eine Internetverbindung.",
    "language-not-supported": "Deutsch wird hier nicht erkannt."
  };
  function speechCtor() { return window.SpeechRecognition || window.webkitSpeechRecognition || null; }
  function splitSpoken(t) {
    return (t || "").replace(/([.!?])\s+/g, "$1\n").split("\n").map(function (x) {
      return x.trim().replace(/\.$/, "").trim();   // ein Punkt am Ende gehoert zum Sprechen, nicht zum Gedanken
    }).filter(Boolean);
  }
  function renderDictation() {
    var mic = document.getElementById("inboxMic"), live = document.getElementById("inboxLive");
    var on = !!(dictation && !dictation.stopping);
    if (mic) {
      mic.hidden = !speechCtor();
      mic.classList.toggle("is-on", on);
      mic.setAttribute("aria-pressed", String(on));
      mic.setAttribute("aria-label", on ? "Diktat beenden" : "Diktieren");
    }
    if (!live) return;
    var h = "";
    if (on) h = '<span class="ihb-live-dot"></span>Hört zu – jede Pause beendet einen Gedanken' +
      (dictation.interim ? ' · <i data-role="dictation-interim">' + escapeHtml(dictation.interim) + "</i>" : "");
    else if (dictationNote) h = escapeHtml(dictationNote);
    live.innerHTML = h;
    live.hidden = !h;
  }
  function startDictation() {
    var Ctor = speechCtor();
    if (!Ctor || (dictation && !dictation.stopping)) return;
    var rec;
    try { rec = new Ctor(); } catch (e) { dictationNote = "Die Spracheingabe ist hier nicht verfügbar."; renderDictation(); return; }
    var s = { rec: rec, interim: "", count: 0, stopping: false, error: "", startedAt: Date.now() };
    dictation = s;
    dictationNote = "";
    var lang = document.documentElement.getAttribute("lang") || "de";
    rec.lang = lang === "de" ? "de-DE" : lang;
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = function (e) {
      var interim = "";
      for (var i = e.resultIndex || 0; i < e.results.length; i++) {
        var r = e.results[i], t = r && r[0] ? r[0].transcript : "";
        // auch was nach dem Stoppen noch fertig erkannt wird, kommt in den Eingang
        if (r && r.isFinal) splitSpoken(t).forEach(function (x) { if (addToInbox(x)) s.count++; });
        else interim += t;
      }
      s.interim = s.stopping ? "" : interim.trim();
      renderDictation();
    };
    rec.onerror = function (e) {
      var code = e && e.error;
      if (code === "no-speech" || code === "aborted") return;   // Stille: einfach weiterhoeren
      s.error = SPEECH_ERRORS[code] || "Die Spracheingabe wurde abgebrochen.";
      s.stopping = true;
      renderDictation();
    };
    rec.onend = function () {
      // Chrome beendet auch ein fortlaufendes Diktat nach einer Weile Stille.
      // Solange niemand gestoppt hat, geht es weiter (nicht im Kreis, wenn es sofort endet).
      if (!s.stopping && dictation === s && Date.now() - s.startedAt > 1000) {
        try { s.startedAt = Date.now(); rec.start(); return; } catch (err) { /* dann eben Schluss */ }
      }
      if (dictation === s) dictation = null;
      dictationNote = s.error || (s.count ? (s.count === 1 ? "1 Gedanke diktiert." : s.count + " Gedanken diktiert.") : "");
      renderDictation();
    };
    try { rec.start(); } catch (e) {
      dictation = null;
      dictationNote = "Die Spracheingabe ließ sich nicht starten.";
    }
    renderDictation();
  }
  function stopDictation() {
    var s = dictation;
    if (!s || s.stopping) return;
    s.stopping = true;
    s.interim = "";
    try { s.rec.stop(); } catch (e) { /* schon beendet */ }
    renderDictation();
  }
  function toggleDictation() {
    if (dictation && !dictation.stopping) stopDictation(); else startDictation();
  }
  document.addEventListener("visibilitychange", function () { if (document.hidden) stopDictation(); });

  // ---------- Startansicht am Handy ----------
  function isPhone() {
    try { return !!(window.matchMedia && window.matchMedia("(max-width: 599px)").matches); } catch (e) { return false; }
  }
  function setPhoneStart(v) {
    if (v !== "eingang" && v !== "karte") return;
    state.phoneStart = v;
    storeSet(START_KEY, v);
    renderSettingsModal();
  }
  function applyPhoneStart() {
    if (state.phoneStart !== "eingang" || !isPhone() || inboxOpen()) return;
    openInbox({ noFocus: true });
  }
  // Escape schliesst den Eingang auch, wenn der Fokus nicht darin steht (etwa
  // nach dem Start am Handy mit Tastatur) - und vor allem anderen auf der Karte.
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape" || !inboxOpen()) return;
    e.preventDefault();
    e.stopPropagation();
    closeInbox();
  }, true);

  // ---------- Sinken: der Gedanke taucht in seine Kernidee ein ----------
  // Ein Schild mit dem Text fliegt zur Kernidee, schrumpft dabei und verblasst;
  // die Kernidee nimmt es mit einem kurzen Schimmer auf, erst dann laeuft der
  // Funkenstrom zum Hub. Das Ziel wird in jedem Bild neu gemessen: nach dem
  // Einsortieren gleitet die Karte oft noch (neue Kernidee, Platzwechsel).
  var SINK_MS = 550;   // bei "Zuegig"; Mittel und Ruhig strecken es wie alle Bewegung
  function corePoint(coreId) {
    var el = bubblesLayer.querySelector('[data-role="core"][data-core-id="' + coreId + '"]');
    if (!el) return null;
    var r = el.getBoundingClientRect();
    if (!r.width) return null;
    return { el: el, x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }
  function sinkIntoCore(coreId, text, from) {
    if (!from || !motionEnabled() || state.view !== "map" || !corePoint(coreId)) { energyFromCore(coreId); return; }
    var pill = document.createElement("div");
    pill.className = "ihb-sink";
    pill.setAttribute("aria-hidden", "true");
    pill.setAttribute("data-core-id", coreId);
    pill.textContent = shortText(text || "", 48);
    document.body.appendChild(pill);
    var dur = Math.round(SINK_MS * speedFactor()), t0 = null, last = corePoint(coreId);
    function place(x, y, s, o) {
      pill.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) translate(-50%,-50%) scale(" + s.toFixed(3) + ")";
      pill.style.opacity = o.toFixed(3);
    }
    place(from.x, from.y, 1, 1);
    function frame(ts) {
      if (t0 === null) t0 = ts;
      var k = Math.min(1, (ts - t0) / dur);
      var to = corePoint(coreId) || last;   // kurz neu gezeichnet: am letzten Ort weiter
      last = to;
      var e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;   // sanft an, sanft ab
      place(from.x + (to.x - from.x) * e, from.y + (to.y - from.y) * e,
        1 - 0.75 * k * k,                                // schrumpft, je naeher, desto schneller
        k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3);              // verblasst erst zum Schluss
      if (k < 1) { requestAnimationFrame(frame); return; }
      if (pill.parentNode) pill.parentNode.removeChild(pill);
      var hit = corePoint(coreId);
      if (hit) {
        hit.el.classList.remove("ihb-absorb");
        void hit.el.offsetWidth;
        hit.el.classList.add("ihb-absorb");
        setTimeout(function () { hit.el.classList.remove("ihb-absorb"); }, Math.round(600 * speedFactor()));
      }
      energyFromCore(coreId);
    }
    requestAnimationFrame(frame);
  }

  // ---------- Kompost (Assist §21.1) ----------
  // Kernideen, die lange niemand geaendert hat und die mit keiner anderen einen
  // Tag teilen, werden zur Durchsicht vorgeschlagen statt still geloescht.
  // Kompostiertes verlaesst die Karte, bleibt aber erhalten und zurueckholbar.
  var COMPOST_DIR = "Kompost";
  var COMPOST_DAY_CHOICES = [30, 60, 90];
  var DAY_MS = 86400000;
  function validIso(v) { return typeof v === "string" && !isNaN(Date.parse(v)) ? v : undefined; }

  // Aenderungsdatum: verglichen wird der Inhalt, nicht wer ihn wie geaendert
  // hat - so reicht eine Stelle fuer alle Wege (Karte, Baum, Editor, Ziehen).
  var coreSigs = null;   // id -> Inhalt beim letzten Stempeln
  function coreSignature(c) {
    return JSON.stringify([c.text || "", c.subtitle || "", c.notes || "", c.tags || [], c.color || "auto", c.icon || "none",
      (c.details || []).map(function (d) { return [d.text || "", d.status || "", d.notes || "", d.tags || [], d.color || "auto"]; })]);
  }
  // accept: einen von aussen geladenen Stand als Basis nehmen, ohne zu stempeln
  function stampCoreChanges(accept) {
    var now = new Date().toISOString(), sigs = {};
    state.cores.forEach(function (c) {
      var sig = coreSignature(c);
      sigs[c.id] = sig;
      if (!validIso(c.updated)) c.updated = now;   // neu, oder aus der Zeit vor v3.8
      // ohne festes Anlagedatum schriebe die .md bei jedem Speichern ein neues
      if (!validIso(c.created)) c.created = c.updated;
      else if (!accept && coreSigs && coreSigs[c.id] !== undefined && coreSigs[c.id] !== sig) c.updated = now;
    });
    coreSigs = sigs;
  }
  stampCoreChanges(true);

  function unionById(first, second) {
    var seen = {}, out = [];
    first.concat(second).forEach(function (c) { if (!seen[c.id]) { seen[c.id] = true; out.push(c); } });
    return out;
  }
  // was (wieder) auf der Karte steht, liegt nicht zugleich im Kompost
  function dropCompostOnMap() {
    var onMap = {};
    state.cores.forEach(function (c) { onMap[c.id] = true; });
    state.compost = state.compost.filter(function (c) { return !onMap[c.id]; });
  }
  function persistCompost() {
    scheduleFolderSync();
    if (!state.loaded || storageKind() === "none") return;
    storeSet(COMPOST_KEY, JSON.stringify(state.compost));
  }

  // ---- Kandidaten und Signal ----
  function sharesTag(core) {
    var t = core.tags || [];
    if (!t.length) return false;
    return state.cores.some(function (o) {
      return o.id !== core.id && (o.tags || []).some(function (x) { return t.indexOf(x) !== -1; });
    });
  }
  function daysSince(iso) { return Math.floor((Date.now() - Date.parse(iso)) / DAY_MS); }
  function isCompostCandidate(c) {
    return !!validIso(c.updated) && daysSince(c.updated) >= state.compostDays && !sharesTag(c);
  }
  function compostCandidates() {
    return state.cores.filter(isCompostCandidate).sort(function (a, b) { return Date.parse(a.updated) - Date.parse(b.updated); });
  }
  function compostNoteHtml(cls) {
    var n = compostCandidates().length;
    if (!n || compostSession) return "";
    return '<p class="' + cls + ' ihb-compost-note" data-role="compost-note">' +
      (n === 1 ? "1 Kernidee ruht" : n + " Kernideen ruhen") + " seit über " + state.compostDays + " Tagen " +
      '<button type="button" class="ihb-chip" data-role="compost-review">Durchsehen</button></p>';
  }
  function setCompostDays(d) {
    if (COMPOST_DAY_CHOICES.indexOf(d) === -1) return;
    state.compostDays = d;
    storeSet(COMPOST_DAYS_KEY, String(d));
    renderCaptionOrQuickCreate();
    if (state.view === "tree") renderTree();
    renderSettingsModal();
  }

  // ---- Durchsicht ----
  var compostSession = null;   // { queue: [ids], done, total }
  function startCompost(ids) {
    var queue = (ids || compostCandidates().map(function (c) { return c.id; })).filter(function (id) { return !!coreById(id); });
    if (!queue.length) return;
    if (sortSession) endSort();
    handOffInbox();
    state.tagEditing = null;
    detailEditing = null;
    compostSession = { queue: queue, done: 0, total: queue.length };
    renderCaptionOrQuickCreate();   // das Signal tritt zurueck, solange die Durchsicht laeuft
    renderCompostDialog();
  }
  function currentCompostCore() {
    if (!compostSession) return null;
    while (compostSession.queue.length && !coreById(compostSession.queue[0])) compostSession.queue.shift();
    return compostSession.queue.length ? coreById(compostSession.queue[0]) : null;
  }
  function fmtDate(iso) { var d = new Date(iso); return pad2(d.getDate()) + "." + pad2(d.getMonth() + 1) + "." + d.getFullYear(); }
  function compostFacts(c) {
    var n = c.details.length;
    var done = c.details.filter(function (d) { return detailStatus(d) === "erledigt"; }).length;
    return (n ? n + (n === 1 ? " Detail" : " Details") + (done ? ", " + done + " erledigt" : "") : "Ohne Details");
  }
  function renderCompostDialog() {
    var c = currentCompostCore();
    if (!c) { endCompost(); return; }
    var days = daysSince(c.updated);
    var html =
      '<div class="ihb-display-head"><span>Kompost · ' + (compostSession.done + 1) + " von " + compostSession.total + "</span>" +
      '<button type="button" data-role="compost-close" aria-label="Durchsicht beenden">&#10005;</button></div>' +
      '<div class="ihb-sort ihb-compost" data-role="compost-dialog" tabindex="-1">' +
      '<p class="ihb-compost-title">' + escapeHtml(c.text || "Unbenannt") + "</p>" +
      (c.subtitle ? '<p class="ihb-note">' + escapeHtml(c.subtitle) + "</p>" : "") +
      '<p class="ihb-note" data-role="compost-facts">' + escapeHtml(compostFacts(c)) + " · unverändert seit " + days +
      (days === 1 ? " Tag" : " Tagen") + " (" + fmtDate(c.updated) + ")</p>" +
      '<div class="ihb-chiprow ihb-sort-actions">' +
      '<button type="button" class="ihb-chip" data-role="compost-keep"><kbd>B</kbd>Behalten</button>' +
      '<button type="button" class="ihb-chip" data-role="compost-inbox"><kbd>E</kbd>Zurück in den Eingang</button>' +
      '<button type="button" class="ihb-chip" data-role="compost-put"><kbd>K</kbd>Kompostieren</button>' +
      '<button type="button" class="ihb-chip" data-role="compost-later"><kbd>S</kbd>Später</button>' +
      "</div>" +
      '<p class="ihb-note ihb-compost-hint">' + ((c.tags || []).length ? "Teilt keinen Tag mit einer anderen Kernidee. " : "Ohne Tags, mit nichts verbunden. ") +
      "Eingang: Titel und offene Details werden Gedanken, der Rest entfällt. " +
      "Kompost: alles bleibt erhalten und lässt sich zurückholen.</p></div>";
    openHubDisplay(html);
    var host = editorHost();
    var box = host && host.querySelector('[data-role="compost-dialog"]');
    // ohne Mitscrollen fokussieren: auf kleinen Schirmen beginnt die Flaeche oben beim Titel
    if (box) { try { box.focus({ preventScroll: true }); } catch (e) { box.focus(); } }
    if (host) host.scrollTop = 0;
  }
  function advanceCompost() {
    if (!compostSession) return;
    compostSession.queue.shift();
    compostSession.done++;
    renderCompostDialog();
  }
  function endCompost() {
    if (!compostSession) return;
    compostSession = null;
    renderCaptionOrQuickCreate();
    if (state.view === "tree") { renderTree(); return; }
    closeHubDisplay();
    updateHubCount();
  }
  function takeOffMap(id) {
    state.cores = state.cores.filter(function (x) { return x.id !== id; });
    if (state.focusedId === id) { state.focusedId = null; state.selectedDetail = null; }
  }
  // Behalten zaehlt als Anfassen: die Frist beginnt neu
  function keepCore(id) {
    var c = coreById(id);
    if (!c) return;
    c.updated = new Date().toISOString();
    onCoresChanged();
  }
  function tagSuffix(tags) {
    return (tags || []).map(function (t) { return " #" + String(t).replace(/\s+/g, "-"); }).join("");
  }
  // Zurueck in den Eingang: der Titel wird ein Gedanke, jedes offene Detail ein
  // Gedanke "Titel: Detail" - so findet das Einsortieren den Zusammenhang wieder.
  function compostToInbox(id) {
    var c = coreById(id);
    if (!c) return;
    var now = new Date().toISOString();
    var base = validIso(c.created) || validIso(c.updated) || now;
    var items = [{ id: nextId(), text: (c.text || "Unbenannt") + tagSuffix(c.tags), created: base }];
    c.details.forEach(function (d) {
      if (detailStatus(d) === "erledigt" || !(d.text || "").trim()) return;
      items.push({ id: nextId(), text: (c.text ? c.text + ": " : "") + d.text + tagSuffix(d.tags), created: validIso(d.created) || base });
    });
    state.inbox = state.inbox.concat(items);
    takeOffMap(id);
    persistInbox();
    updateInboxBadge();
    onCoresChanged();
  }
  function compostCore(id) {
    var c = coreById(id);
    if (!c) return;
    state.compost = state.compost.concat([Object.assign({}, c, { composted: new Date().toISOString() })]);
    takeOffMap(id);
    onCoresChanged();
    persistCompost();
  }
  function restoreCompost(id) {
    if (state.cores.length >= MAX_CORES) return false;
    var c = null;
    state.compost.forEach(function (x) { if (x.id === id) c = x; });
    if (!c) return false;
    var fresh = Object.assign({}, c, { updated: new Date().toISOString() });   // Zurueckholen ist Anfassen
    delete fresh.composted;
    if (coreById(fresh.id)) fresh.id = nextId();
    state.compost = state.compost.filter(function (x) { return x.id !== id; });
    state.cores = state.cores.concat([fresh]);
    onCoresChanged();
    persistCompost();
    if (state.view === "map") energyFromCore(fresh.id);
    renderSettingsModal();
    return true;
  }
  function deleteCompost(id) {
    var c = null;
    state.compost.forEach(function (x) { if (x.id === id) c = x; });
    if (!c || !window.confirm("„" + (c.text || "Unbenannt") + "“ endgültig löschen? Das lässt sich nicht rückgängig machen.")) return;
    state.compost = state.compost.filter(function (x) { return x.id !== id; });
    persistCompost();
    renderSettingsModal();
  }
  function compostAction(kind) {
    var c = currentCompostCore();
    if (!c) return;
    if (kind === "keep") keepCore(c.id);
    else if (kind === "inbox") compostToInbox(c.id);
    else if (kind === "put") compostCore(c.id);
    advanceCompost();
  }
  // Tasten im Dialog: in der Einfangphase, damit sie vor den uebrigen Kuerzeln greifen
  document.addEventListener("keydown", function (e) {
    if (!compostSession || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) return;
    var k = e.key;
    if (k === "Escape") endCompost();
    else if (k === "b" || k === "B") compostAction("keep");
    else if (k === "e" || k === "E") compostAction("inbox");
    else if (k === "k" || k === "K") compostAction("put");
    else if (k === "s" || k === "S") compostAction("later");
    else return;
    e.preventDefault();
    e.stopImmediatePropagation();
  }, true);

  // ---- Suche ----
  function compostMatches() {
    var q = state.query.trim().toLowerCase();
    if (!q) return [];
    return state.compost.filter(function (c) {
      var hay = [c.text, c.subtitle, c.notes, (c.tags || []).join(" ")].concat((c.details || []).map(function (d) { return d.text; }));
      return hay.join("\n").toLowerCase().indexOf(q) !== -1;
    });
  }
  function compostHitNote() {
    var n = compostMatches().length;
    return n ? " · " + n + " im Kompost" : "";
  }

  // ---- Einstellungen ----
  function compostSectionHtml() {
    var q = state.query.trim().toLowerCase(), full = state.cores.length >= MAX_CORES;
    var n = compostCandidates().length;

  function openCompost() {

  // ---- Ordner: Kompost/ ----
  var compostFiles = new Map();    // id -> Dateiname in Kompost/
  var compostDirKnown = false;     // der Ordner hat (oder hatte) einen Kompost
  function readCompostDir(dir, files) {
    var cores = [], map = new Map(), iter = dir.entries();
    function step() {
      return iter.next().then(function (res) {
        if (res.done) return;
        var name = res.value[0], entry = res.value[1];
        if (entry.kind !== "file" || name.toLowerCase().slice(-3) !== ".md") return step();
        return entry.getFile().then(function (f) {
          var t = f.lastModified;
          return f.text().then(function (text) {
            if (files) files.set(COMPOST_DIR + "/" + name, { t: t || Date.now(), how: "geändert", text: text });
            return text;

        }).then(function (text) {
          var c = parseMdToCore(text, name);

  }
  function syncCompostDir(handle) {
    if ((!state.compost.length && !compostDirKnown) || !handle.getDirectoryHandle) return;

      compostDirKnown = true;
      var ids = {};

      var chain = Promise.resolve();
      compostFiles.forEach(function (fname, id) {
        if (ids[id]) return;
        chain = chain.then(function () {
          return dir.removeEntry(fname).catch(function () {}).then(function () {
            compostFiles.delete(id);
            folderFiles.delete(COMPOST_DIR + "/" + fname);

        chain = chain.then(function () {

            .then(function () {

    });
  }

  // liest die Datei so, wie sie gerade im Ordner steht
  function readFolderFile(p) {

  // ---------- Uebergaenge (v4.0) ----------
  // Eingang aus dem Hub: die Haelften gehen ein Stueck auf ("peek"), das Fenster
  // zoomt aus der Hubmitte heraus und sitzt ueber dem Hub; beim Schliessen
  // schrumpft es dorthin zurueck. Ohne Bewegung erscheint es einfach.
  var inboxCard = inboxSheet ? inboxSheet.querySelector(".ihb-inboxcard") : null;
  var inboxAnims = [];
  function hubPoint() {
    if (state.view !== "map" || !hubEl || !mapEl || mapEl.hidden) return null;
    var r = hubEl.getBoundingClientRect();
    if (!r.width) return null;
    return { x: r.left + r.width / 2, y: r.top + r.height / 2, size: layout.hub || r.height };
  }
  function inboxOrigin() {
    var h = hubPoint();
    if (h) return h;
    var b = inboxBtn && inboxBtn.getBoundingClientRect();   // im Baum: aus dem Knopf
    if (b && b.width) return { x: b.left + b.width / 2, y: b.top + b.height / 2, size: b.height };
    return { x: window.innerWidth / 2, y: 60, size: 40 };
  }
  // keepTop: beim Wachsen der Liste nicht neu zentrieren, nur so weit hoch wie noetig
  function placeInboxCard(keepTop) {
    if (inboxInHub) { if (hubOpen) layoutHub(); return; }
    if (!inboxCard || !inboxSheet) return;
    if (isPhone()) {
      inboxSheet.style.removeProperty("--ib-left");
      inboxSheet.style.removeProperty("--ib-top");
      return;
    }
    var vw = window.innerWidth, vh = window.innerHeight;
    var w = Math.min(540, vw - 32), h = inboxCard.offsetHeight;
    var c = hubPoint();
    var left = c ? c.x - w / 2 : (vw - w) / 2;
    left = Math.max(16, Math.min(vw - w - 16, left));
    var prev = parseFloat(inboxSheet.style.getPropertyValue("--ib-top"));
    var top = keepTop && !isNaN(prev) ? prev : (c ? c.y - h / 2 : 64);
    top = Math.max(72, Math.min(vh - h - 16, top));
    inboxSheet.style.setProperty("--ib-left", Math.round(left) + "px");
    inboxSheet.style.setProperty("--ib-top", Math.round(top) + "px");
  }
  var inboxResizeTimer = null;
  window.addEventListener("resize", function () {
    if (!inboxOpen()) return;
    if (!inboxInHub) placeInboxCard(false);
    // erst nach dem Neuzeichnen der Karte (150 ms) steht fest, ob das Hub Platz hat
    clearTimeout(inboxResizeTimer);
    inboxResizeTimer = setTimeout(function () {
      if (inboxOpen() && inboxInHub !== inboxHubPossible()) openInbox({ noFocus: true });   // Hub <-> Fenster
      else if (inboxOpen()) placeInboxCard(false);
    }, 220);
  });
  function startPeek() {
    if (!hubEl || hubOpen || !motionEnabled() || !hubPoint()) return;
    hubEl.style.setProperty("--peek", Math.round((layout.hub || 200) * 0.22) + "px");
    hubEl.classList.toggle("ihb-peek-v", !panelHorizontal());
    hubEl.classList.add("ihb-peek");
  }
  // Nach dem Spalt kommt das Gesicht frueher zurueck als nach der ganzen Anzeige:
  // die Haelften haben nur ein kurzes Stueck zurueckzulegen.
  var peekOutTimer = null;
  function endPeek() {
    if (!hubEl || !hubEl.classList.contains("ihb-peek")) return;
    hubEl.classList.remove("ihb-peek");
    hubEl.classList.add("ihb-peek-out");

  }
  function stopInboxAnims() {
    inboxAnims.forEach(function (a) { try { a.cancel(); } catch (e) { /* schon fertig */ } });
    inboxAnims = [];
  }
  // opening: aus dem Hub heraus; sonst zurueck hinein. done laeuft immer,
  // midway (nur beim Schliessen) nach gut der Haelfte der Zeit.
  function zoomInbox(opening, done, midway) {
    stopInboxAnims();
    inboxAnims = zoomSheet(inboxCard, inboxSheet, opening, done, midway);
    return inboxAnims.length > 0;
  }
  // ein Blatt (Karte in ihrer Ueberlagerung) aus dem Hub heraus bzw. zurueck
  function zoomSheet(card, sheet, opening, done, midway) {
    var r = card && card.animate && motionEnabled() ? card.getBoundingClientRect() : null;
    if (!r || !r.width) { if (done) done(); return []; }
    var o = inboxOrigin();
    var s = Math.max(0.06, Math.min(0.5, o.size / Math.max(r.width, r.height)));
    var small = "translate(" + Math.round(o.x - (r.left + r.width / 2)) + "px," + Math.round(o.y - (r.top + r.height / 2)) + "px) scale(" + s.toFixed(3) + ")";

    var dur = Math.round((opening ? 520 : 380) * speedFactor());
    var kf = opening
      ? [{ transform: small, opacity: 0, borderRadius: "999px" }, { opacity: 1, offset: 0.3 }, { transform: "none", opacity: 1, borderRadius: radius }]
      : [{ transform: "none", opacity: 1, borderRadius: radius }, { opacity: 1, offset: 0.55 }, { transform: small, opacity: 0, borderRadius: "999px" }];
    var a = card.animate(kf, { duration: dur, easing: opening ? "cubic-bezier(.2,.85,.25,1)" : "cubic-bezier(.55,0,.75,.2)", fill: "forwards" });

      ? [{ backgroundColor: "rgba(0,0,0,0)" }, { backgroundColor: veil }]
      : [{ backgroundColor: veil }, { backgroundColor: "rgba(0,0,0,0)" }], { duration: dur, easing: "ease", fill: "forwards" });
    var anims = [a, b];
    if (midway) setTimeout(midway, Math.round(dur * 0.45));
    a.onfinish = function () {
      if (opening) anims.forEach(function (x) { try { x.cancel(); } catch (e) { /* schon fertig */ } });   // danach gelten wieder die normalen Stile
      if (done) done();
    };
    return anims;
  }

  // Einstellungen: leise auf und zu, ohne Umweg ueber den Hub
  function softCard(overlay, opening, done) {
    var card = overlay && overlay.querySelector(".ihb-card");
    if (!card || !card.animate || !motionEnabled()) { if (done) done(); return; }
    var dur = Math.round((opening ? 260 : 180) * speedFactor());
    var away = { transform: "translateY(10px) scale(.985)", opacity: 0 }, here = { transform: "none", opacity: 1 };
    var a = card.animate(opening ? [away, here] : [here, away], { duration: dur, easing: opening ? "cubic-bezier(.2,.85,.25,1)" : "ease-in", fill: "forwards" });
    var veil = getComputedStyle(overlay).backgroundColor;
    overlay.animate(opening ? [{ backgroundColor: "rgba(0,0,0,0)" }, { backgroundColor: veil }] : [{ backgroundColor: veil }, { backgroundColor: "rgba(0,0,0,0)" }],

  }
  // Karte und Baum blenden ineinander, statt hart zu wechseln

  // Lange Woerter: eher kleiner setzen als mitten im Wort brechen. Gemessen wird
  // das laengste Wort in der Endgroesse der Bubble (sie kann gerade noch gleiten).
  var wordMeter = null;
  function widestWord(label, fontPx) {
    var words = (label.textContent || "").split(/\s+/).filter(Boolean);
    if (!words.length) return 0;
    if (!wordMeter) {
      wordMeter = document.createElement("span");
      wordMeter.setAttribute("aria-hidden", "true");
    }
    wordMeter.className = label.className;
    wordMeter.style.cssText = "position:absolute;left:-9999px;top:0;visibility:hidden;display:inline-block;white-space:nowrap;" +
      "-webkit-line-clamp:none;width:auto;max-width:none;font-size:" + fontPx + "px";
    label.parentNode.appendChild(wordMeter);
    var max = 0;
    words.forEach(function (w) { wordMeter.textContent = w; max = Math.max(max, wordMeter.offsetWidth); });
    label.parentNode.removeChild(wordMeter);
    return max;
  }
  function fitLongestWord(bubble, label, finalSize, minFont) {
    var now = bubble.offsetWidth, room = label.clientWidth;
    if (!now || !room || !finalSize) return true;   // keine Messung moeglich
    var avail = room * (finalSize / now) * 0.97;  // Breite in der Endgroesse, mit etwas Luft fuer die Zwischengroessen
    var font = parseFloat(label.style.fontSize) || parseFloat(getComputedStyle(label).fontSize) || 12;
    var widest = widestWord(label, font);
    if (widest <= avail) return true;
    var next = Math.max(minFont, Math.floor(font * (avail / widest) * 2) / 2);
    if (next < font) label.style.fontSize = next + "px";
    return widest * (next / font) <= avail + 0.5;   // passt es jetzt?
  }
  // Ist eine Kugel zu klein fuer ihr laengstes Wort, tritt die Schrift ganz zurueck
  // (die Kugel ist dann ohnehin nur ein Punkt) und blendet wieder ein, sobald
  // sie gross genug ist. Gemerkt wird je Idee, damit nur der Wechsel blendet.
  var labelsOff = {};
  function setLabelOff(bubble, label, sub, off) {
    var id = bubble.getAttribute("data-core-id") || "";
    var was = !!labelsOff[id];
    [label, sub].forEach(function (el) {
      if (!el) return;
      el.classList.toggle("ihb-label-off", off);
      el.classList.toggle("ihb-label-out", off && !was);

  // Schrift im Verhaeltnis zur Kugel: gemessen am Innenraum (ohne Rand und Polster),
  // sonst wird sie in kleineren Zwischengroessen zu breit und bricht mitten im Wort.
  function scaleCoreLabel(el, dia) {
    var lab = el.querySelector(".ihb-label");

    if (!ref) return;
    var inset = parseFloat(lab.getAttribute("data-fit-in")) || 0;
    var ratio = Math.max(1, dia - inset) / Math.max(1, ref - inset);
    [lab, el.querySelector(".ihb-sublabel")].forEach(function (t) {
      var fit = t ? parseFloat(t.getAttribute("data-fit")) : 0;
      if (!fit) return;
      t.style.fontSize = (fit * ratio).toFixed(2) + "px";
      t.style.visibility = fit * ratio < 5 ? "hidden" : "";   // unter 5px ist es nur ein Fleck
    });
  }
  // Nach dem Loesen des Fokus kehren die Ideen erst klein auf den Ring zurueck,
  // dann rechnet die Karte ihr Ruhemass. Statt dahin zu springen, wachsen sie
  // in einem kurzen zweiten Zug hinein.
  var restGrow = null;
  function growToRest(from) {
    if (restGrow) { cancelAnimationFrame(restGrow); restGrow = null; }
    if (!from || !bubblesLayer || !motionEnabled() || typeof requestAnimationFrame !== "function") return;
    var goals = {}, any = false;
    eachEl(bubblesLayer.querySelectorAll('[data-role="core"]'), function (el) {
      var id = el.getAttribute("data-core-id"), to = parseFloat(el.style.width), was = from[id];
      if (id && to && was && Math.abs(to - was) > 0.5) { goals[id] = { from: was, to: to }; any = true; }
    });
    if (!any) return;
    var t0 = Date.now(), dur = 420 * speedFactor();
    bubblesLayer.classList.add("ihb-tweening");
    (function step() {
      restGrow = null;
      if (ringAnim.raf) return;            // eine neue Drehung uebernimmt
      var p = Math.min(1, (Date.now() - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      Object.keys(goals).forEach(function (id) {
        var el = bubblesLayer.querySelector('[data-role="core"][data-core-id="' + id + '"]');
        if (!el) return;
        var d = goals[id].from + (goals[id].to - goals[id].from) * e;
        el.style.width = d + "px";
        el.style.height = d + "px";
        el.style.marginLeft = (-d / 2) + "px";
        el.style.marginTop = (-d / 2) + "px";
        scaleCoreLabel(el, d);
      });
      if (p < 1) restGrow = requestAnimationFrame(step);
      else bubblesLayer.classList.remove("ihb-tweening");
    })();
  }

  // ---------- Dialoge am Handy als Blatt (v4.2) ----------
  var dialogSheet = document.getElementById("dialogSheet");
  var dialogCard = document.getElementById("dialogCard");
  var dialogAnims = [];
  var sheetHandoff = null;   // Masse des Eingangs-Blatts, das gerade uebergibt
  function dialogSheetWanted() { return !!dialogSheet && state.view !== "tree" && isPhone(); }
  function dialogSheetOpen() { return !!(dialogSheet && dialogSheet.classList.contains("open")); }
  function stopDialogAnims() {
    dialogAnims.forEach(function (a) { try { a.cancel(); } catch (e) { /* schon fertig */ } });
    dialogAnims = [];
  }
  function openDialogSheet(html) {
    var was = dialogSheetOpen();
    stopDialogAnims();
    dialogSheet.classList.remove("closing");
    dialogSheet.classList.add("open");
    dialogCard.innerHTML = '<div class="ihb-sheet-body">' + html + "</div>";
    dialogCard.scrollTop = 0;
    var body = dialogCard.firstChild;
    if (was) { fadeIn(body); return; }   // naechster Gedanke: nur der Inhalt wechselt
    if (sheetHandoff) {
      // aus dem Eingang: dasselbe Blatt, es passt nur seine Hoehe an
      var to = dialogCard.getBoundingClientRect();
      if (motionEnabled() && dialogCard.animate && to.height) {
        dialogAnims = [dialogCard.animate([{ height: sheetHandoff.height + "px" }, { height: to.height + "px" }],
          { duration: Math.round(320 * speedFactor()), easing: "cubic-bezier(.2,.85,.25,1)" })];
        fadeIn(body);
      }
      sheetHandoff = null;
      return;
    }
    startPeek();
    dialogAnims = zoomSheet(dialogCard, dialogSheet, true);
  }
  function closeDialogSheet() {
    if (!dialogSheetOpen()) return;
    stopDialogAnims();
    dialogSheet.classList.remove("open");
    dialogSheet.classList.add("closing");
    dialogAnims = zoomSheet(dialogCard, dialogSheet, false, function () {
      if (dialogSheetOpen()) return;
      dialogSheet.classList.remove("closing");
      stopDialogAnims();
      dialogCard.innerHTML = "";
      endPeek();
    }, function () { if (!dialogSheetOpen()) endPeek(); });
  }
  // Einsortieren oder Kompost beginnt: steht der Eingang am Handy als Blatt da,
  // geht er ohne Zoom und das Blatt des Dialogs nimmt seinen Platz ein
  function handOffInbox() {
    if (dialogSheetWanted() && inboxOpen() && !inboxInHub && inboxCard) {
      sheetHandoff = inboxCard.getBoundingClientRect();
      stopInboxAnims();
      inboxSheet.classList.remove("open", "closing");
      inboxPicks = [];
      stopDictation();
      return;
    }
    closeInbox();
  }
  // welcher Dialog laeuft, der endet beim Tipp neben das Blatt
  function closeActiveDialog() {
    if (sortSession) endSort();
    else if (compostSession) endCompost();
    else if (state.tagEditing || detailEditing) closeHubEditor();
    else closeDialogSheet();
  }
  if (dialogSheet) {
    // nur ein Tipp, der auch auf dem Schleier begann: der Klick, den der Browser
    // nach dem Antippen eines Punkts nachschickt, landet sonst hier und schloesse gleich wieder
    var downOnVeil = false;
    dialogSheet.addEventListener("pointerdown", function (e) { downOnVeil = e.target === dialogSheet; });
    dialogSheet.addEventListener("click", function (e) {
      if (e.target === dialogSheet && downOnVeil) closeActiveDialog();
      downOnVeil = false;
    });
    dialogCard.addEventListener("click", function (e) { if (!handleEditorClick(e)) handleSortClick(e); });
    dialogCard.addEventListener("change", handleSortChange);
    dialogCard.addEventListener("keydown", handleEditorKeydown);
  }
  // Die Tastatur am Handy verkleinert nur den sichtbaren Ausschnitt; das Blatt
  // soll darueber liegen und nicht dahinter verschwinden.
  // Nur waehrend getippt wird: sonst koennte ein alter Wert das Blatt anheben.
  function keyboardInset() {
    var vv = window.visualViewport, a = document.activeElement;
    var typing = !!a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA");
    var kb = vv && typing && vv.scale < 1.01 ? Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)) : 0;
    document.documentElement.style.setProperty("--kb", kb + "px");
    return kb;
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", keyboardInset);
    window.visualViewport.addEventListener("scroll", keyboardInset);
  }
  window.addEventListener("resize", keyboardInset);
  document.addEventListener("focusin", keyboardInset);
  document.addEventListener("focusout", function () { setTimeout(keyboardInset, 0); });

  // ---------- Aufruf per Link ----------
  // index.html?neu=Text legt den Text in den Eingang (iOS-Kurzbefehl, Lesezeichen,
  // Raycast). Danach wird die Adresse bereinigt, damit Neuladen nichts verdoppelt.
  function captureFromLink() {
    var text = null;
    try { text = new URLSearchParams(window.location.search).get("neu"); } catch (e) { return false; }
    if (!text || !text.trim()) return false;
    addToInbox(text);
    try {
      var params = new URLSearchParams(window.location.search);
      params.delete("neu");
      var qs = params.toString();
      window.history.replaceState(null, "", window.location.pathname + (qs ? "?" + qs : "") + window.location.hash);
    } catch (e) { /* manche Hosts erlauben das nicht */ }
    openInbox();   // zeigen, dass es angekommen ist
    return true;
  }

  // ---------- init ----------
  function showStartupError(err) {
    var box = document.createElement("div");
    box.id = "ihbStartupError";
    box.setAttribute("style",
      "max-width:560px;margin:40px auto;padding:18px 20px;border-radius:14px;" +
      "background:#2a1a24;border:1px solid rgba(244,114,182,0.4);color:#fbd1e7;" +
      "font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;" +
      "font-size:13px;line-height:1.6;");
    box.innerHTML = "<b>IdeaHub konnte nicht starten.</b><br>" +
      "Bitte diese Meldung melden:<br><code style='font-size:12px;word-break:break-word'>" +
      String(err && err.message ? err.message : err).replace(/[<>&]/g, "") + "</code>";
    document.body.insertBefore(box, document.body.firstChild);
  }

  function init() {
    try { state.theme = wbThemeLesen() || systemThemeLesen() || state.theme; } catch (e) {}
    try {
      applyMotion();
      applySpeed();
      applyTheme();
    } catch (e) { /* theme is cosmetic; never let it stop the app */ }
    try {
      renderStars();
    } catch (e) { /* decorative only */ }
    try {
      renderStructure();
      setView(state.view, true);   // apply the restored view without re-rendering the map
      renderTree();
      restoreFolder();
    } catch (e) {
      showStartupError(e);
      return;
    }
    // Persistence is optional: if the host blocks storage, the app still works.
    try {
      loadPersisted().then(function () {
        try {
          setView(state.view, true);   // die gespeicherte Ansicht auch anwenden
          renderStructure();
          renderTree();
          updateInboxBadge();
          // nur speichern; den Ordner fasst erst eine echte Aenderung an
          if (state.inbox.length && storageKind() !== "none") storeSet(INBOX_KEY, JSON.stringify(state.inbox));
          if (!captureFromLink()) applyPhoneStart();
        } catch (e) { /* keep the already-rendered map */ }
      }, function () {});
    } catch (e) { /* ignore */ }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  window.__ihb = {
    state: state, storageKind: storageKind, storageWarning: storageWarning,
    loadPersisted: loadPersisted, flushPersist: flushPersist, coreToMd: coreToMd,
    parseCapture: parseCapture, captureAction: captureAction, similarCores: similarCores, suggestCores: suggestCores,
    enterEdit: enterEdit, afterRingSettles: afterRingSettles,
    planOutline: planOutline, startTreeEdit: startTreeEdit, treeEditState: function () { return treeEdit; },
    addToInbox: addToInbox, openInbox: openInbox, closeInbox: closeInbox, startSort: startSort,
    sortState: function () { return sortSession; }, INBOX_SIGNAL: INBOX_SIGNAL,
    renderInboxDots: renderInboxDots, inboxToMd: inboxToMd, parseInboxMd: parseInboxMd, isInboxMd: isInboxMd,
    syncToFolder: syncToFolder, inboxMatches: inboxMatches, inboxMdStand: inboxMdStand,
    bundleInbox: bundleInbox, inboxPicks: function () { return inboxPicks.slice(); }, splitSpoken: splitSpoken,
    startDictation: startDictation, stopDictation: stopDictation, dictationState: function () { return dictation; },
    setPhoneStart: setPhoneStart, isPhone: isPhone, sinkIntoCore: sinkIntoCore, SINK_MS: SINK_MS,
    compostCandidates: compostCandidates, startCompost: startCompost, compostState: function () { return compostSession; },
    restoreCompost: restoreCompost, setCompostDays: setCompostDays, stampCoreChanges: stampCoreChanges, openCompost: openCompost,
    folderRows: folderRows, folderFileInfo: function (p) { return folderFiles.get(p) || null; }, readFolderFile: readFolderFile,
    placeInboxCard: placeInboxCard, themeWithFade: themeWithFade,
    inboxInHub: function () { return inboxInHub; }, hubRoomWanted: hubRoomWanted,
    dialogSheetOpen: dialogSheetOpen, keyboardInset: keyboardInset, roomScale: function () { return layout.roomScale || {}; },
    openHubSpan: function () { return openHubSpan(layout); }, fitLongestWord: fitLongestWord, hubOpen: function () { return hubOpen; }, parseMdToCore: parseMdToCore, slugify: slugify, coreFilename: coreFilename,
    coreStatus: coreStatus, coreProgress: coreProgress, cycleDetailStatus: cycleDetailStatus,
    allTags: allTags, toggleTagFilter: toggleTagFilter, clearTagFilter: clearTagFilter, computeCounts: computeCounts,
    highlightMatch: highlightMatch, setTheme: setTheme, glassFill: glassFill,
    toggleFocus: toggleFocus, clearFocus: clearFocus, coreIconSvg: coreIconSvg,
    measureLayout: measureLayout, detailRadiusPx: detailRadiusPx, detailSpreadDeg: detailSpreadDeg,
    coreOrbit: coreOrbit, coreDiameter: coreDiameter, detailModeFor: detailModeFor, detailSizeFor: detailSizeFor,
    orbiting: orbiting, setRotate: setRotate, setMotion: setMotion, motionEnabled: motionEnabled,
    setSpeed: setSpeed, speedFactor: speedFactor,
    camera: camera, clampCamera: clampCamera, applyCamera: applyCamera, setCamera: setCamera,
    resetCamera: resetCamera, toMapSpace: toMapSpace, zoomAt: zoomAt, zoomStep: zoomStep, ringRotation: ringRotation, coreAngleRaw: coreAngleRaw,
    ringTarget: ringTarget, startRingTween: startRingTween, updatePositionsOnly: updatePositionsOnly,
    clusterAngles: clusterAngles, clusterGroups: clusterGroups, setCluster: setCluster,
    setView: setView, renderTree: renderTree, treeExpanded: treeExpanded,
    filteredCores: filteredCores, exportAll: exportAll,
    loadFromFolder: loadFromFolder, adoptFolder: adoptFolder, restoreFolder: restoreFolder,
    reloadFromFolder: reloadFromFolder, disconnectFolder: disconnectFolder,
    deleteCore: deleteCore, deleteDetail: deleteDetail, addCore: addCore, addDetail: addDetail,
    ringRadiusFor: ringRadiusFor, ringIndexFor: ringIndexFor,
    frequentTags: frequentTags, tagCounts: tagCounts, renderTagSuggestions: renderTagSuggestions,
    focusProgressFor: focusProgressFor, panelHorizontal: panelHorizontal,
    layoutHub: layoutHub, openHubDisplay: openHubDisplay, closeHubDisplay: closeHubDisplay, emitEnergy: emitEnergy, energyFromCore: energyFromCore,
    openDetailEditor: openDetailEditor, openTagEditor: openTagEditor,
    commitHubEditor: commitHubEditor, closeHubEditor: closeHubEditor,
    selectDetail: selectDetail, selectedDetailObj: selectedDetailObj,
    computePositions: computePositions, worstClearance: worstClearance,
    edgeMargin: edgeMargin, layoutMargin: layoutMargin, marginForRole: marginForRole,
    focusBlockedByCore: focusBlockedByCore,
    MAX_CORES: MAX_CORES, MAX_DETAILS: MAX_DETAILS,
    exportJson: exportJson, applyJsonBackup: applyJsonBackup, moveDetail: moveDetail, reorderCore: reorderCore, slotAt: slotAt,
    visibleCores: visibleCores, cloudGroups: cloudGroups, groupBubbles: groupBubbles,
    depthFor: depthFor, perspectivePx: perspectivePx, fogFor: fogFor, depthScaleMax: depthScaleMax,
    crownGeometry: crownGeometry, crownDetailSize: crownDetailSize, crownAngle: crownAngle,
    hubExtent: hubExtent, hubReachAt: hubReachAt,
    crownSpacingAt: crownSpacingAt,

    focusCoreId: focusCoreId,

    enterGroup: enterGroup, leaveGroup: leaveGroup, scopeTitle: scopeTitle, groupTitle: groupTitle, GROUP_FROM: GROUP_FROM,
    crossLinks: crossLinks, linkPath: linkPath, setShowLinks: setShowLinks, paletteFor: paletteFor, hexToRgbTriple: hexToRgbTriple, getLayout: function () { return layout; }
  };
